ems.","correct":true}],"correct":["c","e"],"explanation":"Der:die Product Owner:in ist für alle Änderungen am Product Backlog ergebnisverantwortlich und erstellt und kommuniziert die Product Backlog Items klar. Einträge hinzufügen dürfen aber auch andere (z. B. die Entwickler:innen) – die Verantwortung bleibt beim:bei der Product Owner:in. Das Daily Scrum ist ein Event für die Entwickler:innen, und auch das Sprint Backlog gehört den Entwickler:innen.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Erklärung","reason":"Erklärung war ungenau (Product Owner:in kann als Entwickler:in am Daily Scrum teilnehmen) und ging nicht auf die richtigen Antworten ein."}},{"test":2,"nr":76,"id":54892828,"type":"multiple-choice","question":"In the middle of the Sprint, there are 2 new features requested. The Product Owner should:\n(choose the best option)","answers":[{"key":"a","text":"Add these features to the Product Backlog.","correct":true},{"key":"b","text":"Introduce these features at the next Daily Scrum.","correct":false},{"key":"c","text":"Have the Developers add these features to the current Sprint.","correct":false},{"key":"d","text":"Have the Scrum Master add these features to the current Sprint.","correct":false}],"correct":["a"],"explanation":"Das Product Backlog ist eine emergente, geordnete Liste der Dinge, die zur Produktverbesserung benötigt werden. Es ist die einzige Quelle von Arbeit, die durch das Scrum Team erledigt wird. Neue Themen werden hier eingeordnet.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":2,"nr":77,"id":54892830,"type":"multiple-choice","question":"The Sprint Backlog is baselined at the end of the Sprint Planning.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Eine \"Baseline\" gibt es laut Scrum Guide für den Sprint nicht.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":2,"nr":78,"id":54892838,"type":"multiple-choice","question":"Who is responsible for all estimates in the Product Backlog? (choose the best option)","answers":[{"key":"a","text":"The Developers after clarifying requirements with the Product Owner.","correct":true},{"key":"b","text":"The most senior people in the organization, including architects and subject matter experts.","correct":false},{"key":"c","text":"The Product Owner with input from the Developers.","correct":false},{"key":"d","text":"The Scrum Master.","correct":false}],"correct":["a"],"explanation":"Es ist die Aufgabe der Developer:innen Product Backlog Items zu schätzen.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":2,"nr":79,"id":54892842,"type":"multiple-choice","question":"The Product Owner can change the Sprint Backlog any time.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Das Sprint Backlog wird von den Developer:innen verantwortet / geändert.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":2,"nr":80,"id":54893018,"type":"multiple-choice","question":"It's up to the Developers to decide which Scrum events are needed during the Sprint.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Alle Scrum-Events sind notwendig; sie sollten niemals weggelassen werden.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":3,"nr":1,"id":54419920,"type":"multiple-choice","question":"Who does the Scrum Master serve?\n(choose the best answer)","answers":[{"key":"a","text":"The Scrum Team.","correct":false},{"key":"b","text":"The Scrum Team and the organization.","correct":true},{"key":"c","text":"The Product Owner and the organization.","correct":false}],"correct":["b"],"explanation":"Scrum Master:innen sind echte Führungskräfte, die dem Scrum Team und der Gesamtorganisation dienen.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":3,"nr":2,"id":54420032,"type":"multiple-choice","question":"How does the Scrum Master serve the organization?","answers":[{"key":"a","text":"By leading, training, and coaching the organization in its Scrum adoption.","correct":false},{"key":"b","text":"By planning and advising Scrum implementations within the organization.","correct":false},{"key":"c","text":"By helping employees and stakeholders understand and enact an empirical approach for complex work.","correct":false},{"key":"d","text":"All answers are correct.","correct":true}],"correct":["d"],"explanation":"Der:die Scrum Master:in dient laut Scrum Guide der Organisation auf unterschiedliche Weise, unter anderem dadurch,\n• die Organisation bei der Einführung von Scrum zu führen, zu schulen und zu coachen;\n• Einführungen von Scrum in der Organisation zu planen und zu empfehlen;\n• Mitarbeitende und Stakeholder:innen beim Verständnis und bei der Umsetzung eines empirischen Ansatzes für komplexe Arbeit zu unterstützen; und\n• Barrieren zwischen Stakeholder:innen und Scrum Teams zu beseitigen.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":3,"nr":3,"id":54420064,"type":"multiple-choice","question":"How does the Scrum Master serve the Product Owner?","answers":[{"key":"a","text":"By helping find techniques for effective Product Goal definition and Product Backlog management.","correct":false},{"key":"b","text":"By helping the Scrum Team understand the need for clear and concise Product Backlog items.","correct":false},{"key":"c","text":"By helping establish empirical product planning for a complex environment.","correct":false},{"key":"d","text":"All answers are correct.","correct":true}],"correct":["d"],"explanation":"Der:die Scrum Master:in dient dem:der Product Owner:in laut Scrum Guide auf unterschiedliche Weise, unter anderem dadurch,\n• bei der Suche nach Techniken zur effektiven Definition des Produkt‐Ziels und zum Product‐Backlog‐Management zu helfen;\n• dem Scrum Team dabei zu helfen, die Notwendigkeit klarer und präziser Product‐Backlog‐Einträge zu verstehen;\n• bei der Etablierung einer empirischen Produktplanung für ein komplexes Umfeld zu helfen; und\n• die Zusammenarbeit mit Stakeholder:innen nach Wunsch oder Bedarf zu fördern (facilitate).","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":3,"nr":4,"id":54420282,"type":"multiple-choice","question":"Who is responsible for leading, training, and coaching the organization in its Scrum adoption?","answers":[{"key":"a","text":"The Scrum Master","correct":true},{"key":"b","text":"The Project Manager","correct":false},{"key":"c","text":"The Release Train Engineer","correct":false},{"key":"d","text":"The Product Owner","correct":false}],"correct":["a"],"explanation":"Laut Scrum Guide ist der Scrum Master dafür verantwortlich, die Organisation bei der Einführung von Scrum zu leiten, zu schulen und zu coachen.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":3,"nr":5,"id":54420306,"type":"multiple-choice","question":"The Sprint is a container for all other Scrum events.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":3,"nr":6,"id":54420356,"type":"multiple-choice","question":"What is the purpose of the Daily Scrum?","answers":[{"key":"a","text":"To inspect progress toward the Sprint Goal and adapt the Sprint Backlog as necessary.","correct":true},{"key":"b","text":"To inspect progress toward the Sprint Goal and adapt the Sprint Backlog or the Product Backlog as necessary.","correct":false},{"key":"c","text":"To hold a meeting for the Product Owner and Scrum Master.","correct":false},{"key":"d","text":"To inspect progress toward the Product Goal.","correct":false}],"correct":["a"],"explanation":"Der Zweck des Daily Scrums besteht laut Scrum Guide darin, den Fortschritt in Richtung des Sprint‐Ziels zu überprüfen und das Sprint Backlog bei Bedarf anzupassen, um die bevorstehende geplante Arbeit zu justieren. Das Daily Scrum ist ein 15‐minütiges Event für die Developer:innen des Scrum Teams.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":3,"nr":7,"id":54420416,"type":"multiple-choice","question":"If the Product Owner or Scrum Master are actively working on items in the Sprint Backlog, they participate as Developers in the Daily Scrum.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Das Daily Scrum ist ein Scrum-Event für die Entwickler:innen des Scrum-Teams. Wenn der:die Product Owner:in oder der:die Scrum Master:in aktiv an Items im Sprint Backlog arbeiten, nehmen sie als Entwickler:innen am Daily Scrum teil (gemäß Scrum Guide).","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":3,"nr":8,"id":54420466,"type":"multiple-choice","question":"How long is the Daily Scrum?","answers":[{"key":"a","text":"15 minutes","correct":true},{"key":"b","text":"25 minutes","correct":false},{"key":"c","text":"10 minutes","correct":false}],"correct":["a"],"explanation":"Das Daily Scrum ist ein 15‐minütiges Event für die Developer:innen des Scrum Teams. Um die Komplexität zu reduzieren, wird es an jedem Arbeitstag des Sprints zur gleichen Zeit und am gleichen Ort abgehalten.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":3,"nr":9,"id":54420486,"type":"multiple-choice","question":"Why should the Daily Scrum be held at the same time and place every working day of the Sprint?","answers":[{"key":"a","text":"To reduce complexity.","correct":true},{"key":"b","text":"To save costs.","correct":false},{"key":"c","text":"To enable stakeholder participation.","correct":false}],"correct":["a"],"explanation":"Nach dem Scrum Guide sollte das Daily Scrum an jedem Arbeitstag des Sprints zur gleichen Zeit und am gleichen Ort stattfinden, um die Komplexität zu reduzieren.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":3,"nr":10,"id":54420514,"type":"multiple-choice","question":"Daily Scrums promote quick decision-making.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Daily Scrums verbessern die Kommunikation, identifizieren Hindernisse, fördern die schnelle Entscheidungsfindung und eliminieren konsequent die Notwendigkeit für andere Meetings.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":3,"nr":11,"id":54421186,"type":"multiple-choice","question":"The Daily Scrum is the only time Developers are allowed to adjust their plan for the Sprint.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Das Daily Scrum ist nicht die einzige Gelegenheit, bei der die Developer:innen ihren Plan anpassen dürfen. Sie treffen sich oftmals während des Tages für detailliertere Diskussionen zur Anpassung oder Neuplanung der restlichen Arbeit des Sprints.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":3,"nr":12,"id":54444742,"type":"multiple-choice","question":"New team members can be introduced to a Scrum Team without any implications on the velocity.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Es könnte zu einem kurzfristigen Rückgang der Velocity des Teams kommen.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":3,"nr":13,"id":54444752,"type":"multiple-choice","question":"The Product Owner is one person, not a committee.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Das ist richtig. Gemäß dem Scrum Guide muss der:die Product Owner:in eine Person sein, nicht ein Komitee.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":3,"nr":14,"id":54444890,"type":"multiple-choice","question":"The Sprint Planning is time boxed to:","answers":[{"key":"a","text":"A maximum of 8 h for a one-month Sprint","correct":true},{"key":"b","text":"A maximum of 4 h for a one-month Sprint","correct":false},{"key":"c","text":"A maximum of 2 h for a one-month Sprint","correct":false}],"correct":["a"],"explanation":"Das Sprint Planning ist auf maximal acht Stunden für einen einmonatigen Sprint begrenzt. Bei kürzeren Sprints ist das Event in der Regel kürzer.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":3,"nr":15,"id":54445126,"type":"multiple-choice","question":"The Sprint Review is time boxed to:","answers":[{"key":"a","text":"A maximum of 4 h for a one-month Sprint","correct":true},{"key":"b","text":"A maximum of 8 h for a one-month Sprint","correct":false},{"key":"c","text":"A maximum of 3 h for a one-month Sprint","correct":false}],"correct":["a"],"explanation":"Das Sprint Review ist das vorletzte Scrum Event des Sprints und ist für einen einmonatigen Sprint auf maximal vier Stunden begrenzt. Bei kürzeren Sprints ist das Event in der Regel kürzer.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":3,"nr":16,"id":54445144,"type":"multiple-choice","question":"The Sprint Retrospective is time boxed to:","answers":[{"key":"a","text":"A maximum of 3 h for a one-month Sprint","correct":true},{"key":"b","text":"A maximum of 2 h for a one-month Sprint","correct":false},{"key":"c","text":"A maximum of 4 h for a one-month Sprint","correct":false}],"correct":["a"],"explanation":"Die Sprint Retrospektive bildet den Abschluss des Sprints. Sie ist auf maximal drei Stunden für einen einmonatigen Sprint begrenzt. Bei kürzeren Sprints ist das Event in der Regel kürzer.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":3,"nr":17,"id":54445158,"type":"multiple-choice","question":"The Daily Scrum is a:","answers":[{"key":"a","text":"15-minute event for the Developers of the Scrum Team","correct":true},{"key":"b","text":"15-minute event for the whole Scrum Team","correct":false},{"key":"c","text":"15-minute event for the Scrum Team and the stakeholders of the product","correct":false}],"correct":["a"],"explanation":"Das Daily Scrum ist ein 15-minütiges Event für die Entwickler:innen des Scrum-Teams.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":3,"nr":18,"id":54445188,"type":"multiple-choice","question":"The Scrum Master notices that the Developers hold the Daily Scrum at different times during the day, sometimes in different places, and sometimes not at all. What should the Scrum Master do?","answers":[{"key":"a","text":"Teach the team that holding the Daily Scrum at the same time and place every working day of the Sprint helps reduce complexity.","correct":true},{"key":"b","text":"Respect the decision of the self-managed team.","correct":false},{"key":"c","text":"Discuss the topic with the Product Owner.","correct":false}],"correct":["a"],"explanation":"Das Daily Scrum ist ein Scrum-Event für die Entwickler:innen. Um die Komplexität zu reduzieren, wird es an jedem Arbeitstag des Sprints zur gleichen Zeit und am gleichen Ort abgehalten. Der:die Scrum Master:in ist für die Einführung von Scrum verantwortlich, wie es im Scrum Guide definiert ist.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Sprache","reason":"Grammatik."}},{"test":3,"nr":19,"id":54445204,"type":"multiple-choice","question":"The Sprint has a fixed length of:","answers":[{"key":"a","text":"One month or less","correct":true},{"key":"b","text":"Two months or less","correct":false},{"key":"c","text":"None of the answers is correct","correct":false}],"correct":["a"],"explanation":"Sprints sind das Herzstück von Scrum, in dem Ideen in Wert umgesetzt werden. Sie haben eine feste Länge von einem Monat oder weniger, um Konsistenz zu schaffen.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Sprache","reason":"Grammatik."}},{"test":3,"nr":20,"id":54445344,"type":"multiple-choice","question":"When is it allowed to cancel a Sprint?","answers":[{"key":"a","text":"When the Sprint Goal becomes obsolete.","correct":true},{"key":"b","text":"When the Developers see the necessity to cancel the Sprint.","correct":false},{"key":"c","text":"When the stakeholders of the product see the necessity to cancel the Sprint.","correct":false}],"correct":["a"],"explanation":"Ein Sprint kann abgebrochen werden, wenn das Sprint-Ziel obsolet wird. Nur der:die Product Owner:in hat die Erlaubnis, den Sprint abzubrechen.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Quelle","reason":"Quellenangabe fehlte."}},{"test":3,"nr":21,"id":54475538,"type":"multiple-choice","question":"The Product Backlog is dynamic and never complete.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Das Product Backlog entwickelt sich weiter, je mehr man dazulernt.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":3,"nr":22,"id":54475554,"type":"multiple-choice","question":"The purpose of the Sprint Retrospective is to plan ways to increase quality and effectiveness.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Laut Scrum Guide besteht der Zweck der Sprint-Retrospektive darin, Wege zur Steigerung von Qualität und Effektivität zu planen.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":3,"nr":23,"id":54475648,"type":"multiple-choice","question":"The CEO asks the Developers to add a \"very important\" item to the current Sprint. What should the Developers do?","answers":[{"key":"a","text":"Ask the CEO to talk to the Product Owner.","correct":true},{"key":"b","text":"Add the item to the Sprint Backlog.","correct":false},{"key":"c","text":"Nothing.","correct":false}],"correct":["a"],"explanation":"Der:die Product Owner:in ist dafür verantwortlich, solche Situationen zu klären, ein Product Backlog Item zu erstellen und es in das Product Backlog aufzunehmen.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Sprache","reason":"Veralteter Begriff „Development Team“ (seit 2020: Developers)."}},{"test":3,"nr":24,"id":54475658,"type":"multiple-choice","question":"Items at the top of the Product Backlog tend to be smaller than items at the bottom.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Aufgrund der fortlaufenden Refinements sind die obersten Product Backlog Items tendenziell kleiner.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Sprache","reason":"Aussage endete mit Fragezeichen."}},{"test":3,"nr":25,"id":54475672,"type":"multiple-choice","question":"A new Sprint starts immediately after the conclusion of the previous Sprint.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Ein neuer Sprint beginnt unmittelbar nach dem Abschluss des vorherigen Sprints. Es gibt keine Zeit zwischen zwei Sprints.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":3,"nr":26,"id":54475690,"type":"multiple-choice","question":"'Causing the removal of impediments' is the responsibility of which Scrum accountability:","answers":[{"key":"a","text":"Scrum Master","correct":true},{"key":"b","text":"Product Owner","correct":false},{"key":"c","text":"Developers","correct":false}],"correct":["a"],"explanation":"Die Beseitigung von Hindernissen (impediments) für den Fortschritt des Scrum Teams zu bewirken ist laut Scrum Guide eine Aufgabe des:der Scrum Master:in.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":3,"nr":27,"id":54475700,"type":"multiple-choice","question":"What is the responsibility of the Product Owner during Sprint 0?","answers":[{"key":"a","text":"There is no Sprint 0.","correct":true},{"key":"b","text":"Creating the Product Goal.","correct":false},{"key":"c","text":"Creating the Product Vision.","correct":false},{"key":"d","text":"Creating the first Sprint Backlog.","correct":false}],"correct":["a"],"explanation":"In Scrum gibt es keinen \"Sprint 0\".","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":3,"nr":28,"id":54475712,"type":"multiple-choice","question":"How many hours per day should a person in a Scrum Team work?","answers":[{"key":"a","text":"Depends, but the team should work in Sprints at a sustainable pace.","correct":true},{"key":"b","text":"10-12 h","correct":false},{"key":"c","text":"7-8 h","correct":false}],"correct":["a"],"explanation":"Die Arbeit in Sprints in einem nachhaltigen Tempo verbessert den Fokus und die Kontinuität des Scrum-Teams.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":3,"nr":29,"id":54475730,"type":"multiple-choice","question":"How much refinement of the selected Product Backlog items must take place during Sprint Planning?","answers":[{"key":"a","text":"Just enough so that the Developers are able to create a forecast of what can be done in the Sprint and to start the Sprint.","correct":true},{"key":"b","text":"All Product Backlog Items that are selected for the Sprint have to be refined 100%.","correct":false}],"correct":["a"],"explanation":"Die Items für den Sprint können während des Sprints refined werden. Es ist nicht erforderlich, sie zu 100% zu refinen.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Inhalt","reason":"Ein „Sprint Backlog Refinement“ gibt es in Scrum nicht – gemeint ist das Refinement der ausgewählten Product Backlog Items."}},{"test":3,"nr":30,"id":54475738,"type":"multiple-choice","question":"The Scrum Team decides to change the Sprint length frequently. What should the Scrum Master do?","answers":[{"key":"a","text":"Help the team understand that Sprints with a fixed length create consistency.","correct":true},{"key":"b","text":"Respect the team decision without any further actions.","correct":false}],"correct":["a"],"explanation":"Laut Scrum Guide haben Sprints eine feste Länge von einem Monat oder weniger, um Konsistenz zu schaffen. Häufige Änderungen der Sprint-Länge untergraben diese Konsistenz.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Erklärung","reason":"Erklärung betonte die Maximallänge statt der festen Länge, um die es in der Frage geht. Dazu Grammatik."}},{"test":3,"nr":31,"id":54490760,"type":"multiple-choice","question":"Product Backlog refinements are not required in Scrum.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Das Product Backlog sollte während des Sprints und nach Bedarf refined werden.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":3,"nr":32,"id":54490766,"type":"multiple-choice","question":"The Daily Scrum is a 15-minute event for the Developers.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Das Daily Scrum ist eine 15-minütige Veranstaltung für die Entwickler:innen des Scrum-Teams. Um die Komplexität zu reduzieren, wird es an jedem Arbeitstag des Sprints zur gleichen Zeit und am gleichen Ort abgehalten.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":3,"nr":33,"id":54490770,"type":"multiple-choice","question":"The Scrum Master must attend the Daily Scrum.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Der:die Scrum Master:in kann teilnehmen, muss aber nicht.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":3,"nr":34,"id":54490772,"type":"multiple-choice","question":"It is not allowed to change the Sprint scope during a Sprint.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Der Umfang eines Sprints kann mit dem:der Product Owner:in geklärt und neu verhandelt werden, wenn mehr gelernt wird – auch während des Sprints. Das Sprint-Ziel bleibt dabei unverändert.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Sprache","reason":"Grammatik."}},{"test":3,"nr":35,"id":54490776,"type":"multiple-choice","question":"The Lead Developer usually talks to the Product Owner if a question occurs during the Sprint.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Es gibt keine Lead Developer in Scrum.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":3,"nr":36,"id":54490780,"type":"multiple-choice","question":"Product Backlog management can be done by a Developer.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Der:die Product Owner:in kann diese Arbeit auch delegieren (z. B. an Entwickler:innen im Team), bleibt aber ergebnisverantwortlich.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Sprache","reason":"Fehlendes Wort."}},{"test":3,"nr":37,"id":54490786,"type":"multiple-choice","question":"The Scrum Team may invite other people to attend Sprint Planning to provide advice.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Das Scrum Team kann laut Scrum Guide auch andere Personen zum Sprint Planning einladen, um sie z. B. zu Spezialthemen zu konsultieren.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Sprache","reason":"Doppelte Formulierung und Tippfehler."}},{"test":3,"nr":38,"id":54490792,"type":"multiple-choice","question":"The Developers are allowed to adjust their plan for the Sprint only during the Daily Scrum.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Der Daily Scrum ist nicht die einzige Gelegenheit für die Entwickler:innen, ihren Plan anzupassen. Sie treffen sich oft im Laufe des Tages zu detaillierteren Diskussionen über die Anpassung oder Neuplanung der restlichen Arbeit des Sprints.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Sprache","reason":"Grammatik."}},{"test":3,"nr":39,"id":54490796,"type":"multiple-choice","question":"The Sprint Planning is a time boxed Scrum Event.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Das Sprint Planning ist auf maximal acht Stunden für einen einmonatigen Sprint begrenzt. Bei kürzeren Sprints ist das Event in der Regel kürzer.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":3,"nr":40,"id":54490960,"type":"multiple-choice","question":"Following Scrum, it is allowed to forecast Sprint progress using burn-down charts.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Gemäß Scrum Lehre gibt es verschiedene Praktiken zur Vorhersage des Arbeitsfortschritts, wie Burn-Downs, Burn-Ups Charts oder kumulative Flows. Diese haben sich zwar als nützlich erwiesen, ersetzen aber nicht die Bedeutung der Empirie.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Sprache","reason":"Ja/Nein-Frage mit Wahr/Falsch-Antworten – als Aussage umformuliert."}},{"test":3,"nr":41,"id":54747084,"type":"multiple-choice","question":"Could the Product Owner and the Scrum Master also be a Developer?","answers":[{"key":"a","text":"Yes","correct":true},{"key":"b","text":"No","correct":false}],"correct":["a"],"explanation":"Ja, dies ist laut Scrum Guide nicht verboten.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":3,"nr":42,"id":54747104,"type":"multiple-choice","question":"The frequency of updating the Product Backlog is:","answers":[{"key":"a","text":"Anytime (as needed)","correct":true},{"key":"b","text":"Every Sprint","correct":false},{"key":"c","text":"Monthly","correct":false},{"key":"d","text":"Daily","correct":false}],"correct":["a"],"explanation":"Laut Scrum Guide kann / soll das Update des Product Backlogs immer dann erfolgen, wenn es notwendig ist.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":3,"nr":43,"id":54747132,"type":"multiple-choice","question":"Scrum is an iterative and incremental Agile framework.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Scrum ist iterativ, weil die Prozesse in jedem Sprint wiederholt werden. Es ist inkrementell, weil es das Produkt in mehreren inkrementellen Schritten und nicht in einem \"Big Bang\" liefert. Und natürlich ist es agil (adaptiv).","section":"Scrum Guide (US 2020): Scrum Theory (Seite 3-4)","correction":null},{"test":3,"nr":44,"id":54747150,"type":"multiple-choice","question":"Is it allowed to skip the Daily Scrum if there is nothing interesting to talk about?","answers":[{"key":"a","text":"Yes","correct":false},{"key":"b","text":"No","correct":true}],"correct":["b"],"explanation":"Wird eines der Scrum Events nicht durchgeführt, führt dies zu einer verminderten Transparenz und einer verpassten Gelegenheit zur Überprüfung und Anpassung.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":3,"nr":45,"id":54747164,"type":"multi-select","question":"Which statements about the Sprint Retrospective meeting are correct?\n(Choose 2 answers)","answers":[{"key":"a","text":"It's the only time improvements are planned for the project.","correct":false},{"key":"b","text":"It happens before the Sprint Review.","correct":false},{"key":"c","text":"It is time-boxed to a maximum of three hours for a one-month Sprint.","correct":true},{"key":"d","text":"The Product Owner doesn't have to be at the meeting.","correct":false},{"key":"e","text":"It's an opportunity for inspection and adaptation.","correct":true}],"correct":["c","e"],"explanation":"Der Zweck der Sprint Retrospective ist es, Wege zur Steigerung von Qualität und Effektivität zu planen. Das Scrum Team überprüft, wie der letzte Sprint in Bezug auf Individuen, Interaktionen, Prozesse, Werkzeuge und seine Definition of Done verlief. Die Sprint Retrospective schließt den Sprint ab. Sie ist für einen einmonatigen Sprint auf maximal drei Stunden beschränkt. Bei kürzeren Sprints ist das Event in der Regel kürzer. Das gesamte Scrum Team nimmt teil – also auch der:die Product Owner:in.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Inhalt","reason":"Antwort C stellte die Timebox als feste Dauer dar; laut Scrum Guide sind es höchstens drei Stunden. Dazu Grammatik und eine verirrte Fußnoten-Nummer."}},{"test":3,"nr":46,"id":54747176,"type":"multi-select","question":"What are not Product Backlog characteristics?\n(Select two answers)","answers":[{"key":"a","text":"As long as a product exists, its Product Backlog also exists.","correct":false},{"key":"b","text":"A Product Backlog could be closed when it contains no items to include into the next Sprint.","correct":true},{"key":"c","text":"When the final version of a product is rolled out, its Product Backlog is dismissed.","correct":true},{"key":"d","text":"It is dynamic.","correct":false},{"key":"e","text":"It is never complete.","correct":false}],"correct":["b","c"],"explanation":"Ein Product Backlog ist nie vollständig. In der ersten Phase der Entwicklung werden nur die ursprünglich bekannten und am besten verstandenen Anforderungen festgelegt. Das Product Backlog entwickelt sich in dem Maße weiter, wie sich das Produkt und die Umgebung, in der es eingesetzt werden soll, weiterentwickeln.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":3,"nr":47,"id":54747192,"type":"multiple-choice","question":"Each Scrum Artifact may contain a commitment but it's not mandatory.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Jedes Artefakt beinhaltet ein Commitment, um sicherzustellen, dass Informationen bereitgestellt werden, welche Transparenz und Fokus verbessern, um den Fortschritt messbar zu machen.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":3,"nr":48,"id":54747476,"type":"multiple-choice","question":"The Product Owner must always consider the dependencies of the software tools the Developers use when ordering the Product Backlog.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Der Product Owner kann ggf. die Abhängigkeiten zwischen Product Backlog Items berücksichtigen, nicht aber die Abhängigkeiten der von den Entwicklern verwendeten Softwaretools.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":3,"nr":49,"id":54747510,"type":"multiple-choice","question":"The practice of Product Backlog refinement focuses on items for upcoming Sprints, not the current Sprint in progress.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Beim Refinement werden Product Backlog Items in kleinere, präzisere Einträge zerlegt und um Details wie Beschreibung, Reihenfolge und Größe ergänzt. Die Einträge des laufenden Sprints stehen bereits im Sprint Backlog – das Refinement bereitet daher die kommenden Sprints vor.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Erklärung","reason":"Erklärung nutzte die Definition aus dem Scrum Guide 2017 und war unvollständig."}},{"test":3,"nr":50,"id":54747528,"type":"multiple-choice","question":"Only the Developers must attend the Daily Scrum.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Die Entwickler:innen müssen anwesend sein und teilnehmen (attend and participate).","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Sprache","reason":"Schreibweise."}},{"test":3,"nr":51,"id":54857064,"type":"multiple-choice","question":"Who is responsible for ensuring that the work done on a Product Backlog Item meets the Definition of Done?","answers":[{"key":"a","text":"The Scrum Master","correct":false},{"key":"b","text":"The Test Team","correct":false},{"key":"c","text":"The Product Owner","correct":false},{"key":"d","text":"The Developers","correct":true},{"key":"e","text":"The Scrum Team","correct":false}],"correct":["d"],"explanation":"Die spezifischen Fähigkeiten, die von den Developer:innen benötigt werden, sind oft breit gefächert und variieren je nach Arbeitskontext. Die Developer:innen sind jedoch immer ergebnisverantwortlich dafür:\n• Qualität durch die Einhaltung einer Definition of Done einzubringen;","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":3,"nr":52,"id":54857074,"type":"multiple-choice","question":"The Scrum Master is accountable for all estimates in the Product Backlog.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Für die Schätzungen sind die Entwickler:innen verantwortlich.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":3,"nr":53,"id":54858664,"type":"multiple-choice","question":"Who has the authority to cancel the Sprint?","answers":[{"key":"a","text":"The Scrum Master","correct":false},{"key":"b","text":"The Product Owner","correct":true},{"key":"c","text":"The Product Owner and the Scrum Master","correct":false},{"key":"d","text":"The Key Stakeholders","correct":false},{"key":"e","text":"The Developers","correct":false}],"correct":["b"],"explanation":"Ein Sprint könnte abgebrochen werden, wenn das Sprint‐Ziel obsolet wird. Nur der:die Product Owner:in hat die Befugnis, den Sprint abzubrechen","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":3,"nr":54,"id":54858690,"type":"multi-select","question":"Your organization is new to Scrum. Management would like to understand what metrics are useful in determining if value is being delivered. As a Product Owner, which two metrics would be appropriate?\n(choose the two best answers)","answers":[{"key":"a","text":"Time-to-Market","correct":true},{"key":"b","text":"Customer satisfaction","correct":true},{"key":"c","text":"Scope","correct":false},{"key":"d","text":"Productivity","correct":false},{"key":"e","text":"Velocity","correct":false}],"correct":["a","b"],"explanation":"Time-to-Market ist ein Key Value Area (KVA) des Evidence Based Management (EBM)-Ansatzes, der die Fähigkeit der Organisation ausdrückt, neue Fähigkeiten, Dienstleistungen oder Produkte schnell auf den Markt zu bringen. Die Kundenzufriedenheit ist eine Key Value Measure (KVM) im Rahmen des Current Value KVA, die dabei hilft, das Engagement und die Zufriedenheit der Kunden mit dem Produkt zu messen.","section":"Der Leitfaden für Evidence-Based Management (2020)","correction":null},{"test":3,"nr":55,"id":54858716,"type":"multiple-choice","question":"What activities would a Product Owner do during an active Sprint?","answers":[{"key":"a","text":"Prioritize the Sprint Backlog.","correct":false},{"key":"b","text":"Engage with the stakeholders and answer questions from the Developers.","correct":true},{"key":"c","text":"Update the Burn-Down chart.","correct":false},{"key":"d","text":"Participate at the Daily Scrum.","correct":false}],"correct":["b"],"explanation":"","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":3,"nr":56,"id":54858734,"type":"multiple-choice","question":"An increase of the Developers' velocity and productivity is the positive sign of success for a Product Owner.","answers":[{"key":"a","text":"False","correct":true},{"key":"b","text":"True","correct":false}],"correct":["a"],"explanation":"Wichtiger als Velocity und Produktivität ist der Wert, der für Kund:innen entsteht – z. B. gemessen an der Kundenzufriedenheit. Eine höhere Velocity sagt nichts darüber aus, ob das Produkt wertvoller wird.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Sprache","reason":"Erklärung war grammatikalisch unvollständig."}},{"test":3,"nr":57,"id":54858758,"type":"multiple-choice","question":"All the Scrum Teams working on the same product must have the same Sprint length.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Die Sprint-Länge muss bei mehreren Teams die am gleichen Produkt arbeiten nicht gleich sein.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":3,"nr":58,"id":54858918,"type":"multi-select","question":"Which KVA categories should the Product Owner consider to measure and track the creation and delivery of value to the market place (select three)?","answers":[{"key":"a","text":"Risk Reduction","correct":false},{"key":"b","text":"Current Value","correct":true},{"key":"c","text":"Employee Satisfaction","correct":false},{"key":"d","text":"Capability Building","correct":false},{"key":"e","text":"Time-to-Market","correct":true},{"key":"f","text":"Ability to Innovate","correct":true}],"correct":["b","e","f"],"explanation":"","section":"Der Leitfaden für Evidence-Based Management (2020)","correction":null},{"test":3,"nr":59,"id":54858934,"type":"multiple-choice","question":"The purpose of a Sprint is to produce a potentially releasable product Increment.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Sprints sind der Herzschlag von Scrum, in dem Ideen in Wert umgewandelt werden. Laut Scrum Guide ist das gesamte Scrum Team dafür verantwortlich, in jedem Sprint ein wertvolles, nützliches Increment zu erstellen.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Erklärung","reason":"Erklärung beantwortete die Aussage nicht direkt."}},{"test":3,"nr":60,"id":54858958,"type":"multiple-choice","question":"An increment can only be delivered to stakeholders at the Sprint Review.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Das Sprint Review sollte niemals als Barriere zur Lieferung von Wert angesehen werden.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":3,"nr":61,"id":54880056,"type":"multi-select","question":"Why does the Scrum framework recommend small Scrum Teams of 10 or fewer people?","answers":[{"key":"a","text":"Because they better decide how to order the Product Backlog.","correct":false},{"key":"b","text":"Because they are more productive.","correct":true},{"key":"c","text":"Because they communicate better.","correct":true},{"key":"d","text":"Because they remove more impediments for the Scrum Team.","correct":false}],"correct":["b","c"],"explanation":"Das Scrum Team ist klein genug, um flink zu bleiben und groß genug, um innerhalb eines Sprints bedeutsame Arbeit fertigzustellen, üblicherweise 10 oder weniger Personen. Im Allgemeinen haben wir festgestellt, dass kleinere Teams besser kommunizieren und produktiver sind.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Sprache","reason":"Grammatik."}},{"test":3,"nr":62,"id":54880072,"type":"multi-select","question":"How can you determine that the Product Owner and the Developers are interacting enough throughout a Sprint?\n(select the two best answers)","answers":[{"key":"a","text":"See whether the Stakeholders / users are satisfied with the increment.","correct":true},{"key":"b","text":"See if the Product Owner is present at every Daily Scrum.","correct":false},{"key":"c","text":"See the level of velocity of the Developers.","correct":false},{"key":"d","text":"See whether the Product Owner is satisfied with the increment.","correct":true}],"correct":["a","d"],"explanation":"Der eigentliche Zweck von Scrum besteht darin, den Wert eines Produkts zu optimieren und seine Nutzer zufrieden zu stellen.","section":"Scrum Guide (US 2020): Scrum Theory (Seite 3-4)","correction":{"kind":"Sprache","reason":"Satzzeichen."}},{"test":3,"nr":63,"id":54880094,"type":"multiple-choice","question":"When a sprint is cancelled, the Scrum Team discards all the work and refines a new Product Backlog.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Die Arbeit wird bei einem Abbruch nicht verworfen. Laut Scrum Guide 2017 werden die fertigen („Done“) Product Backlog Items begutachtet; ist ein Teil potenziell auslieferbar, akzeptiert der:die Product Owner:in ihn in der Regel. Unfertige Einträge werden neu geschätzt und zurück ins Product Backlog gelegt. Der Scrum Guide 2020 beschreibt diesen Ablauf nicht mehr im Detail.","section":"Scrum Guide 2017: Cancelling a Sprint (im Scrum Guide 2020 nicht mehr beschrieben)","correction":{"kind":"Quelle","reason":"Der beschriebene Ablauf stammt aus dem Scrum Guide 2017, nicht aus 2020."}},{"test":3,"nr":64,"id":54880106,"type":"multiple-choice","question":"When is ownership of individual items, in the Sprint Backlog, assigned to Developers?","answers":[{"key":"a","text":"During Daily Scrum.","correct":false},{"key":"b","text":"When the Scrum Master assigns it.","correct":false},{"key":"c","text":"Any time during Sprint Planning.","correct":false},{"key":"d","text":"Never. Even if individuals work on specific Sprint Backlog items, the Developers as a whole remain accountable for the Sprint Backlog in its entirety.","correct":true}],"correct":["d"],"explanation":"Alle Entwickler:innen sind dafür verantwortlich, die Arbeit im Sprint Backlog zu erledigen, um das Sprint Goal zu erreichen. Die Verantwortung dafür trägt das gesamte Team.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Sprache","reason":"Grammatik."}},{"test":3,"nr":65,"id":54880138,"type":"multiple-choice","question":"What is the impact of a changing environment on the Product Backlog?","answers":[{"key":"a","text":"The Product Backlog is a living artifact that evolves as the product and the environment in which it will be used evolves.","correct":true},{"key":"b","text":"The Product Backlog is static as it is a commitment to the stakeholders.","correct":false},{"key":"c","text":"Identify a different market for the current Product Backlog.","correct":false},{"key":"d","text":"A new Product Backlog is created to meet the needs of the users.","correct":false}],"correct":["a"],"explanation":"Das Product Backlog ist ein lebendiges Artefakt, das sich mit neuen Erkenntnissen weiterentwickelt und verändert.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":3,"nr":66,"id":54880260,"type":"multi-select","question":"What does Product Backlog management include? Select the three most applicable answers.","answers":[{"key":"a","text":"Optimizing the value of the work the Developers perform.","correct":true},{"key":"b","text":"Ensuring that the Product Backlog is visible, transparent, and clear to all, and shows what the Scrum Team will work on next.","correct":true},{"key":"c","text":"Ordering the items in the Product Backlog to best achieve goals and missions.","correct":true},{"key":"d","text":"Presenting Product Backlog items to the Key Stakeholders.","correct":false},{"key":"e","text":"Moving Product Backlog items into the Sprint Backlog.","correct":false}],"correct":["a","b","c"],"explanation":"","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":3,"nr":67,"id":54880264,"type":"multiple-choice","question":"The Sprint Backlog is created at the Sprint Planning. It is prohibited to add new work into the Sprint Backlog later.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Das Sprint Backlog ist ein Plan von und für die Developer:innen. Es ist ein deutlich sichtbares Echtzeitbild der Arbeit, welche die Developer:innen während des Sprints zur Erreichung des Sprint‐Ziels ausführen wollen. Folglich wird das Sprint Backlog während des gesamten Sprints immer dann aktualisiert, wenn mehr gelernt wurde.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":3,"nr":68,"id":54880274,"type":"multiple-choice","question":"Within the Scrum Team, who is most likely to identify the Key Stakeholders for the Product?","answers":[{"key":"a","text":"The Product Owner","correct":true},{"key":"b","text":"The Developers","correct":false},{"key":"c","text":"The Scrum Master","correct":false},{"key":"d","text":"The Upper Management","correct":false}],"correct":["a"],"explanation":"Der:die Product Owner:in ist eine Person, kein Gremium. Der:die Product Owner:in kann die Bedürfnisse vieler Stakeholder:innen im Product Backlog berücksichtigen. Diejenigen, die das Product Backlog ändern möchten, können dies tun, indem sie versuchen, den:die Product Owner:in zu überzeugen.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":3,"nr":69,"id":54880282,"type":"multiple-choice","question":"Multiple teams working on the same product should maintain separate Product Backlogs.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"1 Product = 1 Product Owner:in = 1 Product Backlog","section":"Online Nexus Guide (US 2021): Nexus Artifacts and Commitment","correction":null},{"test":3,"nr":70,"id":54880290,"type":"multiple-choice","question":"All increments to be created by Developers must come from the Product Backlog.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Das Product Backlog ist eine emergente, geordnete Liste der Dinge, die zur Produktverbesserung benötigt werden. Es ist die einzige Quelle von Arbeit, die durch das Scrum Team erledigt wird.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":3,"nr":71,"id":54891136,"type":"multiple-choice","question":"Which statement is true about the Daily Scrum?","answers":[{"key":"a","text":"It is the optimal period for the Product Owner to assign tasks.","correct":false},{"key":"b","text":"It is time boxed to 15 minutes.","correct":true},{"key":"c","text":"It is an opportunity to discuss and resolve impediments.","correct":false},{"key":"d","text":"The time varies depending on team member availability.","correct":false}],"correct":["b"],"explanation":"Das Daily Scrum ist ein 15‐minütiges Event für die Developer:innen des Scrum Teams. Um die Komplexität zu reduzieren, wird es an jedem Arbeitstag des Sprints zur gleichen Zeit und am gleichen Ort abgehalten.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":3,"nr":72,"id":54891148,"type":"multiple-choice","question":"It is best to have a consistent Sprint duration throughout the development effort. What factors may influence how long the Sprint length should be?","answers":[{"key":"a","text":"All of these answers are correct.","correct":true},{"key":"b","text":"No more than one month.","correct":false},{"key":"c","text":"Short enough to manage business risk and change.","correct":false},{"key":"d","text":"Short enough to produce a potentially shippable product increment.","correct":false}],"correct":["a"],"explanation":"","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":3,"nr":73,"id":54891166,"type":"multiple-choice","question":"The Product Owner must attend the Sprint Retrospective.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Das gesamte Scrum Team muss anwesend sein.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":3,"nr":74,"id":54891278,"type":"multiple-choice","question":"Who is accountable for communicating the Product Goal to the Scrum Team?","answers":[{"key":"a","text":"The Product Manager","correct":false},{"key":"b","text":"The Developers","correct":false},{"key":"c","text":"The Scrum Master","correct":false},{"key":"d","text":"The Product Owner","correct":true}],"correct":["d"],"explanation":"Der:die Product Owner:in ist für ein effektives Product‐Backlog‐Management ergebnisverantwortlich. Dazu gehört auch, das Produkt‐Ziel zu entwickeln und explizit zu kommunizieren.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Sprache","reason":"Tippfehler."}},{"test":3,"nr":75,"id":54891290,"type":"multiple-choice","question":"What should happen if an item in the Sprint Backlog cannot be completed in the current Sprint?","answers":[{"key":"a","text":"The Product Owner cancels the sprint.","correct":false},{"key":"b","text":"The developers cancel the Sprint.","correct":false},{"key":"c","text":"The item is evaluated based on the team's rules for estimates and prioritization and then placed back into the Product Backlog.","correct":true},{"key":"d","text":"A meeting is held to determine what went wrong and who should be accountable for the failure to complete the work.","correct":false}],"correct":["c"],"explanation":"","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Sprache","reason":"Grammatik (Apostroph)."}},{"test":3,"nr":76,"id":54891298,"type":"multiple-choice","question":"The developers are responsible for conducting the Daily Scrum.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Das Daily Scrum ist ein 15‐minütiges Event für die Developer:innen des Scrum Teams.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":3,"nr":77,"id":54891402,"type":"multiple-choice","question":"The Increment must be released at the end of every Sprint.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Es muss nicht zwingend ein Release stattfinden.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":3,"nr":78,"id":54891412,"type":"multiple-choice","question":"What should the Sprint Backlog contain?","answers":[{"key":"a","text":"It should contain the high value items from the product backlog.","correct":false},{"key":"b","text":"It should contain a Sprint Goal, items from the Product Backlog chosen for the sprint and an actionable plan on how the Developers intend to deliver them.","correct":true},{"key":"c","text":"The sprint backlog is not a thing that exists in scrum.","correct":false},{"key":"d","text":"It should contain all items to be worked on currently and in the future with the order set by the product owner.","correct":false}],"correct":["b"],"explanation":"Das Sprint Backlog besteht aus dem Sprint‐Ziel (Wofür), den für den Sprint ausgewählten Product‐Backlog‐Einträgen (Was) sowie einem umsetzbaren Plan für die Lieferung des Increments (Wie).","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":3,"nr":79,"id":54891598,"type":"multiple-choice","question":"Which factor(s) should be considered when deciding to release an increment?","answers":[{"key":"a","text":"Customers ability to absorb the new release.","correct":false},{"key":"b","text":"The risks associated with releasing.","correct":false},{"key":"c","text":"The cost and benefits of upgrading.","correct":false},{"key":"d","text":"All answers are some possible things that should be considered when deciding to release an increment.","correct":true}],"correct":["d"],"explanation":"Diese Faktoren machen Sinn, sind so aber nicht im Scrum Guide definiert.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":3,"nr":80,"id":54891634,"type":"multiple-choice","question":"Within a Scrum Team, there are no sub-teams or hierarchies.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Der zentrale Bestandteil von Scrum ist ein kleines Team von Menschen, ein Scrum Team. Das Scrum Team besteht aus einem:einer Scrum Master:in, einem:einer Product Owner:in und Developer:innen. Innerhalb eines Scrum Teams gibt es keine Teilteams oder Hierarchien.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":4,"nr":1,"id":54421558,"type":"multiple-choice","question":"What is the purpose of the Sprint Review?","answers":[{"key":"a","text":"To inspect the outcome of the Sprint and determine future adaptations.","correct":false},{"key":"b","text":"To present the results of the Scrum Team's work to key stakeholders.","correct":false},{"key":"c","text":"To discuss progress toward the Product Goal.","correct":false},{"key":"d","text":"All answers are correct.","correct":true}],"correct":["d"],"explanation":"Zweck des Sprint Reviews ist es, das Ergebnis des Sprints zu überprüfen und künftige Anpassungen festzulegen. Das Scrum Team stellt die Ergebnisse seiner Arbeit den wichtigsten Stakeholder:innen vor, und die Fortschritte in Richtung des Produkt‐Ziels werden diskutiert.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":4,"nr":2,"id":54421570,"type":"multiple-choice","question":"During the Sprint Review, what is discussed?","answers":[{"key":"a","text":"What was accomplished in the Sprint.","correct":false},{"key":"b","text":"What has changed in the environment.","correct":false},{"key":"c","text":"What to do next based on the information discussed.","correct":false},{"key":"d","text":"All answers are correct.","correct":true}],"correct":["d"],"explanation":"Während des Events überprüfen das Scrum Team und die Stakeholder:innen, was im Sprint erreicht wurde und was sich in ihrem Umfeld verändert hat. Auf der Grundlage dieser Informationen arbeiten die Teilnehmenden gemeinsam daran, was als Nächstes zu tun ist.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":4,"nr":3,"id":54421598,"type":"multiple-choice","question":"Can the Product Backlog be adjusted during the Sprint Review?","answers":[{"key":"a","text":"No, the Product Backlog is fixed.","correct":false},{"key":"b","text":"Yes, by the Product Owner to meet new opportunities.","correct":true},{"key":"c","text":"Yes, by the Product Stakeholders to meet new opportunities.","correct":false}],"correct":["b"],"explanation":"Der Product Owner ist für das Management des Product Backlogs verantwortlich, um z.B. neue Chancen zu nutzen.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":4,"nr":4,"id":54421634,"type":"multiple-choice","question":"How long is the Sprint Review timeboxed for a one-month Sprint?","answers":[{"key":"a","text":"2 hours","correct":false},{"key":"b","text":"3 hours","correct":false},{"key":"c","text":"4 hours","correct":true},{"key":"d","text":"8 hours","correct":false}],"correct":["c"],"explanation":"Das Sprint Review ist das vorletzte Event des Sprints und ist für einen einmonatigen Sprint auf maximal vier Stunden zeitlich beschränkt. Bei kürzeren Sprints ist das Event in der Regel kürzer.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":4,"nr":5,"id":54421702,"type":"multiple-choice","question":"Can the length of the Sprint Review be adjusted based on the length of the Sprint?","answers":[{"key":"a","text":"No, the Sprint Review is always the same length.","correct":false},{"key":"b","text":"Yes, the Sprint Review is shorter for shorter Sprints.","correct":true},{"key":"c","text":"Yes, the length of the Sprint Review can be adjusted at the discretion of the Scrum Master.","correct":false}],"correct":["b"],"explanation":"Das Sprint Review ist das vorletzte Event des Sprints und ist für einen einmonatigen Sprint auf maximal vier Stunden zeitlich beschränkt. Bei kürzeren Sprints ist das Event in der Regel kürzer.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":4,"nr":6,"id":54421716,"type":"multiple-choice","question":"The Scrum Team should avoid limiting the Sprint Review to a presentation (it is a working session!).","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Das Sprint Review ist ein Arbeitstermin, und das Scrum Team sollte vermeiden, es auf eine Präsentation zu beschränken.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":4,"nr":7,"id":54422126,"type":"multiple-choice","question":"The Sprint Review is the second to last event of the Sprint.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Das Sprint Review ist das vorletzte Scrum Event in einem Sprint (danach folgt nur noch die Sprint Retrospective).","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Sprache","reason":"Tippfehler."}},{"test":4,"nr":8,"id":54422250,"type":"multiple-choice","question":"How often is the Sprint Retrospective held?","answers":[{"key":"a","text":"At the beginning of every Sprint.","correct":false},{"key":"b","text":"At the end of every Sprint.","correct":true},{"key":"c","text":"When the Scrum Master decides that a Sprint Retrospective is necessary.","correct":false}],"correct":["b"],"explanation":"Die Sprint Retrospective schließt jeden Sprint ab.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":4,"nr":9,"id":54422284,"type":"multiple-choice","question":"What is the purpose of the Sprint Retrospective?","answers":[{"key":"a","text":"To plan ways to increase quality and effectiveness.","correct":true},{"key":"b","text":"To present the results of the Scrum Team's work to key stakeholders.","correct":false},{"key":"c","text":"To review the Product Goal and adjust the Product Backlog as necessary.","correct":false}],"correct":["a"],"explanation":"Der Zweck der Sprint Retrospective ist es, Wege zur Steigerung von Qualität und Effektivität zu planen.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":4,"nr":10,"id":54422498,"type":"multi-select","question":"What could the Scrum Team inspect and discuss during the Sprint Retrospective?","answers":[{"key":"a","text":"Individuals and interactions.","correct":true},{"key":"b","text":"Processes and tools.","correct":true},{"key":"c","text":"The \"Definition of Done\".","correct":true},{"key":"d","text":"The \"Definition of Ready\".","correct":false}],"correct":["a","b","c"],"explanation":"Das Scrum Team überprüft, wie der letzte Sprint in Bezug auf Individuen, Interaktionen, Prozesse, Werkzeuge und seine Definition of Done verlief. Die überprüften Elemente variieren oft je nach Arbeitsdomäne. Das Konzept einer \"Definition of Ready\" gibt es im Scrum Framework nicht.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":4,"nr":11,"id":54422526,"type":"multiple-choice","question":"How long is the Sprint Retrospective timeboxed for a one-month Sprint?","answers":[{"key":"a","text":"3 hours","correct":true},{"key":"b","text":"4 hours","correct":false},{"key":"c","text":"2 hours","correct":false}],"correct":["a"],"explanation":"Die Sprint Retrospective schließt den Sprint ab. Sie ist für einen einmonatigen Sprint auf maximal drei Stunden beschränkt. Bei kürzeren Sprints ist das Event in der Regel kürzer.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":4,"nr":12,"id":54448684,"type":"multiple-choice","question":"What could happen when a Sprint’s horizon is too long?","answers":[{"key":"a","text":"The Sprint Goal may become invalid.","correct":true},{"key":"b","text":"The complexity may decrease.","correct":false},{"key":"c","text":"The risk may decrease.","correct":false}],"correct":["a"],"explanation":"Wenn Sprints zu lang sind, kann das Sprint-Ziel obsolet werden, die Komplexität kann steigen und das Risiko kann sich erhöhen.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Sprache","reason":"Zeichensetzung."}},{"test":4,"nr":13,"id":54451190,"type":"multi-select","question":"During the Sprint:","answers":[{"key":"a","text":"No changes are made that would endanger the Sprint Goal.","correct":true},{"key":"b","text":"Scope may be clarified and renegotiated with the Product Owner as more is learned.","correct":true},{"key":"c","text":"Quality will decrease.","correct":false},{"key":"d","text":"The Product Backlog is refined as needed.","correct":true}],"correct":["a","b","d"],"explanation":"Laut Scrum Guide gilt während des Sprints: Es werden keine Änderungen vorgenommen, die das Sprint-Ziel gefährden; die Qualität nimmt nicht ab; das Product Backlog wird nach Bedarf verfeinert; und der Umfang kann mit dem:der Product Owner:in geklärt und neu verhandelt werden, wenn mehr gelernt wird. Antwort C ist daher falsch – richtig wäre „Quality does not decrease“.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Erklärung","reason":"Erklärung sprach von „Budget“, das in keiner Antwort vorkommt."}},{"test":4,"nr":14,"id":54451984,"type":"multiple-choice","question":"Who ensures that attendees to the Sprint Planning are prepared to discuss the most important Product Backlog items?","answers":[{"key":"a","text":"Product Owner","correct":true},{"key":"b","text":"Scrum Master","correct":false}],"correct":["a"],"explanation":"Der:die Product Owner:in stellt sicher, dass die Teilnehmenden vorbereitet sind, die wichtigsten Product‐Backlog‐Einträge zu besprechen, und wie sie dem Produkt‐Ziel zuzuordnen sind.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":4,"nr":15,"id":54452102,"type":"multiple-choice","question":"Shorter Sprints:","answers":[{"key":"a","text":"Can be employed to generate more learning cycles.","correct":false},{"key":"b","text":"Limit the risk of cost and effort to a smaller time frame.","correct":false},{"key":"c","text":"Both answers are correct.","correct":true}],"correct":["c"],"explanation":"Wenn der Horizont eines Sprints zu lang ist, kann das Sprint‐Ziel hinfällig werden, die Komplexität kann steigen und das Risiko kann zunehmen. Kürzere Sprints können eingesetzt werden, um mehr Lernzyklen zu generieren und das Risiko von Kosten und Aufwand auf einen kleineren Zeitrahmen zu begrenzen. Jeder Sprint kann als ein kurzes Projekt betrachtet werden.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":4,"nr":16,"id":54452510,"type":"multi-select","question":"Which topics are discussed during the Sprint Planning?","answers":[{"key":"a","text":"Why is this Sprint valuable?","correct":true},{"key":"b","text":"What can be Done this Sprint?","correct":true},{"key":"c","text":"How will the chosen work get done?","correct":true},{"key":"d","text":"Who will do which task?","correct":false}],"correct":["a","b","c"],"explanation":"Laut Scrum Guide behandelt das Sprint Planning drei Themen: Warum ist dieser Sprint wertvoll? Was kann in diesem Sprint fertiggestellt werden? Wie wird die ausgewählte Arbeit erledigt? Wer was macht, entscheiden die Entwickler:innen selbst – das ist kein festes Thema des Sprint Plannings.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Inhalt","reason":"Antwort B und C waren identisch; die dritte Frage des Sprint Plannings („How“) fehlte."}},{"test":4,"nr":17,"id":54452524,"type":"multiple-choice","question":"A defined 'Definition of Done' helps the Developers to be more confident in their Sprint forecasts.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Die Definition of Done stellt ein gemeinsames Verständnis dessen dar, was \"fertig\" bedeutet. Daher hilft sie den Entwickler:innen bei der Vorhersage, wie lange es dauern wird/welche Aufgaben erforderlich sind, um ein Product Backlog Item in ein Increment zu verwandeln, das der Definition of Done entspricht.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":4,"nr":18,"id":54452534,"type":"multi-select","question":"Which of the following options represents a purpose of the Daily Scrum?","answers":[{"key":"a","text":"To inspect progress toward the Sprint Goal.","correct":true},{"key":"b","text":"To adapt the Sprint Backlog as necessary.","correct":true},{"key":"c","text":"To adjust the upcoming planned work.","correct":true},{"key":"d","text":"To refine the Product Backlog.","correct":false},{"key":"e","text":"To report the status to the Product Owner.","correct":false}],"correct":["a","b","c"],"explanation":"Der Zweck des Daily Scrum ist es, den Fortschritt auf dem Weg zum Erreichen des Sprint Goals zu überprüfen und das Sprint Backlog bei Bedarf anzupassen.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Sprache","reason":"Wortstellung."}},{"test":4,"nr":19,"id":54452542,"type":"multi-select","question":"Which of the following options represents a purpose of the Sprint Review?","answers":[{"key":"a","text":"To inspect the outcome of the Sprint.","correct":true},{"key":"b","text":"To determine future adaptations to the product.","correct":true},{"key":"c","text":"To discuss the collaboration model with the stakeholders.","correct":false}],"correct":["a","b"],"explanation":"Der Zweck des Sprint-Reviews ist es, das Ergebnis des Sprints zu überprüfen und zukünftige Weiterentwicklungsmöglichkeiten zu beschließen.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":4,"nr":20,"id":54452772,"type":"multi-select","question":"Which of the following options represents a topic relevant for the Sprint Retrospective?","answers":[{"key":"a","text":"Team collaboration","correct":true},{"key":"b","text":"Definition of Done","correct":true},{"key":"c","text":"Definition of a Sprint Goal","correct":false},{"key":"d","text":"Estimation of Product Backlog Items","correct":false}],"correct":["a","b"],"explanation":"Der Zweck der Sprint Retrospektive besteht darin, Wege zur Steigerung von Qualität und Effektivität zu planen. Die Definition of Done und die Zusammenarbeit im Team sind typische Themen für die Sprint Retrospektive. Das Sprint Goal wird während des Sprint Planning definiert. Im Sprint Planning findet auch die Aufwandsschätzung bezüglich der Items statt.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":4,"nr":21,"id":54453066,"type":"multiple-choice","question":"The Sprint Review is a working session and the Scrum Team should avoid limiting it to a presentation.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Das ist richtig! Dem Scrum Guide folgend ist das Sprint Review eine Arbeitssession und das Scrum Team sollte es vermeiden, es auf eine Präsentation zu beschränken.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":4,"nr":22,"id":54453070,"type":"multi-select","question":"Which are events for inspection and adaptation in Scrum?","answers":[{"key":"a","text":"Daily Scrum","correct":true},{"key":"b","text":"Sprint Planning","correct":true},{"key":"c","text":"Sprint Review","correct":true},{"key":"d","text":"Sprint Retrospective","correct":true},{"key":"e","text":"Product Backlog Refinement","correct":false}],"correct":["a","b","c","d"],"explanation":"Jedes Event in Scrum ist eine formelle Gelegenheit, Scrum‐Artefakte zu überprüfen und anzupassen. Diese Events sind speziell darauf ausgelegt, die erforderliche Transparenz zu ermöglichen. Wenn ein Event nicht wie vorgeschrieben durchgeführt wird, verpasst man die Gelegenheit, zu überprüfen und anzupassen.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":4,"nr":23,"id":54483418,"type":"multiple-choice","question":"The stakeholders of a product are not allowed to contact the Scrum Team anytime during the Sprint - only in the Sprint Review.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Obwohl das Scrum Team mit den Stakeholdern während des Sprint Review Meetings zusammenarbeitet, impliziert der Scrum Guide nicht, dass dies die einzige Gelegenheit ist, bei der sie sich treffen bzw. in Kontakt sind.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":4,"nr":24,"id":54483434,"type":"multi-select","question":"The Scrum Values are:","answers":[{"key":"a","text":"Commitment","correct":true},{"key":"b","text":"Focus","correct":true},{"key":"c","text":"Openness","correct":true},{"key":"d","text":"Respect","correct":true},{"key":"e","text":"Courage","correct":true},{"key":"f","text":"Transparency","correct":false},{"key":"g","text":"Inspection","correct":false}],"correct":["a","b","c","d","e"],"explanation":"Die Scrum Werte sind: Commitment, Fokus, Offenheit, Respekt und Mut.","section":"Scrum Guide (US 2020): Scrum Values (Seite 4)","correction":null},{"test":4,"nr":25,"id":54483448,"type":"multiple-choice","question":"The Sprint Planning in Scaled Scrum is time boxed to:","answers":[{"key":"a","text":"A maximum of 8 hours for a one-month Sprint.","correct":true},{"key":"b","text":"A maximum of 16 hours for a one-month Sprint (2 teams = double the time).","correct":false}],"correct":["a"],"explanation":"Auch bei skaliertem Scrum (z. B. Nexus) richtet sich die Timebox nach dem Scrum Guide: höchstens acht Stunden für einen einmonatigen Sprint. Die Timebox verdoppelt sich nicht mit der Anzahl der Teams.","section":"Online Nexus Guide (US 2021): Nexus Events","correction":{"kind":"Erklärung","reason":"Erklärung zu knapp, um die Antwort zu begründen."}},{"test":4,"nr":26,"id":54483456,"type":"multi-select","question":"The Scrum Team decides to change the Sprint length from 4 weeks to 2 weeks. What is the impact of this decision?","answers":[{"key":"a","text":"The risk may increase.","correct":false},{"key":"b","text":"The complexity may rise.","correct":false},{"key":"c","text":"More learning cycles for the team.","correct":true},{"key":"d","text":"The risk of cost and effort is limited to a smaller time frame.","correct":true}],"correct":["c","d"],"explanation":"Wenn ein Sprint zu lange dauert, kann das Sprint-Ziel ungültig werden, die Komplexität kann steigen und das Risiko kann sich erhöhen. Kürzere Sprints können eingesetzt werden, um mehr Lernzyklen zu generieren und das Risiko von Kosten und Aufwand auf einen kleineren Zeitrahmen zu begrenzen.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Sprache","reason":"Grammatik und Satzzeichen."}},{"test":4,"nr":27,"id":54483472,"type":"multiple-choice","question":"When is the Sprint Goal created?","answers":[{"key":"a","text":"Sprint Planning","correct":true},{"key":"b","text":"Sprint Review","correct":false},{"key":"c","text":"Sprint Retrospective","correct":false},{"key":"d","text":"Whenever the Product Owner decides","correct":false}],"correct":["a"],"explanation":"Das Sprint Goal wird im Sprint Planning durch das gesamte Scrum Team definiert.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":4,"nr":28,"id":54483484,"type":"multiple-choice","question":"A Developer is not working on the tasks defined in the Sprint. Which Scrum accountability is responsible for making sure the Developer works on tasks from the Sprint Backlog?","answers":[{"key":"a","text":"Developers","correct":true},{"key":"b","text":"Scrum Master","correct":false},{"key":"c","text":"Product Owner","correct":false},{"key":"d","text":"PMO","correct":false}],"correct":["a"],"explanation":"Die Entwickler:innen managen sich selbst und ziehen sich gegenseitig als Expert:innen zur Verantwortung. Dafür braucht es weder den:die Scrum Master:in noch den:die Product Owner:in.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Erklärung","reason":"Erklärung zu knapp."}},{"test":4,"nr":29,"id":54483516,"type":"multiple-choice","question":"Who is responsible for maximizing the value of the product?","answers":[{"key":"a","text":"Product Owner","correct":true},{"key":"b","text":"Product Manager","correct":false},{"key":"c","text":"Scrum Master","correct":false},{"key":"d","text":"Developers","correct":false}],"correct":["a"],"explanation":"Der:die Product Owner:in ist dafür verantwortlich, den Wert des Produkts zu maximieren. Zu diesem Zweck erstellt er:sie wertsteigernde/-schaffende Product Backlog Items und ordnet (priorisiert) diese. So wird der Wert eines Sprints maximiert.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":4,"nr":30,"id":54483552,"type":"multiple-choice","question":"A company is developing three products using Scrum. Which of the following statements is correct?","answers":[{"key":"a","text":"Each Product will have a Product Owner.","correct":true},{"key":"b","text":"There is one single Product Owner for all three Products.","correct":false},{"key":"c","text":"There is one Product Backlog.","correct":false}],"correct":["a"],"explanation":"Jedes Produkt hat genau ein Product Backlog und eine:n Product Owner:in. Bei drei Produkten gibt es also drei Product Backlogs, und jedes Produkt hat seine:n Product Owner:in. Ob dieselbe Person mehrere Produkte verantwortet, legt der Scrum Guide nicht fest – Antwort B ist deshalb nicht zwingend richtig, Antwort C ist falsch.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Inhalt","reason":"Gleiche Frage wie 1.32 – gleiche Korrektur."}},{"test":4,"nr":31,"id":54739862,"type":"multiple-choice","question":"Could the Product Owner and the Scrum Master also be Developers of the Scrum Team?","answers":[{"key":"a","text":"Yes","correct":true},{"key":"b","text":"No","correct":false}],"correct":["a"],"explanation":"Scrum verbietet dies nicht.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":4,"nr":32,"id":54739904,"type":"multiple-choice","question":"What should Developers do if they don't understand a functional requirement?","answers":[{"key":"a","text":"Move the Item to a future sprint.","correct":false},{"key":"b","text":"Work with the Product Owner to get a better understanding.","correct":true},{"key":"c","text":"Request a specialist to be added to the team.","correct":false}],"correct":["b"],"explanation":"Der:die Product Owner:in ist für ein effektives Product‐Backlog‐Management ergebnisverantwortlich. Das umfasst auch sicherzustellen, dass das Product Backlog transparent, sichtbar und verstanden ist.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":4,"nr":33,"id":54739940,"type":"multiple-choice","question":"Time-boxed means:","answers":[{"key":"a","text":"That an event cannot last longer than a specified amount of time.","correct":true},{"key":"b","text":"That an event starts at a specific time.","correct":false}],"correct":["a"],"explanation":"","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":4,"nr":34,"id":54740114,"type":"multiple-choice","question":"A Product Owner cannot send a representative to replace them at the Sprint Review.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Niemand kann den:die Product Owner:in im Sprint Review ersetzen.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Sprache","reason":"Grammatik."}},{"test":4,"nr":35,"id":54740164,"type":"multiple-choice","question":"When does a new Sprint begin?","answers":[{"key":"a","text":"Immediately after the next Sprint Planning.","correct":false},{"key":"b","text":"Immediately after the end of the previous Sprint.","correct":true},{"key":"c","text":"It depends on the Product Owner.","correct":false}],"correct":["b"],"explanation":"Ein neuer Sprint beginnt unmittelbar nach dem Abschluss des vorherigen Sprints.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":4,"nr":36,"id":54740782,"type":"multiple-choice","question":"Only the Scrum Master is allowed to change the Sprint Backlog during the Sprint.","answers":[{"
