ct":false},{"key":"b","text":"Conventions, standards and guidelines of the Organization.","correct":true},{"key":"c","text":"The Definition of Done of other Scrum Teams working on other products.","correct":false},{"key":"d","text":"The Definition of Done of other Scrum Teams working on the same Product.","correct":true},{"key":"e","text":"Experience of the Product Owner.","correct":false}],"correct":["b","d"],"explanation":"Wenn die Definition of Done für ein Increment Teil der Standards der Organisation ist, müssen alle Scrum Teams diese als Mindestmaß befolgen. Wenn sie kein Organisationsstandard ist, muss das Scrum Team eine für das Produkt geeignete Definition of Done erstellen. Wenn mehrere Scrum Teams an einem Produkt zusammenarbeiten, müssen sie eine gemeinsame Definition of Done definieren und sich alle daran halten.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":5,"nr":70,"id":54887994,"type":"multiple-choice","question":"The Increment is the sum of all the Product Backlog items completed during the current Sprint only.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Ein Increment ist ein konkreter Schritt in Richtung des Produkt‐Ziels. Jedes Increment ist additiv zu allen vorherigen Increments und gründlich geprüft, um sicherzustellen, dass sie alle zusammen funktionieren. Um einen Mehrwert zu erzielen, muss das Increment verwendbar sein.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":5,"nr":71,"id":54894664,"type":"multiple-choice","question":"The Sprint Goal and Sprint Backlog are outputs of Sprint Planning.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Das Sprint Planning initiiert den Sprint, indem es die für den Sprint auszuführenden Arbeiten darlegt. Dieser resultierende Plan wird durch die gemeinschaftliche Arbeit des gesamten Scrum Teams erstellt. Der:die Product Owner:in stellt sicher, dass die Teilnehmenden vorbereitet sind, die wichtigsten Product‐Backlog‐Einträge zu besprechen, und wie sie dem Produkt‐Ziel zuzuordnen sind.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":5,"nr":72,"id":54894672,"type":"multiple-choice","question":"The Sprint Goal is the single objective for the Sprint.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Das Sprint‐Ziel ist die einzige Zielsetzung für den Sprint. Obwohl das Sprint‐Ziel ein Commitment der Developer:innen ist, bietet es Flexibilität in Bezug auf die genaue Arbeit, die erforderlich ist, um es zu erreichen.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":5,"nr":73,"id":54894694,"type":"multiple-choice","question":"A first Sprint can start before the Product Owner has a complete and exhaustive Product Backlog in place.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Für einen ersten Sprint braucht man nicht mehr als eine:n Product Owner:in, ein Team und genügend Ideen, um möglicherweise einen ganzen Sprint durchzuführen.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":5,"nr":74,"id":54894848,"type":"multiple-choice","question":"The Scrum Master should lead the Daily Scrum and ensure that everyone actively participates.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Das ist nicht die Aufgabe des:der Scrum Master:in.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":5,"nr":75,"id":54894870,"type":"multiple-choice","question":"The purpose of the Daily Scrum is for the developers to inform the Product Owner of the progress.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Das Daily Scrum ist ein 15‐minütiges Event für die Developer:innen des Scrum Teams. Der:die Product Owner:in muss nicht anwesend sein.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":5,"nr":76,"id":54894884,"type":"multiple-choice","question":"Who identifies the Key Stakeholders for the Product? (choose the best option)","answers":[{"key":"a","text":"The Product Owner","correct":true},{"key":"b","text":"The Scrum Master","correct":false},{"key":"c","text":"The Scrum Team","correct":false},{"key":"d","text":"The Upper Management","correct":false}],"correct":["a"],"explanation":"Um den Wert des Produkts zu maximieren, sollte der:die Product Owner:in die wichtigsten Stakeholder für das Produkt identifizieren und sie bei Bedarf in den Entwicklungsprozess einbeziehen.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":5,"nr":77,"id":54894916,"type":"multi-select","question":"In the middle of the Sprint, the Developers find that they have room for additional work. They decide to change the Sprint Backlog by adding a few more items from the Product Backlog. Who should be present to decide on the additional work and modify the Sprint Backlog accordingly?","answers":[{"key":"a","text":"Product Owner","correct":true},{"key":"b","text":"Scrum Master","correct":false},{"key":"c","text":"Developers","correct":true},{"key":"d","text":"Senior members of the Dev. Team","correct":false},{"key":"e","text":"Scrum Team","correct":false}],"correct":["a","c"],"explanation":"Nur die Entwickler:innen des Scrum-Teams können Änderungen am Sprint Backlog vornehmen, und es ist die Aufgabe des:der Product Owner:in, den Wert ihrer Arbeit zu optimieren.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Sprache","reason":"Grammatik."}},{"test":5,"nr":78,"id":54894932,"type":"multiple-choice","question":"Who creates the Sprint Goal?","answers":[{"key":"a","text":"The Scrum Team","correct":true},{"key":"b","text":"The Developers","correct":false},{"key":"c","text":"The Product Owner","correct":false},{"key":"d","text":"The Scrum Master","correct":false}],"correct":["a"],"explanation":"Im Sprint Planning schlägt der:die Product Owner:in vor, wie das Produkt im aktuellen Sprint seinen Wert und Nutzen steigern könnte. Das gesamte Scrum Team arbeitet dann zusammen, um ein Sprint-Ziel zu definieren. Das Sprint-Ziel wird anschließend dem Sprint Backlog hinzugefügt.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Erklärung","reason":"Erklärung sagte nicht, wer das Sprint-Ziel erstellt."}},{"test":5,"nr":79,"id":54894946,"type":"multiple-choice","question":"The purpose of the Sprint Review is…","answers":[{"key":"a","text":"To check what was done and not done during the Sprint.","correct":false},{"key":"b","text":"To inspect the Increment and adapt the Product Backlog.","correct":true},{"key":"c","text":"To show Stakeholders work that is done and work that is near to completion.","correct":false},{"key":"d","text":"To review the status of the Project.","correct":false}],"correct":["b"],"explanation":"","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":5,"nr":80,"id":54894966,"type":"multiple-choice","question":"During which Scrum event should the Sprint Goal be crafted?","answers":[{"key":"a","text":"Anytime during the Sprint","correct":false},{"key":"b","text":"The Daily Scrum","correct":false},{"key":"c","text":"The Sprint Retrospective","correct":false},{"key":"d","text":"The Sprint Review","correct":false},{"key":"e","text":"The Sprint Planning","correct":true}],"correct":["e"],"explanation":"Das Sprint‐Ziel wird während des Sprint‐Planning‐Events erstellt und dann zum Sprint Backlog hinzugefügt.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":6,"nr":1,"id":54437214,"type":"multiple-choice","question":"If a Product Backlog item does not meet the Definition of Done, what happens to it?","answers":[{"key":"a","text":"It is released.","correct":false},{"key":"b","text":"It is presented at the Sprint Review.","correct":false},{"key":"c","text":"It returns to the Product Backlog for future consideration.","correct":true}],"correct":["c"],"explanation":"Wenn ein Product‐Backlog‐Item nicht der Definition of Done entspricht, kann es weder released noch beim Sprint Review präsentiert werden. Stattdessen wandert es zur zukünftigen Berücksichtigung in das Product Backlog zurück.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":6,"nr":2,"id":54437476,"type":"multiple-choice","question":"An Increment may be delivered to stakeholders prior to the end of the Sprint.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Innerhalb eines Sprints kann mehr als ein Increment erstellt werden. Deren Summe wird im Sprint Review vorgestellt, womit Empirie unterstützt wird. Ein Increment könnte jedoch auch schon vor Ende des Sprints an die Stakeholder:innen geliefert werden. Das Sprint Review sollte niemals als Barriere zur Lieferung von Wert angesehen werden.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Sprache","reason":"Ja/Nein-Frage mit Wahr/Falsch-Antworten – als Aussage umformuliert."}},{"test":6,"nr":3,"id":54437522,"type":"multi-select","question":"What is the Sprint Backlog composed of?","answers":[{"key":"a","text":"Sprint Goal","correct":true},{"key":"b","text":"The set of Product Backlog items selected for the Sprint","correct":true},{"key":"c","text":"An actionable plan for delivering the Increment","correct":true},{"key":"d","text":"The Sprint Objective","correct":false},{"key":"e","text":"The Increment","correct":false}],"correct":["a","b","c"],"explanation":"Das Sprint Backlog besteht aus dem Sprint‐Ziel (Wofür), den für den Sprint ausgewählten Product‐Backlog‐Items (Was) sowie einem umsetzbaren Plan für die Lieferung des Increments (Wie).","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":6,"nr":4,"id":54437570,"type":"multiple-choice","question":"It is acceptable to update the Sprint Backlog as more is learned.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Das Sprint Backlog ist ein gut sichtbares Echtzeitbild der Arbeit, die die Entwickler während des Sprints zu erledigen planen, um das Sprint Goal zu erreichen. Folglich wird das Sprint Backlog während des Sprints angepasst, wenn neue Erkenntnisse gewonnen werden.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Sprache","reason":"Ja/Nein-Frage mit Wahr/Falsch-Antworten – als Aussage umformuliert."}},{"test":6,"nr":5,"id":54437618,"type":"multiple-choice","question":"The Product Backlog is the single source of work undertaken by the Scrum Team.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Laut dem Scrum Guide ist das Product Backlog eine sich entwickelnde, geordnete Liste dessen, was zur Verbesserung des Produkts benötigt wird. Es ist die einzige Quelle für die Arbeit des Scrum-Teams.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":6,"nr":6,"id":54437788,"type":"multiple-choice","question":"Why does each Scrum artifact have a commitment?","answers":[{"key":"a","text":"To reinforce empiricism and the Scrum values for the Scrum Team and their stakeholders.","correct":true},{"key":"b","text":"To make the work of the Scrum Team more visible.","correct":false},{"key":"c","text":"To enable the team to communicate more efficiently.","correct":false}],"correct":["a"],"explanation":"Laut Scrum Guide dienen die Commitments dazu, Empirie und die Scrum‐Werte für das Scrum Team und seine Stakeholder:innen zu verstärken.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Sprache","reason":"Grammatik."}},{"test":6,"nr":7,"id":54437804,"type":"multi-select","question":"Scrum’s artifacts represent:","answers":[{"key":"a","text":"Work","correct":true},{"key":"b","text":"Value","correct":true},{"key":"c","text":"Time","correct":false},{"key":"d","text":"Budget","correct":false}],"correct":["a","b"],"explanation":"Die Artefakte von Scrum repräsentieren Arbeit oder Wert. Sie sind dafür ausgelegt, die Transparenz von Schlüsselinformationen zu maximieren.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":6,"nr":8,"id":54437992,"type":"multiple-choice","question":"The Sprint Backlog is a plan by and for the Developers.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Gemäß dem Scrum Guide ist das Sprint Backlog ein Plan von und für die Entwickler. Es ist ein gut sichtbares, in Echtzeit erstelltes Bild der Arbeit, die die Entwickler während des Sprints erledigen wollen, um das Sprint Goal zu erreichen.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":6,"nr":9,"id":54438012,"type":"multiple-choice","question":"Multiple Increments may be created within a Sprint.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Laut Scrum Guide kann innerhalb eines Sprints mehr als ein Increment erstellt werden. Deren Summe wird im Sprint Review vorgestellt.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":6,"nr":10,"id":54453720,"type":"multiple-choice","question":"What is the main reason for the Scrum Master to attend the Daily Scrum?","answers":[{"key":"a","text":"The Scrum Master doesn't have to attend the Daily Scrum.","correct":true},{"key":"b","text":"To make sure the Developers answer the 'three questions'.","correct":false},{"key":"c","text":"To make sure that every Developer attends.","correct":false}],"correct":["a"],"explanation":"Das Daily Scrum ist ein Scrum Event nur für die Entwickler:innen. Der:die Scrum Master:in muss nicht anwesend sein.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Sprache","reason":"Zeichensetzung."}},{"test":6,"nr":11,"id":54453734,"type":"multiple-choice","question":"Developers have pulled a Product Backlog Item into the Sprint Backlog and worked on it during the Sprint. However, it does not meet their Definition of Done by the end of the Sprint. What should the Scrum Team do?","answers":[{"key":"a","text":"Include only the finalized parts into the Increment.","correct":false},{"key":"b","text":"Do not present it in the Sprint Review and put it back into the Product Backlog.","correct":true},{"key":"c","text":"Present the unfinished Item in the Sprint Review.","correct":false}],"correct":["b"],"explanation":"Wenn ein Item nicht der Definition of Done entspricht, darf es im Sprint Review nicht präsentiert und nicht released werden.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":6,"nr":12,"id":54453752,"type":"multiple-choice","question":"The (artifact) commitment of the Product Backlog in Scrum is the Product Goal.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Jedes Scrum Artefakt beinhaltet ein Commitment, um sicherzustellen, dass Informationen bereitgestellt werden, welche Transparenz und Fokus verbessern, um den Fortschritt messbar zu machen:\n• Für das Product Backlog ist es das Produkt‐Ziel.\n• Für das Sprint Backlog ist es das Sprint‐Ziel.\n• Für das Increment ist es die Definition of Done.\nDiese Commitments dienen dazu, Empirie und die Scrum‐Werte für das Scrum Team und seine Stakeholder:innen zu verstärken.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":6,"nr":13,"id":54453922,"type":"multiple-choice","question":"Scrum’s artifacts represent work or costs.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Die Artefakte von Scrum stellen Arbeit (Work) oder Wert (Value) dar.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":6,"nr":14,"id":54454054,"type":"multi-select","question":"Which of the following options are accountabilities of the Developers?","answers":[{"key":"a","text":"Creating a plan for the Sprint (plan in the Sprint Backlog).","correct":true},{"key":"b","text":"Instilling quality by adhering to a Definition of Done.","correct":true},{"key":"c","text":"Holding each other accountable as professionals.","correct":true},{"key":"d","text":"Ensuring that the Product Backlog is transparent, visible and understood.","correct":false}],"correct":["a","b","c"],"explanation":"Der:die Product Owner:in ist dafür verantwortlich, dass das Product Backlog transparent, sichtbar und verständlich ist.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":6,"nr":15,"id":54454062,"type":"multiple-choice","question":"The Sprint Retrospective is time boxed to:","answers":[{"key":"a","text":"A maximum of 3 h for a one-month Sprint","correct":true},{"key":"b","text":"A maximum of 2 h for a one-month Sprint","correct":false}],"correct":["a"],"explanation":"Die Sprint Retrospective schließt den Sprint ab. Sie ist für einen einmonatigen Sprint auf maximal drei Stunden beschränkt. Bei kürzeren Sprints ist das Event in der Regel kürzer.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":6,"nr":16,"id":54454072,"type":"multiple-choice","question":"The Sprint Planning is time boxed to:","answers":[{"key":"a","text":"A maximum of 8 h for a one-month Sprint","correct":true},{"key":"b","text":"A maximum of 4 h for a one-month Sprint","correct":false},{"key":"c","text":"A maximum of 3 h for a one-month Sprint","correct":false}],"correct":["a"],"explanation":"Das Sprint Planning ist zeitlich beschränkt auf maximal acht Stunden für einen einmonatigen Sprint. Bei kürzeren Sprints ist das Event in der Regel kürzer.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":6,"nr":17,"id":54454080,"type":"multiple-choice","question":"Each event in Scrum is a formal opportunity to inspect and adapt Scrum artifacts.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Das ist richtig! Jedes Ereignis in Scrum ist eine formale Gelegenheit, Scrum-Artefakte zu überprüfen und anzupassen.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":6,"nr":18,"id":54454100,"type":"multiple-choice","question":"Optimally, all Scrum events are held at the same time and place.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Im Idealfall finden alle Scrum Events zur gleichen Zeit und am gleichen Ort statt, um die Komplexität zu reduzieren.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":6,"nr":19,"id":54486268,"type":"multiple-choice","question":"How should the Developers react when they realize that they have overcommitted themselves in a Sprint?","answers":[{"key":"a","text":"They should collaborate with the Product Owner and decide together how to adjust the Sprint Backlog.","correct":true},{"key":"b","text":"They should ask the Scrum Master to cancel the Sprint.","correct":false},{"key":"c","text":"They should keep this information to themselves until the next Sprint Review.","correct":false}],"correct":["a"],"explanation":"Der:die Scrum Master:in ist nicht berechtigt, den Sprint abzubrechen. Es ist keine gute Idee, die Informationen zurückzuhalten. Es ist wichtig, dass sie sich sofort mit dem:der Product Owner:in zusammensetzen, um die notwendigen Anpassungen zu besprechen.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Sprache","reason":"Zeichensetzung."}},{"test":6,"nr":20,"id":54486286,"type":"multiple-choice","question":"The Product Owner has to maximize the value - more features always bring more value. Therefore, the Product Owner has to maximize the number of features in a sprint.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Es ist nicht richtig, dass Features immer einen Mehrwert für das Produkt darstellen. Einige Features können den Gesamtwert sogar verringern (z. B. durch höhere Wartungskosten oder geringere Skalierbarkeit).","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":6,"nr":21,"id":54486306,"type":"multiple-choice","question":"What should the Product Owner do when the Developers are ready to start the first Sprint, but the Product Backlog is not ready yet?","answers":[{"key":"a","text":"The Product Owner should let the team start the Sprint and continue refining the Product Backlog.","correct":true},{"key":"b","text":"The Product Owner should not allow the team to start the Sprint.","correct":false},{"key":"c","text":"The Product Owner should ask the Scrum Master to remove this impediment.","correct":false}],"correct":["a"],"explanation":"Unfertige (nicht aus-spezifizierte) Items zu haben, ist kein Hindernis oder gar ein Grund, einen Sprint nicht zu beginnen. Es ist völlig in Ordnung, Items während des Sprints (\"on the fly\") zu spezifizieren.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Sprache","reason":"Großschreibung."}},{"test":6,"nr":22,"id":54486322,"type":"multiple-choice","question":"Which statement about the Product Backlog is correct?","answers":[{"key":"a","text":"The Product Owner is responsible for managing the Product Backlog.","correct":true},{"key":"b","text":"The Scrum Master is responsible for managing the Product Backlog.","correct":false},{"key":"c","text":"The Product Backlog must only contain small, detailed and clearly described items.","correct":false}],"correct":["a"],"explanation":"Der:die Product Owner:in ist für das Management des Product Backlogs verantwortlich. Es sollte nach Wert geordnet sein, und die Elemente am unteren Ende des Product Backlogs können größer sein (noch nicht verfeinert).","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":6,"nr":23,"id":54486336,"type":"multiple-choice","question":"If the Product Owner has concerns about the Definition of Done (DoD) - what should the Product Owner do?","answers":[{"key":"a","text":"The Product Owner should discuss the Definition of Done with the Developers and the rest of the Scrum Team.","correct":true},{"key":"b","text":"The Product Owner should ask the Scrum Master to change the Definition of Done.","correct":false},{"key":"c","text":"The Product Owner should change the Definition of Done.","correct":false}],"correct":["a"],"explanation":"Laut Scrum Guide 2020 erstellt das gesamte Scrum Team die Definition of Done, sofern es keinen Organisationsstandard gibt; die Entwickler:innen müssen sich daran halten. Der:die Product Owner:in ist Teil des Scrum Teams und bringt Bedenken deshalb in die gemeinsame Diskussion ein – typischerweise in der Sprint Retrospective. Allein ändern darf er:sie die Definition of Done nicht.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Inhalt","reason":"Erklärung gab die Regel aus dem Scrum Guide 2017 wieder (Development Team verantwortet die DoD). Laut Scrum Guide 2020 erstellt das gesamte Scrum Team die Definition of Done."}},{"test":6,"nr":24,"id":54486362,"type":"multi-select","question":"Which two statements about the Developers are correct?","answers":[{"key":"a","text":"The Developers are accountable for instilling quality by adhering to the Definition of Done.","correct":true},{"key":"b","text":"The Developers are self-managed.","correct":true},{"key":"c","text":"The Developers are not allowed to help the Product Owner manage the Product Backlog.","correct":false},{"key":"d","text":"The Developers decide when to do the next release.","correct":false}],"correct":["a","b"],"explanation":"Laut Scrum Guide 2020 sind die Entwickler:innen u. a. dafür ergebnisverantwortlich, Qualität durch die Einhaltung der Definition of Done einzubringen, und das Scrum Team ist selbstmanagend. Die Entwickler:innen dürfen dem:der Product Owner:in beim Product-Backlog-Management helfen (z. B. beim Refinement). Ob und wann ein Increment released wird, entscheidet in der Regel der:die Product Owner:in.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Inhalt","reason":"Antwort A („The Development Team owns the Definition of Done“) stammt aus dem Scrum Guide 2017 und ist nach dem Scrum Guide 2020 falsch. Durch eine korrekte Aussage ersetzt; Erklärung ergänzt."}},{"test":6,"nr":25,"id":54486548,"type":"multiple-choice","question":"The Sprint Review is considered as a \"formal meeting\".","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Sei vorsichtig mit dem Wort \"formal\". Scrum.org verwendet das Wort \"formal\" auf zwei verschiedene Arten:\n1. \"formal Opportunities\" zur Inspektion und Anpassung - das bedeutet eine ernsthafte Gelegenheit -> alle Scrum Events sind formale Gelegenheiten zur Inspektion und Anpassung.\n2. Ein \"formales Meeting\" - ein Meeting, in dem Leute etwas genehmigen und Unterschriften austauschen -> kein Scrum Event ist ein formales Meeting.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":6,"nr":26,"id":54486560,"type":"multiple-choice","question":"What kind of testing should be done during the Sprint?","answers":[{"key":"a","text":"All kinds of tests required to create a working Increment.","correct":true},{"key":"b","text":"Test driven development.","correct":false},{"key":"c","text":"Unit tests.","correct":false},{"key":"d","text":"Acceptance tests.","correct":false}],"correct":["a"],"explanation":"Jedes Increment sollte potenziell releasebar sein. Daher sollten alle Tests während des Sprints durchgeführt werden, damit die Items \"Done\" werden.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Sprache","reason":"Grammatik."}},{"test":6,"nr":27,"id":54492150,"type":"multiple-choice","question":"The size of the Scrum Team should be:","answers":[{"key":"a","text":"10 or fewer people","correct":true},{"key":"b","text":"3-9 people","correct":false},{"key":"c","text":"3-7 people","correct":false}],"correct":["a"],"explanation":"Das Scrum Team muss klein genug sein, um flexibel zu bleiben, und groß genug, um innerhalb eines Sprints umfangreiche Arbeit abschließen zu können. In der Regel wird dies mit 10 oder weniger Personen erreicht.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Sprache","reason":"Grammatik."}},{"test":6,"nr":28,"id":54492262,"type":"multiple-choice","question":"The Scrum Team is responsible for Stakeholder collaboration and talks to them anytime it makes sense during the Sprint, even outside of the prescribed Scrum Events.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Obwohl das Scrum Team während des Sprint Reviews mit den Stakeholdern interagiert, sagt der Scrum Guide nicht, dass dies die einzige Gelegenheit ist, bei der sie miteinander sprechen.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":6,"nr":29,"id":54492276,"type":"multiple-choice","question":"All Scrum Events have a time box.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Alle Scrum Events haben eine Timebox. Es gibt keine Ausnahmen.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":6,"nr":30,"id":54492284,"type":"multiple-choice","question":"Which of the following should not be changed during a Sprint?","answers":[{"key":"a","text":"The Sprint Backlog.","correct":false},{"key":"b","text":"Product Backlog.","correct":false},{"key":"c","text":"Definition of Done.","correct":true}],"correct":["c"],"explanation":"Das Sprint Backlog ändert sich ständig, da die Elemente des Sprint Backlogs in Aufgaben heruntergebrochen werden. Das Product Backlog wird während des Sprints verfeinert und kann auch jederzeit neu priorisiert werden. Die Definition of Done sollte nicht geändert werden.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":6,"nr":31,"id":54492296,"type":"multiple-choice","question":"The Product Owner can ask a developer to order the Product Backlog items instead of him/her.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Product Owner:innen sind für das Product Backlog verantwortlich, aber sie müssen nicht alles selbst durchführen. Es ist in Ordnung, etwas Arbeit zu delegieren.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":6,"nr":32,"id":54492302,"type":"multiple-choice","question":"The Product Backlog should have just enough detail.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Das Product Backlog wird sich weiterentwickeln. Die Menge der verfügbaren Informationen wird wachsen und sich verändern.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":6,"nr":33,"id":54492310,"type":"multiple-choice","question":"What is the main role of a QA in Scrum?","answers":[{"key":"a","text":"There are no QAs in Scrum.","correct":true},{"key":"b","text":"Support to have less technical debt.","correct":false},{"key":"c","text":"Support the testers in the process.","correct":false}],"correct":["a"],"explanation":"In Scrum gibt es nur: Product Owner:in, Scrum Master:in und Entwickler:innen.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Sprache","reason":"Falscher Apostroph."}},{"test":6,"nr":34,"id":54492600,"type":"multi-select","question":"Which 2 of the following indicate that an item is ready for development?","answers":[{"key":"a","text":"The item is refined and small enough to fit in one Sprint.","correct":true},{"key":"b","text":"The item is smaller than 15 Story Points.","correct":false},{"key":"c","text":"The item is estimated (e.g. in Story Points).","correct":true},{"key":"d","text":"All stakeholders have agreed to prioritize it.","correct":false}],"correct":["a","c"],"explanation":"Laut Scrum Guide gelten Product Backlog Items als bereit für das Sprint Planning, wenn das Scrum Team sie innerhalb eines Sprints fertigstellen kann. Diese Transparenz erreichen sie meist durch Refinement, bei dem Beschreibung, Reihenfolge und Größe ergänzt werden. Eine feste Story-Point-Grenze oder die Zustimmung aller Stakeholder verlangt Scrum nicht.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Sprache","reason":"Grammatik; Erklärung fehlte."}},{"test":6,"nr":35,"id":54492608,"type":"multiple-choice","question":"Which Scrum Event can be compared to the use of a \"lessons learned meeting\"?","answers":[{"key":"a","text":"The Sprint Retrospective.","correct":true},{"key":"b","text":"The Daily Scrum.","correct":false}],"correct":["a"],"explanation":"Bei der Sprint-Retrospektive geht es darum, die Art und Weise, wie die Arbeit erledigt wurde, zu besprechen und Wege zur Verbesserung zu finden.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":6,"nr":36,"id":54492616,"type":"multiple-choice","question":"The Definition of Ready is defined by the Product Owner.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Eine „Definition of Ready“ ist kein Bestandteil von Scrum. Der Scrum Guide definiert sie nicht und legt deshalb auch nicht fest, wer sie erstellt.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Erklärung","reason":"Ungenaue Formulierung."}},{"test":6,"nr":37,"id":54492620,"type":"multi-select","question":"Which of the following statements are correct about \"technical debt\"?","answers":[{"key":"a","text":"If you have a high level of \"technical debt\", it could lead to false assumptions about the current state of the system.","correct":true},{"key":"b","text":"It creates uncertainty, because when you add more and more features more and more problems will occur.","correct":true},{"key":"c","text":"If you have \"technical debt\", no further features should be developed until the \"technical debt\" is fixed.","correct":false},{"key":"d","text":"It is the task of the Product Owner to take it into account during the release planning.","correct":false}],"correct":["a","b"],"explanation":"Es ist normal, dass man in einem Projekt ein gewisses Maß an \"technischen Schulden\" hat. Das Ziel ist nicht, keine Schulden zu haben, sondern sie auf einem akzeptablen Niveau zu halten.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":6,"nr":38,"id":54492622,"type":"multiple-choice","question":"When can a Sprint be cancelled?","answers":[{"key":"a","text":"When the Sprint Goal becomes obsolete.","correct":true},{"key":"b","text":"When the Developers are asking the Product Owner to do it.","correct":false}],"correct":["a"],"explanation":"","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":6,"nr":39,"id":54492624,"type":"multi-select","question":"Which of the following are benefits of self-managing teams?","answers":[{"key":"a","text":"Increase of creativity.","correct":true},{"key":"b","text":"Increase of individual buy-in.","correct":true},{"key":"c","text":"Increase of respect.","correct":false},{"key":"d","text":"Increase of predictability.","correct":false}],"correct":["a","b"],"explanation":"Wenn Teams sich selbst managen, bedeutet dies, dass sie ihre eigenen Entscheidungen treffen, anstatt Befehle zu erhalten. Sie nehmen den Entscheidungsfindungsprozess ernster (mehr Kreativität) und engagieren sich stärker für die Entscheidung (größere Akzeptanz).","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":6,"nr":40,"id":54492626,"type":"multiple-choice","question":"What does it mean for a team to be a \"cross-functional\" Team?","answers":[{"key":"a","text":"The team has all the expertise (not each person) required to transform a Product Backlog item into a potentially releasable Increment.","correct":true},{"key":"b","text":"Each of the team members should be a developer, tester and architect.","correct":false},{"key":"c","text":"The team should be able to collaborate with different departments.","correct":false}],"correct":["a"],"explanation":"Interdisziplinarität bedeutet nicht, dass jedes Teammitglied alles weiß und alles kann, aber gemeinsam sollten sie über die erforderlichen Fähigkeiten verfügen, um die Arbeit zu erledigen.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Sprache","reason":"Präposition."}},{"test":6,"nr":41,"id":54747560,"type":"multiple-choice","question":"To deliver a single product, three different Scrum Teams are formed. How many Product Owners are needed?","answers":[{"key":"a","text":"One","correct":true},{"key":"b","text":"As many as recommended by the Scrum Master.","correct":false},{"key":"c","text":"Three","correct":false}],"correct":["a"],"explanation":"1 Product = 1 Product Owner","section":"Online Nexus Guide (US 2021): Accountabilities in Nexus","correction":{"kind":"Sprache","reason":"Fehlender Artikel."}},{"test":6,"nr":42,"id":54747578,"type":"multiple-choice","question":"What pre-conditions must be fulfilled in order to allow Sprint Planning to begin?","answers":[{"key":"a","text":"A fully refined Product Backlog.","correct":false},{"key":"b","text":"There are no pre-conditions.","correct":true},{"key":"c","text":"A clear and non-negotiable Sprint Goal.","correct":false},{"key":"d","text":"Formal budget approval to conduct another Sprint.","correct":false}],"correct":["b"],"explanation":"Der Scrum Guide nennt keine Vorbedingungen für das Sprint Planning. Das Product Backlog muss nicht vollständig refined sein, das Sprint-Ziel entsteht erst im Sprint Planning, und eine Budgetfreigabe ist kein Bestandteil von Scrum.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Erklärung","reason":"Erklärung ging nicht auf die Vorbedingungen ein."}},{"test":6,"nr":43,"id":54747586,"type":"multiple-choice","question":"The Product Goal is in the Product Backlog.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Das Produkt‐Ziel beschreibt einen zukünftigen Zustand des Produkts, welches dem Scrum Team als Planungsziel dienen kann. Das Produkt‐Ziel befindet sich im Product Backlog. Der Rest des Product Backlogs entsteht, um zu definieren, „was“ das Produkt‐Ziel erfüllt.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":6,"nr":44,"id":54747602,"type":"multiple-choice","question":"What should happen to the \"Done\" Product Backlog items when the Sprint is cancelled?","answers":[{"key":"a","text":"They should be moved to the next Sprint Backlog.","correct":false},{"key":"b","text":"They should be moved back to the Product Backlog, and would be taken care of in the future Sprints.","correct":false},{"key":"c","text":"They will be reviewed, and if they are potentially releasable, the Product Owner typically accepts them.","correct":true}],"correct":["c"],"explanation":"Diese Regel stammt aus dem Scrum Guide 2017: Wird ein Sprint abgebrochen, werden alle abgeschlossenen („Done“) Product Backlog Items begutachtet. Ist ein Teil der Arbeit potenziell auslieferbar, akzeptiert der:die Product Owner:in ihn in der Regel. Der Scrum Guide 2020 sagt nur noch, dass ein Sprint abgebrochen werden kann, wenn das Sprint-Ziel obsolet wird, und dass nur der:die Product Owner:in dazu befugt ist.","section":"Scrum Guide 2017: Cancelling a Sprint (im Scrum Guide 2020 nicht mehr beschrieben)","correction":{"kind":"Quelle","reason":"Die Regel stammt aus dem Scrum Guide 2017, nicht aus 2020. Erklärung ergänzt."}},{"test":6,"nr":45,"id":54747612,"type":"multiple-choice","question":"The Scrum Master serves the Scrum Team but not the larger organization.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":6,"nr":46,"id":54802208,"type":"multiple-choice","question":"The Scrum Master can also be one of the Developers.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Der Scrum Guide verbietet nicht, dass der:die Scrum Master:in auch als Entwickler:in mitarbeitet.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Sprache","reason":"Grammatik und veralteter Begriff."}},{"test":6,"nr":47,"id":54802230,"type":"multiple-choice","question":"The Developers are suggesting to move the Daily Scrum to every two days instead of every day. What should the Scrum Master do?","answers":[{"key":"a","text":"Educate and coach them on why it is important to do the Daily Scrum every day.","correct":true},{"key":"b","text":"Align with the Product Owner on next steps.","correct":false},{"key":"c","text":"Nothing, they are a self-managing team.","correct":false}],"correct":["a"],"explanation":"Der:die Scrum Master:in ist ergebnisverantwortlich für die Einführung von Scrum, wie es im Scrum Guide definiert ist. Er:sie tut dies, indem er:sie allen dabei hilft, die Scrum‐Theorie und ‐Praxis zu verstehen, sowohl innerhalb des Scrum Teams als auch in der Organisation.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":6,"nr":48,"id":54802254,"type":"multiple-choice","question":"In an Agile environment, which role BEST describes the 'Voice of the Customer'?","answers":[{"key":"a","text":"The UX Expert","correct":false},{"key":"b","text":"The Product Owner","correct":true},{"key":"c","text":"The Scrum Master","correct":false}],"correct":["b"],"explanation":"Der:die Product Owner:in kann die Bedürfnisse vieler Stakeholder:innen (z.B. Kunden:innen) im Product Backlog berücksichtigen. Diejenigen, die das Product Backlog ändern möchten, können dies tun, indem sie versuchen, den:die Product Owner:in zu überzeugen.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":6,"nr":49,"id":54802618,"type":"multiple-choice","question":"The Definition of Done is an informal description of the state of the Increment when it meets the quality measures required for the product.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Die Definition of Done ist eine formale Beschreibung des Zustands des Increments, wenn es die für das Produkt erforderlichen Qualitätsmaßnahmen erfüllt.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":6,"nr":50,"id":54854184,"type":"multiple-choice","question":"Who is responsible for managing Developers' tasks during the Sprint?","answers":[{"key":"a","text":"The Scrum Master","correct":false},{"key":"b","text":"The Developers","correct":true},{"key":"c","text":"The Product Owner","correct":false},{"key":"d","text":"The Project Manager","correct":false}],"correct":["b"],"explanation":"Die Developer:innen sind immer ergebnisverantwortlich dafür,\n• einen Plan für den Sprint zu erstellen, das Sprint Backlog;\n• Qualität durch die Einhaltung einer Definition of Done einzubringen;\n• täglich ihren Plan zur Erreichung des Sprint‐Ziels anzupassen; und\n• sich wechselseitig als Expert:innen zur Verantwortung zu ziehen.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":6,"nr":51,"id":54861974,"type":"multi-select","question":"Select all that apply:","answers":[{"key":"a","text":"Daily Scrums improve communications.","correct":true},{"key":"b","text":"Daily Scrums can take place in different rooms each day.","correct":false},{"key":"c","text":"Daily Scrums highlight and promote quick decision-making.","correct":true},{"key":"d","text":"Daily Scrums identify impediments to development for removal.","correct":true},{"key":"e","text":"Daily Scrums last at least 15 mins.","correct":false}],"correct":["a","c","d"],"explanation":"Das Daily Scrum ist ein 15-minütiges Event für die Entwickler:innen. Das bedeutet, dass 15 Minuten die Höchstdauer sind, nicht die Mindestdauer. Ein Daily Scrum kann auch weniger als 15 Minuten dauern.\nDas Daily Scrum wird jeden Tag zur gleichen Zeit und am gleichen Ort abgehalten, um die Komplexität zu reduzieren.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":6,"nr":52,"id":54862002,"type":"multiple-choice","question":"What are the 3 questions the Sprint Planning answers?","answers":[{"key":"a","text":"What, How and When?","correct":false},{"key":"b","text":"Why, What and How?","correct":true},{"key":"c","text":"What, Where and How?","correct":false},{"key":"d","text":"Why, Where and When?","correct":false},{"key":"e","text":"What, When and How?","correct":false}],"correct":["b"],"explanation":"Laut Scrum Guide behandelt das Sprint Planning drei Themen: Warum ist dieser Sprint wertvoll? Was kann in diesem Sprint fertiggestellt werden? Wie wird die ausgewählte Arbeit erledigt?","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Erklärung","reason":"Erklärung beschrieb das Sprint Backlog statt der drei Themen des Sprint Plannings; dazu Leerzeichen vor den Fragezeichen."}},{"test":6,"nr":53,"id":54862094,"type":"multi-select","question":"In which three ways does Scrum promote self-management?\n(choose 3 answers)","answers":[{"key":"a","text":"By removing titles for each Developer of the Scrum Team.","correct":true},{"key":"b","text":"By being a lightweight framework.","correct":true},{"key":"c","text":"By not allowing documentation.","correct":false},{"key":"d","text":"By preventing stakeholders from entering the development room.","correct":false},{"key":"e","text":"By the Developers deciding what work to do in a Sprint.","correct":true}],"correct":["a","b","e"],"explanation":"","section":"Scrum Guide (US 2020): Scrum Theory (Seite 3-4)","correction":{"kind":"Sprache","reason":"Satzbau."}},{"test":6,"nr":54,"id":54862128,"type":"multiple-choice","question":"What is the main reason for the Scrum Master to be at the Daily Scrum?","answers":[{"key":"a","text":"He or she does not have to be there; he or she only has to ensure the Developers have a Daily Scrum.","correct":true},{"key":"b","text":"To gather status and progress information to report to management.","correct":false},{"key":"c","text":"To make sure every team member answers the three questions.","correct":false},{"key":"d","text":"To write down any changes to the Sprint Backlog, including adding new items, and tracking progress on the Burn-Down.","correct":false}],"correct":["a"],"explanation":"Das Daily Scrum ist ein 15‐minütiges Event für die Developer:innen des Scrum Teams.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":6,"nr":55,"id":54862172,"type":"multiple-choice","question":"The Product Backlog is ordered by:","answers":[{"key":"a","text":"Items are randomly arranged.","correct":false},{"key":"b","text":"Risk, where safer items are at the top, and riskier items are at the bottom.","correct":false},{"key":"c","text":"Importance, where the most important/valuable items are at the top at all times.","correct":true},{"key":"d","text":"Size, where small items are at the top and large items are at the bottom.","correct":false}],"correct":["c"],"explanation":"Das Product Backlog ist eine emergente, geordnete Liste der Dinge, die zur Produktverbesserung benötigt werden. Es ist die einzige Quelle von Arbeit, die durch das Scrum Team erledigt wird.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":6,"nr":56,"id":54862222,"type":"multiple-choice","question":"What best describes the Sprint Backlog?\n(choose the best answer)","answers":[{"key":"a","text":"The Product Backlog items selected for this Sprint plus a set of the Developers' internal tasks.","correct":false},{"key":"b","text":"The Product Backlog items selected for this Sprint.","correct":false},{"key":"c","text":"The Product Backlog items selected for this Sprint plus the plan for delivering them.","correct":true}],"correct":["c"],"explanation":"Das Sprint Backlog besteht aus dem Sprint‐Ziel (Wofür), den für den Sprint ausgewählten Product‐Backlog‐Einträgen (Was) sowie einem umsetzbaren Plan für die Lieferung des Increments (Wie).","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Sprache","reason":"Apostroph fehlte."}},{"test":6,"nr":57,"id":54862288,"type":"multiple-choice","question":"Who is responsible for ensuring that all Scrum events take place and are positive, productive, and kept within the timebox?","answers":[{"key":"a","text":"The Scrum Master","correct":true},{"key":"b","text":"The Product Owner","correct":false},{"key":"c","text":"The Developers","correct":false}],"correct":["a"],"explanation":"Es ist Aufgabe des:der Scrum Master:in sicherzustellen, dass alle Events von Scrum stattfinden, positiv und produktiv sind und innerhalb der Timebox bleiben.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":6,"nr":58,"id":54862358,"type":"multiple-choice","question":"Which of these may a Scrum Team deliver at the end of a Sprint?","answers":[{"key":"a","text":"A single document, if that is what the Scrum Master asked for.","correct":false},{"key":"b","text":"An increment with minor known defects / bugs in it.","correct":false},{"key":"c","text":"Failing unit tests, to identify acceptance tests for the next Sprint.","correct":false},{"key":"d","text":"An increment of working product that is \"done\".","correct":true}],"correct":["d"],"explanation":"In dem Moment, in dem ein Product‐Backlog‐Eintrag die Definition of Done erfüllt, wird ein Increment geboren.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":6,"nr":59,"id":54862486,"type":"multiple-choice","question":"Who is responsible for representing the stakeholders?","answers":[{"key":"a","text":"The Project Manager","correct":false},{"key":"b","text":"The Team Manager","correct":false},{"key":"c","text":"The Product Owner","correct":true},{"key":"d","text":"The Developers","correct":false},{"key":"e","text":"The Business Analyst","correct":false}],"correct":["c"],"explanation":"Der:die Product Owner:in ist eine Person, kein Gremium. Der:die Product Owner:in kann die Bedürfnisse vieler Stakeholder:innen im Product Backlog berücksichtigen.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":6,"nr":60,"id":54862494,"type":"multiple-choice","question":"During the Sprint, the Sprint Goal can be changed.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Während des Sprints werden keine Änderungen vorgenommen, die das Sprint‐Ziel gefährden würden.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":6,"nr":61,"id":54888012,"type":"multiple-choice","question":"Only the Product Owner and the Developers participate in the Sprint Planning. There is nothing to do for the Scrum Master.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Die im Sprint durchzuführende Arbeit wird beim Sprint Planning geplant. Dieser Plan wird durch die gemeinschaftliche Arbeit des gesamten Scrum-Teams erstellt.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":6,"nr":62,"id":54888166,"type":"multiple-choice","question":"All items of the Product Backlog must be written by the Product Owner before being given to the Developers.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Der:die Product Owner:in ist für das Product Backlog verantwortlich. Wer die Elemente hinzufügt und wie sie dem Product Backlog hinzugefügt werden, variiert stark zwischen Organisationen, Scrum-Teams und Einzelpersonen.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":6,"nr":63,"id":54888176,"type":"multiple-choice","question":"If it is not an organizational standard, who is responsible for creation of the Definition of Done?","answers":[{"key":"a","text":"The Developers","correct":false},{"key":"b","text":"The Product Owner","correct":false},{"key":"c","text":"The Scrum Master","correct":false},{"key":"d","text":"The Scrum Team","correct":true}],"correct":["d"],"explanation":"Wenn die Definition of Done für ein Increment Teil der Standards der Organisation ist, müssen alle Scrum Teams diese als Mindestmaß befolgen. Wenn sie kein Organisationsstandard ist, muss das Scrum Team eine für das Produkt geeignete Definition of Done erstellen.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":6,"nr":64,"id":54888186,"type":"multiple-choice","question":"Lean thinking is a foundation of the Scrum framework.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Scrum basiert auf Empirie und Lean Thinking. Empirie bedeutet, dass Wissen aus Erfahrung gewonnen wird und Entscheidungen auf der Grundlage von Beobachtungen getroffen werden. Lean Thinking reduziert Verschwendung und fokussiert auf das Wesentliche.","section":"Scrum Guide (US 2020): Scrum Theory (Seite 3-4)","correction":{"kind":"Sprache","reason":"Falsches Wort."}},{"test":6,"nr":65,"id":54888194,"type":"multiple-choice","question":"All Scrum Teams working on the same Product should use the same Product Backlog.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"1 Product = 1 Product Backlog","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":6,"nr":66,"id":54888214,"type":"multiple-choice","question":"Who is responsible for all product related activities?","answers":[{"key":"a","text":"The Scrum Team","correct":true},{"key":"b","text":"The Developers","correct":false},{"key":"c","text":"The Scrum Master","correct":false},{"key":"d","text":"The Key Stakeholders","correct":false}],"correct":["a"],"explanation":"Das Scrum Team ist umsetzungsverantwortlich (responsible) für alle produktbezogenen Aktivitäten: Zusammenarbeit mit den Stakeholder:innen, Verifikation, Wartung, Betrieb, Experimente, Forschung und Entwicklung und alles, was sonst noch erforderlich sein könnte. Es ist von der Organisation so aufgebaut und befähigt, dass es seine Arbeit selbst steuert.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":6,"nr":67,"id":54888226,"type":"multi-select","question":"How does the Scrum Master help the Product Owner? Select the three most appropriate answers.","answers":[{"key":"a","text":"Facilitating stakeholder collaboration as requested or needed.","correct":true},{"key":"b","text":"Leading and coaching the organization in its Scrum adoption.","correct":false},{"key":"c","text":"Introducing cutting edge development practices.","correct":false},{"key":"d","text":"Helping the Scrum Team understand the need for clear and concise Product Backlog items.","correct":true},{"key":"e","text":"Helping find techniques for effective Product Goal definition and Product Backlog management.","correct":true}],"correct":["a","d","e"],"explanation":"Der:die Scrum Master:in dient dem:der Product Owner:in auf unterschiedliche Weise, unter anderem dadurch,\n• bei der Suche nach Techniken zur effektiven Definition des Produkt‐Ziels und zum Product‐Backlog‐Management zu helfen;\n• dem Scrum Team dabei zu helfen, die Notwendigkeit klarer und präziser Product‐Backlog‐Einträge zu verstehen;\n• bei der Etablierung einer empirischen Produktplanung für ein komplexes Umfeld zu helfen; und\n• die Zusammenarbeit mit Stakeholder:innen nach Wunsch oder Bedarf zu fördern (facilitate).","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":6,"nr":68,"id":54888372,"type":"multiple-choice","question":"What is a key inspect and adapt meeting for the Developers?","answers":[{"key":"a","text":"Project Status Meeting","correct":false},{"key":"b","text":"Daily Scrum","correct":true},{"key":"c","text":"Design Sessions","correct":false}],"correct":["b"],"explanation":"Es gibt keine Design Sessions/Status Meetings in Scrum.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":6,"nr":69,"id":54888398,"type":"multiple-choice","question":"If only the work scheduled for the Sprint's first few days is decomposed to units of one day or fewer, might the Sprint Planning be completed?","answers":[{"key":"a","text":"No, all items in the Sprint Backlog should be decomposed to units of one day or less by the end of the Sprint Planning.","correct":false},{"key":"b","text":"Yes","correct":true}],"correct":["b"],"explanation":"Laut Scrum Guide ist es nicht notwendig, den gesamten Sprint schon im Sprint Planning perfekt durchzuplanen. Der Plan wird im Laufe des Sprints weiter verfeinert und angepasst.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Sprache","reason":"Tippfehler in der Erklärung."}},{"test":6,"nr":70,"id":54888416,"type":"multiple-choice","question":"A team should NOT start the first Sprint until the Product Owner has detailed all of the Product Backlog items in the Product Backlog.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":6,"nr":71,"id":54894992,"type":"multiple-choice","question":"Once a sprint begins, the Sprint Backlog cannot be changed.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Das Sprint Backlog ist ständig im Wandel (die Entwickler:innen zerlegen es z. B. in kleinere Aufgaben). Nach Rücksprache mit dem:der Product Owner:in können auch neue Product Backlog Items ins Sprint Backlog aufgenommen werden.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Sprache","reason":"Fehlendes Wort in der Erklärung."}},{"test":6,"nr":72,"id":54895006,"type":"multi-select","question":"The Scrum Master serves the Scrum Team:\n(Choose 2 answers)","answers":[{"key":"a","text":"By helping the Scrum Team focus on creating high-value Increments that meet the Definition of Done.","correct":true},{"key":"b","text":"By coaching the team members in self-management and cross-functionality.","correct":true},{"key":"c","text":"By ending the meetings when time-boxes expire.","correct":false},{"key":"d","text":"By managing the Product Backlog.","correct":false}],"correct":["a","b"],"explanation":"Das Product Backlog wird von der:dem Product Owner:in gemanaged.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":6,"nr":73,"id":54895012,"type":"multiple-choice","question":"During the Sprint:","answers":[{"key":"a","text":"The Product Backlog doesn't change.","correct":false},{"key":"b","text":"Scope may be clarified but it doesn't change.","correct":false},{"key":"c","text":"No changes are made that would endanger the Sprint Goal.","correct":true},{"key":"d","text":"Quality may vary.","correct":false}],"correct":["c"],"explanation":"Während des Sprints\n• werden keine Änderungen vorgenommen, die das Sprint‐Ziel gefährden würden;\n• nimmt die Qualität nicht ab;\n• wird das Product Backlog nach Bedarf verfeinert; und\n• kann der Scope (Inhalt und Umfang) geklärt und mit dem:der Product Owner:in neu vereinbart werden, sobald mehr Erkenntnisse vorliegen.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":6,"nr":74,"id":54895020,"type":"multi-select","question":"During the Sprint:","answers":[{"key":"a","text":"The Product Backlog is refined as needed.","correct":true},{"key":"b","text":"No changes are made that would endanger the Sprint Goal.","correct":true},{"key":"c","text":"The Scrum Master may choose to change the scope.","correct":false},{"key":"d","text":"Quality does not decrease.","correct":true},{"key":"e","text":"Scope doesn't change.","correct":false}],"correct":["a","b","d"],"explanation":"Während des Sprints\n• werden keine Änderungen vorgenommen, die das Sprint‐Ziel gefährden würden;\n• nimmt die Qualität nicht ab;\n• wird das Product Backlog nach Bedarf verfeinert; und\n• kann der Scope (Inhalt und Umfang) geklärt und mit dem:der Product Owner:in neu vereinbart werden, sobald mehr Erkenntnisse vorliegen.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":6,"nr":75,"id":54895034,"type":"multiple-choice","question":"During the Sprint Review it is up to the stakeholders to reorder the Product Backlog.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Dies ist die Aufgabe des:der Product Owner:in.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":6,"nr":76,"id":54895042,"type":"multiple-choice","question":"Who should know the most about the overall Product roadmap and milestones?","answers":[{"key":"a","text":"The Product Owner","correct":true},{"key":"b","text":"The Scrum Master","correct":false},{"key":"c","text":"The Developers","correct":false},{"key":"d","text":"The Project Manager","correct":false}],"correct":["a"],"explanation":"Der:die Product Owner:in ist eine Person, kein Gremium. Der:die Product Owner:in kann die Bedürfnisse vieler Stakeholder:innen im Product Backlog berücksichtigen. Diejenigen, die das Product Backlog ändern möchten, können dies tun, indem sie versuchen, den:die Product Owner:in zu überzeugen.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":6,"nr":77,"id":54895050,"type":"multiple-choice","question":"It's required to use user stories in Scrum.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"User Stories sind eine verbreitete Praxis, aber in Scrum nicht vorgeschrieben.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Erklärung","reason":"„Best Practice“ steht so nicht im Scrum Guide."}},{"test":6,"nr":78,"id":54895272,"type":"multiple-choice","question":"Once the Definition of Done is defined, it can never change.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Die Definition of Done ist eine formale Beschreibung des Zustands des Increments, wenn es die für das Produkt erforderlichen Qualitätsmaßnahmen erfüllt. Die Definition of Done kann geändert werden.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":6,"nr":79,"id":54895444,"type":"multi-select","question":"A done Increment is valuable if:\n(choose the best two options)","answers":[{"key":"a","text":"It meets the business analyst’s specifications.","correct":false},{"key":"b","text":"It has all the features that the Product Owner wanted in that Sprint.","correct":false},{"key":"c","text":"It reduces long-term operational costs.","correct":true},{"key":"d","text":"It is likely to increase customer satisfaction.","correct":true},{"key":"e","text":"It is delivered when the Product Owner expected it.","correct":false}],"correct":["c","d"],"explanation":"","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":6,"nr":80,"id":54895672,"type":"multiple-choice","question":"The Scrum Master is a participant in Sprint Retrospective.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"An der Sprint Retrospective nimmt das gesamte Scrum Team teil.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Sprache","reason":"Rechtschreibung."}}];
const GUIDE = {"en": "<header class=\"sg-cover\"><p class=\"sg-authors\">Ken Schwaber &amp; Jeff Sutherland</p><h2>The Scrum Guide</h2><p class=\"sg-sub\">The Definitive Guide to Scrum: The Rules of the Game</p><p class=\"sg-date\">November 2020</p></header><p class=\"sg-attrib\">Original text: <a href=\"https://scrumguides.org/scrum-guide.html\" target=\"_blank\" rel=\"noopener\">scrumguides.org</a>. Changes in this app: the dotted-underlined explanations were added for exam practice and are not part of the Scrum Guide. Shared under the same licence, <a href=\"https://creativecommons.org/licenses/by-sa/4.0/\" target=\"_blank\" rel=\"noopener\">CC BY-SA 4.0</a>.</p><h3 id=\"sg-purpose-of-the-scrum-guide\">Purpose of the Scrum Guide</h3>\n<p>We developed Scrum in the early 1990s. We wrote the first version of the Scrum Guide in 2010 to help people worldwide understand Scrum. We have evolved the Guide since then through small, functional updates. Together, we stand behind it.</p>\n<p>The Scrum Guide contains the definition of Scrum. Each element of the framework serves a specific purpose that is essential to the overall value and results realized with Scrum. Changing the core design or ideas of Scrum, leaving out elements, or not following the rules of Scrum, covers up problems and limits the benefits of Scrum, potentially even rendering it useless.</p>\n<p>We follow the growing use of Scrum within an ever-growing complex world. We are humbled to see Scrum being adopted in many domains holding essentially complex work, beyond software product development where Scrum has its roots. As Scrum’s use spreads, developers, researchers, analysts, scientists, and other specialists do the work. We use the word “developers” in Scrum not to exclude, but to simplify. If you get value from Scrum, consider yourself included.</p>\n<p>As Scrum is being used, patterns, processes, and insights that fit the Scrum framework as described in this document, may be found, applied and devised. Their description is beyond the purpose of the Scrum Guide because they are context sensitive and differ widely between Scrum uses. Such tactics for using within the Scrum framework vary widely and are described elsewhere.</p>\n<p>Ken Schwaber &amp; Jeff Sutherland November 2020</p>\n<p class=\"sg-legal\">© 2020 Ken Schwaber and Jeff Sutherland</p><p class=\"sg-legal\">This publication is offered for license under the Attribution Share-Alike license of Creative Commons, accessible at https://creativecommons.org/licenses/by-sa/4.0/legalcode and also described in summary form at https://creativecommons.org/licenses/by-sa/4.0/. By utilizing this Scrum Guide, you acknowledge and agree that you have read and agree to be bound by the terms of the Attribution Share-Alike license of Creative Commons.</p><h3 id=\"sg-scrum-definition\">Scrum Definition</h3>\n<p>Scrum is a lightweight framework that helps people, teams and organizations generate value through adaptive solutions for complex problems.</p>\n<p>In a nutshell, Scrum requires a <span class=\"term\" tabindex=\"0\" data-tip=\"0\">Scrum Master</span> to foster an environment where:</p>\n<ul>\n<li>A <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner</span> orders the work for a complex problem into a <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span>.</li>\n<li>The <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> turns a selection of the work into an <span class=\"term\" tabindex=\"0\" data-tip=\"4\">Increment</span> of value during a <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span>.</li>\n<li>The <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> and its <span class=\"term\" tabindex=\"0\" data-tip=\"6\">stakeholders</span> inspect the results and adjust for the next <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span>.</li>\n<li>Repeat</li>\n</ul>\n<p>Scrum is simple. Try it as is and determine if its philosophy, theory, and structure help to achieve goals and create value. The Scrum framework is <span class=\"term\" tabindex=\"0\" data-tip=\"7\">purposefully incomplete</span>, only defining the parts required to implement Scrum theory. Scrum is built upon by the collective intelligence of the people using it. Rather than provide people with detailed instructions, the rules of Scrum guide their relationships and interactions.</p>\n<p>Various processes, techniques and methods can be employed within the framework. Scrum wraps around existing practices or renders them unnecessary. Scrum makes visible the relative efficacy of current management, environment, and work techniques, so that improvements can be made.</p>\n<h3 id=\"sg-scrum-theory\">Scrum Theory</h3>\n<p>Scrum is founded on <span class=\"term\" tabindex=\"0\" data-tip=\"8\">empiricism</span> and <span class=\"term\" tabindex=\"0\" data-tip=\"9\">lean thinking</span>. Empiricism asserts that knowledge comes from experience and making decisions based on what is observed. Lean thinking reduces waste and focuses on the essentials.</p>\n<p>Scrum employs an iterative, incremental approach to optimize predictability and to control risk. Scrum engages groups of people who collectively have all the skills and expertise to do the work and share or acquire such skills as needed.</p>\n<p>Scrum combines four formal events for <span class=\"term\" tabindex=\"0\" data-tip=\"10\">inspection</span> and <span class=\"term\" tabindex=\"0\" data-tip=\"11\">adaptation</span> within a containing event, the <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span>. These events work because they implement the empirical Scrum pillars of <span class=\"term\" tabindex=\"0\" data-tip=\"12\">transparency</span>, inspection, and adaptation.</p>\n<h4 id=\"sg-transparency\">Transparency</h4>\n<p>The emergent process and work must be visible to those performing the work as well as those receiving the work. With Scrum, important decisions are based on the perceived state of its three formal artifacts. Artifacts that have low <span class=\"term\" tabindex=\"0\" data-tip=\"12\">transparency</span> can lead to decisions that diminish value and increase risk.</p>\n<p>Transparency enables <span class=\"term\" tabindex=\"0\" data-tip=\"10\">inspection</span>. Inspection without <span class=\"term\" tabindex=\"0\" data-tip=\"12\">transparency</span> is misleading and wasteful.</p>\n<h4 id=\"sg-inspection\">Inspection</h4>\n<p>The Scrum artifacts and the progress toward agreed goals must be inspected frequently and diligently to detect potentially undesirable variances or problems. To help with <span class=\"term\" tabindex=\"0\" data-tip=\"10\">inspection</span>, Scrum provides cadence in the form of its five events. Inspection enables <span class=\"term\" tabindex=\"0\" data-tip=\"11\">adaptation</span>.</p>\n<p>Inspection without <span class=\"term\" tabindex=\"0\" data-tip=\"11\">adaptation</span> is considered pointless. Scrum events are designed to provoke change.</p>\n<h4 id=\"sg-adaptation\">Adaptation</h4>\n<p>If any aspects of a process deviate outside acceptable limits or if the resulting product is unacceptable, the process being applied or the materials being produced must be adjusted. The adjustment must be made as soon as possible to minimize further deviation.</p>\n<p>Adaptation becomes more difficult when the people involved are not empowered or <span class=\"term\" tabindex=\"0\" data-tip=\"13\">self-managing</span>. A <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> is expected to adapt the moment it learns anything new through <span class=\"term\" tabindex=\"0\" data-tip=\"10\">inspection</span>.</p>\n<h3 id=\"sg-scrum-values\">Scrum Values</h3>\n<p>Successful use of Scrum depends on people becoming more proficient in living five values: <strong><span class=\"term\" tabindex=\"0\" data-tip=\"14\">Commitment, Focus, Openness, Respect, and Courage</span></strong></p>\n<p>The <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> commits to achieving its goals and to supporting each other. Their primary focus is on the work of the <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span> to make the best possible progress toward these goals. The Scrum Team and its <span class=\"term\" tabindex=\"0\" data-tip=\"6\">stakeholders</span> are open about the work and the challenges. Scrum Team members respect each other to be capable, independent people, and are respected as such by the people with whom they work. The Scrum Team members have the courage to do the right thing, to work on tough problems.</p>\n<p>These values give direction to the <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> with regard to their work, actions, and behavior. The decisions that are made, the steps taken, and the way Scrum is used should reinforce these values, not diminish or undermine them. The Scrum Team members learn and explore the values as they work with the Scrum events and artifacts. When these values are embodied by the Scrum Team and the people they work with, the empirical Scrum pillars of <span class=\"term\" tabindex=\"0\" data-tip=\"12\">transparency</span>, <span class=\"term\" tabindex=\"0\" data-tip=\"10\">inspection</span>, and <span class=\"term\" tabindex=\"0\" data-tip=\"11\">adaptation</span> come to life building trust.</p>\n<h3 id=\"sg-scrum-team\">Scrum Team</h3>\n<p>The fundamental unit of Scrum is a small team of people, a <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span>. The Scrum Team consists of one <span class=\"term\" tabindex=\"0\" data-tip=\"0\">Scrum Master</span>, one <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner</span>, and <span class=\"term\" tabindex=\"0\" data-tip=\"15\">Developers</span>. Within a Scrum Team, there are no sub-teams or hierarchies. It is a cohesive unit of professionals focused on one objective at a time, the <span class=\"term\" tabindex=\"0\" data-tip=\"16\">Product Goal</span>.</p>\n<p>Scrum Teams are <span class=\"term\" tabindex=\"0\" data-tip=\"17\">cross-functional</span>, meaning the members have all the skills necessary to create value each <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span>. They are also <span class=\"term\" tabindex=\"0\" data-tip=\"13\">self-managing</span>, meaning they internally decide who does what, when, and how.</p>\n<p>The <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> is small enough to remain nimble and large enough to complete significant work within a <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span>, typically 10 or fewer people. In general, we have found that smaller teams communicate better and are more productive. If Scrum Teams become too large, they should consider reorganizing into multiple cohesive Scrum Teams, each focused on the same product. Therefore, they should share the same <span class=\"term\" tabindex=\"0\" data-tip=\"16\">Product Goal</span>, <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span>, and <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner</span>.</p>\n<p>The <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> is responsible for all product-related activities from stakeholder collaboration, verification, maintenance, operation, experimentation, research and development, and anything else that might be required. They are structured and empowered by the organization to manage their own work. Working in <span class=\"term\" tabindex=\"0\" data-tip=\"18\">Sprints</span> at a sustainable pace improves the Scrum Team’s focus and consistency.</p>\n<p>The entire <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> is accountable for creating a valuable, useful <span class=\"term\" tabindex=\"0\" data-tip=\"4\">Increment</span> every <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span>. Scrum defines three specific <span class=\"term\" tabindex=\"0\" data-tip=\"19\">accountabilities</span> within the Scrum Team: the <span class=\"term\" tabindex=\"0\" data-tip=\"15\">Developers</span>, the <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner</span>, and the <span class=\"term\" tabindex=\"0\" data-tip=\"0\">Scrum Master</span>.</p>\n<h4 id=\"sg-developers\">Developers</h4>\n<p><span class=\"term\" tabindex=\"0\" data-tip=\"15\">Developers</span> are the people in the <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> that are committed to creating any aspect of a usable <span class=\"term\" tabindex=\"0\" data-tip=\"4\">Increment</span> each <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span>.</p>\n<p>The specific skills needed by the <span class=\"term\" tabindex=\"0\" data-tip=\"15\">Developers</span> are often broad and will vary with the domain of work. However, the Developers are always accountable for:</p>\n<ul>\n<li>Creating a plan for the <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span>, the <span class=\"term\" tabindex=\"0\" data-tip=\"20\">Sprint Backlog</span>;</li>\n<li>Instilling quality by adhering to a <span class=\"term\" tabindex=\"0\" data-tip=\"21\">Definition of Done</span>;</li>\n<li>Adapting their plan each day toward the <span class=\"term\" tabindex=\"0\" data-tip=\"22\">Sprint Goal</span>; and,</li>\n<li>Holding each other accountable as professionals</li>\n</ul>\n<h4 id=\"sg-product-owner\">Product Owner</h4>\n<p>The <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner</span> is accountable for maximizing the value of the product resulting from the work of the <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span>. How this is done may vary widely across organizations, Scrum Teams, and individuals.</p>\n<p>The <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner</span> is also accountable for effective <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span> management, which includes:</p>\n<ul>\n<li>Developing and explicitly communicating the <span class=\"term\" tabindex=\"0\" data-tip=\"16\">Product Goal</span>;</li>\n<li>Creating and clearly communicating <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span> items;</li>\n<li>Ordering <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span> items; and,</li>\n<li>Ensuring that the <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span> is transparent, visible and understood.</li>\n</ul>\n<p>The <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner</span> may do the above work or may delegate the responsibility to others. Regardless, the Product Owner remains accountable.</p>\n<p>For Product Owners to succeed, the entire organization must respect their decisions. These decisions are visible in the content and ordering of the <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span>, and through the inspectable <span class=\"term\" tabindex=\"0\" data-tip=\"4\">Increment</span> at the <span class=\"term\" tabindex=\"0\" data-tip=\"23\">Sprint Review</span>.</p>\n<p>The <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner</span> is one person, not a committee. The Product Owner may represent the needs of many <span class=\"term\" tabindex=\"0\" data-tip=\"6\">stakeholders</span> in the <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span>. Those wanting to change the Product Backlog can do so by trying to convince the Product Owner.</p>\n<h4 id=\"sg-scrum-master\">Scrum Master</h4>\n<p>The <span class=\"term\" tabindex=\"0\" data-tip=\"0\">Scrum Master</span> is accountable for establishing Scrum as defined in the Scrum Guide. They do this by helping everyone understand Scrum theory and practice, both within the <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> and the organization.</p>\n<p>The <span cla
