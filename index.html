"type":"multiple-choice","question":"When should a new increment be released into production?","answers":[{"key":"a","text":"When it makes sense.","correct":true},{"key":"b","text":"When it is free of defects.","correct":false},{"key":"c","text":"When the CEO asks for it.","correct":false}],"correct":["a"],"explanation":"Am Ende eines jeden Sprints muss ein releasefähiges Increment geliefert werden. Das Release dieses Increments ist jedoch nicht zwingend erforderlich. Dies erfolgt nur, wenn es sinnvoll ist.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Sprache","reason":"Fehlendes Wort."}},{"test":1,"nr":42,"id":54572574,"type":"multiple-choice","question":"The Scrum Master is:","answers":[{"key":"a","text":"A true leader who serves the Scrum Team and the larger organization.","correct":true},{"key":"b","text":"A technical advisor for the Developers.","correct":false},{"key":"c","text":"A manager for the Scrum Team.","correct":false},{"key":"d","text":"A value maximizer for the product.","correct":false}],"correct":["a"],"explanation":"Der:die Scrum Master:in ist ergebnisverantwortlich für die Effektivität des Scrum Teams. Er:sie tut dies, indem er:sie das Scrum Team in die Lage versetzt, seine Praktiken innerhalb des Scrum‐Rahmenwerks zu verbessern.\nScrum Master:innen sind echte Führungskräfte, die dem Scrum Team und der Gesamtorganisation dienen.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Sprache","reason":"Grammatik."}},{"test":1,"nr":43,"id":54572824,"type":"multiple-choice","question":"Who is allowed to change the Sprint Backlog during the Sprint? (choose the best answer)","answers":[{"key":"a","text":"Developers","correct":true},{"key":"b","text":"Stakeholders","correct":false},{"key":"c","text":"Product Owner","correct":false}],"correct":["a"],"explanation":"Die Entwickler:innen sind verantwortlich (\"ownen\") für den Sprint Backlog.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":1,"nr":44,"id":54572842,"type":"multiple-choice","question":"The Scrum Master is accountable for the Scrum Team’s effectiveness.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Der:die Scrum Master:in ist ergebnisverantwortlich für die Effektivität des Scrum Teams. Er:sie tut dies, indem er:sie das Scrum Team in die Lage versetzt, seine Praktiken innerhalb des Scrum‐Rahmenwerks zu verbessern.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":1,"nr":45,"id":54572880,"type":"multiple-choice","question":"Who is responsible for all product-related activities?","answers":[{"key":"a","text":"The Scrum Team","correct":true},{"key":"b","text":"The Scrum Master","correct":false},{"key":"c","text":"The Product Owner","correct":false},{"key":"d","text":"The Project Manager","correct":false}],"correct":["a"],"explanation":"Das Scrum Team ist umsetzungsverantwortlich (responsible) für alle produktbezogenen Aktivitäten: Zusammenarbeit mit den Stakeholder:innen, Verifikation, Wartung, Betrieb, Experimente, Forschung und Entwicklung und alles, was sonst noch erforderlich sein könnte. Es ist von der Organisation so aufgebaut und befähigt, dass es seine Arbeit selbst steuert.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Sprache","reason":"Doppeltes Wort."}},{"test":1,"nr":46,"id":54572906,"type":"multiple-choice","question":"When does a Sprint end?","answers":[{"key":"a","text":"When the time box expires.","correct":true},{"key":"b","text":"When the product owner ends it.","correct":false},{"key":"c","text":"When all items are \"done\".","correct":false}],"correct":["a"],"explanation":"Ein Sprint ist ein zeitlich begrenztes (\"timeboxed\") Scrum Event. Ein Sprint wird nur frühzeitig beendet wenn das Sprint-Ziel obsolet geworden ist.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":1,"nr":47,"id":54573066,"type":"multiple-choice","question":"Which of these tools is mandatory for the Scrum Team to use?","answers":[{"key":"a","text":"Gantt chart","correct":false},{"key":"b","text":"Version control","correct":false},{"key":"c","text":"Burndown chart","correct":false},{"key":"d","text":"Burnup chart","correct":false},{"key":"e","text":"None of the answers is correct.","correct":true}],"correct":["e"],"explanation":"Das Scrum Team kann jedes Werkzeug, jede Methode oder Praxis verwenden die ihnen hilft ein neues Increment zu erzeugen (darf natürlich nicht im Widerspruch zu Scrum stehen).","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":1,"nr":48,"id":54573092,"type":"multiple-choice","question":"During the Sprint Planning the Product Owner crafts a Sprint Goal.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Während dem Sprint Planning erstellt das Scrum Team das Sprint Goal.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":1,"nr":49,"id":54573114,"type":"multiple-choice","question":"The role of Scrum Master in Sprint Retrospective is:","answers":[{"key":"a","text":"Peer Team Member","correct":true},{"key":"b","text":"Auditor / Reviewer","correct":false},{"key":"c","text":"Pure adviser","correct":false}],"correct":["a"],"explanation":"Der Scrum Master nimmt als gleichwertiges Teammitglied teil.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":1,"nr":50,"id":54574930,"type":"multiple-choice","question":"A key concern when multiple Scrum Teams are working for the same Product Backlog is minimizing dependencies between teams.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Die Minimierung von Abhängigkeiten reduziert die Komplexität und erhöht die Flexibilität.\nNexus Guide of 2021 :\n\"Cross-Team Refinement of the Product Backlog reduces or eliminates cross-team dependencies within a Nexus. The Product Backlog must be decomposed so that dependencies are transparent, identified across teams, and removed or minimized.\"","section":"Online Nexus Guide (US 2021): Nexus Events","correction":null},{"test":1,"nr":51,"id":54854318,"type":"multiple-choice","question":"During the Daily Scrum, which plan is used as a reference (e.g. to understand the progress)?","answers":[{"key":"a","text":"Sprint Burn-Down","correct":false},{"key":"b","text":"Sprint Backlog","correct":true},{"key":"c","text":"Product Backlog","correct":false}],"correct":["b"],"explanation":"Das Sprint Backlog ist ein Plan von und für die Developer:innen. Es ist ein deutlich sichtbares Echtzeitbild der Arbeit, welche die Developer:innen während des Sprints zur Erreichung des Sprint‐Ziels ausführen wollen.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Sprache","reason":"Fragezeichen fehlte."}},{"test":1,"nr":52,"id":54854336,"type":"multi-select","question":"Who are not responsible for the changes in the Product Backlog? Select all applicable options.","answers":[{"key":"a","text":"The CEO","correct":true},{"key":"b","text":"The Scrum Master","correct":true},{"key":"c","text":"The Key Stakeholders","correct":true},{"key":"d","text":"The Product Owner","correct":false},{"key":"e","text":"The Developers","correct":true}],"correct":["a","b","c","e"],"explanation":"Der:die Product Owner:in ist für ein effektives Product‐Backlog‐Management ergebnisverantwortlich.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":1,"nr":53,"id":54854344,"type":"multiple-choice","question":"Who has the vision of the product?","answers":[{"key":"a","text":"The Scrum Master","correct":false},{"key":"b","text":"The Chief Executive Officer (CEO)","correct":false},{"key":"c","text":"The Product Owner","correct":true},{"key":"d","text":"The Chief Marketing Officer (CMO)","correct":false}],"correct":["c"],"explanation":"","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":1,"nr":54,"id":54855082,"type":"multiple-choice","question":"Who determines how to do the work during the Sprint?","answers":[{"key":"a","text":"The engineering director","correct":false},{"key":"b","text":"The Technical Architects","correct":false},{"key":"c","text":"The Developers","correct":true},{"key":"d","text":"The Team Leads","correct":false},{"key":"e","text":"The Scrum Master","correct":false}],"correct":["c"],"explanation":"Das Scrum Team ist selbstmanagend: Die Entwickler:innen entscheiden intern, wer was wann und wie macht.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Erklärung","reason":"Erklärung war als einzige auf Englisch."}},{"test":1,"nr":55,"id":54855104,"type":"multiple-choice","question":"Who is accountable for the Product Backlog?","answers":[{"key":"a","text":"The Scrum Master","correct":false},{"key":"b","text":"The Developers","correct":false},{"key":"c","text":"The Scrum Master and The Developers","correct":false},{"key":"d","text":"The Product Owner","correct":true},{"key":"e","text":"The Product Owner and The Scrum Master","correct":false},{"key":"f","text":"The Product Owner and The Developers","correct":false}],"correct":["d"],"explanation":"Der:die Product Owner:in ist für ein effektives Product‐Backlog‐Management ergebnisverantwortlich.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":1,"nr":56,"id":54855146,"type":"multi-select","question":"Which of the following can the Product Owner delegate to others, while remaining accountable for the work? (Select 2 answers)","answers":[{"key":"a","text":"Attending the Sprint Retrospective.","correct":false},{"key":"b","text":"Developing and communicating the Product Goal.","correct":true},{"key":"c","text":"Attending the Sprint Review.","correct":false},{"key":"d","text":"Ordering the Product Backlog.","correct":true}],"correct":["b","d"],"explanation":"Laut Scrum Guide kann der:die Product Owner:in die Arbeit des Product-Backlog-Managements – z. B. das Entwickeln und Kommunizieren des Produkt-Ziels oder das Ordnen der Product Backlog Items – an andere delegieren, bleibt aber ergebnisverantwortlich. Die Teilnahme an Sprint Review und Sprint Retrospective gehört dagegen zur eigenen Rolle im Scrum Team.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Erklärung","reason":"Erklärung ging nicht auf die richtigen Antworten ein."}},{"test":1,"nr":57,"id":54855188,"type":"multiple-choice","question":"How long does the Product Backlog exist?","answers":[{"key":"a","text":"Till the final Product Release.","correct":false},{"key":"b","text":"While at least one Scrum Team is working on it.","correct":false},{"key":"c","text":"Not more than 5 years.","correct":false},{"key":"d","text":"While the Product exists.","correct":true}],"correct":["d"],"explanation":"","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Sprache","reason":"Grammatik."}},{"test":1,"nr":58,"id":54855198,"type":"multiple-choice","question":"It is a good practice to have at least two Product Owners on big projects.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Der:die Product Owner:in ist eine Person, kein Gremium.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":1,"nr":59,"id":54855230,"type":"multiple-choice","question":"Scrum framework is founded on:","answers":[{"key":"a","text":"Empiricism and Emotional Intelligence","correct":false},{"key":"b","text":"Empiricism","correct":true},{"key":"c","text":"Empiricism and Technical Practices","correct":false}],"correct":["b"],"explanation":"Von den Optionen ist nur „Empiricism“ richtig. Laut Scrum Guide 2020 basiert Scrum auf Empirie und Lean Thinking; emotionale Intelligenz oder technische Praktiken sind keine Grundlage von Scrum.","section":"Scrum Guide (US 2020): Scrum Theory (Seite 3-4)","correction":{"kind":"Erklärung","reason":"Erklärung passte nicht zu den Antwortoptionen."}},{"test":1,"nr":60,"id":54855254,"type":"multiple-choice","question":"The Scrum Master is no longer necessary when Scrum Teams become self-managed.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Es gibt immer einen:e Scrum Master:in in einem Scrum Team.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":1,"nr":61,"id":54878292,"type":"multiple-choice","question":"Who has the \"final say\" on the order of the Product Backlog Items?","answers":[{"key":"a","text":"The Product Owner and The Scrum Master","correct":false},{"key":"b","text":"The Product Owner","correct":true},{"key":"c","text":"The Developers","correct":false},{"key":"d","text":"The Scrum Master","correct":false}],"correct":["b"],"explanation":"Der:die Product Owner:in ist ergebnisverantwortlich für die Maximierung des Wertes des Produkts, der sich aus der Arbeit des Scrum Teams ergibt. Wie dies geschieht, kann je nach Organisation, Scrum Team und Individuum sehr unterschiedlich sein. Der:die Product Owner:in ist für ein effektives Product‐Backlog‐Management ergebnisverantwortlich.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":1,"nr":62,"id":54878300,"type":"multiple-choice","question":"Who is responsible for collaborating with the stakeholders?","answers":[{"key":"a","text":"The Product Owner and The Scrum Master","correct":false},{"key":"b","text":"The Scrum Team","correct":true},{"key":"c","text":"The Product Owner","correct":false},{"key":"d","text":"The Developers","correct":false},{"key":"e","text":"The Scrum Master","correct":false}],"correct":["b"],"explanation":"Das Scrum Team ist umsetzungsverantwortlich (responsible) für alle produktbezogenen Aktivitäten: Zusammenarbeit mit den Stakeholder:innen, Verifikation, Wartung, Betrieb, Experimente, Forschung und Entwicklung und alles, was sonst noch erforderlich sein könnte.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":1,"nr":63,"id":54878308,"type":"multiple-choice","question":"If multiple Stakeholders have varied interests in the product and different viewpoints what is the best strategy for the Product Owner?","answers":[{"key":"a","text":"Stick to the viewpoint promising the fastest time-to-market.","correct":false},{"key":"b","text":"Calculate ROI (Return Of Investments) for every viewpoint and select the maximal one.","correct":false},{"key":"c","text":"Do an intelligent balancing of interests and try to maximize the value of the Product as a whole.","correct":true},{"key":"d","text":"Listen to the people that fund the product’s development because they always have the last word.","correct":false}],"correct":["c"],"explanation":"Der:die Product Owner:in ist ergebnisverantwortlich für die Maximierung des Wertes des Produkts, der sich aus der Arbeit des Scrum Teams ergibt. Wie dies geschieht, kann je nach Organisation, Scrum Team und Individuum sehr unterschiedlich sein.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":1,"nr":64,"id":54878436,"type":"multiple-choice","question":"What are the prerequisites for starting a Sprint Planning?\n(choose the best answer)","answers":[{"key":"a","text":"User Stories that conform with the Definition of Ready.","correct":false},{"key":"b","text":"The preparedness of the Product Owner.","correct":false},{"key":"c","text":"There are no such prerequisites.","correct":true},{"key":"d","text":"A fully refined Product Backlog.","correct":false}],"correct":["c"],"explanation":"Der Scrum Guide nennt keine Vorbedingungen für den Start des Sprint Plannings. Eine „Definition of Ready“ ist kein Bestandteil von Scrum, und das Product Backlog muss nicht vollständig refined sein. Der:die Product Owner:in sorgt zwar dafür, dass die Teilnehmenden vorbereitet sind, die wichtigsten Product Backlog Items zu besprechen – eine formale Vorbedingung ist das aber nicht.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Erklärung","reason":"Erklärung ging am Thema vorbei (Uhrzeit der Events statt Vorbedingungen)."}},{"test":1,"nr":65,"id":54878444,"type":"multi-select","question":"Product Backlog Refinement…\n(Select the two most applicable sentence endings)","answers":[{"key":"a","text":"Usually happens 2-4 times in dependency of the Sprint length.","correct":false},{"key":"b","text":"Is an ongoing process.","correct":true},{"key":"c","text":"Answers the question: how will the work needed to deliver the Increment be achieved.","correct":false},{"key":"d","text":"Is time-boxed to a maximum of 4 hours.","correct":false},{"key":"e","text":"Is the act of adding detail, estimates, and order to Product Backlog items.","correct":true}],"correct":["b","e"],"explanation":"Product‐Backlog‐Einträge, die durch das Scrum Team innerhalb eines Sprints abgeschlossen (Done) werden können, gelten als bereit für die Auswahl in einem Sprint‐Planning‐Event. Diesen Transparenzgrad erlangen sie in der Regel durch Refinement‐Aktivitäten. Das Refinement des Product Backlogs ist der Vorgang, durch den Product‐Backlog‐Einträge in kleinere, präzisere Elemente zerlegt und weiter definiert werden. Dies ist eine kontinuierliche Aktivität, wodurch weitere Details wie Beschreibung, Reihenfolge und Größe ergänzt werden.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":1,"nr":66,"id":54878452,"type":"multiple-choice","question":"When is the Scrum Team allowed to interact with the Key Stakeholders?\n(select the most applicable option)","answers":[{"key":"a","text":"The Sprint Retrospective","correct":false},{"key":"b","text":"The Sprint Review","correct":false},{"key":"c","text":"The Daily Scrum","correct":false},{"key":"d","text":"Any time where it’s valuable to have the Stakeholder input.","correct":true}],"correct":["d"],"explanation":"Es gibt hier keine Einschränkungen die im Scrum Guide genannt werden.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":1,"nr":67,"id":54878470,"type":"multi-select","question":"The Scrum Master serves the organization in several ways, including:","answers":[{"key":"a","text":"Planning and advising Scrum implementations within the organization.","correct":true},{"key":"b","text":"Leading, training, and coaching the organization in its Scrum adoption.","correct":true},{"key":"c","text":"Ensuring that the Product Backlog is transparent, visible and understood.","correct":false},{"key":"d","text":"Developing and explicitly communicating the Product Goal.","correct":false},{"key":"e","text":"Removing barriers between stakeholders and Scrum Teams.","correct":true}],"correct":["a","b","e"],"explanation":"Product Backlog Management und Product Goal Entwicklung sind Aufgaben des:der Product Owners:in.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":1,"nr":68,"id":54878846,"type":"multiple-choice","question":"Who is allowed to participate in the Daily Scrum?","answers":[{"key":"a","text":"The Key Stakeholders","correct":false},{"key":"b","text":"The Product Owner","correct":false},{"key":"c","text":"The Developers","correct":true},{"key":"d","text":"The Scrum Master","correct":false}],"correct":["c"],"explanation":"Der Daily Scrum ist ein internes Scrum Event für die Entwickler:innen. Nur sie dürfen hier aktiv teilnehmen (Sei vorsichtig: \"participate\" vs. \"attend\").","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":1,"nr":69,"id":54878866,"type":"multiple-choice","question":"At the end of Sprint Planning, the Developers could not decompose all of the work into units of one day or less. They could decompose the work for only the first few days of the Sprint. What should happen?","answers":[{"key":"a","text":"The Developers should close the Sprint Planning and start the work.","correct":true},{"key":"b","text":"The Scrum Master should coach the team in required skills.","correct":false},{"key":"c","text":"Since the team is self-organized, they should continue Sprint Planning in the following days before they start the work.","correct":false}],"correct":["a"],"explanation":"Weitere Refinements können auch im Sprint stattfinden. Es muss nicht der ganze Sprint perfekt vorbereitet sein.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Sprache","reason":"Die eigentliche Frage fehlte, dazu Grammatik."}},{"test":1,"nr":70,"id":54879526,"type":"multiple-choice","question":"The Scrum framework ensures that adding more resources to the product development will proportionally increase the product value.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Es besteht kein im Scrum Guide beschriebener Zusammenhang zwischen dem Umfang der für die Produktentwicklung eingesetzten Ressourcen und dem Produktwert.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":1,"nr":71,"id":54888702,"type":"multiple-choice","question":"When is a good time to integrate the code?","answers":[{"key":"a","text":"At the end of each Sprint.","correct":false},{"key":"b","text":"Frequently, during the Sprint (as needed).","correct":true},{"key":"c","text":"At the end of the project.","correct":false},{"key":"d","text":"Before each release.","correct":false}],"correct":["b"],"explanation":"Man kann nicht genau wissen, ob der Code richtig funktioniert, wenn man ihn nicht mit dem restlichen Code integriert. Deshalb gibt es bei Agile die kontinuierliche Integration, die mehrmals am Tag stattfinden kann.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":1,"nr":72,"id":54888712,"type":"multiple-choice","question":"Which of the following is the most important opportunity for capturing lessons learned?","answers":[{"key":"a","text":"Sprint Planning","correct":false},{"key":"b","text":"Daily Scrum","correct":false},{"key":"c","text":"Sprint Retrospective","correct":true},{"key":"d","text":"Sprint Review","correct":false}],"correct":["c"],"explanation":"Der Zweck der Sprint Retrospective ist es, Wege zur Steigerung von Qualität und Effektivität zu planen. Das Scrum Team überprüft, wie der letzte Sprint in Bezug auf Individuen, Interaktionen, Prozesse, Werkzeuge und seine Definition of Done verlief.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Erklärung","reason":"Verirrte Fußnoten-Nummer im Text."}},{"test":1,"nr":73,"id":54888718,"type":"multiple-choice","question":"The Developers use the Daily Scrum to inspect progress towards the Sprint Goal.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Der Zweck des Daily Scrums besteht darin, den Fortschritt in Richtung des Sprint‐Ziels zu überprüfen und das Sprint Backlog bei Bedarf anzupassen, um die bevorstehende geplante Arbeit zu justieren.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":1,"nr":74,"id":54888726,"type":"multiple-choice","question":"Removing impediments to the Scrum team's progress is one of the Scrum Master's responsibilities.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Der:die Scrum Master:in dient dem Scrum Team auf unterschiedliche Weise, unter anderem dadurch, die Beseitigung von Hindernissen (impediments) für den Fortschritt des Scrum Teams zu bewirken.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":1,"nr":75,"id":54888824,"type":"multiple-choice","question":"Which of the following may change during the Sprint?","answers":[{"key":"a","text":"Minimum level of quality","correct":false},{"key":"b","text":"Product Backlog","correct":true},{"key":"c","text":"Sprint Goal","correct":false}],"correct":["b"],"explanation":"Das Refinement des Product Backlogs ist der Vorgang, durch den Product‐Backlog‐Einträge in kleinere, präzisere Elemente zerlegt und weiter definiert werden. Dies ist eine kontinuierliche Aktivität, wodurch weitere Details wie Beschreibung, Reihenfolge und Größe ergänzt werden.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":1,"nr":76,"id":54888838,"type":"multiple-choice","question":"If multiple scrum teams are working together on the same product, how many product backlogs should exist?","answers":[{"key":"a","text":"One primary and one for each team.","correct":false},{"key":"b","text":"As many as the scrum team decides during sprint planning.","correct":false},{"key":"c","text":"One.","correct":true},{"key":"d","text":"One for each team.","correct":false}],"correct":["c"],"explanation":"1 Product = 1 Product Backlog","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":1,"nr":77,"id":54888858,"type":"multiple-choice","question":"The Product Owner can ask the developers to order the Product Backlog items instead of him/her.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Der:die Product Owner:in kann seine Aufgaben an die Entwickler:innen delegieren, bleibt aber selbst verantwortlich.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":1,"nr":78,"id":54890470,"type":"multiple-choice","question":"When multiple teams are working on the same product, one person can be a member of more than one Scrum Team.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Der Scrum Guide verbietet dies nicht, auch wenn es nicht als Best Practice gilt.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":1,"nr":79,"id":54891032,"type":"multiple-choice","question":"All interactions between the stakeholders and the Developers must be through the Product Owner.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Das gesamte Scrum Team darf mit Stakeholdern kollaborieren.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":1,"nr":80,"id":54891120,"type":"multiple-choice","question":"How should the Product Backlog be ordered?","answers":[{"key":"a","text":"Lowest effort items at the top and greatest effort items at the bottom.","correct":false},{"key":"b","text":"Whichever way makes the most sense for the Developers to understand.","correct":false},{"key":"c","text":"The most valuable and most refined items should be at the top.","correct":true},{"key":"d","text":"The least valuable and least refined items should be at the top.","correct":false}],"correct":["c"],"explanation":"Der Scrum Guide schreibt keine bestimmte Sortierung vor – der:die Product Owner:in ordnet das Product Backlog so, dass der Wert maximiert wird. Von den Optionen passt C am besten: Einträge weiter oben sind in der Regel wertvoller und bereits klarer und detaillierter als Einträge weiter unten.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Erklärung","reason":"Erklärung klang, als schreibe der Scrum Guide eine Sortierung vor."}},{"test":2,"nr":1,"id":54407218,"type":"multiple-choice","question":"Who makes up the Scrum Team?","answers":[{"key":"a","text":"One Scrum Master and Developers.","correct":false},{"key":"b","text":"One Product Owner and Developers.","correct":false},{"key":"c","text":"One Scrum Master, one Product Owner, and Developers.","correct":true},{"key":"d","text":"One Scrum Master and one Product Owner.","correct":false}],"correct":["c"],"explanation":"Das Scrum Team besteht aus einem:einer Scrum Master:in, einem:einer Product Owner:in und Developer:innen. Innerhalb eines Scrum Teams gibt es keine Teilteams oder Hierarchien.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":2,"nr":2,"id":54407400,"type":"multiple-choice","question":"What is the primary focus of the Scrum Team?","answers":[{"key":"a","text":"Collaborating with stakeholders","correct":false},{"key":"b","text":"The Product Goal","correct":true},{"key":"c","text":"The Sprint Goal","correct":false}],"correct":["b"],"explanation":"Der zentrale Bestandteil von Scrum ist ein kleines Team von Menschen, ein Scrum Team. Es handelt sich um eine geschlossene Einheit von Fachleuten, die sich auf ein Ziel konzentrieren, das Produkt‐Ziel.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":2,"nr":3,"id":54407418,"type":"multiple-choice","question":"What is the ideal size of a Scrum Team?\n(choose the best answer)","answers":[{"key":"a","text":"As large as possible.","correct":false},{"key":"b","text":"10 or fewer people.","correct":true},{"key":"c","text":"Small enough to communicate well and be productive.","correct":false}],"correct":["b"],"explanation":"Das Scrum Team ist klein genug, um flink zu bleiben und groß genug, um innerhalb eines Sprints bedeutsame Arbeit fertigzustellen, üblicherweise 10 oder weniger Personen.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":2,"nr":4,"id":54407428,"type":"multiple-choice","question":"If a Scrum Team becomes too large, what should they consider doing?","answers":[{"key":"a","text":"Reorganizing into multiple cohesive Scrum Teams.","correct":true},{"key":"b","text":"Hiring fewer people.","correct":false},{"key":"c","text":"Increasing the length of the Sprints.","correct":false}],"correct":["a"],"explanation":"","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Sprache","reason":"Grammatik."}},{"test":2,"nr":5,"id":54407438,"type":"multiple-choice","question":"Who is accountable for creating a valuable, useful Increment every Sprint?\n(choose the best answer)","answers":[{"key":"a","text":"The Developers","correct":false},{"key":"b","text":"The Product Owner","correct":false},{"key":"c","text":"The Scrum Master","correct":false},{"key":"d","text":"The entire Scrum Team","correct":true}],"correct":["d"],"explanation":"","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":2,"nr":6,"id":54407532,"type":"multiple-choice","question":"What is the purpose of cross-functional teams in Scrum?","answers":[{"key":"a","text":"To ensure that all necessary skills are represented in the team.","correct":false},{"key":"b","text":"To reduce dependencies on people outside the team.","correct":false},{"key":"c","text":"To improve the team's ability to complete work within a Sprint.","correct":false},{"key":"d","text":"All answers are correct.","correct":true}],"correct":["d"],"explanation":"Scrum Teams sind interdisziplinär, d. h. die Mitglieder verfügen über alle Fähigkeiten, die erforderlich sind, um in jedem Sprint Wert zu schaffen. Dadurch sind sie weniger von Personen außerhalb des Teams abhängig und können ihre Arbeit innerhalb eines Sprints abschließen. Dass das Team intern entscheidet, wer was wann und wie macht, beschreibt dagegen das Selbstmanagement.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Inhalt","reason":"Antwort B beschrieb Selbstmanagement, nicht Interdisziplinarität – „All answers are correct“ war damit falsch. Antwort B ersetzt."}},{"test":2,"nr":7,"id":54418978,"type":"multiple-choice","question":"Which of the following is NOT a responsibility of Developers in a Scrum Team?","answers":[{"key":"a","text":"Instilling quality by adhering to a Definition of Done.","correct":false},{"key":"b","text":"Adapting their plan each day toward the Sprint Goal.","correct":false},{"key":"c","text":"Holding each other accountable as professionals.","correct":false},{"key":"d","text":"Managing the budget.","correct":true}],"correct":["d"],"explanation":"Laut Scrum Guide sind die Developer:innen ergebnisverantwortlich dafür,\n• einen Plan für den Sprint zu erstellen, das Sprint Backlog;\n• Qualität durch die Einhaltung einer Definition of Done einzubringen;\n• täglich ihren Plan zur Erreichung des Sprint‐Ziels anzupassen; und\n• sich wechselseitig als Expert:innen zur Verantwortung zu ziehen.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":2,"nr":8,"id":54419084,"type":"multiple-choice","question":"The specific skills needed by Developers in a Scrum Team will vary based on:","answers":[{"key":"a","text":"The domain of work.","correct":true},{"key":"b","text":"The length of the Sprint.","correct":false}],"correct":["a"],"explanation":"Laut Scrum Guide sind die spezifischen Fähigkeiten, die von den Developer:innen benötigt werden, oft breit gefächert und variieren je nach Arbeitskontext.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Sprache","reason":"Fehlendes Wort in der Erklärung."}},{"test":2,"nr":9,"id":54419150,"type":"multiple-choice","question":"Which of the following is NOT a responsibility of the Product Owner in managing the Product Backlog?","answers":[{"key":"a","text":"Developing and explicitly communicating the Product Goal.","correct":false},{"key":"b","text":"Ordering Product Backlog items.","correct":false},{"key":"c","text":"Ensuring that the Product Backlog is transparent and visible.","correct":false},{"key":"d","text":"Creating and clearly communicating the Definition of Ready (DoR).","correct":true}],"correct":["d"],"explanation":"Das Konzept einer \"Definition of Ready (DoR)\" ist nicht Teil des Scrum Frameworks.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":2,"nr":10,"id":54419382,"type":"multiple-choice","question":"How can stakeholders change the Product Backlog?","answers":[{"key":"a","text":"By negotiating with the Product Owner.","correct":true},{"key":"b","text":"By organizing a vote among the stakeholders.","correct":false},{"key":"c","text":"By presenting their case to the Developers.","correct":false}],"correct":["a"],"explanation":"Der:die Product Owner:in ist für die effektive Verwaltung des Product Backlogs verantwortlich. Diejenigen, die das Product Backlog ändern möchten, können dies tun, indem sie versuchen, den:die Product Owner:in zu überzeugen.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":2,"nr":11,"id":54419456,"type":"multiple-choice","question":"Who is responsible for effective Product Backlog management?","answers":[{"key":"a","text":"The Product Owner","correct":true},{"key":"b","text":"A committee of stakeholders","correct":false},{"key":"c","text":"The Scrum Team","correct":false},{"key":"d","text":"The entire organization","correct":false}],"correct":["a"],"explanation":"Der:die Product Owner:in ist laut Scrum Guide für ein effektives Product‐Backlog‐Management ergebnisverantwortlich, das Folgendes umfasst:\n• das Produkt‐Ziel zu entwickeln und explizit zu kommunizieren;\n• die Product‐Backlog‐Einträge zu erstellen und klar zu kommunizieren;\n• die Reihenfolge der Product‐Backlog‐Einträge festzulegen; und\n• sicherzustellen, dass das Product Backlog transparent, sichtbar und verstanden ist.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Erklärung","reason":"Erklärung brach mitten im Wort ab."}},{"test":2,"nr":12,"id":54444518,"type":"multiple-choice","question":"There is a conflict between two team members. What should the Scrum Master do?","answers":[{"key":"a","text":"Remove one of the team members from the team.","correct":false},{"key":"b","text":"Ask the Product Owner to remove one of the team members from the team.","correct":false},{"key":"c","text":"Trust in the power of the self-managing team. Support the process if requested by the team.","correct":true}],"correct":["c"],"explanation":"Das Scrum Team managt sich selbst. Der:die Scrum Master:in vertraut darauf und unterstützt nur, wenn das Team es wünscht oder es nötig ist.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Sprache","reason":"Rechtschreibung."}},{"test":2,"nr":13,"id":54444530,"type":"multiple-choice","question":"The Product Owner is allowed to delegate some work to the Developers.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Der:die Product Owner:in kann z.B. die Erstellung von Product Backlog Items an die Entwickler:innen delegieren, aber der:die Product Owner:in bleibt verantwortlich für das Ergebnis.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":2,"nr":14,"id":54444544,"type":"multiple-choice","question":"Which of the following Scrum accountabilities decides how the work during the Sprint is done?","answers":[{"key":"a","text":"Product Owner","correct":false},{"key":"b","text":"Scrum Master","correct":false},{"key":"c","text":"Developers","correct":true}],"correct":["c"],"explanation":"Die Entwickler:innen erstellen den Plan für den Sprint (Teil des Sprint Backlogs). Dieser beantwortet die Frage, wie die Arbeit im Sprint erledigt werden soll.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Erklärung","reason":"Der Plan für den Sprint ist Teil des Sprint Backlogs, nicht des Sprint-Ziels. Dazu Grammatik in der Frage."}},{"test":2,"nr":15,"id":54444556,"type":"multiple-choice","question":"The Scrum Team must be:","answers":[{"key":"a","text":"Product Goal focused","correct":false},{"key":"b","text":"Cross-functional","correct":false},{"key":"c","text":"Self-managing","correct":false},{"key":"d","text":"All of the answers are correct.","correct":true}],"correct":["d"],"explanation":"Alle Antworten sind richtig und finden sich im Scrum Guide.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":2,"nr":16,"id":54444598,"type":"multiple-choice","question":"There are no sub-hierarchies in the Scrum Team besides the fact that the Lead Developer is leading the Developers.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"In Scrum gibt es keine \"Lead Developer\" (keine Unterhierarchien).","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Sprache","reason":"Zeichensetzung."}},{"test":2,"nr":17,"id":54444614,"type":"multiple-choice","question":"Who is developing and communicating the Product Goal?","answers":[{"key":"a","text":"Product Owner","correct":true},{"key":"b","text":"Developers","correct":false},{"key":"c","text":"Scrum Master","correct":false},{"key":"d","text":"Product Manager","correct":false}],"correct":["a"],"explanation":"Die Entwicklung und die explizite Kommunikation des Produkt-Ziels liegt in der Verantwortung des:der Product Owner:in. In Scrum gibt es keine Produktmanager:innen.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":2,"nr":18,"id":54444632,"type":"multiple-choice","question":"Who is accountable for maximizing the value of the product?","answers":[{"key":"a","text":"Product Owner","correct":true},{"key":"b","text":"Scrum Master","correct":false},{"key":"c","text":"Developers","correct":false}],"correct":["a"],"explanation":"Der:die Product Owner:in ist dafür verantwortlich, den Wert des Produkts zu maximieren.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":2,"nr":19,"id":54444682,"type":"multi-select","question":"Which of the following options are accountabilities of the Developers?","answers":[{"key":"a","text":"Creating a plan for the Sprint (plan in the Sprint Backlog).","correct":true},{"key":"b","text":"Instilling quality by adhering to a Definition of Done.","correct":true},{"key":"c","text":"Holding each other accountable as professionals.","correct":true},{"key":"d","text":"Ensuring that the Product Backlog is transparent, visible and understood.","correct":false},{"key":"e","text":"Ensuring that all Scrum events take place and are positive, productive and kept within the time box.","correct":false}],"correct":["a","b","c"],"explanation":"Der:die Product Owner:in ist dafür verantwortlich, dass das Product Backlog transparent, sichtbar und verständlich ist. Der:die Scrum Master:in ist dafür verantwortlich, dass alle Scrum-Events stattfinden, positiv und produktiv sind und die Timeboxen eingehalten werden.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":2,"nr":20,"id":54444698,"type":"multiple-choice","question":"Which Scrum accountability owns the Sprint Backlog?","answers":[{"key":"a","text":"Product Owner","correct":false},{"key":"b","text":"Developers","correct":true},{"key":"c","text":"Scrum Master","correct":false}],"correct":["b"],"explanation":"Die Entwickler:innen sind diejenigen, die für das Sprint Backlog verantwortlich sind.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":2,"nr":21,"id":54474932,"type":"multiple-choice","question":"Scrum is founded on:","answers":[{"key":"a","text":"Empiricism","correct":false},{"key":"b","text":"Lean thinking","correct":false},{"key":"c","text":"All answers are true","correct":true}],"correct":["c"],"explanation":"Scrum basiert auf Empirie und Lean Thinking. Empirie bedeutet, dass Wissen aus Erfahrung gewonnen wird und Entscheidungen auf der Grundlage von Beobachtungen getroffen werden. Lean Thinking reduziert Verschwendung und fokussiert auf das Wesentliche.","section":"Scrum Guide (US 2020): Scrum Theory (Seite 3-4)","correction":null},{"test":2,"nr":22,"id":54474950,"type":"multiple-choice","question":"The Product Owner is not able to define a Product Goal. What should the Scrum Master do?","answers":[{"key":"a","text":"Help the Product Owner find techniques for effective Product Goal definition.","correct":true},{"key":"b","text":"Define the Product Goal with the Developers and present it to the Product Owner.","correct":false},{"key":"c","text":"Inform the management about the impediment.","correct":false}],"correct":["a"],"explanation":"Der:die Scrum Master:in dient dem:der Product Owner:in auf verschiedene Weise, unter anderem: Er:sie hilft bei der Suche nach Techniken für die Definition von Produkt-Zielen und Product Backlog Management.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Sprache","reason":"Grammatik passte nicht zur Frage."}},{"test":2,"nr":23,"id":54474960,"type":"multiple-choice","question":"The Sprint Backlog doesn't change during the Sprint.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Das Sprint Backlog obliegt den Entwickler:innen. Sie passen das Sprint Backlog während des Sprints ständig an, indem sie z.B. die Backlog Items in kleinere Aufgaben herunterbrechen.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":2,"nr":24,"id":54474970,"type":"multiple-choice","question":"What is the responsibility of Testers in Scrum?","answers":[{"key":"a","text":"There is no such accountability in Scrum. There is only the Scrum Master, the Product Owner and Developers.","correct":true},{"key":"b","text":"To create test cases and plan test cycles.","correct":false},{"key":"c","text":"To add testing related details to the Definition of Done.","correct":false}],"correct":["a"],"explanation":"","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":2,"nr":25,"id":54474986,"type":"multi-select","question":"The Scrum Values are:","answers":[{"key":"a","text":"Commitment","correct":true},{"key":"b","text":"Focus","correct":true},{"key":"c","text":"Openness","correct":true},{"key":"d","text":"Respect","correct":true},{"key":"e","text":"Courage","correct":true},{"key":"f","text":"Transparency","correct":false},{"key":"g","text":"Inspection","correct":false}],"correct":["a","b","c","d","e"],"explanation":"Die Scrum Werte sind: Commitment, Fokus, Offenheit, Respekt und Mut.","section":"Scrum Guide (US 2020): Scrum Values (Seite 4)","correction":null},{"test":2,"nr":26,"id":54475000,"type":"multiple-choice","question":"The purpose of the Sprint Retrospective is to plan ways to increase quality and effectiveness.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Basierend auf dem Scrum Guide besteht der Zweck der Sprint-Retrospektive darin, Wege zur Steigerung von Qualität und Effektivität zu planen.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":2,"nr":27,"id":54475030,"type":"multiple-choice","question":"The organization decides that all Scrum Teams should extend their Sprint length to 5 weeks (more than a month). What should the Scrum Master do?","answers":[{"key":"a","text":"All answers are correct.","correct":true},{"key":"b","text":"Help the organization understand that longer Sprints may result in Sprint Goals that become invalid.","correct":false},{"key":"c","text":"Help the organization understand that longer Sprints may result in higher complexity for the teams.","correct":false},{"key":"d","text":"Help the organization understand that shorter Sprints result in more learning cycles.","correct":false}],"correct":["a"],"explanation":"Wenn der Zeitraum eines Sprints zu lang ist, kann das Sprint-Ziel ungültig werden, die Komplexität kann steigen und das Risiko kann zunehmen. Kürzere Sprints können eingesetzt werden, um mehr Lernzyklen zu generieren und das Risiko von Kosten und Aufwand auf einen kleineren Zeitrahmen zu begrenzen.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Sprache","reason":"Falsches Wort („enhance“ statt „extend“) und Zeichensetzung."}},{"test":2,"nr":28,"id":54475202,"type":"multiple-choice","question":"Two Scrum Teams are working on the same product. How should their individual Product Backlogs be aligned with one another, in order to ensure quality and continuity?","answers":[{"key":"a","text":"During the Sprint Planning and in collaboration with the Product Owner who manages them.","correct":false},{"key":"b","text":"There is only one Product Backlog for both teams.","correct":true},{"key":"c","text":"During the Scrum of Scrums, the Scrum Masters align the dependencies.","correct":false}],"correct":["b"],"explanation":"1 Produkt = 1 Produkt Backlog = 1 Product Owner:in","section":"Online Nexus Guide (US 2021): Nexus Artifacts and Commitment","correction":null},{"test":2,"nr":29,"id":54475362,"type":"multiple-choice","question":"What is the main reason for the Product Owner to attend the Daily Scrum?","answers":[{"key":"a","text":"The Product Owner doesn't have to attend the Daily Scrum.","correct":true},{"key":"b","text":"To make sure, that every Developer attends and is prepared.","correct":false},{"key":"c","text":"To receive a status report for the Sprint.","correct":false}],"correct":["a"],"explanation":"Das Daily Scrum ist ein Scrum Event für die Entwickler:innen. Der:die Product Owner:in darf teilnehmen (passiv), muss aber nicht.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":2,"nr":30,"id":54475376,"type":"multiple-choice","question":"The Scrum Team is responsible for Stakeholder collaboration and talks to them anytime it makes sense during the Sprint, even outside of the prescribed Scrum Events.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Obwohl das Scrum Team während des Sprint Reviews mit den Stakeholdern interagiert, gibt der Scrum Guide nicht vor, dass dies die einzige Gelegenheit ist, bei der sie sich austauschen können.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":2,"nr":31,"id":54490670,"type":"multiple-choice","question":"Shorter Sprints:","answers":[{"key":"a","text":"Can be employed to generate more learning cycles.","correct":false},{"key":"b","text":"Limit the risk of cost and effort to a smaller time frame.","correct":false},{"key":"c","text":"Both answers are correct.","correct":true}],"correct":["c"],"explanation":"Kürzere Sprints können eingesetzt werden, um mehr Lernzyklen zu erzeugen und das Risiko von Kosten und Aufwand auf einen kleineren Zeitrahmen zu begrenzen. Jeder Sprint kann als ein kurzes Projekt betrachtet werden.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":2,"nr":32,"id":54490678,"type":"multiple-choice","question":"Why do the Scrum Commitments exist?","answers":[{"key":"a","text":"To reinforce empiricism and the Scrum Values for the Scrum Team and their stakeholders.","correct":true},{"key":"b","text":"To make the product progress more visible.","correct":false}],"correct":["a"],"explanation":"Die Scrum Commitments dienen dazu, die Empirie und die Scrum-Werte für das Scrum-Team und seine Stakeholder zu stärken.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":2,"nr":33,"id":54490688,"type":"multiple-choice","question":"Which outcome is expected as Scrum Teams mature, with regards to the Definition of Done?","answers":[{"key":"a","text":"They will improve their Definition of Done by including more stringent criteria.","correct":true},{"key":"b","text":"They will no longer need a Definition of Done.","correct":false},{"key":"c","text":"A Definition of Done is not necessarily needed in Scrum.","correct":false}],"correct":["a"],"explanation":"Wenn ein Scrum-Team mehr Erfahrung hat, wird es weitere Kriterien zur Definition of Done hinzufügen, da es im Laufe des Prozesses mehr dazu lernt.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":2,"nr":34,"id":54490692,"type":"multiple-choice","question":"The size of the Scrum Team should be:","answers":[{"key":"a","text":"10 or fewer people","correct":true},{"key":"b","text":"3-9 people","correct":false},{"key":"c","text":"3-7 people","correct":false}],"correct":["a"],"explanation":"Das Scrum-Team ist klein genug, um flexibel zu bleiben, und groß genug, um innerhalb eines Sprints umfangreiche Arbeiten abzuschließen. In der Regel sind hierzu 10 oder weniger Personen ideal.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":2,"nr":35,"id":54490702,"type":"multiple-choice","question":"In the Sprint Review, the Product Backlog may also be adjusted to meet new opportunities.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Während des Sprint Review Events überprüfen das Scrum Team und die Stakeholder, was im Sprint erreicht wurde und was sich in ihrem Umfeld verändert hat. Auf der Grundlage dieser Informationen arbeiten die Teilnehmer:innen gemeinsam daran festzulegen, was als nächstes zu tun ist. Das Product Backlog kann auch angepasst werden, um neuen Möglichkeiten gerecht zu werden.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":2,"nr":36,"id":54490712,"type":"multiple-choice","question":"Who is responsible for updating the Sprint Backlog?","answers":[{"key":"a","text":"Developers","correct":true},{"key":"b","text":"Product Owner","correct":false},{"key":"c","text":"Scrum Master","correct":false}],"correct":["a"],"explanation":"Das Sprint Backlog gehört den Entwickler:innen. Das Sprint Backlog ist ein Plan von und für die Entwickler:innen.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":2,"nr":37,"id":54490716,"type":"multiple-choice","question":"Who decides when a new functionality in the Sprint should be tested?","answers":[{"key":"a","text":"Developers","correct":true},{"key":"b","text":"Product Owner","correct":false},{"key":"c","text":"Test Manager","correct":false}],"correct":["a"],"explanation":"Die Entwickler:innen sind für die Erstellung des Increments verantwortlich. Niemand sonst sagt ihnen, wie sie ein Product Backlog Item in ein wertsteigerndes Increment zu verwandeln haben.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":2,"nr":38,"id":54490724,"type":"multiple-choice","question":"Product Backlog Items must include acceptance criteria to prove the security of the product.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Der Scrum Guide schreibt nicht vor, wie Product Backlog Items aufgebaut sein müssen. Sicherheitsanforderungen können z. B. Teil der Definition of Done sein.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Erklärung","reason":"Persönliche Meinung in der Erklärung."}},{"test":2,"nr":39,"id":54490728,"type":"multiple-choice","question":"Within a Scrum Team, there are no sub-teams or hierarchies.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"In einem Scrum-Team gibt es keine Unterteams oder Hierarchien. Es ist eine zusammenhängende Einheit von Fachleuten, die sich jeweils auf ein Ziel konzentrieren, das Produkt-Ziel.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":2,"nr":40,"id":54490732,"type":"multiple-choice","question":"A company is developing three products using Scrum. Which of the following statements is correct?","answers":[{"key":"a","text":"Each Product will have a Product Owner.","correct":true},{"key":"b","text":"There is one single Product Owner for all three Products.","correct":false},{"key":"c","text":"There is one Product Backlog.","correct":false}],"correct":["a"],"explanation":"Jedes Produkt hat genau ein Product Backlog und eine:n Product Owner:in. Bei drei Produkten gibt es also drei Product Backlogs, und jedes Produkt hat seine:n Product Owner:in. Ob dieselbe Person mehrere Produkte verantwortet, legt der Scrum Guide nicht fest – Antwort B ist deshalb nicht zwingend richtig, Antwort C ist falsch.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Inhalt","reason":"Gleiche Frage wie 1.32 – gleiche Korrektur."}},{"test":2,"nr":41,"id":54597376,"type":"multiple-choice","question":"When is a Product Backlog retired?","answers":[{"key":"a","text":"When the Product Owner is retired.","correct":false},{"key":"b","text":"When the Product is retired.","correct":true}],"correct":["b"],"explanation":"Wenn ein Produkt existiert, existiert auch sein Product Backlog.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Sprache","reason":"Tippfehler („retied“)."}},{"test":2,"nr":42,"id":54597540,"type":"multiple-choice","question":"What provides guidance to the Scrum Team on why it is building the Increment?","answers":[{"key":"a","text":"The Sprint Goal","correct":true},{"key":"b","text":"The Product Backlog","correct":false},{"key":"c","text":"The Definition of Done","correct":false}],"correct":["a"],"explanation":"Das Sprint Goal ist ein für den Sprint festgelegtes Ziel, das durch die Umsetzung des Sprint Backlogs erreicht werden kann.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":2,"nr":43,"id":54736024,"type":"multiple-choice","question":"How frequently should product releases happen?","answers":[{"key":"a","text":"Frequently enough (depending on the circumstances / what is most beneficial for the product value)","correct":true},{"key":"b","text":"Every Sprint","correct":false},{"key":"c","text":"At least every 6 Sprints","correct":false},{"key":"d","text":"At least every 6 months","correct":false}],"correct":["a"],"explanation":"Das Team muss jeden Sprint ein potenziell releasebares Increment bereitstellen. Dieses muss aber nicht zwingend released werden!","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Sprache","reason":"Grammatik."}},{"test":2,"nr":44,"id":54736526,"type":"multi-select","question":"Who does not participate in the Daily Scrum? Select all applicable answers.","answers":[{"key":"a","text":"The Developers","correct":false},{"key":"b","text":"The Product Owner","correct":true},{"key":"c","text":"The Scrum Master","correct":true},{"key":"d","text":"The CEO","correct":true}],"correct":["b","c","d"],"explanation":"Der:die Product Owner:in / Scrum Master:in können anwesend sein, dürfen aber nicht aktiv teilnehmen (wenn sie selbst an Tickets arbeiten, nehmen sie als Developer:in teil). Sie müssen auch nicht zwingend anwesend sein.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":2,"nr":45,"id":54737558,"type":"multiple-choice","question":"Who is not allowed to attend the Daily Scrum?","answers":[{"key":"a","text":"The Scrum Master","correct":false},{"key":"b","text":"The Product Owner","correct":false},{"key":"c","text":"The Developers","correct":false},{"key":"d","text":"None of them (they are all allowed to attend).","correct":true}],"correct":["d"],"explanation":"Alle der genannten dürfen anwesend sein (passiv) aber nur die Entwickler:innen dürfen aktiv teilnehmen.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":2,"nr":46,"id":54738390,"type":"multiple-choice","question":"The Sprint Backlog is composed of the Sprint Goal (why), the set of Product Backlog items selected for the Sprint (what), as well as a release date (when).","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Das Sprint Backlog besteht aus dem Sprint‐Ziel (Wofür), den für den Sprint ausgewählten Product‐Backlog‐Einträgen (Was) sowie einem umsetzbaren Plan für die Lieferung des Increments (Wie).","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":2,"nr":47,"id":54739218,"type":"multiple-choice","question":"During the Sprint, no changes are made that would change the Product Backlog.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Das Product Backlog ist im ständigen Wandel.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":2,"nr":48,"id":54739428,"type":"multiple-choice","question":"During a Sprint Review, the stakeholders notice that the product development progress is not very visible and lacks transparency. Moreover, they don't understand the next steps. Who is accountable for addressing this?","answers":[{"key":"a","text":"The Product Owner","correct":true},{"key":"b","text":"The Scrum Master","correct":false}],"correct":["a"],"explanation":"Der:die Product Owner:in ist dafür ergebnisverantwortlich, dass das Product Backlog transparent, sichtbar und verstanden ist und dass das Produkt-Ziel klar kommuniziert wird. Damit liegen auch die Sichtbarkeit des Fortschritts und die nächsten Schritte bei ihm:ihr. Der:die Scrum Master:in kann dabei unterstützen, z. B. mit Techniken für ein effektives Product-Backlog-Management – die Verantwortung bleibt aber beim:bei der Product Owner:in.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Inhalt","reason":"Falsche Lösung: Für ein transparentes, verständliches Product Backlog und damit für den Fortschritt Richtung Produkt-Ziel ist der:die Product Owner:in ergebnisverantwortlich, nicht der:die Scrum Master:in."}},{"test":2,"nr":49,"id":54739488,"type":"multiple-choice","question":"What Product Owner activities take place between the end of the current Sprint and the beginning of the next Sprint?","answers":[{"key":"a","text":"Updating of the product roadmap.","correct":false},{"key":"b","text":"Pre-sprint planning.","correct":false},{"key":"c","text":"Product Backlog refinement.","correct":false},{"key":"d","text":"Nothing (the next sprint starts immediately).","correct":true}],"correct":["d"],"explanation":"Ein neuer Sprint beginnt unmittelbar nach dem Abschluss des vorherigen Sprints.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":2,"nr":50,"id":54739516,"type":"multiple-choice","question":"How long should the Sprint be?","answers":[{"key":"a","text":"Not more than 2 months.","correct":false},{"key":"b","text":"Not more than 2 weeks.","correct":false},{"key":"c","text":"Not more than 1 month.","correct":true}],"correct":["c"],"explanation":"","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":2,"nr":51,"id":54855606,"type":"multiple-choice","question":"The Sprint length should be:","answers":[{"key":"a","text":"Short enough to be able to synchronize the development work with other business events.","correct":false},{"key":"b","text":"All of these answers are correct.","correct":true},{"key":"c","text":"No more than one month.","correct":false},{"key":"d","text":"Short enough to keep the business risk acceptable to the Product Owner.","correct":false}],"correct":["b"],"explanation":"Wenn der Horizont eines Sprints zu lang ist, kann das Sprint‐Ziel hinfällig werden, die Komplexität kann steigen und das Risiko kann zunehmen. Kürzere Sprints können eingesetzt werden, um mehr Lernzyklen zu generieren und das Risiko von Kosten und Aufwand auf einen kleineren Zeitrahmen zu begrenzen. Jeder Sprint kann als ein kurzes Projekt betrachtet werden.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":2,"nr":52,"id":54855626,"type":"multiple-choice","question":"Who is responsible for ensuring the Product Backlog items are understood to the level needed?","answers":[{"key":"a","text":"The Developers","correct":false},{"key":"b","text":"The Scrum Master","correct":false},{"key":"c","text":"The Product Owner","correct":true},{"key":"d","text":"The Business Analyst","correct":false}],"correct":["c"],"explanation":"Der:die Product Owner:in ist für ein effektives Product‐Backlog‐Management ergebnisverantwortlich, das Folgendes umfasst:\n• das Produkt‐Ziel zu entwickeln und explizit zu kommunizieren;\n• die Product‐Backlog‐Einträge zu erstellen und klar zu kommunizieren;","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Sprache","reason":"Fragezeichen fehlte."}},{"test":2,"nr":53,"id":54855644,"type":"multi-select","question":"Select the five Scrum Values.","answers":[{"key":"a","text":"Focus","correct":true},{"key":"b","text":"Openness","correct":true},{"key":"c","text":"Respect","correct":true},{"key":"d","text":"Effectiveness","correct":false},{"key":"e","text":"Courage","correct":true},{"key":"f","text":"Agility","correct":false},{"key":"g","text":"Commitment","correct":true},{"key":"h","text":"Self-organization","correct":false}],"correct":["a","b","c","e","g"],"explanation":"Die fünf Scrum Werte: Commitment, Fokus, Offenheit, Respekt und Mut","section":"Scrum Guide (US 2020): Scrum Values (Seite 4)","correction":null},{"test":2,"nr":54,"id":54855966,"type":"multiple-choice","question":"What might be a valid reason for abnormally cancelling a Sprint?","answers":[{"key":"a","text":"When the work becomes too difficult for the Developers.","correct":false},{"key":"b","text":"When the sales department discovers features that add more value than the current work being done.","correct":false},{"key":"c","text":"When the Sprint Goal becomes obsolete.","correct":true},{"key":"d","text":"When the Developers discover they cannot meet their Sprint commitments.","correct":false}],"correct":["c"],"explanation":"Ein Sprint könnte abgebrochen werden, wenn das Sprint‐Ziel obsolet wird. Nur der:die Product Owner:in hat die Befugnis, den Sprint abzubrechen.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Sprache","reason":"Grammatik."}},{"test":2,"nr":55,"id":54855972,"type":"multiple-choice","question":"Every Scrum Team should have the skills and abilities to deliver a \"done\" increment in a Sprint.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Scrum Teams sind interdisziplinär, d.h. die Mitglieder verfügen über alle Fähigkeiten, die erforderlich sind, um in jedem Sprint Wert zu schaffen.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":2,"nr":56,"id":54856086,"type":"multiple-choice","question":"Which stakeholder is the most important for the Product Owner to satisfy?","answers":[{"key":"a","text":"The Product's users","correct":true},{"key":"b","text":"The company founder","correct":false},{"key":"c","text":"The Head of Product","correct":false},{"key":"d","text":"The board of directors","correct":false}],"correct":["a"],"explanation":"Die oberste Priorität ist die Zufriedenheit der Endnutzer.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":2,"nr":57,"id":54856096,"type":"multiple-choice","question":"Why is it important that there is only one Product Owner per product?","answers":[{"key":"a","text":"It is clear who is accountable for the Product Backlog, the Developers always know who determines priorities, and it helps avoid barriers to effective communication and rapid decision-making.","correct":true},{"key":"b","text":"The Scrum Master knows who will be his back-up whenever he is unavailable, it saves the organization time and money, and the Developers know who to request tasks from.","correct":false},{"key":"c","text":"It isn't important as multiple Product Owners can easily share a single Product Backlog.","correct":false}],"correct":["a"],"explanation":"","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":2,"nr":58,"id":54856110,"type":"multiple-choice","question":"Duration (length) of the Sprint is decided by:","answers":[{"key":"a","text":"Scrum Team","correct":true},{"key":"b","text":"Product Owner","correct":false},{"key":"c","text":"Scrum Master","correct":false}],"correct":["a"],"explanation":"Der Scrum Guide gibt nur vor, dass ein Sprint höchstens einen Monat dauert. Innerhalb dieser Grenze legt das selbstmanagende Scrum Team die Sprint-Länge fest.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Erklärung","reason":"Erklärung zu knapp, um die Antwort zu begründen."}},{"test":2,"nr":59,"id":54856432,"type":"multiple-choice","question":"A Scrum Team chooses to have a Developer also play the role of Scrum Master. However, a Developer cannot play both roles (Developer + Scrum Master).","answers":[{"key":"a","text":"False","correct":true},{"key":"b","text":"True","correct":false}],"correct":["a"],"explanation":"Es gibt keine offizielle Regel, die besagt, dass ein:e Scrum Master:in nicht auch ein:e Entwickler:in sein kann.\nEs ist jedoch nicht die beste Praxis.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":2,"nr":60,"id":54856444,"type":"multi-select","question":"The Scrum Team consists of:","answers":[{"key":"a","text":"The Key Stakeholders","correct":false},{"key":"b","text":"The Developers","correct":true},{"key":"c","text":"The Product Owner","correct":true},{"key":"d","text":"The Scrum Master","correct":true}],"correct":["b","c","d"],"explanation":"","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":2,"nr":61,"id":54879548,"type":"multiple-choice","question":"The Sprint Review is a demo of the Product Backlog items completed during a Sprint. Do you agree?","answers":[{"key":"a","text":"Yes. There is not much difference.","correct":false},{"key":"b","text":"No, the Sprint Review contains many more activities.","correct":true},{"key":"c","text":"No, the demo also should include the Items completed in the previous Sprints that were not demonstrated for some reason.","correct":false}],"correct":["b"],"explanation":"Das Sprint Review ist ein Arbeitstermin, und das Scrum Team sollte vermeiden, es auf eine Präsentation zu beschränken.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Sprache","reason":"Grammatik."}},{"test":2,"nr":62,"id":54879660,"type":"multiple-choice","question":"When something about Scrum frustrates the Product Owner, he can delegate the accountability for a task to the Scrum Master.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Der:die Product Owner:in kann die Aufgabe delegieren, nicht aber die Verantwortung für diese.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":2,"nr":63,"id":54879766,"type":"multiple-choice","question":"By the end of the Sprint Planning, the Developers should be able to explain to the Product Owner and the Scrum Master how they intend to work to accomplish the Sprint Goal and create the Increment.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Das Sprint Backlog besteht aus dem Sprint‐Ziel (Wofür), den für den Sprint ausgewählten Product‐Backlog‐Einträgen (Was) sowie einem umsetzbaren Plan für die Lieferung des Increments (Wie).","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":2,"nr":64,"id":54879798,"type":"multiple-choice","question":"Although burn-down charts are optional, they can be a useful tool for tracking which measure?\n(choose the best answer)","answers":[{"key":"a","text":"How individual team members are performing.","correct":false},{"key":"b","text":"How much cost has been accumulated.","correct":false},{"key":"c","text":"How much work is remaining across time.","correct":true},{"key":"d","text":"How much business value has been delivered to the customer.","correct":false}],"correct":["c"],"explanation":"Das Burn-Down-Chart zeigt den Umfang der noch zu erledigenden Arbeit in Relation zu der für die Iteration vorgesehenen Zeit. Burn-Down-Charts sind ein effizientes Verfolgungsinstrument, da sie zeigen, wann die verbleibende Arbeit voraussichtlich abgeschlossen sein wird, wenn sich am Backlog oder am Scrum-Team nichts ändert.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Sprache","reason":"Satzzeichen."}},{"test":2,"nr":65,"id":54879814,"type":"multiple-choice","question":"Scrum Teams can identify improvements only during the Sprint Retrospective.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Obwohl Verbesserungen jederzeit umgesetzt werden können, bietet die Sprint-Retrospektive eine formelle Gelegenheit, sich auf die Überprüfung und Anpassung zu konzentrieren.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":2,"nr":66,"id":54879928,"type":"multiple-choice","question":"In which event are key stakeholders expected to participate actively?\n(choose the best answer)","answers":[{"key":"a","text":"The Daily Scrum","correct":false},{"key":"b","text":"The Sprint Planning","correct":false},{"key":"c","text":"The Sprint Retrospective","correct":false},{"key":"d","text":"The Sprint Review","correct":true}],"correct":["d"],"explanation":"Das Sprint Review ist das Event, bei dem die Stakeholder laut Scrum Guide regulär aktiv mitarbeiten: Das Scrum Team stellt die Ergebnisse seiner Arbeit den wichtigsten Stakeholder:innen vor, und gemeinsam wird festgelegt, was als Nächstes zu tun ist. Zum Sprint Planning kann das Scrum Team andere Personen zwar zur Beratung einladen – das ist aber kein fester Bestandteil.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Inhalt","reason":"Auch zum Sprint Planning können laut Scrum Guide andere Personen zur Beratung eingeladen werden – daher als „beste Antwort“ formuliert und erklärt."}},{"test":2,"nr":67,"id":54879944,"type":"multi-select","question":"What are the three pillars that uphold Scrum?","answers":[{"key":"a","text":"Agility","correct":false},{"key":"b","text":"Inspection","correct":true},{"key":"c","text":"Cross-functionality","correct":false},{"key":"d","text":"Adaptation","correct":true},{"key":"e","text":"Self-organization","correct":false},{"key":"f","text":"Transparency","correct":true}],"correct":["b","d","f"],"explanation":"Scrum kombiniert vier formale Events zur Überprüfung und Anpassung innerhalb eines umspannenden Events, des Sprints. Diese Events funktionieren, weil sie die empirischen Scrum‐Säulen Transparenz, Überprüfung und Anpassung implementieren.","section":"Scrum Guide (US 2020): Scrum Theory (Seite 3-4)","correction":null},{"test":2,"nr":68,"id":54879956,"type":"multiple-choice","question":"The structure of the Daily Scrum is well-defined and constant. Every Developer must answer the three main questions:\n• What did I do yesterday?\n• What will I do today?\n• Do I see any impediment?","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Es gibt keine vorgeschriebene Struktur für das Daily Scrum. Die Struktur des Daily Scrum wird von den Entwicklern:innen festgelegt.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":2,"nr":69,"id":54879978,"type":"multi-select","question":"What measures can help determine the success of the product?\n(choose the 3 best answers).","answers":[{"key":"a","text":"The product's impact on cost.","correct":true},{"key":"b","text":"The product's impact on customer satisfaction.","correct":true},{"key":"c","text":"How much of the planned scope is delivered by the end of the Sprint.","correct":false},{"key":"d","text":"The product's impact on revenue.","correct":true},{"key":"e","text":"The frequency of membership changes within the Scrum Team.","correct":false},{"key":"f","text":"The Scrum Team's velocity.","correct":false}],"correct":["a","b","d"],"explanation":"Als Product Owner:in muss man ein Gleichgewicht zwischen interner und externer Wertschöpfung finden. Interne Messgrößen können Kosteneinsparungen, Mitarbeiterzufriedenheit, Zeitaufwand für einen bestimmten (internen) Prozess, Einnahmen usw. sein. Externe Messgrößen können Kundenzufriedenheit, NPS usw. sein.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Sprache","reason":"Tippfehler."}},{"test":2,"nr":70,"id":54879990,"type":"multiple-choice","question":"It is a good practice to have from time to time a special technical Sprint that consists only of tasks removing the technical debt without implementing any new functionality.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Einen speziellen „Technik-Sprint“ sieht Scrum nicht vor. Jeder Sprint soll mindestens ein nützliches, wertvolles Increment liefern, das der Definition of Done entspricht. Technische Schulden werden stattdessen laufend als Teil der normalen Arbeit abgebaut.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Erklärung","reason":"„Es ist verboten“ steht so nicht im Scrum Guide, und die Begründung nutzte Begriffe aus dem Scrum Guide 2017."}},{"test":2,"nr":71,"id":54892774,"type":"multiple-choice","question":"The Developers are always accountable for:","answers":[{"key":"a","text":"Ensuring that all Scrum events take place and are positive, productive, and kept within the time box.","correct":false},{"key":"b","text":"Ordering Product Backlog items.","correct":false},{"key":"c","text":"Holding each other accountable as professionals.","correct":true},{"key":"d","text":"Ensuring that the Product Backlog is transparent, visible and understood.","correct":false}],"correct":["c"],"explanation":"Die spezifischen Fähigkeiten, die von den Developer:innen benötigt werden, sind oft breit gefächert und variieren je nach Arbeitskontext. Die Developer:innen sind jedoch immer ergebnisverantwortlich dafür,\n• einen Plan für den Sprint zu erstellen, das Sprint Backlog;\n• Qualität durch die Einhaltung einer Definition of Done einzubringen;\n• täglich ihren Plan zur Erreichung des Sprint‐Ziels anzupassen; und\n• sich wechselseitig als Expert:innen zur Verantwortung zu ziehen.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":2,"nr":72,"id":54892782,"type":"multiple-choice","question":"For a one-month Sprint, select the correct time boxes for each Scrum event.","answers":[{"key":"a","text":"Sprint Planning : 4 hours or less, Daily Scrum : 15 minutes or less, Sprint Review : 4 hours or less, Sprint Retrospective : 4 hours or less.","correct":false},{"key":"b","text":"Sprint Planning : 8 hours or less, Daily Scrum : 15 minutes or less, Sprint Review : 4 hours or less, Sprint Retrospective : 3 hours or less.","correct":true},{"key":"c","text":"Sprint Planning : 4 hours or less, Daily Scrum : 15 minutes or less, Sprint Review : 8 hours or less, Sprint Retrospective : 4 hours or less.","correct":false},{"key":"d","text":"Sprint Planning : 8 hours or less, Daily Scrum : 30 minutes or less, Sprint Review : 4 hours or less, Sprint Retrospective : 3 hours or less.","correct":false}],"correct":["b"],"explanation":"Diese Zeiten sind genau so im Scrum Guide zu finden (siehe \"Scrum Events\").","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":2,"nr":73,"id":54892796,"type":"multiple-choice","question":"The Developers cannot deliver the Increment because they don't understand a functional requirement. What should they do?","answers":[{"key":"a","text":"Ask a specialist to solve the problem within the remaining duration of the Sprint.","correct":false},{"key":"b","text":"Partially complete the work.","correct":false},{"key":"c","text":"Collaborate with the Product Owner to solve the problem.","correct":true},{"key":"d","text":"Move the work to a future Sprint.","correct":false}],"correct":["c"],"explanation":"Der:die Product Owner:in hat die Aufgabe, die Product Backlog Items verständlich zu machen.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":2,"nr":74,"id":54892810,"type":"multiple-choice","question":"The Scrum Master is the sole creator of the definition of \"Done.\"","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Wenn die Definition of Done für ein Increment Teil der Standards der Organisation ist, müssen sich alle Scrum Teams mindestens daran halten. Wenn es sich nicht um einen Organisationsstandard handelt, muss das ganze Scrum Team zusammenarbeiten um eine für das Produkt geeignete Definition of Done zu erstellen.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":2,"nr":75,"id":54892820,"type":"multi-select","question":"Which two of the following are correct about the Product Owner accountability?","answers":[{"key":"a","text":"Participates in the Daily Scrum meeting.","correct":false},{"key":"b","text":"Is the only person who can add items to the Product Backlog.","correct":false},{"key":"c","text":"Is accountable for all changes to the Product Backlog.","correct":true},{"key":"d","text":"Can make changes to the Sprint Backlog.","correct":false},{"key":"e","text":"Explains the Product Backlog it
