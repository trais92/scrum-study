key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Das Sprint Backlog ist ein Plan von und für die Developer:innen.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":4,"nr":37,"id":54740808,"type":"multiple-choice","question":"What does a burn-down chart show?","answers":[{"key":"a","text":"Work remaining in the Sprint.","correct":true},{"key":"b","text":"Budget \"burned\".","correct":false},{"key":"c","text":"Burn out level of the team members.","correct":false}],"correct":["a"],"explanation":"Ein Burn-down Chart ist eine grafische Darstellung, welche die verbleibende Arbeit in Relation zur verbleibenden Zeit anzeigt.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Sprache","reason":"Fehlender Artikel."}},{"test":4,"nr":38,"id":54740820,"type":"multiple-choice","question":"An increment can only be delivered to stakeholders at the Sprint Review.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Ein Increment kann auch schon vor Ende des Sprints an die Stakeholder:innen geliefert werden. Das Sprint Review sollte niemals als Barriere zur Lieferung von Wert angesehen werden.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":4,"nr":39,"id":54740904,"type":"multi-select","question":"Which of the following are NOT Scrum Artifacts? Select all applicable answers.","answers":[{"key":"a","text":"The list of Impediments","correct":true},{"key":"b","text":"Increment","correct":false},{"key":"c","text":"Sprint Backlog","correct":false},{"key":"d","text":"Product Backlog","correct":false}],"correct":["a"],"explanation":"Die drei Scrum-Artefakte sind Product Backlog, Sprint Backlog und Increment. Eine Liste der Hindernisse (Impediments) ist kein Scrum-Artefakt.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Erklärung","reason":"Erklärung fehlte bei dieser Mehrfachauswahl mit nur einer richtigen Antwort."}},{"test":4,"nr":40,"id":54740918,"type":"multiple-choice","question":"The purpose of a Sprint is to produce a potentially releasable product Increment.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Sprints sind der Herzschlag von Scrum, in dem Ideen in Wert umgewandelt werden. Laut Scrum Guide ist das gesamte Scrum Team dafür verantwortlich, in jedem Sprint ein wertvolles, nützliches Increment zu erstellen.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Erklärung","reason":"Gleiche Frage wie 3.59 – gleiche Erklärung ergänzt."}},{"test":4,"nr":41,"id":54741516,"type":"multiple-choice","question":"A Developer is asked by an important stakeholder to help with some external tasks. The Developer refers the stakeholder to the Product Owner. In this case, the Scrum Master should:","answers":[{"key":"a","text":"Do nothing: the Developer acted correctly.","correct":true},{"key":"b","text":"Prohibit the developer from supporting.","correct":false},{"key":"c","text":"Help the stakeholder with the task.","correct":false}],"correct":["a"],"explanation":"Der:die Entwickler:in hat richtig gehandelt: Neue Anforderungen gehören ins Product Backlog, und dafür ist der:die Product Owner:in verantwortlich. Der:die Scrum Master:in muss hier nicht eingreifen.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Sprache","reason":"Grammatik und unklare Erklärung."}},{"test":4,"nr":42,"id":54741574,"type":"multiple-choice","question":"According to which criterion should the product backlog be ordered?","answers":[{"key":"a","text":"Product value","correct":true},{"key":"b","text":"Alphabetical","correct":false},{"key":"c","text":"Size","correct":false},{"key":"d","text":"Development costs","correct":false}],"correct":["a"],"explanation":"Das Product Backlog sollte so geordnet sein, dass es den Wert des Produktes maximiert.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":4,"nr":43,"id":54741730,"type":"multiple-choice","question":"Is it good practice to maintain separate Product Backlogs for multiple Scrum Teams that work on one product?","answers":[{"key":"a","text":"Yes","correct":false},{"key":"b","text":"No","correct":true}],"correct":["b"],"explanation":"1 Produkt = 1 Product Owner = 1 Product Backlog","section":"Online Nexus Guide (US 2021): Accountabilities in Nexus","correction":{"kind":"Sprache","reason":"Satzbau passte nicht zum Fragezeichen."}},{"test":4,"nr":44,"id":54742096,"type":"multiple-choice","question":"Which of the following is a way to reduce technical debt?","answers":[{"key":"a","text":"Improving the Definition of Done.","correct":true},{"key":"b","text":"Improving the Definition of Ready.","correct":false},{"key":"c","text":"Hiring a QA.","correct":false}],"correct":["a"],"explanation":"Die Definition of Done schafft Transparenz, indem sie allen ein gemeinsames Verständnis darüber vermittelt, welche Arbeiten als Teil des Increments abgeschlossen wurden. Es gibt keine Definition of Ready in Scrum.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":4,"nr":45,"id":54742100,"type":"multiple-choice","question":"It is a good practice to have at least two Product Owners on big projects.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"1 Product = 1 Product Owner","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":4,"nr":46,"id":54742108,"type":"multiple-choice","question":"Who decides what is most important to work on next?\n(choose the best answer)","answers":[{"key":"a","text":"The Product Owner","correct":true},{"key":"b","text":"The CEO","correct":false},{"key":"c","text":"The Scrum Master","correct":false}],"correct":["a"],"explanation":"Der:die Product Owner:in ordnet das Product Backlog und bestimmt damit, was als Nächstes am wichtigsten ist. Welche Einträge konkret in den Sprint kommen, wählen die Entwickler:innen im Sprint Planning im Gespräch mit dem:der Product Owner:in aus.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Inhalt","reason":"Im Sprint Planning wählen die Entwickler:innen die Einträge im Gespräch mit dem:der Product Owner:in aus – daher als „beste Antwort“ formuliert und erklärt."}},{"test":4,"nr":47,"id":54742116,"type":"multiple-choice","question":"If the Sprint Goal becomes obsolete, the Sprint could be cancelled.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Ein Sprint könnte abgebrochen werden, wenn das Sprint‐Ziel obsolet wird. Nur der:die Product Owner:in hat die Befugnis, den Sprint abzubrechen.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":4,"nr":48,"id":54742150,"type":"multi-select","question":"Technical debt:\n(choose the best three answers).","answers":[{"key":"a","text":"is a lack of technical supplies.","correct":false},{"key":"b","text":"compromises long-term quality of the Product.","correct":true},{"key":"c","text":"belongs entirely to the Developers. No one else needs to know about it.","correct":false},{"key":"d","text":"is a real risk which can genuinely be incurred.","correct":true},{"key":"e","text":"reflects some extra development work.","correct":true}],"correct":["b","d","e"],"explanation":"Technische Schuld ist ein Konzept in der Programmierung, das die zusätzliche Entwicklungsarbeit widerspiegelt, die entsteht, wenn Code zum Einsatz kommt, der kurzfristig zwar einfach zu implementieren ist, aber nicht die wirklich beste Lösung darstellt.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":4,"nr":49,"id":54742186,"type":"multiple-choice","question":"When technical debt occurs, the system will become more unstable as development progresses and code is added resulting in future work being slowed down.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Technische Schuld ist ein Konzept in der Programmierung, das die zusätzliche Entwicklungsarbeit widerspiegelt, die entsteht, wenn Code zum Einsatz kommt, der kurzfristig zwar einfach zu implementieren ist, aber nicht die wirklich beste Lösung darstellt.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":4,"nr":50,"id":54742198,"type":"multiple-choice","question":"If several Scrum Teams are working on the same product, each Scrum Team should operate with their own separate Product Backlog.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"1 Product = 1 Product Backlog","section":"Online Nexus Guide (US 2021): Nexus Artifacts and Commitment","correction":{"kind":"Sprache","reason":"Aussage endete mit Fragezeichen."}},{"test":4,"nr":51,"id":54860566,"type":"multiple-choice","question":"In addition to product requirements, Scrum Teams also impose some technical conditions that the product must meet. These conditions must be added to the:","answers":[{"key":"a","text":"Product Backlog","correct":false},{"key":"b","text":"Definition of Done","correct":true},{"key":"c","text":"Sprint Backlog","correct":false}],"correct":["b"],"explanation":"Die Definition of Done ist eine formale Beschreibung des Zustands des Increments, wenn es die für das Produkt erforderlichen Qualitätsmaßnahmen erfüllt.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":4,"nr":52,"id":54860570,"type":"multiple-choice","question":"Only the Scrum Master is allowed to change the Sprint Backlog during the Sprint.","answers":[{"key":"a","text":"False","correct":true},{"key":"b","text":"True","correct":false}],"correct":["a"],"explanation":"Das Sprint Backlog besteht aus dem Sprint‐Ziel (Wofür), den für den Sprint ausgewählten Product‐Backlog‐Einträgen (Was) sowie einem umsetzbaren Plan für die Lieferung des Increments (Wie). Das Sprint Backlog ist ein Plan von und für die Developer:innen.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":4,"nr":53,"id":54860578,"type":"multiple-choice","question":"What should Developers do if they realize they have selected too much work after starting the Sprint?","answers":[{"key":"a","text":"Add additional team members to handle the extra work.","correct":false},{"key":"b","text":"Modify the definition of \"Done\" to ensure all Product Backlog items can be done by the end of the Sprint.","correct":false},{"key":"c","text":"Work with the Product Owner to remove some work or Product Backlog items as soon as possible.","correct":true},{"key":"d","text":"Continue working and update the Product Owner at the Sprint Review.","correct":false}],"correct":["c"],"explanation":"Das Sprint Backlog ist ein lebendiges Artefakt, das sich weiterentwickelt und verändert, wenn mehr gelernt oder herausgefunden wird.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":4,"nr":54,"id":54860582,"type":"multiple-choice","question":"If an item in the Sprint Backlog cannot be finished by the end of the Sprint (it turns out there is more work than estimated), the Sprint is cancelled.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Ein Sprint könnte abgebrochen werden, wenn das Sprint‐Ziel obsolet wird. Nur der:die Product Owner:in hat die Befugnis, den Sprint abzubrechen.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":4,"nr":55,"id":54860590,"type":"multiple-choice","question":"How frequently should the Product Owner communicate and reiterate the product vision to the Scrum Team and the key stakeholders?","answers":[{"key":"a","text":"Every Daily Scrum","correct":false},{"key":"b","text":"Every Sprint Retrospective","correct":false},{"key":"c","text":"Once at the first Sprint Planning","correct":false},{"key":"d","text":"Early and often","correct":true}],"correct":["d"],"explanation":"Dies ist nicht klar im Scrum Guide definiert.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Sprache","reason":"Wortstellung."}},{"test":4,"nr":56,"id":54860666,"type":"multiple-choice","question":"When does a new Sprint begin?","answers":[{"key":"a","text":"Immediately after the next Sprint Planning.","correct":false},{"key":"b","text":"Immediately after the end of the previous Sprint.","correct":true},{"key":"c","text":"It depends on the Product Owner.","correct":false},{"key":"d","text":"Every Monday.","correct":false}],"correct":["b"],"explanation":"Ein neuer Sprint beginnt unmittelbar nach dem Abschluss des vorherigen Sprints.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":4,"nr":57,"id":54860678,"type":"multiple-choice","question":"A Scrum Team crafts the following Sprint Goal: \"All the Sprint code should have passed 100% automated unit tests\".","answers":[{"key":"a","text":"It is a well-formed Sprint Goal.","correct":false},{"key":"b","text":"It is incorrect, since the Product Owner formulates the goal and not the Scrum Team.","correct":false},{"key":"c","text":"It is not an appropriate goal, since the Sprint Goal should be about the expected business value.","correct":true}],"correct":["c"],"explanation":"Das Sprint-Ziel beschreibt, warum der Sprint für die Stakeholder wertvoll ist. „100 % automatisierte Unit-Tests“ ist ein Qualitätskriterium – das gehört in die Definition of Done, nicht ins Sprint-Ziel. Das Sprint-Ziel erstellt übrigens das gesamte Scrum Team, nicht nur der:die Product Owner:in.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Sprache","reason":"Grammatik; Erklärung fehlte."}},{"test":4,"nr":58,"id":54860688,"type":"multiple-choice","question":"A Product Owner cannot send a representative to replace them at the Sprint Review.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Der:die Product Owner:in kann Aufgaben delegieren, nicht aber die Teilnahme an Scrum Events.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Sprache","reason":"Grammatik."}},{"test":4,"nr":59,"id":54860698,"type":"multiple-choice","question":"What should Developers do if they don't understand a functional requirement?","answers":[{"key":"a","text":"Move the item to a future Sprint.","correct":false},{"key":"b","text":"Complete as much as possible and add the remaining work as a new Product Backlog item.","correct":false},{"key":"c","text":"Work with the Product Owner to determine what is possible and acceptable.","correct":true},{"key":"d","text":"Request a specialist to be added to the Scrum Team.","correct":false}],"correct":["c"],"explanation":"Der:die Product Owner:in ist auch für ein effektives Product‐Backlog‐Management ergebnisverantwortlich, das Folgendes umfasst:\n• das Produkt‐Ziel zu entwickeln und explizit zu kommunizieren;\n• die Product‐Backlog‐Einträge zu erstellen und klar zu kommunizieren;\n• die Reihenfolge der Product‐Backlog‐Einträge festzulegen; und\n• sicherzustellen, dass das Product Backlog transparent, sichtbar und verstanden ist.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":4,"nr":60,"id":54860706,"type":"multiple-choice","question":"Could the Product Owner and the Scrum Master also be Developers of the Scrum Team?","answers":[{"key":"a","text":"Yes","correct":true},{"key":"b","text":"No","correct":false}],"correct":["a"],"explanation":"Dies ist im Scrum Guide nicht klar definiert (nicht verboten).","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":4,"nr":61,"id":54880380,"type":"multi-select","question":"Select all that apply. The full Scrum Team participates in:","answers":[{"key":"a","text":"Sprint Planning","correct":true},{"key":"b","text":"Sprint Retrospective","correct":true},{"key":"c","text":"Daily Scrum","correct":false},{"key":"d","text":"Sprint Review","correct":true}],"correct":["a","b","d"],"explanation":"Das Daily Scrum ist ein 15‐minütiges Event (nur) für die Developer:innen des Scrum Teams.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":4,"nr":62,"id":54880392,"type":"multiple-choice","question":"If 5 Scrum Teams work on the same product, how many Product Owners are needed?","answers":[{"key":"a","text":"One Product Owner.","correct":true},{"key":"b","text":"As decided by the self-organized Scrum Team.","correct":false},{"key":"c","text":"As decided by the management.","correct":false}],"correct":["a"],"explanation":"1 Product = 1 Product Backlog = 1 Product Owner:in","section":"Online Nexus Guide (US 2021): Accountabilities in Nexus","correction":null},{"test":4,"nr":63,"id":54880530,"type":"multiple-choice","question":"Who can change the Sprint Backlog in the middle of the Sprint?","answers":[{"key":"a","text":"Only the Product Owner","correct":false},{"key":"b","text":"Only the Developers","correct":true},{"key":"c","text":"The Scrum Team","correct":false},{"key":"d","text":"Only the Scrum Master","correct":false}],"correct":["b"],"explanation":"Die Developer:innen sind für das Sprint Backlog verantwortlich.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Sprache","reason":"Unpassende Zeitform."}},{"test":4,"nr":64,"id":54880654,"type":"multiple-choice","question":"Who is responsible for estimating the Product Backlog items?","answers":[{"key":"a","text":"The Scrum Master.","correct":false},{"key":"b","text":"The Developers after clarifying the requirements with the Product Owner.","correct":true},{"key":"c","text":"The Technical Architect.","correct":false},{"key":"d","text":"The Product Owner.","correct":false}],"correct":["b"],"explanation":"Die Developer:innen sind für Aufwandsschätzungen verantwortlich.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":4,"nr":65,"id":54880804,"type":"multiple-choice","question":"What is the order of items in the Product Backlog?","answers":[{"key":"a","text":"Less valuable and most unclear items at the bottom.","correct":true},{"key":"b","text":"The recently added items at the top.","correct":false},{"key":"c","text":"The less clear items at the top.","correct":false},{"key":"d","text":"Alphabetical.","correct":false}],"correct":["a"],"explanation":"Das Product Backlog ist eine emergente, geordnete Liste der Dinge, die zur Produktverbesserung benötigt werden. Es ist die einzige Quelle von Arbeit, die durch das Scrum Team erledigt wird. Product‐Backlog‐Einträge, die durch das Scrum Team innerhalb eines Sprints abgeschlossen (Done) werden können, gelten als bereit für die Auswahl in einem Sprint‐Planning‐Event.\nDiesen Transparenzgrad erlangen sie in der Regel durch Refinement‐Aktivitäten. Das Refinement des Product Backlogs ist der Vorgang, durch den Product‐Backlog‐Einträge in kleinere, präzisere Elemente zerlegt und weiter definiert werden.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":4,"nr":66,"id":54880842,"type":"multiple-choice","question":"The Definition of Done is created during the first Sprint and remains unchanged until the Product release.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Während jeder Sprint-Retrospektive plant das Scrum-Team Möglichkeiten zur Verbesserung der Produktqualität, indem es die Definition of Done entsprechend anpasst.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":4,"nr":67,"id":54880854,"type":"multiple-choice","question":"Who defines the Definition of Done?","answers":[{"key":"a","text":"Developers","correct":false},{"key":"b","text":"Product Owner","correct":false},{"key":"c","text":"Technical / Domain Experts","correct":false},{"key":"d","text":"Scrum Team","correct":true}],"correct":["d"],"explanation":"Wenn die Definition of Done für ein Increment Teil der Standards der Organisation ist, müssen alle Scrum Teams diese als Mindestmaß befolgen. Wenn sie kein Organisationsstandard ist, muss das Scrum Team eine für das Produkt geeignete Definition of Done erstellen.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":4,"nr":68,"id":54880880,"type":"multiple-choice","question":"Who is accountable for the Product Backlog?","answers":[{"key":"a","text":"The Developers","correct":false},{"key":"b","text":"The Scrum Master","correct":false},{"key":"c","text":"The Product Owner","correct":true},{"key":"d","text":"The Product Owner and The Scrum Master","correct":false},{"key":"e","text":"The Product Owner and The Developers","correct":false}],"correct":["c"],"explanation":"Der:die Product Owner:in ist für das Product Backlog verantwortlich. Er:sie kann einzelne Aufgaben delegieren, bleibt aber verantwortlich für das Ergebnis.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":4,"nr":69,"id":54881214,"type":"multiple-choice","question":"What technique should be used for creating Product Backlog Items?","answers":[{"key":"a","text":"Any technique that leads to success, even a mix of several techniques.","correct":true},{"key":"b","text":"Use Cases","correct":false},{"key":"c","text":"Scenarios","correct":false},{"key":"d","text":"User Stories","correct":false}],"correct":["a"],"explanation":"Im Scrum Guide ist dies nicht definiert bzw. festgelegt.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":4,"nr":70,"id":54881228,"type":"multiple-choice","question":"The Product Owner is responsible for all estimates in the Product Backlog.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Die Entwickler:innen sind für Aufwandsschätzungen verantwortlich.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":4,"nr":71,"id":54894398,"type":"multiple-choice","question":"All work to be done by the Developers must ultimately originate from the Product Backlog.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Das Product Backlog ist eine emergente, geordnete Liste der Dinge, die zur Produktverbesserung benötigt werden. Es ist die einzige Quelle von Arbeit, die durch das Scrum Team erledigt wird.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Sprache","reason":"Aussage endete mit Fragezeichen."}},{"test":4,"nr":72,"id":54894412,"type":"multiple-choice","question":"The Product Owner manages…","answers":[{"key":"a","text":"The Product Backlog","correct":true},{"key":"b","text":"The Developers","correct":false},{"key":"c","text":"The Scrum Team","correct":false},{"key":"d","text":"The Project","correct":false}],"correct":["a"],"explanation":"Der:die Product Owner:in ist für das Product Backlog Management verantwortlich.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":4,"nr":73,"id":54894424,"type":"multiple-choice","question":"Why should a Scrum Team member be cross-functional?","answers":[{"key":"a","text":"Cross-functional people are cheaper to employ than dedicated specialists.","correct":false},{"key":"b","text":"They should not be cross-functional; the scrum team should be made up of specialists only.","correct":false},{"key":"c","text":"The Scrum Team collectively should have all the skills needed to complete an increment; this can include cross-functional team members and sometimes specialists.","correct":true},{"key":"d","text":"Cross-functional people have the ability to understand what other people in specialized areas are saying; therefore cross-functional people should be placed on a scrum team so that they can work with others outside of the team towards the sprint goal.","correct":false}],"correct":["c"],"explanation":"Scrum Teams sind interdisziplinär, d.h. die Mitglieder verfügen über alle Fähigkeiten, die erforderlich sind, um in jedem Sprint Wert zu schaffen. Sie managen sich außerdem selbst, d.h. sie entscheiden intern, wer was wann und wie macht.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":4,"nr":74,"id":54894570,"type":"multiple-choice","question":"Conflict should be avoided at all cost on Agile teams.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Konflikte gehören zur Zusammenarbeit dazu. Konstruktiv ausgetragen, führen sie zu besseren Lösungen – dafür braucht es die Scrum-Werte Offenheit, Respekt und Mut.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Erklärung","reason":"Erklärung zu knapp."}},{"test":4,"nr":75,"id":54894588,"type":"multi-select","question":"Why should a Product Owner care about the Developers adhering to the Definition of Done? (choose the best two options)","answers":[{"key":"a","text":"To control the Total Cost of Ownership of the product.","correct":true},{"key":"b","text":"To have complete transparency into what has been done at the end of each Sprint.","correct":true},{"key":"c","text":"He doesn’t have to care. Other systems aren’t very good either.","correct":false},{"key":"d","text":"To be able to reprimand the team when they don’t meet their velocity goal for the Sprint.","correct":false},{"key":"e","text":"To predict the team’s productivity over time.","correct":false}],"correct":["a","b"],"explanation":"Die Definition of Done schafft Transparenz, indem sie allen ein gemeinsames Verständnis darüber vermittelt, welche Arbeiten als Teil des Increments abgeschlossen wurden. Wenn ein Product Backlog Item nicht der Definition of Done entspricht, kann es weder released noch beim Sprint Review präsentiert werden. Stattdessen wandert es zur zukünftigen Berücksichtigung in das Product Backlog zurück. Ohne eingehaltene Definition of Done entstehen außerdem technische Schulden, die die Gesamtkosten (Total Cost of Ownership) erhöhen.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Sprache","reason":"Grammatik."}},{"test":4,"nr":76,"id":54894600,"type":"multiple-choice","question":"The Sprint Review is the only time when stakeholder feedback is captured.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Das Sprint Review ist wahrscheinlich die wichtigste Gelegenheit, um Feedback einzuholen. Der:die Product Owner:in steht in ständigem Kontakt mit den Stakeholdern, um neue Product Backlog Items zu identifizieren oder sie zu verfeinern.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":4,"nr":77,"id":54894606,"type":"multiple-choice","question":"Ordering the Product Backlog items can be part of the Product Backlog refinement.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Das Refinement des Product Backlogs ist der Vorgang, durch den Product‐Backlog‐Einträge in kleinere, präzisere Elemente zerlegt und weiter definiert werden. Dies ist eine kontinuierliche Aktivität, wodurch weitere Details wie Beschreibung, Reihenfolge und Größe ergänzt werden.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":4,"nr":78,"id":54894616,"type":"multiple-choice","question":"During a Sprint, scope may be clarified and re-negotiated between the Scrum Master and the Developers as more is learned.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Das ist die Aufgabe des:der Product Owner:in (nicht des:der Scrum Master:in).","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":4,"nr":79,"id":54894628,"type":"multiple-choice","question":"Which of the following is required by Scrum?","answers":[{"key":"a","text":"Release planning","correct":false},{"key":"b","text":"Test-Driven Development","correct":false},{"key":"c","text":"Having time boxed events","correct":true},{"key":"d","text":"Story Points","correct":false}],"correct":["c"],"explanation":"Scrum schreibt nur sein Rahmenwerk vor – dazu gehören die zeitlich begrenzten (timeboxed) Events. Release-Planung, Test-Driven Development und Story Points sind mögliche Praktiken, aber keine Pflicht.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Erklärung","reason":"Erklärung ging nur auf eine falsche Antwort ein."}},{"test":4,"nr":80,"id":54894638,"type":"multiple-choice","question":"The Product Owner can delegate some of his/her responsibilities to the Developers.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Scrum erlaubt, dass der:die Product Owner:in Aufgaben delegiert.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":5,"nr":1,"id":54427540,"type":"multiple-choice","question":"What is the commitment for the Increment?","answers":[{"key":"a","text":"The Product Goal","correct":false},{"key":"b","text":"The Sprint Goal","correct":false},{"key":"c","text":"The Definition of Done","correct":true},{"key":"d","text":"The Definition of Ready","correct":false},{"key":"e","text":"None of the answers is correct.","correct":false}],"correct":["c"],"explanation":"Jedes Scrum Artefakt beinhaltet ein Commitment:\n• Für das Product Backlog ist es das Produkt‐Ziel.\n• Für das Sprint Backlog ist es das Sprint‐Ziel.\n• Für das Increment ist es die Definition of Done.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":5,"nr":2,"id":54429940,"type":"multiple-choice","question":"What is the commitment for the Product Backlog?","answers":[{"key":"a","text":"The Product Goal","correct":true},{"key":"b","text":"The Sprint Goal","correct":false},{"key":"c","text":"The Definition of Done","correct":false},{"key":"d","text":"The Definition of Ready","correct":false}],"correct":["a"],"explanation":"Jedes Scrum Artefakt beinhaltet ein Commitment:\n• Für das Product Backlog ist es das Produkt‐Ziel.\n• Für das Sprint Backlog ist es das Sprint‐Ziel.\n• Für das Increment ist es die Definition of Done.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":5,"nr":3,"id":54431430,"type":"multiple-choice","question":"What is the commitment for the Sprint Backlog?","answers":[{"key":"a","text":"Sprint Goal","correct":true},{"key":"b","text":"Definition of Done","correct":false},{"key":"c","text":"Product Goal","correct":false}],"correct":["a"],"explanation":"Jedes Scrum Artefakt beinhaltet ein Commitment:\n• Für das Product Backlog ist es das Produkt‐Ziel.\n• Für das Sprint Backlog ist es das Sprint‐Ziel.\n• Für das Increment ist es die Definition of Done.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":5,"nr":4,"id":54435472,"type":"multiple-choice","question":"What do the commitments in each Scrum artifact reinforce?","answers":[{"key":"a","text":"Empiricism and the Scrum values.","correct":true},{"key":"b","text":"Lean thinking and the agile values.","correct":false},{"key":"c","text":"Lean thinking and the Scrum values.","correct":false}],"correct":["a"],"explanation":"Laut Scrum Guide dienen die Commitments dazu, Empirie und die Scrum‐Werte für das Scrum Team und seine Stakeholder:innen zu verstärken.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":5,"nr":5,"id":54435602,"type":"multiple-choice","question":"Who benefits from the commitments in each Scrum Artifact?","answers":[{"key":"a","text":"The Scrum Team only","correct":false},{"key":"b","text":"The stakeholders only","correct":false},{"key":"c","text":"The Scrum Team and stakeholders","correct":true}],"correct":["c"],"explanation":"Laut Scrum Guide dienen die Commitments dazu, Empirie und die Scrum‐Werte für das Scrum Team aber auch für seine Stakeholder:innen zu verstärken.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":5,"nr":6,"id":54435610,"type":"multiple-choice","question":"Scrum’s artifacts represent work or value.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Die Artefakte von Scrum repräsentieren Arbeit oder Wert. Sie sind dafür ausgelegt, die Transparenz von Schlüsselinformationen zu maximieren.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":5,"nr":7,"id":54436414,"type":"multiple-choice","question":"What is true about the Product Goal?","answers":[{"key":"a","text":"It is the long-term objective for the Scrum Team.","correct":true},{"key":"b","text":"It is the short-term objective for the Scrum Team.","correct":false},{"key":"c","text":"It is the objective for the Sprint.","correct":false},{"key":"d","text":"It is the objective for the next two Sprints.","correct":false},{"key":"e","text":"There can be multiple Product Goals at the same time.","correct":false}],"correct":["a"],"explanation":"Das Produkt‐Ziel ist das langfristige Ziel für das Scrum Team. Das Scrum Team muss ein Ziel erfüllen (oder aufgeben), bevor es das nächste angeht.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":5,"nr":8,"id":54436676,"type":"multiple-choice","question":"The Sprint Goal is created during the Sprint Planning event.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Das Sprint‐Ziel wird während des Sprint‐Planning‐Events erstellt und dann zum Sprint Backlog hinzugefügt.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":5,"nr":9,"id":54436726,"type":"multiple-choice","question":"When is a new Increment born?","answers":[{"key":"a","text":"When a Product Backlog item meets the Definition of Done.","correct":true},{"key":"b","text":"When the Developers decide that it is done.","correct":false},{"key":"c","text":"When the Product Owner decides that it is done.","correct":false},{"key":"d","text":"When the automated tests are running without errors.","correct":false}],"correct":["a"],"explanation":"In dem Moment, in dem ein Product‐Backlog‐Item die Definition of Done erfüllt, ist ein neues Increment geboren.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":5,"nr":10,"id":54436750,"type":"multiple-choice","question":"If multiple Scrum Teams work on a product, they must mutually define and comply with the same Definition of Done.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Wenn mehrere Scrum Teams an einem Produkt zusammenarbeiten, müssen sie eine gemeinsame Definition of Done definieren und sich alle daran halten.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Sprache","reason":"Ja/Nein-Frage mit Wahr/Falsch-Antworten – als Aussage umformuliert."}},{"test":5,"nr":11,"id":54436762,"type":"multiple-choice","question":"If the Definition of Done is part of the standards of the organization, all Scrum Teams must follow it as a minimum.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Wenn eine Definition of Done Teil der Standards der Organisation ist, müssen alle Scrum Teams diese als Mindestmaß befolgen. Wenn sie kein Organisationsstandard ist, muss das Scrum Team eine für das Produkt geeignete Definition of Done erstellen.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Sprache","reason":"Ja/Nein-Frage mit Wahr/Falsch-Antworten – als Aussage umformuliert."}},{"test":5,"nr":12,"id":54453134,"type":"multi-select","question":"Which of the Scrum events are formal opportunities to inspect and adapt Scrum artifacts?","answers":[{"key":"a","text":"Daily Scrum","correct":true},{"key":"b","text":"Sprint Planning","correct":true},{"key":"c","text":"Sprint Review","correct":true},{"key":"d","text":"Sprint Retrospective","correct":true}],"correct":["a","b","c","d"],"explanation":"Jedes Ereignis in Scrum ist eine formale Gelegenheit, Scrum Artefakte zu überprüfen und anzupassen.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Sprache","reason":"Grammatik."}},{"test":5,"nr":13,"id":54453144,"type":"multiple-choice","question":"There are no Sprint Reviews in Scaled Scrum.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Auch bei skaliertem Scrum (z. B. Nexus) gelten alle Scrum-Regeln. Im Nexus Framework ersetzt das Nexus Sprint Review die einzelnen Sprint Reviews der Teams – ein Review des gesamten integrierten Increments findet also auf jeden Fall statt.","section":"Online Nexus Guide (US 2021): Nexus Events","correction":{"kind":"Erklärung","reason":"Erklärung sprach vom Daily Scrum, gefragt war nach dem Sprint Review."}},{"test":5,"nr":14,"id":54453160,"type":"multi-select","question":"Daily Scrums are valuable for the Developers to:","answers":[{"key":"a","text":"Improve communications.","correct":true},{"key":"b","text":"Identify impediments.","correct":true},{"key":"c","text":"Promote quick decision-making.","correct":true},{"key":"d","text":"Eliminate the need for other meetings.","correct":true},{"key":"e","text":"None of the answers is correct.","correct":false}],"correct":["a","b","c","d"],"explanation":"Daily Scrums verbessern die Kommunikation, identifizieren Hindernisse, fördern die schnelle Entscheidungsfindung und eliminieren konsequent die Notwendigkeit für andere Meetings.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Sprache","reason":"Grammatik."}},{"test":5,"nr":15,"id":54453176,"type":"multiple-choice","question":"Why is the Daily Scrum held at the same time and same place every day?","answers":[{"key":"a","text":"It reduces complexity.","correct":true},{"key":"b","text":"It saves costs.","correct":false},{"key":"c","text":"It creates additional value.","correct":false}],"correct":["a"],"explanation":"Das Daily Scrum ist ein 15‐minütiges Event für die Developer:innen des Scrum Teams. Um die Komplexität zu reduzieren, wird es an jedem Arbeitstag des Sprints zur gleichen Zeit und am gleichen Ort abgehalten.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Sprache","reason":"Tippfehler („safes“)."}},{"test":5,"nr":16,"id":54453192,"type":"multiple-choice","question":"Who is responsible for tracking the remaining work in the Sprint?","answers":[{"key":"a","text":"Developers","correct":true},{"key":"b","text":"Scrum Master","correct":false},{"key":"c","text":"Project Manager","correct":false}],"correct":["a"],"explanation":"Die Entwickler:innen überprüfen täglich, wie weit sie im Hinblick auf das Sprint-Ziel vorangekommen sind.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":5,"nr":17,"id":54453216,"type":"multiple-choice","question":"How should Product Backlog Items be selected when multiple Scrum Teams work from the same Product Backlog?","answers":[{"key":"a","text":"The Developers of each team select Product Backlog items for their Sprint Backlog in agreement with the Product Owner.","correct":true},{"key":"b","text":"They propose which Product Backlog Items they would like to select and the Scrum Masters of the teams will decide who will do what in the Scrum of Scrums.","correct":false},{"key":"c","text":"The Product Owners decide which team does what.","correct":false}],"correct":["a"],"explanation":"In Scaled Scrum gibt es immer nur einen:e Product Owner:in (bei 1 Produkt = 1 Product Backlog = 1 Product Owner:in). Die Scrum Master:innen sind nicht in den Prozess eingebunden.","section":"Online Nexus Guide (US 2021): Nexus Artifacts and Commitment","correction":{"kind":"Sprache","reason":"Grammatik und veralteter Begriff."}},{"test":5,"nr":18,"id":54453230,"type":"multiple-choice","question":"When do single Developers take individual accountability for a Sprint Backlog Item?","answers":[{"key":"a","text":"Never. All Sprint Backlog items are \"owned\" by the Developers as a whole.","correct":true},{"key":"b","text":"After the Daily Scrum.","correct":false},{"key":"c","text":"After the Sprint Planning.","correct":false}],"correct":["a"],"explanation":"Die einzelnen Entwickler:innen übernehmen natürlich einzelne Aufgaben, aber die Gesamtheit der Entwickler:innen ist immer für die Sprint Backlog Items verantwortlich.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Sprache","reason":"Grammatik."}},{"test":5,"nr":19,"id":54453244,"type":"multiple-choice","question":"Which of the following statements is true about the Product Owner?","answers":[{"key":"a","text":"There can be more than one Product Owner per product.","correct":false},{"key":"b","text":"The Product Owner is accountable for ordering the Product Backlog.","correct":true},{"key":"c","text":"The Product Owner is not allowed to attend the Daily Scrum.","correct":false}],"correct":["b"],"explanation":"1 Produkt = 1 Product Backlog = 1 Product Owner:in. Das Daily Scrum ist ein Scrum Event für die Entwickler:innen, aber es ist erlaubt, dass der:die Product Owner:in daran teilnimmt.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":5,"nr":20,"id":54453370,"type":"multi-select","question":"What are two good ways for a Scrum Team to ensure security concerns are satisfied?","answers":[{"key":"a","text":"Add a hardening Sprint to specifically resolve all security concerns.","correct":false},{"key":"b","text":"Create Product Backlog items for each concern.","correct":true},{"key":"c","text":"Add security concerns to the Definition of Done.","correct":true},{"key":"d","text":"Cancel the Sprint.","correct":false},{"key":"e","text":"Ask the IT-Security department to support here.","correct":false}],"correct":["b","c"],"explanation":"In Scrum gibt es keine \"hardening\" Sprints (nur Sprints). Der Sprint kann nur abgebrochen werden, wenn das Sprint Goal obsolet wird.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":5,"nr":21,"id":54485244,"type":"multiple-choice","question":"Which of the following should not be changed during a Sprint?\n(choose the best answer)","answers":[{"key":"a","text":"Sprint Backlog","correct":false},{"key":"b","text":"Product Backlog","correct":false},{"key":"c","text":"Definition of Done","correct":true},{"key":"d","text":"Definition of Ready","correct":false}],"correct":["c"],"explanation":"Das Sprint Backlog ändert sich ständig, da die Items des Sprint Backlogs in kleinere Aufgaben zerlegt werden. Das Product Backlog wird während des Sprints refined und kann jederzeit neu geordnet werden. Die Definition of Done sollte während des Sprints nicht geändert werden – Verbesserungen daran werden typischerweise in der Sprint Retrospective geplant. Eine Definition of Ready gibt es in Scrum nicht.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Inhalt","reason":"Als Mehrfachauswahl markiert, obwohl nur eine Antwort richtig ist; jetzt Einfachauswahl mit Hinweis auf die beste Antwort."}},{"test":5,"nr":22,"id":54485260,"type":"multi-select","question":"Which two of the following contribute the most to the Scrum Value \"Focus\"?","answers":[{"key":"a","text":"Having time boxed events.","correct":true},{"key":"b","text":"Having a Sprint Goal.","correct":true},{"key":"c","text":"Using Story Points.","correct":false},{"key":"d","text":"Having a Burn-Down-Chart.","correct":false}],"correct":["a","b"],"explanation":"Die 5 Werte von Scrum sind Commitment, Mut, Fokus, Offenheit und Respekt. Ein Sprint-Ziel und zeitlich begrenzte Scrum-Events tragen am meisten zum Scrum-Wert \"Fokus\" bei.","section":"Scrum Guide (US 2020): Scrum Values (Seite 4)","correction":null},{"test":5,"nr":23,"id":54485906,"type":"multi-select","question":"Which of the following are not allowed in Scrum?","answers":[{"key":"a","text":"A Sprint 0.","correct":true},{"key":"b","text":"A Release Sprint.","correct":true},{"key":"c","text":"Using Story Points.","correct":false},{"key":"d","text":"Using User Stories.","correct":false},{"key":"e","text":"Having two Product Owners in a Scrum Team.","correct":true}],"correct":["a","b","e"],"explanation":"User Stories und Story Points sind in Scrum nicht vorgeschrieben, aber erlaubt. Einen Sprint 0, einen Release-Sprint oder mehr als eine:n Product Owner:in gibt es in Scrum dagegen nicht.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Erklärung","reason":"Der Scrum Guide empfiehlt User Stories und Story Points nicht."}},{"test":5,"nr":24,"id":54485918,"type":"multiple-choice","question":"Which of the following is correct about the Product Vision?","answers":[{"key":"a","text":"It is an old concept and overall not recommended.","correct":false},{"key":"b","text":"It gives an overall direction to all Sprints, makes it easier to prioritize Product Backlog items and helps the team to stay focused.","correct":true},{"key":"c","text":"It helps the Product Owner to decide when the product is releasable.","correct":false}],"correct":["b"],"explanation":"Die \"Product Vision\" ist zwar nicht Teil des Scrum Guide, aber ein sehr empfehlenswertes Konzept, das auch von Scrum.org unterstützt wird.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":5,"nr":25,"id":54485978,"type":"multiple-choice","question":"Being self-managing means that it is okay for the Developers to skip the Daily Scrum.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Selbstmanagement bedeutet nicht, dass man Änderungen am Scrum-Framework vornehmen kann. Scrum-Teams müssen immer alle Scrum-Events durchführen.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Sprache","reason":"Grammatik."}},{"test":5,"nr":26,"id":54485992,"type":"multiple-choice","question":"Scrum can only be used to develop products, not to maintain/sustain existing ones.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Scrum gilt als Framework und kann für die Entwicklung neuer Produkte oder die Wartung und Pflege bestehender Produkte verwendet werden.","section":"Scrum Guide (US 2020): Scrum Theory (Seite 3-4)","correction":null},{"test":5,"nr":27,"id":54486004,"type":"multiple-choice","question":"Which statement is not correct about the Daily Scrum?","answers":[{"key":"a","text":"It is moderated by the Product Owner.","correct":true},{"key":"b","text":"It should be held at the same time and place.","correct":false},{"key":"c","text":"It is a time boxed event (15 min).","correct":false},{"key":"d","text":"The developers have to participate in the meeting.","correct":false}],"correct":["a"],"explanation":"Es ist nicht die Aufgabe des:der Product Owner:in, das Daily Scrum zu moderieren. Der:die Product Owner:in muss nicht am Daily Scrum teilnehmen - nur die Entwickler:innen.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Sprache","reason":"Falscher Name des Events („Scrum Daily“)."}},{"test":5,"nr":28,"id":54486018,"type":"multi-select","question":"Which two of the following answers are not correct about the Product Owner accountability?","answers":[{"key":"a","text":"The Product Owner measures the progress of a release.","correct":false},{"key":"b","text":"The Product Owner decides which developer does what.","correct":true},{"key":"c","text":"The Product Owner is responsible for maximizing the value.","correct":false},{"key":"d","text":"The Product Owner has to participate in the Daily Scrum.","correct":true}],"correct":["b","d"],"explanation":"Das Scrum Team ist selbstmanagend – die Entwickler:innen entscheiden selbst, wer welche Aufgabe übernimmt. Am Daily Scrum müssen nur die Entwickler:innen teilnehmen; der:die Product Owner:in nimmt nur teil, wenn er:sie selbst an Einträgen im Sprint Backlog arbeitet.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Erklärung","reason":"Veralteter Begriff und ungenaue Aussage zur Teilnahme am Daily Scrum."}},{"test":5,"nr":29,"id":54486212,"type":"multiple-choice","question":"When can a Sprint be cancelled?","answers":[{"key":"a","text":"When the Developers are asking the Product Owner to do it.","correct":false},{"key":"b","text":"When the Business Analyst is asking the Product Owner to do it.","correct":false},{"key":"c","text":"When the Sprint Goal becomes obsolete and no items are \"Done\" yet.","correct":false},{"key":"d","text":"When the Sprint Goal becomes obsolete.","correct":true}],"correct":["d"],"explanation":"In Scrum gibt es keine Rolle des \"Business Analysten\".\nWenn das Sprint Goal obsolet wird - kann der Sprint abgebrochen werden.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":5,"nr":30,"id":54486226,"type":"multiple-choice","question":"The Developers have trouble understanding a Sprint Backlog item. What should they do?","answers":[{"key":"a","text":"Collaborate with the Product Owner immediately to receive a better understanding.","correct":true},{"key":"b","text":"Don't touch the item until the Sprint Review to discuss it with the Product Owner again.","correct":false},{"key":"c","text":"Ask the Scrum Master to explain it to them.","correct":false}],"correct":["a"],"explanation":"Der:die Product Owner:in ist dafür verantwortlich, die Items zu erklären. Es liegt in der Verantwortung der Entwickler:innen, die Diskussion so früh wie möglich zu beginnen und nicht bis zum Sprint-Ende zu warten.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Sprache","reason":"Grammatik."}},{"test":5,"nr":31,"id":54491018,"type":"multi-select","question":"Select typical responsibilities of a Scrum Master.","answers":[{"key":"a","text":"Coaching the team members in self-management and cross-functionality.","correct":true},{"key":"b","text":"Doing the documentation for the Developers.","correct":false},{"key":"c","text":"Causing the removal of impediments to the Scrum Team’s progress.","correct":true},{"key":"d","text":"Supporting the Developers in tracking the release progress.","correct":false},{"key":"e","text":"Facilitating Scrum events as requested or needed.","correct":true}],"correct":["a","c","e"],"explanation":"Der:die Scrum Master:in dient dem Scrum Team auf unterschiedliche Weise, unter anderem dadurch,\n• die Teammitglieder in Selbstmanagement und interdisziplinärer Zusammenarbeit zu coachen;\n• das Scrum Team bei der Fokussierung auf die Schaffung von hochwertigen Increments zu unterstützen, die der Definition of Done entsprechen;\n• die Beseitigung von Hindernissen (impediments) für den Fortschritt des Scrum Teams zu bewirken; und\n• sicherzustellen, dass alle Events von Scrum stattfinden, positiv und produktiv sind und innerhalb der Timebox bleiben.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Sprache","reason":"Veralteter Begriff „Development Team“ (seit 2020: Developers bzw. Scrum Team)."}},{"test":5,"nr":32,"id":54491190,"type":"multiple-choice","question":"Higher velocity = higher value","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Es besteht kein direkter Zusammenhang zwischen Geschwindigkeit und Wert. Wenn wir z. B. an weniger werthaltigen Dingen schneller arbeiten, ist die Geschwindigkeit zwar höher, aber der Wert kann gleich hoch, höher oder niedriger sein.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":5,"nr":33,"id":54491204,"type":"multiple-choice","question":"Who determines how work is performed during the Sprint?","answers":[{"key":"a","text":"Developers","correct":true},{"key":"b","text":"Product Owner","correct":false},{"key":"c","text":"Scrum Master","correct":false}],"correct":["a"],"explanation":"Die Entwickler:innen erstellen den Plan für den Sprint im Sprint Planning. Sie legen also fest, wie sie ihre Arbeit während des Sprints erledigen werden, um ein Increment zu erstellen.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":5,"nr":34,"id":54491210,"type":"multiple-choice","question":"A defined 'Definition of Done' helps the Developers to be more confident in their Sprint forecasts.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Die Definition of Done ist ein gemeinsames Verständnis dessen, was \"fertig\" bedeutet. Daher hilft sie den Entwicklern:innen bei der Vorhersage, wie lange es dauern wird/welche Aufgaben erforderlich sind, um ein Product Backlog Item in ein Increment zu verwandeln, das der Definition of Done entspricht.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":5,"nr":35,"id":54491214,"type":"multiple-choice","question":"As the Sprint Planning progresses, the Developers recognize that the workload of the Product Backlog items selected for the Sprint is greater than what they can handle in a Sprint. Name an appropriate action they can take to resolve this.","answers":[{"key":"a","text":"Remove some of the selected Product Backlog Items.","correct":true},{"key":"b","text":"Start the Sprint and see what will happen.","correct":false},{"key":"c","text":"Add the Product Backlog Items as \"stretch\" Items to the Sprint Backlog.","correct":false}],"correct":["a"],"explanation":"In Scrum gibt es keine Konzepte wie \"Stretch\"-Items. Es macht keinen Sinn, einen Sprint ohne ein Commitment des Teams zu beginnen.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Sprache","reason":"Veralteter Begriff „Development Team“ (seit 2020: Developers)."}},{"test":5,"nr":36,"id":54491224,"type":"multiple-choice","question":"The (artifact) commitment of the Sprint Backlog in Scrum is the Definition of Done.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Jedes Artefakt beinhaltet ein Commitment, um sicherzustellen, dass Informationen bereitgestellt werden, welche Transparenz und Fokus verbessern, um den Fortschritt messbar zu machen:\n• Für das Product Backlog ist es das Produkt‐Ziel.\n• Für das Sprint Backlog ist es das Sprint‐Ziel.\n• Für das Increment ist es die Definition of Done.\nDiese Commitments dienen dazu, Empirie und die Scrum‐Werte für das Scrum Team und seine Stakeholder:innen zu verstärken.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":5,"nr":37,"id":54491408,"type":"multiple-choice","question":"There are no Daily Scrums in Scaled Scrum.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Für Scaled Scrum gelten die gleichen Scrum-Regeln. Daher muss es das Daily Scrum geben.","section":"Online Nexus Guide (US 2021): Nexus Events","correction":null},{"test":5,"nr":38,"id":54491416,"type":"multiple-choice","question":"The Scrum Team recognizes that the system is not running stable enough. What should they do?","answers":[{"key":"a","text":"Add additional quality criteria to the Definition of Done.","correct":true},{"key":"b","text":"Stop the current Sprint and start a hardening Sprint.","correct":false}],"correct":["a"],"explanation":"In Scrum gibt es keinen Sprint 0, keinen Härtungs-Sprint usw. - nur Sprints!","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":5,"nr":39,"id":54491418,"type":"multiple-choice","question":"Why do the Scrum Commitments exist?","answers":[{"key":"a","text":"To reinforce empiricism and the Scrum Values for the Scrum Team and their stakeholders.","correct":true},{"key":"b","text":"To make the product progress more visible.","correct":false}],"correct":["a"],"explanation":"Diese Commitments dienen dazu, die Empirie und die Scrum-Werte für das Scrum-Team und seine Stakeholder zu stärken.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":5,"nr":40,"id":54491424,"type":"multiple-choice","question":"What is the purpose of the Sprint Goal for the team?","answers":[{"key":"a","text":"The Sprint Goal creates coherence and focus.","correct":true},{"key":"b","text":"The Sprint Goal is the base line for the Sprint Backlog.","correct":false},{"key":"c","text":"The Sprint Goal reflects only non-functional requirements.","correct":false}],"correct":["a"],"explanation":"","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":5,"nr":41,"id":54742444,"type":"multiple-choice","question":"The Daily Scrum focuses on progress toward the Product Goal.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Der Zweck des Daily Scrums besteht darin, den Fortschritt in Richtung des Sprint‐Ziels zu überprüfen und das Sprint Backlog bei Bedarf anzupassen, um die bevorstehende geplante Arbeit zu justieren. => Sprint‐Ziel wäre korrekt.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":5,"nr":42,"id":54742964,"type":"multiple-choice","question":"The Scrum Team adapts the Definition of Done during:","answers":[{"key":"a","text":"Sprint Retrospective","correct":true},{"key":"b","text":"Sprint Planning","correct":false},{"key":"c","text":"Sprint Review","correct":false}],"correct":["a"],"explanation":"Der Zweck der Sprint Retrospective ist es, Wege zur Steigerung von Qualität und Effektivität zu planen. Das Scrum Team überprüft, wie der letzte Sprint in Bezug auf Individuen, Interaktionen, Prozesse, Werkzeuge und seine Definition of Done verlief.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":5,"nr":43,"id":54743206,"type":"multiple-choice","question":"Who is responsible for managing the Product Backlog?","answers":[{"key":"a","text":"Product Owner","correct":true},{"key":"b","text":"Scrum Master","correct":false},{"key":"c","text":"Developers","correct":false},{"key":"d","text":"Product Manager","correct":false}],"correct":["a"],"explanation":"Der:die Product Owner:in ist für ein effektives Product‐Backlog‐Management ergebnisverantwortlich.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":5,"nr":44,"id":54743678,"type":"multi-select","question":"Select the true statements. Before starting the first Sprint, what are the prerequisites?","answers":[{"key":"a","text":"A staffed Scrum Team.","correct":true},{"key":"b","text":"Just enough Product Backlog Items with business ideas for the first Sprint.","correct":true},{"key":"c","text":"The availability of the Project Manager.","correct":false},{"key":"d","text":"A completed System Architecture.","correct":false},{"key":"e","text":"A complete Product Backlog capturing all the detailed product needs.","correct":false}],"correct":["a","b"],"explanation":"Für den ersten Sprint braucht es ein vollständiges Scrum Team (Product Owner:in, Scrum Master:in, Entwickler:innen) und genug Product Backlog Items für den ersten Sprint. Ein vollständiges Product Backlog, eine fertige Systemarchitektur oder eine:n Projektmanager:in setzt Scrum nicht voraus.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Erklärung","reason":"Erklärung ging nicht auf die Antworten ein."}},{"test":5,"nr":45,"id":54744056,"type":"multiple-choice","question":"The Daily Scrum time-box depends on the size of the Scrum Team.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Das Daily Scrum ist ein 15-minütiges, zeitlich begrenztes Ereignis für Scrum-Teams jeder Größe.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":5,"nr":46,"id":54744448,"type":"multiple-choice","question":"If an item in the Sprint Backlog cannot be finished by the end of the Sprint (it turned out there is a lot more work to do than was estimated), the Sprint is cancelled and a new Sprint is created with a more realistic scope.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Der Sprint wird nur dann abgebrochen, wenn das Sprint Goal obsolet geworden ist. Wenn einige Arbeiten nicht erledigt werden konnten, sollte das Sprint Backlog zwischen dem:der Product Owner:in und den Entwicklern:innen neu diskutiert werden.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":5,"nr":47,"id":54745128,"type":"multiple-choice","question":"What is a good way for a Scrum Team to ensure that security concerns are addressed and transparent?","answers":[{"key":"a","text":"Create Product Backlog items for the concern and/or add security concerns to the Definition of Done.","correct":true},{"key":"b","text":"Add Security Sprints to resolve security concerns when needed.","correct":false},{"key":"c","text":"Delegate the work to an external team.","correct":false}],"correct":["a"],"explanation":"Das Product Backlog und die Definition of Done sind Artefakte, die die Transparenz fördern.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":5,"nr":48,"id":54745168,"type":"multiple-choice","question":"What can be used by the Scrum Team to identify unfinished work at the end of the Sprint?","answers":[{"key":"a","text":"Definition of Done","correct":true},{"key":"b","text":"Testing Standard","correct":false},{"key":"c","text":"Definition of Ready","correct":false},{"key":"d","text":"Coding Standard","correct":false}],"correct":["a"],"explanation":"Die Definition of Done ist eine formale Beschreibung des Zustands des Increments, wenn es die für das Produkt erforderlichen Qualitätsmaßnahmen erfüllt.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":5,"nr":49,"id":54745672,"type":"multiple-choice","question":"Who must get feedback from the Key Stakeholders in the Sprint Review? (choose the best answer)","answers":[{"key":"a","text":"The Developers","correct":false},{"key":"b","text":"The Product Owner","correct":false},{"key":"c","text":"The Scrum Team","correct":true},{"key":"d","text":"The Scrum Master","correct":false}],"correct":["c"],"explanation":"Während des Sprint-Reviews arbeiten das ganze Scrum-Team und die Stakeholder zusammen, um zu überprüfen, was im Sprint getan wurde.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":5,"nr":50,"id":54745708,"type":"multiple-choice","question":"Scrum has a role called \"Project Manager.\"","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Es gibt keine Projekt Manager:innen in Scrum.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":5,"nr":51,"id":54861602,"type":"multiple-choice","question":"How much work must the Developers of the Scrum Team do to a Product Backlog item they select for a Sprint?","answers":[{"key":"a","text":"A proportional amount of time on analysis, design, programming, testing and documentation.","correct":false},{"key":"b","text":"All development work and at least some testing.","correct":false},{"key":"c","text":"As much as they can fit into the Sprint. Any remaining work will be transferred to a subsequent Sprint.","correct":false},{"key":"d","text":"As much as they have told the Product Owner will be done for every Product Backlog item they select, in conformance with the Definition of Done.","correct":true}],"correct":["d"],"explanation":"Die Definition of Done ist eine formale Beschreibung des Zustands des Increments, wenn es die für das Produkt erforderlichen Qualitätsmaßnahmen erfüllt. In dem Moment, in dem ein Product‐Backlog‐Eintrag die Definition of Done erfüllt, wird ein Increment geboren.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Sprache","reason":"Grammatik."}},{"test":5,"nr":52,"id":54861620,"type":"multi-select","question":"Who must participate in every Sprint Planning?\n(Select all that apply)","answers":[{"key":"a","text":"The Developers","correct":true},{"key":"b","text":"The Stakeholders","correct":false},{"key":"c","text":"The CEO","correct":false},{"key":"d","text":"The Product Owner","correct":true},{"key":"e","text":"The Scrum Master","correct":true}],"correct":["a","d","e"],"explanation":"Das Sprint Planning initiiert den Sprint, indem es die für den Sprint auszuführenden Arbeiten darlegt. Dieser resultierende Plan wird durch die gemeinschaftliche Arbeit des gesamten Scrum Teams erstellt.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":5,"nr":53,"id":54861668,"type":"multi-select","question":"The Daily Scrum is an event that takes place every day. What would be the three main concerns if the frequency were to be lowered to every two or three days?\n(Choose 3 answers)","answers":[{"key":"a","text":"Opportunities to inspect and adapt the Sprint Backlog are lost.","correct":true},{"key":"b","text":"Impediments are raised and resolved more slowly.","correct":true},{"key":"c","text":"The Scrum Master loses the ability to update the Gantt chart properly.","correct":false},{"key":"d","text":"The Sprint plan becomes inaccurate.","correct":true},{"key":"e","text":"The Product Owner cannot accurately report progress to the stakeholders.","correct":false},{"key":"f","text":"Too much work is spent updating the Scrum board before the meeting.","correct":false}],"correct":["a","b","d"],"explanation":"Der Zweck des Daily Scrums besteht darin, den Fortschritt in Richtung des Sprint‐Ziels zu überprüfen und das Sprint Backlog bei Bedarf anzupassen, um die bevorstehende geplante Arbeit zu justieren. Daily Scrums verbessern die Kommunikation, identifizieren Hindernisse, fördern die schnelle Entscheidungsfindung und eliminieren konsequent die Notwendigkeit für andere Meetings.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Sprache","reason":"Tippfehler („property“ statt „properly“)."}},{"test":5,"nr":54,"id":54861684,"type":"multiple-choice","question":"Who is responsible for conducting the Daily Scrum?","answers":[{"key":"a","text":"The Scrum Team","correct":false},{"key":"b","text":"The Product Owner","correct":false},{"key":"c","text":"The Developers","correct":true},{"key":"d","text":"The Scrum Master","correct":false}],"correct":["c"],"explanation":"Das Daily Scrum ist ein 15‐minütiges Event für die Developer:innen des Scrum Teams.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Sprache","reason":"Leerzeichen vor dem Fragezeichen."}},{"test":5,"nr":55,"id":54861692,"type":"multi-select","question":"You are the Scrum Master of a newly formed Scrum Team. Select three of the following activities that would probably help the team get started.","answers":[{"key":"a","text":"Ensure the Scrum Team understands they need a Definition of Done.","correct":true},{"key":"b","text":"Ask the Product Owner to discuss the product or project, its history, goals, and context as well as answer questions.","correct":true},{"key":"c","text":"Ensure the Scrum Team members have compatible personalities.","correct":false},{"key":"d","text":"Introduce a bonus system for the top performers in the team.","correct":false},{"key":"e","text":"Have the development managers for each Developer introduce their direct reports and go over their responsibilities on the Scrum Team.","correct":false},{"key":"f","text":"Have the Scrum Team members introduce themselves to each other and give a brief background of their skills and work history.","correct":true}],"correct":["a","b","f"],"explanation":"","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Sprache","reason":"Grammatik."}},{"test":5,"nr":56,"id":54861710,"type":"multiple-choice","question":"A Product Owner wants advice from the Scrum Master on estimating work in Scrum. Which of these is the guideline that the Scrum Master should give?","answers":[{"key":"a","text":"Estimates must be in relative units.","correct":false},{"key":"b","text":"Product Backlog items must be estimated in story points.","correct":false},{"key":"c","text":"Scrum forbids estimating.","correct":false},{"key":"d","text":"Estimates are made by the Developers.","correct":true},{"key":"e","text":"Estimates are made by the Product Owner, but are best checked with the Developers.","correct":false}],"correct":["d"],"explanation":"","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":5,"nr":57,"id":54861712,"type":"multiple-choice","question":"What is the recommended size for a Scrum Team?","answers":[{"key":"a","text":"10 or fewer people","correct":true},{"key":"b","text":"3 to 9","correct":false},{"key":"c","text":"9","correct":false}],"correct":["a"],"explanation":"Das Scrum Team ist klein genug, um flink zu bleiben und groß genug, um innerhalb eines Sprints bedeutsame Arbeit fertigzustellen, üblicherweise 10 oder weniger Personen.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":5,"nr":58,"id":54861736,"type":"multiple-choice","question":"The Product Owner is also accountable for effective Product Backlog management, which includes:","answers":[{"key":"a","text":"Developing and explicitly communicating the Product Goal.","correct":true},{"key":"b","text":"Planning and advising Scrum implementations within the organization.","correct":false},{"key":"c","text":"Helping find techniques for effective Product Goal definition and Product Backlog management.","correct":false},{"key":"d","text":"Helping establish empirical product planning for a complex environment.","correct":false}],"correct":["a"],"explanation":"Der:die Product Owner:in ist auch für ein effektives Product‐Backlog‐Management ergebnisverantwortlich, das Folgendes umfasst:\n• das Produkt‐Ziel zu entwickeln und explizit zu kommunizieren;\n• die Product‐Backlog‐Einträge zu erstellen und klar zu kommunizieren;\n• die Reihenfolge der Product‐Backlog‐Einträge festzulegen; und\n• sicherzustellen, dass das Product Backlog transparent, sichtbar und verstanden ist.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":null},{"test":5,"nr":59,"id":54861742,"type":"multiple-choice","question":"During the Sprint, if new work is required, the Developers can add it to the current Sprint Backlog.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Das Sprint Backlog ist ein Plan von und für die Developer:innen. Es ist ein deutlich sichtbares Echtzeitbild der Arbeit, welche die Developer:innen während des Sprints zur Erreichung des Sprint‐Ziels ausführen wollen. Folglich wird das Sprint Backlog während des gesamten Sprints immer dann aktualisiert, wenn mehr gelernt wurde. Es sollte genügend Details beinhalten, damit sie ihren Fortschritt im Daily Scrum überprüfen können.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":{"kind":"Sprache","reason":"Satzende fehlte."}},{"test":5,"nr":60,"id":54861744,"type":"multiple-choice","question":"Sometimes, one day of preparation is necessary to plan a new Sprint after the end of the previous one.","answers":[{"key":"a","text":"True","correct":false},{"key":"b","text":"False","correct":true}],"correct":["b"],"explanation":"Ein neuer Sprint beginnt unmittelbar nach dem Ende des vorangegangenen Sprints.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":5,"nr":61,"id":54887386,"type":"multiple-choice","question":"At the Sprint Retrospective, the Scrum Team can add the identified improvements to the Sprint Backlog for the next Sprint.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Das Scrum Team identifiziert die hilfreichsten Änderungen, um seine Effektivität zu verbessern. Die wirkungsvollsten Verbesserungen werden so schnell wie möglich in Angriff genommen. Sie können sogar in das Sprint Backlog für den nächsten Sprint aufgenommen werden.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Sprache","reason":"Aussage endete mit Fragezeichen."}},{"test":5,"nr":62,"id":54887400,"type":"multi-select","question":"What are Product Backlog characteristics?\n(Select three)","answers":[{"key":"a","text":"It is dynamic.","correct":true},{"key":"b","text":"It is never complete.","correct":true},{"key":"c","text":"As long as a product exists, its Product Backlog also exists.","correct":true},{"key":"d","text":"When the final version of a product is rolled out, its Product Backlog is dismissed.","correct":false},{"key":"e","text":"A Product Backlog could be closed when it contains no items to include into the next Sprint.","correct":false}],"correct":["a","b","c"],"explanation":"Das Product Backlog ist eine emergente, geordnete Liste der Dinge, die zur Produktverbesserung benötigt werden. Es ist die einzige Quelle von Arbeit, die durch das Scrum Team erledigt wird.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":5,"nr":63,"id":54887532,"type":"multiple-choice","question":"How long should the Sprint Planning be for a one-month Sprint?","answers":[{"key":"a","text":"Not more than 4 hours.","correct":false},{"key":"b","text":"Not more than 8 hours.","correct":true},{"key":"c","text":"Until all the Items in the Sprint Backlog are decomposed to units of one day or less.","correct":false}],"correct":["b"],"explanation":"Das Sprint Planning ist zeitlich beschränkt auf maximal acht Stunden für einen einmonatigen Sprint. Bei kürzeren Sprints ist das Event in der Regel kürzer.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Inhalt","reason":"Die Timebox von 8 Stunden gilt für einen einmonatigen Sprint – das fehlte in der Frage."}},{"test":5,"nr":64,"id":54887684,"type":"multi-select","question":"What are the best ways for a Product Owner to manage value for the Product?\n(choose the best two answers)","answers":[{"key":"a","text":"Ordering of the Product Backlog.","correct":true},{"key":"b","text":"Frequently releasing increments to validate assumptions built into the product.","correct":true},{"key":"c","text":"Setting value points on individual Product Backlog items.","correct":false},{"key":"d","text":"Managing the Product Cost Ratio.","correct":false}],"correct":["a","b"],"explanation":"Häufiges Releasen führt zu mehr Kunden-Feedback und daher mehr Ideen für den Product Backlog.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":5,"nr":65,"id":54887698,"type":"multiple-choice","question":"People other than the Scrum Team members can attend the Sprint Planning in order to provide technical or domain advice.","answers":[{"key":"a","text":"True","correct":true},{"key":"b","text":"False","correct":false}],"correct":["a"],"explanation":"Das Scrum Team kann laut Scrum Guide auch andere Personen zum Sprint Planning einladen, die technische oder fachliche Beratung leisten.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":{"kind":"Erklärung","reason":"Laut Scrum Guide lädt das Scrum Team ein, nicht nur die Entwickler:innen. Dazu Grammatik in der Aussage."}},{"test":5,"nr":66,"id":54887720,"type":"multiple-choice","question":"Why do the Developers need a Sprint Goal?","answers":[{"key":"a","text":"The Developers are more focused with a common and specific goal.","correct":true},{"key":"b","text":"Sprint Goals are not valuable. Everything is known from the Product Backlog.","correct":false},{"key":"c","text":"A Sprint Goal ensures that all of the product Backlog items selected for the Sprint are implemented.","correct":false},{"key":"d","text":"A Sprint Goal only gives purpose to sprint 0.","correct":false}],"correct":["a"],"explanation":"Das Sprint‐Ziel ist die einzige Zielsetzung für den Sprint. Obwohl das Sprint‐Ziel ein Commitment der Developer:innen ist, bietet es Flexibilität in Bezug auf die genaue Arbeit, die erforderlich ist, um es zu erreichen. Das Sprint‐Ziel schafft auch Kohärenz und Fokus und ermutigt somit das Scrum Team, zusammen statt in separaten Initiativen zu arbeiten.","section":"Scrum Guide (US 2020): Scrum Artifacts (Seite 10-12)","correction":null},{"test":5,"nr":67,"id":54887736,"type":"multiple-choice","question":"Who must present the new increment to the stakeholders during the Sprint Review?\n(choose the best answer)","answers":[{"key":"a","text":"The Developers","correct":false},{"key":"b","text":"The Scrum Team","correct":true},{"key":"c","text":"The Scrum Master","correct":false},{"key":"d","text":"The Product Owner","correct":false}],"correct":["b"],"explanation":"Zweck des Sprint Reviews ist es, das Ergebnis des Sprints zu überprüfen und künftige Anpassungen festzulegen. Das Scrum Team stellt die Ergebnisse seiner Arbeit den wichtigsten Stakeholder:innen vor, und die Fortschritte in Richtung des Produkt‐Ziels werden diskutiert.","section":"Scrum Guide (US 2020): Scrum Events (Seite 7-10)","correction":null},{"test":5,"nr":68,"id":54887762,"type":"multi-select","question":"What are the true statements?","answers":[{"key":"a","text":"Only the Product Owner can change the Sprint Backlog.","correct":false},{"key":"b","text":"Only the Product Owner should update the Product Backlog without delegating to anyone.","correct":false},{"key":"c","text":"Only the Developers should be responsible for estimating the Product Backlog Items.","correct":true},{"key":"d","text":"Only the Product Owner can cancel the Sprint. Others can only influence the decision to cancel.","correct":true}],"correct":["c","d"],"explanation":"Das Sprint Backlog wird von den Entwickler:innen verantwortet. Der:die Product Owner:in kann Aufgaben delegieren. Schätzungen machen die Entwickler:innen, und nur der:die Product Owner:in kann einen Sprint abbrechen.","section":"Scrum Guide (US 2020): Scrum Team (Seite 5-6)","correction":{"kind":"Sprache","reason":"Tippfehler."}},{"test":5,"nr":69,"id":54887978,"type":"multi-select","question":"What should be taken into account for the Definition of Done? Select the two most appropriate items.","answers":[{"key":"a","text":"Advice of the Scrum Master.","corre
