ss=\"term\" tabindex=\"0\" data-tip=\"0\">Scrum Master</span> is accountable for the <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span>’s effectiveness. They do this by enabling the Scrum Team to improve its practices, within the Scrum framework.</p>\n<p>Scrum Masters are true leaders who serve the <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> and the larger organization.</p>\n<p>The <span class=\"term\" tabindex=\"0\" data-tip=\"0\">Scrum Master</span> serves the <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> in several ways, including:</p>\n<ul>\n<li>Coaching the team members in self-management and cross-functionality;</li>\n<li>Helping the <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> focus on creating high-value Increments that meet the <span class=\"term\" tabindex=\"0\" data-tip=\"21\">Definition of Done</span>;</li>\n<li>Causing the removal of <span class=\"term\" tabindex=\"0\" data-tip=\"24\">impediments</span> to the <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span>’s progress; and,</li>\n<li>Ensuring that all Scrum events take place and are positive, productive, and kept within the <span class=\"term\" tabindex=\"0\" data-tip=\"25\">timebox</span>.</li>\n</ul>\n<p>The <span class=\"term\" tabindex=\"0\" data-tip=\"0\">Scrum Master</span> serves the <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner</span> in several ways, including:</p>\n<ul>\n<li>Helping find techniques for effective <span class=\"term\" tabindex=\"0\" data-tip=\"16\">Product Goal</span> definition and <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span> management;</li>\n<li>Helping the <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> understand the need for clear and concise <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span> items;</li>\n<li>Helping establish empirical product planning for a complex environment; and,</li>\n<li>Facilitating stakeholder collaboration as requested or needed.</li>\n</ul>\n<p>The <span class=\"term\" tabindex=\"0\" data-tip=\"0\">Scrum Master</span> serves the organization in several ways, including:</p>\n<ul>\n<li>Leading, training, and coaching the organization in its Scrum adoption;</li>\n<li>Planning and advising Scrum implementations within the organization;</li>\n<li>Helping employees and <span class=\"term\" tabindex=\"0\" data-tip=\"6\">stakeholders</span> understand and enact an empirical approach for complex work; and,</li>\n<li>Removing barriers between <span class=\"term\" tabindex=\"0\" data-tip=\"6\">stakeholders</span> and Scrum Teams.</li>\n</ul>\n<h3 id=\"sg-scrum-events\">Scrum Events</h3>\n<p>The <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span> is a container for all other events. Each event in Scrum is a formal opportunity to inspect and adapt Scrum artifacts. These events are specifically designed to enable the <span class=\"term\" tabindex=\"0\" data-tip=\"12\">transparency</span> required. Failure to operate any events as prescribed results in lost opportunities to inspect and adapt. Events are used in Scrum to create regularity and to minimize the need for meetings not defined in Scrum. Optimally, all events are held at the same time and place to reduce complexity.</p>\n<h4 id=\"sg-sprint\">The Sprint</h4>\n<p><span class=\"term\" tabindex=\"0\" data-tip=\"18\">Sprints</span> are the heartbeat of Scrum, where ideas are turned into value.</p>\n<p>They are fixed length events of one month or less to create consistency. A new <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span> starts immediately after the conclusion of the previous Sprint.</p>\n<p>All the work necessary to achieve the <span class=\"term\" tabindex=\"0\" data-tip=\"16\">Product Goal</span>, including <span class=\"term\" tabindex=\"0\" data-tip=\"26\">Sprint Planning</span>, Daily Scrums, <span class=\"term\" tabindex=\"0\" data-tip=\"23\">Sprint Review</span>, and <span class=\"term\" tabindex=\"0\" data-tip=\"27\">Sprint Retrospective</span>, happen within <span class=\"term\" tabindex=\"0\" data-tip=\"18\">Sprints</span>.</p>\n<p>During the <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span>:</p>\n<ul>\n<li>No changes are made that would endanger the <span class=\"term\" tabindex=\"0\" data-tip=\"22\">Sprint Goal</span>;</li>\n<li>Quality does not decrease;</li>\n<li>The <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span> is refined as needed; and,</li>\n<li>Scope may be clarified and renegotiated with the <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner</span> as more is learned.</li>\n</ul>\n<p><span class=\"term\" tabindex=\"0\" data-tip=\"18\">Sprints</span> enable predictability by ensuring <span class=\"term\" tabindex=\"0\" data-tip=\"10\">inspection</span> and <span class=\"term\" tabindex=\"0\" data-tip=\"11\">adaptation</span> of progress toward a <span class=\"term\" tabindex=\"0\" data-tip=\"16\">Product Goal</span> at least every calendar month. When a <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span>’s horizon is too long the <span class=\"term\" tabindex=\"0\" data-tip=\"22\">Sprint Goal</span> may become invalid, complexity may rise, and risk may increase. Shorter Sprints can be employed to generate more learning cycles and limit risk of cost and effort to a smaller time frame. Each Sprint may be considered a short project.</p>\n<p>Various practices exist to forecast progress, like <span class=\"term\" tabindex=\"0\" data-tip=\"28\">burn-downs</span>, burn-ups, or cumulative flows. While proven useful, these do not replace the importance of <span class=\"term\" tabindex=\"0\" data-tip=\"8\">empiricism</span>. In complex environments, what will happen is unknown. Only what has already happened may be used for forward-looking decision making.</p>\n<p>A <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span> could be <span class=\"term\" tabindex=\"0\" data-tip=\"29\">cancelled</span> if the <span class=\"term\" tabindex=\"0\" data-tip=\"22\">Sprint Goal</span> becomes obsolete. Only the <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner</span> has the authority to cancel the Sprint.</p>\n<h4 id=\"sg-sprint-planning\">Sprint Planning</h4>\n<p><span class=\"term\" tabindex=\"0\" data-tip=\"26\">Sprint Planning</span> initiates the <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span> by laying out the work to be performed for the Sprint. This resulting plan is created by the collaborative work of the entire <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span>.</p>\n<p>The <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner</span> ensures that attendees are prepared to discuss the most important <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span> items and how they map to the <span class=\"term\" tabindex=\"0\" data-tip=\"16\">Product Goal</span>. The <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> may also invite other people to attend <span class=\"term\" tabindex=\"0\" data-tip=\"26\">Sprint Planning</span> to provide advice.</p>\n<p><span class=\"term\" tabindex=\"0\" data-tip=\"26\">Sprint Planning</span> addresses the following topics:</p>\n<p>Topic One: Why is this <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span> valuable?</p>\n<p>The <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner</span> proposes how the product could increase its value and utility in the current <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span>. The whole <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> then collaborates to define a <span class=\"term\" tabindex=\"0\" data-tip=\"22\">Sprint Goal</span> that communicates why the Sprint is valuable to <span class=\"term\" tabindex=\"0\" data-tip=\"6\">stakeholders</span>. The Sprint Goal must be finalized prior to the end of <span class=\"term\" tabindex=\"0\" data-tip=\"26\">Sprint Planning</span>.</p>\n<p>Topic Two: What can be Done this <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span>?</p>\n<p>Through discussion with the <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner</span>, the <span class=\"term\" tabindex=\"0\" data-tip=\"15\">Developers</span> select items from the <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span> to include in the current <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span>. The <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> may refine these items during this process, which increases understanding and confidence.</p>\n<p>Selecting how much can be completed within a <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span> may be challenging. However, the more the <span class=\"term\" tabindex=\"0\" data-tip=\"15\">Developers</span> know about their past performance, their upcoming capacity, and their <span class=\"term\" tabindex=\"0\" data-tip=\"21\">Definition of Done</span>, the more confident they will be in their Sprint forecasts.</p>\n<p>Topic Three: How will the chosen work get done?</p>\n<p>For each selected <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span> item, the <span class=\"term\" tabindex=\"0\" data-tip=\"15\">Developers</span> plan the work necessary to create an <span class=\"term\" tabindex=\"0\" data-tip=\"4\">Increment</span> that meets the <span class=\"term\" tabindex=\"0\" data-tip=\"21\">Definition of Done</span>. This is often done by decomposing Product Backlog items into smaller work items of one day or less. How this is done is at the sole discretion of the Developers. No one else tells them how to turn Product Backlog items into Increments of value.</p>\n<p>The <span class=\"term\" tabindex=\"0\" data-tip=\"22\">Sprint Goal</span>, the <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span> items selected for the <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span>, plus the plan for delivering them are together referred to as the <span class=\"term\" tabindex=\"0\" data-tip=\"20\">Sprint Backlog</span>.</p>\n<p><span class=\"term\" tabindex=\"0\" data-tip=\"26\">Sprint Planning</span> is <span class=\"term\" tabindex=\"0\" data-tip=\"25\">timeboxed</span> to a maximum of eight hours for a one-month <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span>. For shorter <span class=\"term\" tabindex=\"0\" data-tip=\"18\">Sprints</span>, the event is usually shorter.</p>\n<h4 id=\"sg-daily-scrum\">Daily Scrum</h4>\n<p>The purpose of the <span class=\"term\" tabindex=\"0\" data-tip=\"30\">Daily Scrum</span> is to inspect progress toward the <span class=\"term\" tabindex=\"0\" data-tip=\"22\">Sprint Goal</span> and adapt the <span class=\"term\" tabindex=\"0\" data-tip=\"20\">Sprint Backlog</span> as necessary, adjusting the upcoming planned work.</p>\n<p>The <span class=\"term\" tabindex=\"0\" data-tip=\"30\">Daily Scrum</span> is a 15-minute event for the <span class=\"term\" tabindex=\"0\" data-tip=\"15\">Developers</span> of the <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span>. To reduce complexity, it is held at the same time and place every working day of the <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span>. If the <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner</span> or <span class=\"term\" tabindex=\"0\" data-tip=\"0\">Scrum Master</span> are actively working on items in the <span class=\"term\" tabindex=\"0\" data-tip=\"20\">Sprint Backlog</span>, they participate as Developers.</p>\n<p>The <span class=\"term\" tabindex=\"0\" data-tip=\"15\">Developers</span> can select whatever structure and techniques they want, as long as their <span class=\"term\" tabindex=\"0\" data-tip=\"30\">Daily Scrum</span> focuses on progress toward the <span class=\"term\" tabindex=\"0\" data-tip=\"22\">Sprint Goal</span> and produces an actionable plan for the next day of work. This creates focus and improves self-management.</p>\n<p>Daily Scrums improve communications, identify <span class=\"term\" tabindex=\"0\" data-tip=\"24\">impediments</span>, promote quick decision-making, and consequently eliminate the need for other meetings.</p>\n<p>The <span class=\"term\" tabindex=\"0\" data-tip=\"30\">Daily Scrum</span> is not the only time <span class=\"term\" tabindex=\"0\" data-tip=\"15\">Developers</span> are allowed to adjust their plan. They often meet throughout the day for more detailed discussions about adapting or re-planning the rest of the <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span>’s work.</p>\n<h4 id=\"sg-sprint-review\">Sprint Review</h4>\n<p>The purpose of the <span class=\"term\" tabindex=\"0\" data-tip=\"23\">Sprint Review</span> is to inspect the outcome of the <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span> and determine future adaptations. The <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> presents the results of their work to key <span class=\"term\" tabindex=\"0\" data-tip=\"6\">stakeholders</span> and progress toward the <span class=\"term\" tabindex=\"0\" data-tip=\"16\">Product Goal</span> is discussed.</p>\n<p>During the event, the <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> and <span class=\"term\" tabindex=\"0\" data-tip=\"6\">stakeholders</span> review what was accomplished in the <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span> and what has changed in their environment. Based on this information, attendees collaborate on what to do next. The <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span> may also be adjusted to meet new opportunities. The <span class=\"term\" tabindex=\"0\" data-tip=\"23\">Sprint Review</span> is a working session and the Scrum Team should avoid limiting it to a presentation.</p>\n<p>The <span class=\"term\" tabindex=\"0\" data-tip=\"23\">Sprint Review</span> is the second to last event of the <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span> and is <span class=\"term\" tabindex=\"0\" data-tip=\"25\">timeboxed</span> to a maximum of four hours for a one-month Sprint. For shorter <span class=\"term\" tabindex=\"0\" data-tip=\"18\">Sprints</span>, the event is usually shorter.</p>\n<h4 id=\"sg-sprint-retrospective\">Sprint Retrospective</h4>\n<p>The purpose of the <span class=\"term\" tabindex=\"0\" data-tip=\"27\">Sprint Retrospective</span> is to plan ways to increase quality and effectiveness.</p>\n<p>The <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> inspects how the last <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span> went with regards to individuals, interactions, processes, tools, and their <span class=\"term\" tabindex=\"0\" data-tip=\"21\">Definition of Done</span>. Inspected elements often vary with the domain of work. Assumptions that led them astray are identified and their origins explored. The Scrum Team discusses what went well during the Sprint, what problems it encountered, and how those problems were (or were not) solved.</p>\n<p>The <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> identifies the most helpful changes to improve its effectiveness. The most impactful improvements are addressed as soon as possible. They may even be added to the <span class=\"term\" tabindex=\"0\" data-tip=\"20\">Sprint Backlog</span> for the next <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span>.</p>\n<p>The <span class=\"term\" tabindex=\"0\" data-tip=\"27\">Sprint Retrospective</span> concludes the <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span>. It is <span class=\"term\" tabindex=\"0\" data-tip=\"25\">timeboxed</span> to a maximum of three hours for a one-month Sprint. For shorter <span class=\"term\" tabindex=\"0\" data-tip=\"18\">Sprints</span>, the event is usually shorter.</p>\n<h3 id=\"sg-scrum-artifacts\">Scrum Artifacts</h3>\n<p>Scrum’s artifacts represent work or value. They are designed to maximize <span class=\"term\" tabindex=\"0\" data-tip=\"12\">transparency</span> of key information. Thus, everyone inspecting them has the same basis for <span class=\"term\" tabindex=\"0\" data-tip=\"11\">adaptation</span>.</p>\n<p>Each artifact contains a <span class=\"term\" tabindex=\"0\" data-tip=\"31\">commitment</span> to ensure it provides information that enhances <span class=\"term\" tabindex=\"0\" data-tip=\"12\">transparency</span> and focus against which progress can be measured:</p>\n<ul>\n<li>For the <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span> it is the <span class=\"term\" tabindex=\"0\" data-tip=\"16\">Product Goal</span>.</li>\n<li>For the <span class=\"term\" tabindex=\"0\" data-tip=\"20\">Sprint Backlog</span> it is the <span class=\"term\" tabindex=\"0\" data-tip=\"22\">Sprint Goal</span>.</li>\n<li>For the <span class=\"term\" tabindex=\"0\" data-tip=\"4\">Increment</span> it is the <span class=\"term\" tabindex=\"0\" data-tip=\"21\">Definition of Done</span>.</li>\n</ul>\n<p>These commitments exist to reinforce <span class=\"term\" tabindex=\"0\" data-tip=\"8\">empiricism</span> and the Scrum values for the <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> and their <span class=\"term\" tabindex=\"0\" data-tip=\"6\">stakeholders</span>.</p>\n<h4 id=\"sg-product-backlog\">Product Backlog</h4>\n<p>The <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span> is an emergent, ordered list of what is needed to improve the product. It is the single source of work undertaken by the <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span>.</p>\n<p><span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span> items that can be Done by the <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> within one <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span> are deemed ready for selection in a <span class=\"term\" tabindex=\"0\" data-tip=\"26\">Sprint Planning</span> event. They usually acquire this degree of <span class=\"term\" tabindex=\"0\" data-tip=\"12\">transparency</span> after refining activities. <span class=\"term\" tabindex=\"0\" data-tip=\"32\">Product Backlog refinement</span> is the act of breaking down and further defining Product Backlog items into smaller more precise items. This is an ongoing activity to add details, such as a description, order, and size. Attributes often vary with the domain of work.</p>\n<p>The <span class=\"term\" tabindex=\"0\" data-tip=\"15\">Developers</span> who will be doing the work are responsible for the <span class=\"term\" tabindex=\"0\" data-tip=\"33\">sizing</span>. The <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner</span> may influence the Developers by helping them understand and select trade-offs.</p>\n<h5 id=\"sg-commitment-product-goal\">Commitment: Product Goal</h5>\n<p>The <span class=\"term\" tabindex=\"0\" data-tip=\"16\">Product Goal</span> describes a future state of the product which can serve as a target for the <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> to plan against. The Product Goal is in the <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span>. The rest of the Product Backlog emerges to define “what” will fulfill the Product Goal.</p>\n<blockquote>A product is a vehicle to deliver value. It has a clear boundary, known <span class=\"term\" tabindex=\"0\" data-tip=\"6\">stakeholders</span>, well-defined users or customers. A product could be a service, a physical product, or something more abstract.</blockquote>\n<p>The <span class=\"term\" tabindex=\"0\" data-tip=\"16\">Product Goal</span> is the long-term objective for the <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span>. They must fulfill (or abandon) one objective before taking on the next.</p>\n<h4 id=\"sg-sprint-backlog\">Sprint Backlog</h4>\n<p>The <span class=\"term\" tabindex=\"0\" data-tip=\"20\">Sprint Backlog</span> is composed of the <span class=\"term\" tabindex=\"0\" data-tip=\"22\">Sprint Goal</span> (why), the set of <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span> items selected for the <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span> (what), as well as an actionable plan for delivering the <span class=\"term\" tabindex=\"0\" data-tip=\"4\">Increment</span> (how).</p>\n<p>The <span class=\"term\" tabindex=\"0\" data-tip=\"20\">Sprint Backlog</span> is a plan by and for the <span class=\"term\" tabindex=\"0\" data-tip=\"15\">Developers</span>. It is a highly visible, real-time picture of the work that the Developers plan to accomplish during the <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span> in order to achieve the <span class=\"term\" tabindex=\"0\" data-tip=\"22\">Sprint Goal</span>. Consequently, the Sprint Backlog is updated throughout the Sprint as more is learned. It should have enough detail that they can inspect their progress in the <span class=\"term\" tabindex=\"0\" data-tip=\"30\">Daily Scrum</span>.</p>\n<h5 id=\"sg-commitment-sprint-goal\">Commitment: Sprint Goal</h5>\n<p>The <span class=\"term\" tabindex=\"0\" data-tip=\"22\">Sprint Goal</span> is the single objective for the <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span>. Although the Sprint Goal is a <span class=\"term\" tabindex=\"0\" data-tip=\"31\">commitment</span> by the <span class=\"term\" tabindex=\"0\" data-tip=\"15\">Developers</span>, it provides flexibility in terms of the exact work needed to achieve it. The Sprint Goal also creates coherence and focus, encouraging the <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> to work together rather than on separate initiatives.</p>\n<p>The <span class=\"term\" tabindex=\"0\" data-tip=\"22\">Sprint Goal</span> is created during the <span class=\"term\" tabindex=\"0\" data-tip=\"26\">Sprint Planning</span> event and then added to the <span class=\"term\" tabindex=\"0\" data-tip=\"20\">Sprint Backlog</span>. As the <span class=\"term\" tabindex=\"0\" data-tip=\"15\">Developers</span> work during the <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span>, they keep the Sprint Goal in mind. If the work turns out to be different than they expected, they collaborate with the <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner</span> to negotiate the scope of the Sprint Backlog within the Sprint without affecting the Sprint Goal.</p>\n<h4 id=\"sg-increment\">Increment</h4>\n<p>An <span class=\"term\" tabindex=\"0\" data-tip=\"4\">Increment</span> is a concrete stepping stone toward the <span class=\"term\" tabindex=\"0\" data-tip=\"16\">Product Goal</span>. Each Increment is additive to all prior Increments and thoroughly verified, ensuring that all Increments work together. In order to provide value, the Increment must be usable.</p>\n<p>Multiple Increments may be created within a <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span>. The sum of the Increments is presented at the <span class=\"term\" tabindex=\"0\" data-tip=\"23\">Sprint Review</span> thus supporting <span class=\"term\" tabindex=\"0\" data-tip=\"8\">empiricism</span>. However, an <span class=\"term\" tabindex=\"0\" data-tip=\"4\">Increment</span> may be delivered to <span class=\"term\" tabindex=\"0\" data-tip=\"6\">stakeholders</span> prior to the end of the Sprint. The Sprint Review should never be considered a gate to releasing value.</p>\n<p>Work cannot be considered part of an <span class=\"term\" tabindex=\"0\" data-tip=\"4\">Increment</span> unless it meets the <span class=\"term\" tabindex=\"0\" data-tip=\"21\">Definition of Done</span>.</p>\n<h5 id=\"sg-commitment-definition-of-done\">Commitment: Definition of Done</h5>\n<p>The <span class=\"term\" tabindex=\"0\" data-tip=\"21\">Definition of Done</span> is a formal description of the state of the <span class=\"term\" tabindex=\"0\" data-tip=\"4\">Increment</span> when it meets the quality measures required for the product.</p>\n<p>The moment a <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span> item meets the <span class=\"term\" tabindex=\"0\" data-tip=\"21\">Definition of Done</span>, an <span class=\"term\" tabindex=\"0\" data-tip=\"4\">Increment</span> is born.</p>\n<p>The <span class=\"term\" tabindex=\"0\" data-tip=\"21\">Definition of Done</span> creates <span class=\"term\" tabindex=\"0\" data-tip=\"12\">transparency</span> by providing everyone a shared understanding of what work was completed as part of the <span class=\"term\" tabindex=\"0\" data-tip=\"4\">Increment</span>. If a <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span> item does not meet the Definition of Done, it cannot be released or even presented at the <span class=\"term\" tabindex=\"0\" data-tip=\"23\">Sprint Review</span>. Instead, it returns to the Product Backlog for future consideration.</p>\n<p>If the <span class=\"term\" tabindex=\"0\" data-tip=\"21\">Definition of Done</span> for an increment is part of the standards of the organization, all Scrum Teams must follow it as a minimum. If it is not an organizational standard, the <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> must create a Definition of Done appropriate for the product.</p>\n<p>The <span class=\"term\" tabindex=\"0\" data-tip=\"15\">Developers</span> are required to conform to the <span class=\"term\" tabindex=\"0\" data-tip=\"21\">Definition of Done</span>. If there are multiple Scrum Teams working together on a product, they must mutually define and comply with the same Definition of Done.</p>\n<h3 id=\"sg-end-note\">End Note</h3>\n<p>Scrum is free and offered in this Guide. The Scrum framework, as outlined herein, is <span class=\"term\" tabindex=\"0\" data-tip=\"34\">immutable</span>. While implementing only parts of Scrum is possible, the result is not Scrum. Scrum exists only in its entirety and functions well as a container for other techniques, methodologies, and practices.</p>\n<h3 id=\"sg-acknowledgements\">Acknowledgements</h3>\n<h4 id=\"sg-people\">People</h4>\n<p>Of the thousands of people who have contributed to Scrum, we should single out those who were instrumental at the start: Jeff Sutherland worked with Jeff McKenna and John Scumniotales, and Ken Schwaber worked with Mike Smith and Chris Martin, and all of them worked together. Many others contributed in the ensuing years and without their help Scrum would not be refined as it is today.</p>\n<h4 id=\"sg-scrum-guide-history\">Scrum Guide History</h4>\n<p>Ken Schwaber and Jeff Sutherland first co-presented Scrum at the OOPSLA Conference in 1995. It essentially documented the learning that Ken and Jeff gained over the previous few years and made public the first formal definition of Scrum.</p>\n<p>The Scrum Guide documents Scrum as developed, evolved, and sustained for 30-plus years by Jeff Sutherland and Ken Schwaber. Other sources provide patterns, processes, and insights that complement the Scrum framework. These may increase productivity, value, creativity, and satisfaction with the results.</p>\n<p>The complete history of Scrum is described elsewhere. To honor the first places where it was tried and proven, we recognize Individual Inc., Newspage, Fidelity Investments, and IDX (now GE Medical).</p>", "de": "<header class=\"sg-cover\"><p class=\"sg-authors\">Ken Schwaber &amp; Jeff Sutherland</p><h2>Der Scrum Guide</h2><p class=\"sg-sub\">Der gültige Leitfaden für Scrum: Die Spielregeln</p><p class=\"sg-date\">November 2020</p></header><p class=\"sg-attrib\">Offizielle deutsche Übersetzung der GermanScrumTranslators (Übersetzung Version 3.5, Glossar Stand 15.06.2022), veröffentlicht auf <a href=\"https://scrumguides.org/download.html\" target=\"_blank\" rel=\"noopener\">scrumguides.org</a>. © 2020 Ken Schwaber and Jeff Sutherland, lizenziert unter <a href=\"https://creativecommons.org/licenses/by-sa/4.0/\" target=\"_blank\" rel=\"noopener\">CC BY-SA 4.0</a>. Änderungen in dieser App: Der Text ist unverändert. Die gepunktet unterstrichenen Begriffe zeigen den offiziellen englischen Begriff und eine englische Erklärung für die Prüfungsvorbereitung; sie sind nicht Teil des Scrum Guides.</p>\n<h3 id=\"sg-purpose-of-the-scrum-guide\">Der Sinn des Scrum Guides</h3>\n<p>Wir haben Scrum in den frühen 1990er-Jahren entwickelt. Wir haben die erste Version des Scrum Guides im Jahr 2010 geschrieben, um Menschen auf der ganzen Welt dabei zu helfen, Scrum zu verstehen. Wir haben den Guide seitdem durch kleine, funktionale Aktualisierungen weiterentwickelt. Wir stehen gemeinsam dahinter.</p>\n<p>Der Scrum Guide enthält die Definition von Scrum. Jedes Element von Scrum dient einem bestimmten Zweck, der für den Gesamtwert und die mit Scrum erzielten Ergebnisse wesentlich ist. Den Kern oder die Grundideen von Scrum zu verändern, Elemente wegzulassen oder den Regeln von Scrum nicht zu folgen, verdeckt Probleme, begrenzt den Nutzen und macht Scrum im Zweifel sogar nutzlos.</p>\n<p>Wir verfolgen den zunehmenden Einsatz von Scrum in einer stetig komplexer werdenden Welt. Wir sehen demütig, wie Scrum in zahlreichen Bereichen komplexer Arbeit über die Softwareentwicklung hinaus - wo Scrum seine Wurzeln hat - eingesetzt wird. Während sich die Verwendung von Scrum weiter verbreitet, wird diese Arbeit von Entwickler:innen, Forscher:innen, Analyst:innen, Wissenschaftler:innen und anderen Spezialist:innen getan. Wir verwenden das Wort „<span class=\"term\" tabindex=\"0\" data-tip=\"15\">Developer:innen</span>” in Scrum nicht, um jemanden auszuschließen, sondern um zu vereinfachen. Wer auch immer vom Einsatz von Scrum profitiert, soll sich angesprochen fühlen.</p>\n<p>Beim Einsatz von Scrum können Muster, Prozesse und Erkenntnisse angewendet und entwickelt werden, die zum Scrum-Rahmenwerk passen, wie es in diesem Dokument beschrieben ist. Ihre Beschreibung geht über den Zweck des Scrum Guides hinaus, da sie kontextabhängig sind und sich, je nachdem wie Scrum eingesetzt wird, stark unterscheiden. Solche Taktiken für die Anwendung innerhalb des Scrum-Rahmenwerks variieren stark und werden an anderer Stelle beschrieben.</p>\n<p>Ken Schwaber &amp; Jeff Sutherland, Juli 2020</p>\n<p class=\"sg-legal\">© 2020 Ken Schwaber and Jeff Sutherland</p>\n<p class=\"sg-legal\">This publication is offered for license under the Attribution Share-Alike license of Creative Commons, accessible at http://creativecommons.org/licenses/by-sa/4.0/legalcode and also described in summary form at http://creativecommons.org/licenses/by-sa/4.0/. By utilizing this Scrum Guide, you acknowledge and agree that you have read and agree to be bound by the terms of the Attribution Share-Alike license of Creative Commons.</p>\n<h3 id=\"sg-scrum-definition\">Scrum-Definition</h3>\n<p>Scrum ist ein leichtgewichtiges Rahmenwerk, welches Menschen, Teams und Organisationen hilft, Wert durch adaptive Lösungen für komplexe Probleme zu generieren.</p>\n<p>Kurz gesagt fordert Scrum, dass ein:e <span class=\"term\" tabindex=\"0\" data-tip=\"0\">Scrum Master:in</span> ein Umfeld fördert, in dem</p>\n<ol><li>ein:e <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner:in</span> die Arbeit für ein komplexes Problem in ein <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span> einsortiert;</li><li>das <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> aus einer Auswahl dieser Arbeit innerhalb eines <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprints</span> ein wertvolles <span class=\"term\" tabindex=\"0\" data-tip=\"4\">Increment</span> erzeugt;</li><li>das <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> und dessen <span class=\"term\" tabindex=\"0\" data-tip=\"6\">Stakeholder:innen</span> die Ergebnisse überprüfen und für den nächsten <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span> anpassen;</li><li>diese Schritte wiederholt werden.</li></ol>\n<p>Scrum ist einfach. Probiere es so aus, wie es ist, und finde heraus, ob seine Philosophie, Theorie und Struktur dabei helfen, Ziele zu erreichen und Wert zu schaffen. Das Scrum-Rahmenwerk ist <span class=\"term\" tabindex=\"0\" data-tip=\"7\">absichtlich unvollständig</span> und definiert nur die Teile, die zur Umsetzung der Scrum-Theorie erforderlich sind. Scrum baut auf der kollektiven Intelligenz der Personen auf, die es anwenden. Anstatt den Menschen detaillierte Anweisungen zu geben, leiten die Regeln von Scrum ihre Beziehungen und Interaktionen.</p>\n<p>Innerhalb des Rahmenwerks können verschiedene Prozesse, Techniken und Methoden eingesetzt werden. Scrum umhüllt bestehende Praktiken oder macht sie überflüssig. Scrum macht die relative Wirksamkeit des aktuellen Managements, der Umgebung und der Arbeitstechniken sichtbar, so dass Verbesserungen vorgenommen werden können.</p>\n<h3 id=\"sg-scrum-theory\">Scrum-Theorie</h3>\n<p>Scrum basiert auf <span class=\"term\" tabindex=\"0\" data-tip=\"8\">Empirie</span> und <span class=\"term\" tabindex=\"0\" data-tip=\"9\">Lean Thinking</span>. Empirie bedeutet, dass Wissen aus Erfahrung gewonnen wird und Entscheidungen auf der Grundlage von Beobachtungen getroffen werden. Lean Thinking reduziert Verschwendung und fokussiert auf das Wesentliche.</p>\n<p>Scrum verwendet einen iterativen, inkrementellen Ansatz zur Optimierung der Vorhersagbarkeit und zur Risikokontrolle. Scrum setzt auf Personengruppen, die gemeinsam über alle Fähigkeiten und Fachkenntnisse verfügen, um die Arbeit zu erledigen und solche Fähigkeiten im Bedarfsfall zu teilen oder zu erwerben.</p>\n<p>Scrum kombiniert vier formale Events zur <span class=\"term\" tabindex=\"0\" data-tip=\"10\">Überprüfung</span> und <span class=\"term\" tabindex=\"0\" data-tip=\"11\">Anpassung</span> innerhalb eines umspannenden Events, des <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprints</span>. Diese Events funktionieren, weil sie die empirischen Scrum-Säulen <span class=\"term\" tabindex=\"0\" data-tip=\"12\">Transparenz</span>, Überprüfung und Anpassung implementieren.</p>\n<h4 id=\"sg-transparency\">Transparenz</h4>\n<p>Der sich entwickelnde Prozess und die entstehende Arbeit müssen sowohl für diejenigen sichtbar sein, die die Arbeit ausführen, als auch für diejenigen, die die Arbeit empfangen. Bei Scrum basieren wichtige Entscheidungen auf dem wahrgenommenen Zustand seiner drei formalen Artefakte. Artefakte, die wenig transparent sind, können zu Entscheidungen führen, die den Wert mindern und das Risiko erhöhen.</p>\n<p><span class=\"term\" tabindex=\"0\" data-tip=\"12\">Transparenz</span> ermöglicht <span class=\"term\" tabindex=\"0\" data-tip=\"10\">Überprüfung</span>. Eine Überprüfung ohne Transparenz ist irreführend und verschwenderisch.</p>\n<h4 id=\"sg-inspection\">Überprüfung</h4>\n<p>Die Scrum-Artefakte und der Fortschritt in Richtung der vereinbarten Ziele müssen häufig und sorgfältig überprüft werden, um potenziell unerwünschte Abweichungen oder Probleme aufzudecken. Um bei der <span class=\"term\" tabindex=\"0\" data-tip=\"10\">Überprüfung</span> zu helfen, bietet Scrum einen Rhythmus in Form seiner fünf Events.</p>\n<p><span class=\"term\" tabindex=\"0\" data-tip=\"10\">Überprüfung</span> ermöglicht <span class=\"term\" tabindex=\"0\" data-tip=\"11\">Anpassung</span>. Überprüfung ohne Anpassung wird als unsinnig betrachtet. Scrum Events sind darauf ausgerichtet, Veränderungen zu bewirken.</p>\n<h4 id=\"sg-adaptation\">Anpassung</h4>\n<p>Wenn einzelne Aspekte eines Prozesses von akzeptablen Grenzen abweichen oder wenn das resultierende Produkt nicht akzeptabel ist, müssen der angewandte Prozess oder die produzierten Ergebnisse angepasst werden. Die <span class=\"term\" tabindex=\"0\" data-tip=\"11\">Anpassung</span> muss so schnell wie möglich erfolgen, um weitere Abweichungen zu minimieren.</p>\n<p>Die <span class=\"term\" tabindex=\"0\" data-tip=\"11\">Anpassung</span> wird schwieriger, wenn die beteiligten Personen nicht bevollmächtigt (empowered) sind oder sich nicht <span class=\"term\" tabindex=\"0\" data-tip=\"13\">selbst managen</span> können. Von einem <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> wird erwartet, dass es sich in dem Moment anpasst, in dem es durch <span class=\"term\" tabindex=\"0\" data-tip=\"10\">Überprüfung</span> etwas Neues lernt.</p>\n<h3 id=\"sg-scrum-values\">Scrum-Werte</h3>\n<p>Die erfolgreiche Anwendung von Scrum hängt davon ab, dass die Menschen immer besser in der Lage sind, fünf Werte zu leben:</p>\n<p class=\"sg-center\"><strong><span class=\"term\" tabindex=\"0\" data-tip=\"14\">Commitment, Fokus, Offenheit, Respekt und Mut</span> </strong></p>\n<p>Das <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> committet sich, seine Ziele zu erreichen und sich gegenseitig zu unterstützen. Sein primärer Fokus liegt auf der Arbeit des <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprints</span>, um den bestmöglichen Fortschritt in Richtung dieser Ziele zu bewirken. Das Scrum Team und dessen <span class=\"term\" tabindex=\"0\" data-tip=\"6\">Stakeholder:innen</span> sind offen in Bezug auf die Arbeit und die Herausforderungen. Die Mitglieder des Scrum Teams respektieren sich gegenseitig als fähige, unabhängige Personen und werden als solche auch von den Menschen, mit denen sie zusammenarbeiten, respektiert. Die Mitglieder des Scrum Teams haben den Mut, das Richtige zu tun: an schwierigen Problemen zu arbeiten.</p>\n<p>Diese Werte geben dem <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> die Richtung vor, was seine Arbeit, seine Handlungen und sein Verhalten betrifft. Die Entscheidungen, die getroffen werden, die Schritte, die unternommen werden, und die Art und Weise, wie Scrum angewendet wird, sollten diese Werte stärken und nicht schmälern oder untergraben. Die Mitglieder des Scrum Teams lernen und erforschen die Werte, während sie in den Events und mit den Artefakten von Scrum arbeiten. Wenn diese Werte durch das Scrum Team und die Menschen, mit denen es arbeitet, verkörpert werden, werden die empirischen Scrum-Säulen <span class=\"term\" tabindex=\"0\" data-tip=\"12\">Transparenz</span>, <span class=\"term\" tabindex=\"0\" data-tip=\"10\">Überprüfung</span> und <span class=\"term\" tabindex=\"0\" data-tip=\"11\">Anpassung</span> lebendig und bauen Vertrauen auf.</p>\n<h3 id=\"sg-scrum-team\">Scrum Team</h3>\n<p>Der zentrale Bestandteil von Scrum ist ein kleines Team von Menschen, ein <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span>. Das Scrum Team besteht aus einem:einer <span class=\"term\" tabindex=\"0\" data-tip=\"0\">Scrum Master:in</span>, einem:einer <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner:in</span> und <span class=\"term\" tabindex=\"0\" data-tip=\"15\">Developer:innen</span>. Innerhalb eines Scrum Teams gibt es keine Teilteams oder Hierarchien. Es handelt sich um eine geschlossene Einheit von Fachleuten, die sich auf ein Ziel konzentrieren, das <span class=\"term\" tabindex=\"0\" data-tip=\"16\">Produkt-Ziel</span>.</p>\n<p><span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Teams</span> sind <span class=\"term\" tabindex=\"0\" data-tip=\"17\">interdisziplinär</span>, d.h. die Mitglieder verfügen über alle Fähigkeiten, die erforderlich sind, um in jedem <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span> Wert zu schaffen. Sie managen sich außerdem selbst, d.h. sie entscheiden intern, wer was wann und wie macht.</p>\n<p>Das <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> ist klein genug, um flink zu bleiben und groß genug, um innerhalb eines <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprints</span> bedeutsame Arbeit fertigzustellen, üblicherweise 10 oder weniger Personen. Im Allgemeinen haben wir festgestellt, dass kleinere Teams besser kommunizieren und produktiver sind. Wenn Scrum Teams zu groß werden, sollten sie in Erwägung ziehen, sich in mehrere zusammengehörende Scrum Teams zu reorganisieren, die sich alle auf dasselbe Produkt konzentrieren. Daher sollten sie sich <span class=\"term\" tabindex=\"0\" data-tip=\"16\">Produkt-Ziel</span>, <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span> und <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner:in</span> teilen.</p>\n<p>Das <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> ist umsetzungsverantwortlich (responsible) für alle produktbezogenen Aktivitäten: Zusammenarbeit mit den <span class=\"term\" tabindex=\"0\" data-tip=\"6\">Stakeholder:innen</span>, Verifikation, Wartung, Betrieb, Experimente, Forschung und Entwicklung und alles, was sonst noch erforderlich sein könnte. Es ist von der Organisation so aufgebaut und befähigt, dass es seine Arbeit selbst steuert. Das Arbeiten in <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprints</span> mit einer nachhaltigen Geschwindigkeit verbessert den Fokus und die Kontinuität des Scrum Teams.</p>\n<p>Das gesamte <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> ist ergebnisverantwortlich (accountable), in jedem <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span> ein wertvolles, nützliches <span class=\"term\" tabindex=\"0\" data-tip=\"4\">Increment</span> zu schaffen. Scrum definiert drei spezifische <span class=\"term\" tabindex=\"0\" data-tip=\"19\">Ergebnisverantwortlichkeiten</span> innerhalb des Scrum Teams: <span class=\"term\" tabindex=\"0\" data-tip=\"15\">Developer:innen</span>, <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner:in</span> und <span class=\"term\" tabindex=\"0\" data-tip=\"0\">Scrum Master:in</span></p>\n<h4 id=\"sg-developers\">Developer:innen</h4>\n<p><span class=\"term\" tabindex=\"0\" data-tip=\"15\">Developer:innen</span> sind jene Personen im <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span>, die sich der Aufgabe verschrieben haben, jeden <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span> jeden Aspekt eines nutzbaren <span class=\"term\" tabindex=\"0\" data-tip=\"4\">Increments</span> zu schaffen.</p>\n<p>Die spezifischen Fähigkeiten, die von den <span class=\"term\" tabindex=\"0\" data-tip=\"15\">Developer:innen</span> benötigt werden, sind oft breit gefächert und variieren je nach Arbeitskontext. Die Developer:innen sind jedoch immer ergebnisverantwortlich dafür,</p>\n<ul><li>einen Plan für den <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span> zu erstellen, das <span class=\"term\" tabindex=\"0\" data-tip=\"20\">Sprint Backlog</span>;</li><li>Qualität durch die Einhaltung einer <span class=\"term\" tabindex=\"0\" data-tip=\"21\">Definition of Done</span> einzubringen;</li><li>täglich ihren Plan zur Erreichung des <span class=\"term\" tabindex=\"0\" data-tip=\"22\">Sprint-Ziels</span> anzupassen; und</li><li>sich wechselseitig als Expert:innen zur Verantwortung zu ziehen.</li></ul>\n<h4 id=\"sg-product-owner\">Product Owner:in</h4>\n<p>Der:die <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner:in</span> ist ergebnisverantwortlich für die Maximierung des Wertes des Produkts, der sich aus der Arbeit des <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Teams</span> ergibt. Wie dies geschieht, kann je nach Organisation, Scrum Team und Individuum sehr unterschiedlich sein.</p>\n<p>Der:die <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner:in</span> ist auch für ein effektives Product-Backlog-Management ergebnisverantwortlich, das Folgendes umfasst:</p>\n<ul><li>das <span class=\"term\" tabindex=\"0\" data-tip=\"16\">Produkt-Ziel</span> zu entwickeln und explizit zu kommunizieren;</li><li>die Product-Backlog-Einträge zu erstellen und klar zu kommunizieren;</li><li>die Reihenfolge der Product-Backlog-Einträge festzulegen; und</li><li>sicherzustellen, dass das <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span> transparent, sichtbar und verstanden ist.</li></ul>\n<p>Der:die <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner:in</span> kann die oben genannten Arbeiten selbst durchführen oder die Umsetzungsverantwortung an andere delegieren. Unabhängig davon bleibt der:die Product Owner:in ergebnisverantwortlich.</p>\n<p>Damit der:die <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner:in</span> Erfolg haben kann, muss die gesamte Organisation seine:ihre Entscheidungen respektieren. Diese Entscheidungen sind im Inhalt und in der Reihenfolge des <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlogs</span> sowie durch das überprüfbare <span class=\"term\" tabindex=\"0\" data-tip=\"4\">Increment</span> beim <span class=\"term\" tabindex=\"0\" data-tip=\"23\">Sprint Review</span>, sichtbar.</p>\n<p>Der:die <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner:in</span> ist eine Person, kein Gremium. Der:die Product Owner:in kann die Bedürfnisse vieler <span class=\"term\" tabindex=\"0\" data-tip=\"6\">Stakeholder:innen</span> im <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span> berücksichtigen. Diejenigen, die das Product Backlog ändern möchten, können dies tun, indem sie versuchen, den:die Product Owner:in zu überzeugen.</p>\n<h4 id=\"sg-scrum-master\">Scrum Master:in</h4>\n<p>Der:die <span class=\"term\" tabindex=\"0\" data-tip=\"0\">Scrum Master:in</span> ist ergebnisverantwortlich für die Einführung von Scrum, wie es im Scrum Guide definiert ist. Er:sie tut dies, indem er:sie allen dabei hilft, die Scrum-Theorie und -Praxis zu verstehen, sowohl innerhalb des <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Teams</span> als auch in der Organisation.</p>\n<p>Der:die <span class=\"term\" tabindex=\"0\" data-tip=\"0\">Scrum Master:in</span> ist ergebnisverantwortlich für die Effektivität des <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Teams</span>. Er:sie tut dies, indem er:sie das Scrum Team in die Lage versetzt, seine Praktiken innerhalb des Scrum-Rahmenwerks zu verbessern.</p>\n<p>Scrum Master:innen sind echte Führungspersönlichkeiten, die dem <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> und der Gesamtorganisation dienen.</p>\n<p>Der:die <span class=\"term\" tabindex=\"0\" data-tip=\"0\">Scrum Master:in</span> dient dem <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> auf unterschiedliche Weise, unter anderem dadurch,</p>\n<ul><li>die Teammitglieder in <span class=\"term\" tabindex=\"0\" data-tip=\"13\">Selbstmanagement</span> und interdisziplinärer Zusammenarbeit zu coachen;</li><li>das <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> bei der Fokussierung auf die Schaffung von hochwertigen <span class=\"term\" tabindex=\"0\" data-tip=\"4\">Increments</span> zu unterstützen, die der <span class=\"term\" tabindex=\"0\" data-tip=\"21\">Definition of Done</span> entsprechen;</li><li>die Beseitigung von <span class=\"term\" tabindex=\"0\" data-tip=\"24\">Hindernissen</span> (impediments) für den Fortschritt des <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Teams</span> zu bewirken; und</li><li>sicherzustellen, dass alle Events von Scrum stattfinden, positiv und produktiv sind und innerhalb der <span class=\"term\" tabindex=\"0\" data-tip=\"25\">Timebox</span> bleiben.</li></ul>\n<p>Der:die <span class=\"term\" tabindex=\"0\" data-tip=\"0\">Scrum Master:in</span> dient dem:der <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner:in</span> auf unterschiedliche Weise, unter anderem dadurch,</p>\n<ul><li>bei der Suche nach Techniken zur effektiven Definition des <span class=\"term\" tabindex=\"0\" data-tip=\"16\">Produkt-Ziels</span> und zum Product-Backlog-Management zu helfen;</li><li>dem <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> dabei zu helfen, die Notwendigkeit klarer und prägnanter Product-Backlog-Einträge zu verstehen;</li><li>bei der Etablierung einer empirischen Produktplanung für ein komplexes Umfeld zu helfen; und</li><li>die Zusammenarbeit mit <span class=\"term\" tabindex=\"0\" data-tip=\"6\">Stakeholder:innen</span> nach Wunsch oder Bedarf zu fördern (facilitate).</li></ul>\n<p>Der:die <span class=\"term\" tabindex=\"0\" data-tip=\"0\">Scrum Master:in</span> dient der Organisation auf unterschiedliche Weise, unter anderem dadurch,</p>\n<ul><li>die Organisation bei der Einführung von Scrum zu führen, zu schulen und zu coachen;</li><li>Einführungen von Scrum in der Organisation zu planen und zu empfehlen;</li><li>Mitarbeitende und <span class=\"term\" tabindex=\"0\" data-tip=\"6\">Stakeholder:innen</span> beim Verständnis und bei der Umsetzung eines empirischen Ansatzes für komplexe Arbeit zu unterstützen; und</li><li>Barrieren zwischen <span class=\"term\" tabindex=\"0\" data-tip=\"6\">Stakeholder:innen</span> und <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Teams</span> zu beseitigen.</li></ul>\n<h3 id=\"sg-scrum-events\">Scrum Events</h3>\n<p>Der <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span> ist ein Container für alle anderen Events. Jedes Event in Scrum ist eine formelle Gelegenheit, Scrum-Artefakte zu überprüfen und anzupassen. Diese Events sind speziell darauf ausgelegt, die erforderliche <span class=\"term\" tabindex=\"0\" data-tip=\"12\">Transparenz</span> zu ermöglichen. Wenn ein Event nicht wie vorgeschrieben durchgeführt wird, verpasst man die Gelegenheit, zu überprüfen und anzupassen. Events werden in Scrum verwendet, um Regelmäßigkeit zu schaffen und die Notwendigkeit von Meetings, die in Scrum nicht definiert sind, zu minimieren. Optimalerweise werden alle Events zur selben Zeit und am selben Ort abgehalten, um die Komplexität zu reduzieren.</p>\n<h4 id=\"sg-sprint\">Der Sprint</h4>\n<p><span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprints</span> sind der Herzschlag von Scrum, wo Ideen in Wert umgewandelt werden.</p>\n<p>Es sind Events mit fester Länge von einem Monat oder weniger, um Konsistenz zu schaffen. Ein neuer <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span> beginnt unmittelbar nach dem Abschluss des vorherigen Sprints.</p>\n<p>Alle Arbeiten, die notwendig sind, um das <span class=\"term\" tabindex=\"0\" data-tip=\"16\">Produkt-Ziel</span> zu erreichen, einschließlich <span class=\"term\" tabindex=\"0\" data-tip=\"26\">Sprint Planning</span>, Daily Scrums, <span class=\"term\" tabindex=\"0\" data-tip=\"23\">Sprint Review</span> und <span class=\"term\" tabindex=\"0\" data-tip=\"27\">Sprint Retrospective</span>, finden innerhalb der <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprints</span> statt.</p>\n<p>Während des <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprints</span></p>\n<ul><li>werden keine Änderungen vorgenommen, die das <span class=\"term\" tabindex=\"0\" data-tip=\"22\">Sprint-Ziel</span> gefährden würden;</li><li>nimmt die Qualität nicht ab;</li><li>wird das <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span> nach Bedarf verfeinert; und</li><li>kann der Scope (Inhalt und Umfang) geklärt und mit dem:der <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner:in</span> neu vereinbart werden, sobald mehr Erkenntnisse vorliegen.</li></ul>\n<p><span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprints</span> ermöglichen Vorhersagbarkeit, indem sie mindestens jeden Kalendermonat eine <span class=\"term\" tabindex=\"0\" data-tip=\"10\">Überprüfung</span> und <span class=\"term\" tabindex=\"0\" data-tip=\"11\">Anpassung</span> der Fortschritte in Richtung eines <span class=\"term\" tabindex=\"0\" data-tip=\"16\">Produkt-Ziels</span> gewährleisten. Wenn der Horizont eines Sprints zu lang ist, kann das <span class=\"term\" tabindex=\"0\" data-tip=\"22\">Sprint-Ziel</span> hinfällig werden, die Komplexität kann steigen und das Risiko kann zunehmen. Kürzere Sprints können eingesetzt werden, um mehr Lernzyklen zu generieren und das Risiko von Kosten und Aufwand auf einen kleineren Zeitrahmen zu begrenzen. Jeder Sprint kann als ein kurzes Projekt betrachtet werden.</p>\n<p>Es gibt verschiedene Vorgehensweisen, um den Fortschritt vorherzusagen, wie <span class=\"term\" tabindex=\"0\" data-tip=\"28\">Burn-Down-Charts</span>, Burn-Up-Charts oder Cumulative-Flow-Diagramme. Diese haben sich zwar als nützlich erwiesen, ersetzen jedoch nicht die Bedeutung der <span class=\"term\" tabindex=\"0\" data-tip=\"8\">Empirie</span>. In komplexen Umgebungen ist unbekannt, was passieren wird. Nur was bereits geschehen ist, kann für eine vorausschauende Entscheidungsfindung genutzt werden.</p>\n<p>Ein <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span> könnte <span class=\"term\" tabindex=\"0\" data-tip=\"29\">abgebrochen</span> werden, wenn das <span class=\"term\" tabindex=\"0\" data-tip=\"22\">Sprint-Ziel</span> obsolet wird. Nur der:die <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner:in</span> hat die Befugnis, den Sprint abzubrechen.</p>\n<h4 id=\"sg-sprint-planning\">Sprint Planning</h4>\n<p>Das <span class=\"term\" tabindex=\"0\" data-tip=\"26\">Sprint Planning</span> initiiert den <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span>, indem es die für den Sprint auszuführenden Arbeiten darlegt. Dieser resultierende Plan wird durch die gemeinschaftliche Arbeit des gesamten <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Teams</span> erstellt.</p>\n<p>Der:die <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner:in</span> stellt sicher, dass die Teilnehmenden vorbereitet sind, die wichtigsten Product-Backlog-Einträge zu besprechen, und wie sie dem <span class=\"term\" tabindex=\"0\" data-tip=\"16\">Produkt-Ziel</span> zuzuordnen sind. Das <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> kann zu Beratungszwecken auch andere Personen zur Teilnahme am <span class=\"term\" tabindex=\"0\" data-tip=\"26\">Sprint Planning</span> einladen.</p>\n<p>Das <span class=\"term\" tabindex=\"0\" data-tip=\"26\">Sprint Planning</span> behandelt die folgenden Themen:</p>\n<p>Thema Eins: Warum ist dieser <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span> wertvoll? Der:die <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner:in</span> schlägt vor, wie das Produkt im aktuellen Sprint seinen Wert und Nutzen steigern könnte. Das gesamte <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> arbeitet dann zusammen, um ein <span class=\"term\" tabindex=\"0\" data-tip=\"22\">Sprint-Ziel</span> zu definieren, das verdeutlicht, warum der Sprint für die <span class=\"term\" tabindex=\"0\" data-tip=\"6\">Stakeholder:innen</span> wertvoll ist. Das Sprint-Ziel muss vor dem Ende des Sprint Plannings finalisiert sein.</p>\n<p>Thema Zwei: Was kann in diesem <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span> abgeschlossen (Done) werden? Im Gespräch mit dem:der <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner:in</span> wählen die <span class=\"term\" tabindex=\"0\" data-tip=\"15\">Developer:innen</span> Einträge aus dem <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span> aus, die in den aktuellen Sprint aufgenommen werden sollen. Das <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> kann diese Einträge während dieses Prozesses verfeinern, was Verständnis und Vertrauen erhöht.</p>\n<p>Die Auswahl, wie viel innerhalb eines <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprints</span> abgeschlossen werden kann, kann eine Herausforderung darstellen. Je mehr die <span class=\"term\" tabindex=\"0\" data-tip=\"15\">Developer:innen</span> jedoch über ihre bisherige Leistung, ihre zukünftige Kapazität und ihre <span class=\"term\" tabindex=\"0\" data-tip=\"21\">Definition of Done</span> wissen, desto sicherer werden sie in ihren Sprint-Vorhersagen sein.</p>\n<p>Thema Drei: Wie wird die ausgewählte Arbeit erledigt? Für jeden ausgewählten Product-Backlog-Eintrag planen die <span class=\"term\" tabindex=\"0\" data-tip=\"15\">Developer:innen</span> die notwendige Arbeit, um ein <span class=\"term\" tabindex=\"0\" data-tip=\"4\">Increment</span> zu erstellen, das der <span class=\"term\" tabindex=\"0\" data-tip=\"21\">Definition of Done</span> entspricht. Dies geschieht oft durch Zerlegung von Product-Backlog-Einträgen in kleinere Arbeitseinheiten von einem Tag oder weniger. Wie dies geschieht, liegt im alleinigen Ermessen der Developer:innen. Niemand sonst sagt ihnen, wie sie Product-Backlog-Einträge in Increments von Wert umwandeln sollen.</p>\n<p>Das <span class=\"term\" tabindex=\"0\" data-tip=\"22\">Sprint-Ziel</span>, die für den <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span> ausgewählten Product-Backlog-Einträge und der Plan für deren Lieferung werden zusammenfassend als <span class=\"term\" tabindex=\"0\" data-tip=\"20\">Sprint Backlog</span> bezeichnet.</p>\n<p>Das <span class=\"term\" tabindex=\"0\" data-tip=\"26\">Sprint Planning</span> ist <span class=\"term\" tabindex=\"0\" data-tip=\"25\">zeitlich beschränkt</span> auf maximal acht Stunden für einen einmonatigen <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span>. Bei kürzeren Sprints ist das Event in der Regel kürzer.</p>\n<h4 id=\"sg-daily-scrum\">Daily Scrum</h4>\n<p>Der Zweck des Daily Scrums besteht darin, den Fortschritt in Richtung des <span class=\"term\" tabindex=\"0\" data-tip=\"22\">Sprint-Ziels</span> zu überprüfen und das <span class=\"term\" tabindex=\"0\" data-tip=\"20\">Sprint Backlog</span> bei Bedarf anzupassen, um die bevorstehende geplante Arbeit zu justieren.</p>\n<p>Das <span class=\"term\" tabindex=\"0\" data-tip=\"30\">Daily Scrum</span> ist ein 15-minütiges Event für die <span class=\"term\" tabindex=\"0\" data-tip=\"15\">Developer:innen</span> des <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Teams</span>. Um die Komplexität zu reduzieren, wird es an jedem Arbeitstag des <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprints</span> zur gleichen Zeit und am gleichen Ort abgehalten. Falls der:die <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner:in</span> oder der:die <span class=\"term\" tabindex=\"0\" data-tip=\"0\">Scrum Master:in</span> aktiv an Einträgen des <span class=\"term\" tabindex=\"0\" data-tip=\"20\">Sprint Backlogs</span> arbeitet, nimmt er:sie als Developer:in teil.</p>\n<p>Die <span class=\"term\" tabindex=\"0\" data-tip=\"15\">Developer:innen</span> können Struktur und Techniken beliebig wählen, solange ihr <span class=\"term\" tabindex=\"0\" data-tip=\"30\">Daily Scrum</span> sich auf den Fortschritt in Richtung des <span class=\"term\" tabindex=\"0\" data-tip=\"22\">Sprint-Ziels</span> fokussiert und einen umsetzbaren Plan für den nächsten Arbeitstag erstellt. Das schafft Fokus und fördert <span class=\"term\" tabindex=\"0\" data-tip=\"13\">Selbstmanagement</span>.</p>\n<p>Daily Scrums verbessern die Kommunikation, identifizieren <span class=\"term\" tabindex=\"0\" data-tip=\"24\">Hindernisse</span>, fördern die schnelle Entscheidungsfindung und eliminieren konsequent die Notwendigkeit für andere Meetings.</p>\n<p>Das <span class=\"term\" tabindex=\"0\" data-tip=\"30\">Daily Scrum</span> ist nicht die einzige Gelegenheit, bei der die <span class=\"term\" tabindex=\"0\" data-tip=\"15\">Developer:innen</span> ihren Plan anpassen dürfen. Sie treffen sich oftmals während des Tages für detailliertere Diskussionen zur Anpassung oder Neuplanung der restlichen Arbeit des <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprints</span>.</p>\n<h4 id=\"sg-sprint-review\">Sprint Review</h4>\n<p>Zweck des <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span> Reviews ist es, das Ergebnis des Sprints zu überprüfen und künftige Anpassungen festzulegen. Das <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> stellt die Ergebnisse seiner Arbeit den wichtigsten <span class=\"term\" tabindex=\"0\" data-tip=\"6\">Stakeholder:innen</span> vor, und die Fortschritte in Richtung des <span class=\"term\" tabindex=\"0\" data-tip=\"16\">Produkt-Ziels</span> werden diskutiert.</p>\n<p>Während des Events überprüfen das <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> und die <span class=\"term\" tabindex=\"0\" data-tip=\"6\">Stakeholder:innen</span>, was im <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span> erreicht wurde und was sich in ihrem Umfeld verändert hat. Auf der Grundlage dieser Informationen arbeiten die Teilnehmenden gemeinsam daran, was als Nächstes zu tun ist. Auch kann das <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span> angepasst werden, um neue Möglichkeiten wahrzunehmen. Das <span class=\"term\" tabindex=\"0\" data-tip=\"23\">Sprint Review</span> ist ein Arbeitstermin, und das Scrum Team sollte vermeiden, es auf eine Präsentation zu beschränken.</p>\n<p>Das <span class=\"term\" tabindex=\"0\" data-tip=\"23\">Sprint Review</span> ist das vorletzte Event des <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprints</span> und ist für einen einmonatigen Sprint auf maximal vier Stunden <span class=\"term\" tabindex=\"0\" data-tip=\"25\">zeitlich beschränkt</span>. Bei kürzeren Sprints ist das Event in der Regel kürzer.</p>\n<h4 id=\"sg-sprint-retrospective\">Sprint Retrospective</h4>\n<p>Der Zweck der <span class=\"term\" tabindex=\"0\" data-tip=\"27\">Sprint Retrospective</span> ist es, Wege zur Steigerung von Qualität und Effektivität zu planen.</p>\n<p>Das <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> überprüft, wie der letzte <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span> in Bezug auf Individuen, Interaktionen, Prozesse, Werkzeuge und seine <span class=\"term\" tabindex=\"0\" data-tip=\"21\">Definition of Done</span> verlief. Die überprüften Elemente variieren oft je nach Arbeitsdomäne. Annahmen, die das Team in die Irre geführt haben, werden identifiziert und ihre Ursprünge erforscht. Das Scrum Team bespricht, was während des Sprints gut gelaufen ist, auf welche Probleme es gestoßen ist und wie diese Probleme gelöst wurden (oder auch nicht).</p>\n<p>Das <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> identifiziert die hilfreichsten Änderungen, um seine Effektivität zu verbessern. Die wirkungsvollsten Verbesserungen werden so schnell wie möglich in Angriff genommen. Sie können sogar in das <span class=\"term\" tabindex=\"0\" data-tip=\"20\">Sprint Backlog</span> für den nächsten <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span> aufgenommen werden.</p>\n<p>Die <span class=\"term\" tabindex=\"0\" data-tip=\"27\">Sprint Retrospective</span> schließt den <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span> ab. Sie ist für einen einmonatigen Sprint auf maximal drei Stunden beschränkt. Bei kürzeren Sprints ist das Event in der Regel kürzer.</p>\n<h3 id=\"sg-scrum-artifacts\">Scrum-Artefakte</h3>\n<p>Die Artefakte von Scrum repräsentieren Arbeit oder Wert. Sie sind dafür ausgelegt, die <span class=\"term\" tabindex=\"0\" data-tip=\"12\">Transparenz</span> von Schlüsselinformationen zu maximieren. So haben alle, die sie überprüfen, die gleiche Grundlage für Anpassungen.</p>\n<p>Jedes Artefakt beinhaltet ein <span class=\"term\" tabindex=\"0\" data-tip=\"31\">Commitment</span>, um sicherzustellen, dass Informationen bereitgestellt werden, welche <span class=\"term\" tabindex=\"0\" data-tip=\"12\">Transparenz</span> und Fokus verbessern, um den Fortschritt messbar zu machen:</p>\n<ul><li>Für das <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span> ist es das <span class=\"term\" tabindex=\"0\" data-tip=\"16\">Produkt-Ziel</span>.</li><li>Für das <span class=\"term\" tabindex=\"0\" data-tip=\"20\">Sprint Backlog</span> ist es das <span class=\"term\" tabindex=\"0\" data-tip=\"22\">Sprint-Ziel</span>.</li><li>Für das <span class=\"term\" tabindex=\"0\" data-tip=\"4\">Increment</span> ist es die <span class=\"term\" tabindex=\"0\" data-tip=\"21\">Definition of Done</span>.</li></ul>\n<p>Diese <span class=\"term\" tabindex=\"0\" data-tip=\"31\">Commitments</span> dienen dazu, <span class=\"term\" tabindex=\"0\" data-tip=\"8\">Empirie</span> und die Scrum-Werte für das <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> und seine <span class=\"term\" tabindex=\"0\" data-tip=\"6\">Stakeholder:innen</span> zu verstärken.</p>\n<h4 id=\"sg-product-backlog\">Product Backlog</h4>\n<p>Das <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span> ist eine emergente, geordnete Liste der Dinge, die zur Produktverbesserung benötigt werden. Es ist die einzige Quelle von Arbeit, die durch das <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> erledigt wird.</p>\n<p>Product-Backlog-Einträge, die durch das <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> innerhalb eines <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprints</span> abgeschlossen (Done) werden können, gelten als bereit für die Auswahl in einem Sprint-Planning-Event. Diesen Transparenzgrad erlangen sie in der Regel durch Refinement-Aktivitäten. Das <span class=\"term\" tabindex=\"0\" data-tip=\"32\">Refinement</span> des <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlogs</span> ist der Vorgang, durch den Product-Backlog-Einträge in kleinere, präzisere Elemente zerlegt und weiter definiert werden. Dies ist eine kontinuierliche Aktivität, wodurch weitere Details wie Beschreibung, Reihenfolge und Größe ergänzt werden. Die Attribute variieren oft je nach Arbeitsumfeld.</p>\n<p>Die <span class=\"term\" tabindex=\"0\" data-tip=\"15\">Developer:innen</span>, die die Arbeit erledigen werden, sind für die <span class=\"term\" tabindex=\"0\" data-tip=\"33\">Größenbestimmung</span> umsetzungsverantwortlich. Der:die <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner:in</span> kann die Developer:innen beeinflussen, indem er:sie dabei unterstützt, die Product-Backlog-Einträge zu verstehen und Kompromisse einzugehen.</p>\n<h5 id=\"sg-commitment-product-goal\">Commitment: Produkt-Ziel</h5>\n<p>Das <span class=\"term\" tabindex=\"0\" data-tip=\"16\">Produkt-Ziel</span> beschreibt einen zukünftigen Zustand des Produkts, welches dem <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> als Planungsziel dienen kann. Das Produkt-Ziel befindet sich im <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span>. Der Rest des Product Backlogs entsteht, um zu definieren, „was“ das Produkt-Ziel erfüllt.</p>\n<p><em>Ein Produkt ist ein Instrument, um Wert zu liefern. Es hat klare Grenzen, bekannte </em> <em><span class=\"term\" tabindex=\"0\" data-tip=\"6\">Stakeholder:innen</span>, eindeutig definierte Benutzer:innen oder Kund:innen. Ein Produkt kann eine </em> <em>Dienstleistung, ein physisches Produkt oder etwas Abstrakteres sein. </em></p>\n<p>Das <span class=\"term\" tabindex=\"0\" data-tip=\"16\">Produkt-Ziel</span> ist das langfristige Ziel für das <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span>. Das Scrum Team muss eine Zielvorgabe erfüllen (oder aufgeben), bevor es die nächste angeht.</p>\n<h4 id=\"sg-sprint-backlog\">Sprint Backlog</h4>\n<p>Das <span class=\"term\" tabindex=\"0\" data-tip=\"20\">Sprint Backlog</span> besteht aus dem <span class=\"term\" tabindex=\"0\" data-tip=\"22\">Sprint-Ziel</span> (Wofür), den für den <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span> ausgewählten Product-Backlog-Einträgen (Was) sowie einem umsetzbaren Plan für die Lieferung des <span class=\"term\" tabindex=\"0\" data-tip=\"4\">Increments</span> (Wie).</p>\n<p>Das <span class=\"term\" tabindex=\"0\" data-tip=\"20\">Sprint Backlog</span> ist ein Plan von und für die <span class=\"term\" tabindex=\"0\" data-tip=\"15\">Developer:innen</span>. Es ist ein deutlich sichtbares Echtzeitbild der Arbeit, welche die Developer:innen während des <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprints</span> zur Erreichung des <span class=\"term\" tabindex=\"0\" data-tip=\"22\">Sprint-Ziels</span> ausführen wollen. Folglich wird das Sprint Backlog während des gesamten Sprints immer dann aktualisiert, wenn mehr gelernt wurde. Es sollte genügend Details beinhalten, damit sie ihren Fortschritt im <span class=\"term\" tabindex=\"0\" data-tip=\"30\">Daily Scrum</span> überprüfen können.</p>\n<h5 id=\"sg-commitment-sprint-goal\">Commitment: Sprint-Ziel</h5>\n<p>Das <span class=\"term\" tabindex=\"0\" data-tip=\"22\">Sprint-Ziel</span> ist die einzige Zielsetzung für den <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span>. Obwohl das Sprint-Ziel ein <span class=\"term\" tabindex=\"0\" data-tip=\"31\">Commitment</span> der <span class=\"term\" tabindex=\"0\" data-tip=\"15\">Developer:innen</span> ist, bietet es Flexibilität in Bezug auf die genaue Arbeit, die erforderlich ist, um es zu erreichen. Das Sprint-Ziel schafft auch Kohärenz und Fokus und ermutigt somit das <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span>, zusammen statt in separaten Initiativen zu arbeiten.</p>\n<p>Das <span class=\"term\" tabindex=\"0\" data-tip=\"22\">Sprint-Ziel</span> wird während des Sprint-Planning-Events erstellt und dann zum <span class=\"term\" tabindex=\"0\" data-tip=\"20\">Sprint Backlog</span> hinzugefügt. Während die <span class=\"term\" tabindex=\"0\" data-tip=\"15\">Developer:innen</span> innerhalb des <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprints</span> arbeiten, behalten sie das Sprint-Ziel im Gedächtnis. Wenn sich herausstellt, dass die Arbeit von ihren Erwartungen abweicht, arbeiten sie mit dem:der <span class=\"term\" tabindex=\"0\" data-tip=\"1\">Product Owner:in</span> zusammen, um den Umfang des Sprint Backlogs innerhalb des Sprints zu verhandeln, ohne das Sprint-Ziel zu beeinflussen.</p>\n<h4 id=\"sg-increment\">Increment</h4>\n<p>Ein <span class=\"term\" tabindex=\"0\" data-tip=\"4\">Increment</span> ist ein konkreter Schritt in Richtung des <span class=\"term\" tabindex=\"0\" data-tip=\"16\">Produkt-Ziels</span>. Jedes Increment ist additiv zu allen vorherigen Increments und gründlich geprüft, um sicherzustellen, dass sie alle zusammen funktionieren. Um einen Mehrwert zu erzielen, muss das Increment verwendbar sein.</p>\n<p>Innerhalb eines <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprints</span> kann mehr als ein <span class=\"term\" tabindex=\"0\" data-tip=\"4\">Increment</span> erstellt werden. Deren Summe wird im <span class=\"term\" tabindex=\"0\" data-tip=\"23\">Sprint Review</span> vorgestellt, womit <span class=\"term\" tabindex=\"0\" data-tip=\"8\">Empirie</span> unterstützt wird. Ein Increment könnte jedoch auch schon vor Ende des Sprints an die <span class=\"term\" tabindex=\"0\" data-tip=\"6\">Stakeholder:innen</span> geliefert werden. Das Sprint Review sollte niemals als Barriere zur Lieferung von Wert angesehen werden.</p>\n<p>Arbeit kann nicht als Teil eines <span class=\"term\" tabindex=\"0\" data-tip=\"4\">Increments</span> betrachtet werden, solange sie nicht der <span class=\"term\" tabindex=\"0\" data-tip=\"21\">Definition of Done</span> entspricht.</p>\n<h5 id=\"sg-commitment-definition-of-done\">Commitment: Definition of Done</h5>\n<p>Die <span class=\"term\" tabindex=\"0\" data-tip=\"21\">Definition of Done</span> ist eine formale Beschreibung des Zustands des <span class=\"term\" tabindex=\"0\" data-tip=\"4\">Increments</span>, wenn es die für das Produkt erforderlichen Qualitätsmaßnahmen erfüllt.</p>\n<p>In dem Moment, in dem ein Product-Backlog-Eintrag die <span class=\"term\" tabindex=\"0\" data-tip=\"21\">Definition of Done</span> erfüllt, wird ein <span class=\"term\" tabindex=\"0\" data-tip=\"4\">Increment</span> geboren.</p>\n<p>Die <span class=\"term\" tabindex=\"0\" data-tip=\"21\">Definition of Done</span> schafft <span class=\"term\" tabindex=\"0\" data-tip=\"12\">Transparenz</span>, indem sie allen ein gemeinsames Verständnis darüber vermittelt, welche Arbeiten als Teil des <span class=\"term\" tabindex=\"0\" data-tip=\"4\">Increments</span> abgeschlossen wurden. Wenn ein Product-Backlog-Eintrag nicht der Definition of Done entspricht, kann es weder released noch beim <span class=\"term\" tabindex=\"0\" data-tip=\"23\">Sprint Review</span> präsentiert werden. Stattdessen wandert es zur zukünftigen Berücksichtigung in das <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span> zurück.</p>\n<p>Wenn die <span class=\"term\" tabindex=\"0\" data-tip=\"21\">Definition of Done</span> für ein <span class=\"term\" tabindex=\"0\" data-tip=\"4\">Increment</span> Teil der Standards der Organisation ist, müssen alle <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Teams</span> diese als Mindestmaß befolgen. Wenn sie kein Organisationsstandard ist, muss das Scrum Team eine für das Produkt geeignete Definition of Done erstellen.</p>\n<p>Die <span class=\"term\" tabindex=\"0\" data-tip=\"15\">Developer:innen</span> müssen sich an die <span class=\"term\" tabindex=\"0\" data-tip=\"21\">Definition of Done</span> halten. Wenn mehrere <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Teams</span> an einem Produkt zusammenarbeiten, müssen sie eine gemeinsame Definition of Done definieren und sich alle daran halten.</p>\n<h3 id=\"sg-end-note\">Schlussbemerkung</h3>\n<p>Scrum ist kostenlos und wird in diesem Guide angeboten. Das Scrum-Rahmenwerk, wie es hier beschrieben wird, ist <span class=\"term\" tabindex=\"0\" data-tip=\"34\">unveränderlich</span>. Es ist zwar möglich, nur Teile von Scrum zu implementieren, aber das Ergebnis ist nicht Scrum. Scrum existiert nur in seiner Gesamtheit und funktioniert gut als Container für andere Techniken, Methodiken und Praktiken.</p>\n<h4 id=\"sg-acknowledgements\">Danksagungen</h4>\n<h5 id=\"sg-people\">Personen</h5>\n<p>Von den tausenden Personen, die zu Scrum beigetragen haben, sollten wir diejenigen hervorheben, die zu Beginn von besonderer Bedeutung waren: Jeff Sutherland arbeitete mit Jeff McKenna und John Scumniotales, und Ken Schwaber arbeitete mit Mike Smith sowie Chris Martin - und sie alle arbeiteten zusammen. Viele weitere haben in den folgenden Jahren einen Beitrag geleistet. Ohne deren Hilfe wäre Scrum nicht so ausgefeilt, wie es heute ist.</p>\n<h5 id=\"sg-scrum-guide-history\">Scrum-Guide-Historie</h5>\n<p>Ken Schwaber und Jeff Sutherland haben Scrum gemeinsam zum ersten Mal auf der OOPSLA Konferenz 1995 präsentiert. Diese Präsentation dokumentierte im Kern die Erkenntnisse, die Ken und Jeff in den vorherigen Jahren bei der Anwendung von Scrum gewonnen hatten, und stellte die erste formale Veröffentlichung der Definition von Scrum dar.</p>\n<p>Der Scrum Guide dokumentiert Scrum, wie es von Jeff Sutherland und Ken Schwaber über 30 Jahre lang weiterentwickelt wurde, gewachsen ist und aufrechterhalten wurde. Andere Quellen liefern Muster, Prozesse und Erkenntnisse, die das Scrum-Rahmenwerk ergänzen. Diese können zur Steigerung der Produktivität, des Werts, der Kreativität und der Zufriedenheit mit den Ergebnissen führen.</p>\n<p>Die vollständige Geschichte von Scrum wird an anderer Stelle beschrieben. Um die ersten Orte zu würdigen, an denen es erprobt wurde und sich bewährt hat, erkennen wir Individual Inc., Newspage, Fidelity Investments und IDX (jetzt GE Medical) als solche an.</p>\n<h4 id=\"sg-de-aenderungen-des-scrum-guides-von-2020-im-vergleich-zu-2017\">Änderungen des Scrum Guides von 2020 im Vergleich zu 2017</h4>\n<h6 id=\"sg-de-noch-weniger-vorschreibend\">Noch weniger vorschreibend</h6>\n<p>Im Laufe der Jahre wurde der Scrum Guide etwas vorschreibender. Die Version von 2020 zielte darauf ab, Scrum wieder zu einem minimal ausreichenden Rahmenwerk zu machen, indem die vorschreibende Sprache entfernt oder abgeschwächt wurde. Zum Beispiel wurden die Daily-Scrum-Fragen entfernt, die Sprache zur Beschreibung der Attribute von Product-Backlog-Einträgen und Retro-Items im <span class=\"term\" tabindex=\"0\" data-tip=\"20\">Sprint Backlog</span> abgeschwächt, der Abschnitt zum Sprint-Abbruch gekürzt und mehr.</p>\n<h6 id=\"sg-de-ein-team-fokussiert-auf-ein-produkt\">Ein Team, fokussiert auf ein Produkt</h6>\n<p>Ziel war es, das Konzept eines separaten Teams innerhalb eines Teams zu beseitigen, das zu einem „Stellvertrenden-“ oder „wir und sie\"-Verhalten zwischen dem:der PO und dem Dev Team geführt hat. Es gibt jetzt nur noch ein <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span>, das sich auf dasselbe Ziel fokussiert und drei verschiedene <span class=\"term\" tabindex=\"0\" data-tip=\"19\">Ergebnisverantwortlichkeiten</span> hat: PO, SM und <span class=\"term\" tabindex=\"0\" data-tip=\"15\">Developer:innen</span>.</p>\n<h6 id=\"sg-de-einfuehrung-des-produkt-ziels\">Einführung des Produkt-Ziels</h6>\n<p>Der Scrum Guide von 2020 führt das Konzept eines <span class=\"term\" tabindex=\"0\" data-tip=\"16\">Produkt-Ziels</span> ein, um das <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> auf ein größeres, wertvolles Ziel auszurichten. Jeder <span class=\"term\" tabindex=\"0\" data-tip=\"5\">Sprint</span> sollte das Produkt näher an das übergeordnete Produkt-Ziel heranbringen.</p>\n<h6 id=\"sg-de-eine-heimat-fuer-das-sprint-ziel-die-definition-of-done-und-das-produkt-ziel\">Eine Heimat für das Sprint-Ziel, die Definition of Done und das Produkt-Ziel</h6>\n<p>Frühere Scrum Guides beschrieben das <span class=\"term\" tabindex=\"0\" data-tip=\"22\">Sprint-Ziel</span> und die <span class=\"term\" tabindex=\"0\" data-tip=\"21\">Definition of Done</span>, ohne ihnen wirklich eine Identität zu geben. Sie waren nicht wirklich Artefakte, aber waren diesen in gewisser Weise zugeordnet. Mit der Erweiterung um das <span class=\"term\" tabindex=\"0\" data-tip=\"16\">Produkt-Ziel</span> bietet die Version von 2020 mehr Klarheit darüber. Jedes der drei Artefakte enthält nun „<span class=\"term\" tabindex=\"0\" data-tip=\"31\">Commitments</span>\" ihnen gegenüber. Für das <span class=\"term\" tabindex=\"0\" data-tip=\"2\">Product Backlog</span> ist dies das Produkt-Ziel, das <span class=\"term\" tabindex=\"0\" data-tip=\"20\">Sprint Backlog</span> hat das Sprint-Ziel, und das <span class=\"term\" tabindex=\"0\" data-tip=\"4\">Increment</span> hat die Definition of Done (jetzt ohne Anführungszeichen). Sie existieren, um <span class=\"term\" tabindex=\"0\" data-tip=\"12\">Transparenz</span> und Fokus hinsichtlich des Fortschritts jedes Artefakts zu fördern.</p>\n<h6 id=\"sg-de-selbstmanagement-statt-selbstorganisation\">Selbstmanagement statt Selbstorganisation</h6>\n<p>Frühere Scrum Guides bezeichneten Development Teams als insofern selbstorganisierend, als dass sie wählen konnten, wer die Arbeit erledigt und wie gearbeitet wird. Mit einem stärkeren Fokus auf das <span class=\"term\" tabindex=\"0\" data-tip=\"3\">Scrum Team</span> betont die Version von 2020 ein selbstmanagendes Scrum Team. Dieses wählt, wer die Arbeit erledigt, wie und woran gearbeitet wird.</p>\n<h6 id=\"sg-de-drei-sprint-planning-themen\">Drei Sprint-Planning-Themen</h6>\n<p>Zusätzlich zu den Sprint-Planning-Themen „Was\" und „Wie\" legt der Scrum Guide von 2020 den Schwerpunkt auf ein drittes Thema: „Wofür\". Dieses bezieht sich auf das <span class=\"term\" tabindex=\"0\" data-tip=\"22\">Sprint-Ziel</span>.</p>\n<h6 id=\"sg-de-allgemeine-vereinfachung-der-sprache-fuer-ein-breiteres-publikum\">Allgemeine Vereinfachung der Sprache für ein breiteres Publikum</h6>\n<p>Der Scrum Guide von 2020 legt einen Schwerpunkt auf die Eliminierung redundanter und komplexer Aussagen so
