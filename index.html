wie die Beseitigung aller verbleibenden Rückschlüsse auf IT-Arbeit (z.B. Test, System, Design, Requirements, etc.) gelegt. Der Scrum Guide umfasst jetzt weniger als 13 Seiten [Anm. d. Übersetzer:innen: Im Deutschen sind es bis zur Danksagung 14 geworden.].</p>\n<h4 id=\"sg-de-uebersetzung\">Übersetzung</h4>\n<p>Dieser Guide wurde von der englischen Originalversion, bereitgestellt von Ken Schwaber und Jeff Sutherland, übersetzt. Hierzu beigetragen haben:</p>\n<p>2020: Silke von der Bruck, Sabine Canditt, Jan Gretschuskin, Eva Gysling, Martin Hoppacher, Björn Jensen, Ralph Jocham, Dominik Maximini, Wolf Dieter Moggert, Peter Schmidt, Boris Steiner</p>\n<p>2017: Sabine Canditt, Jan Gretschuskin, Eva Gysling, Martin Hoppacher, Ralph Jocham, Dominik Maximini, Stefan Mieth, Wolf Dieter Moggert, Pascal Naujoks, Urs Reupke, Anna Rudat, Andreas Schliep, Harald Schlindwein, Peter Schmidt, Boris Steiner</p>\n<p>2016: Jan Gretschuskin, Dominik Maximini, Pascal Naujoks, Boris Steiner, Jürgen Halstenberg, Ralph Jocham, Wolf Dieter Moggert, Patrick Koglin, Harald Schlindwein</p>\n<p>2013: Jan Gretschuskin, Dominik Maximini, Pascal Naujoks, Sabrina Roos, Andreas Schliep, Wolfgang Wiedenroth</p>\n<p>2011: Dominik Maximini, Andreas Schliep, Ulf Schneider, Wolfgang Wiedenroth</p>\n<h6 id=\"sg-de-kontaktinformationen\">Kontaktinformationen</h6>\n<table class=\"sg-table\"><tr><td>Name der Übersetzungsgruppe:</td><td>GermanScrumTranslators</td></tr><tr><td>Bewerbungen werden angenommen unter:</td><td>https://www.linkedin.com/groups/4071080/</td></tr><tr><td>Primärer Ansprechpartner / Product Owner:</td><td>Dominik Maximini</td></tr><tr><td>Kontaktadresse:</td><td>translation@valuerise-consulting.de</td></tr></table>\n<h5 id=\"sg-de-aenderungshistorie-der-uebersetzung\">Änderungshistorie der Übersetzung</h5>\n<table class=\"sg-table\"><tr><td>Version 1.0:</td><td>Komplette Neuübersetzung des Scrum Guides, basierend auf der Version von 2016. </td></tr><tr><td>Version 1.1:</td><td>Klarstellung im Abschnitt „Das Scrum Team“: Interdisziplinäre Teams sind im Idealfall nicht von Personen außerhalb des Teams abhängig. Klarstellung im Abschnitt: „Anwendungen von Scrum“: Frequenz von Auslieferungen regelmäßig und mehrfach täglich. </td></tr><tr><td>Version 1.2:</td><td>Klarstellung im Abschnitt: „Sprint Review“: Der Scrum Master agiert als Servant Leader und nicht nur als Organisator des Events. </td></tr><tr><td>Version 2.0:</td><td>Überarbeitung der Begrifflichkeiten und Ergänzung des verwendeten Glossars. „Sinn machen“ wurde in „Sinn ergeben“ geändert. </td></tr><tr><td>Version 3.2:</td><td>Komplette Neuübersetzung anlässlich der Veröffentlichung des Scrum Guide 2020.</td></tr><tr><td>Version 3.3:</td><td>Einarbeitung des ersten Feedbacks nach der Neuübersetzung.</td></tr><tr><td>Version 3.5</td><td>„Cadence“ wird mit „Rhythmus“, „true leaders“ mit „echte Führungspersönlichkeiten“ und „concise“ mit „prägnant“ übersetzt.  </td></tr></table>\n<h5 id=\"sg-de-uebersetzungs-glossar\">Übersetzungs-Glossar</h5>\n<p>Version 3.5, Stand 15.06.2022</p>\n<p>Übersetzungs-Grundregeln, an die wir uns gehalten haben:</p>\n<ul><li>Feststehende Ausdrücke von „Core Scrum“ (Accountabilities, Artefakte, Events) behalten wir Englisch bei, alle anderen werden übersetzt (Beispiel: Sprint Retrospective).</li><li>Folgt ein deutsches Wort auf eines oder mehrere englische, so wird gemäß der deutschen Rechtschreibregeln „durchgekoppelt“ (Beispiel: Sprint-Backlog-Einträge).</li><li>Wir nutzen wie im Original inklusive Formulierungen („gendern”). Wir erreichen das Screenreader-freundlich, indem wir Artikel und Varianten mit Doppelpunkt verknüpfen. Das gilt auch für feststehende Ausdrücke (Beispiele: ein:e Product Owner:in oder die Developer:innen).</li><li>Wir benutzen überwiegend auch bei englischen Ausdrücken die deutsche Grammatik, z.B. den deutschen Genitiv (Beispiel: nicht „innerhalb des Sprint“ sondern „innerhalb des Sprints“).</li></ul>\n<table class=\"sg-table\"><tr><th><strong>Englischer Begriff </strong></th><th><strong>Deutscher Begriff </strong></th></tr><tr><td>accountable</td><td>ergebnisverantwortlich</td></tr><tr><td>adaptation</td><td>Anpassung</td></tr><tr><td>Commitment</td><td>Commitment</td></tr><tr><td>Courage</td><td>Mut</td></tr><tr><td>cross-functional</td><td>interdisziplinär</td></tr><tr><td>Daily Scrum</td><td>Daily Scrum</td></tr><tr><td>Definition of Done</td><td>Definition of Done</td></tr><tr><td>the Developer</td><td>der:die Developer:in;</td></tr><tr><td>the Developers</td><td>die Developer:innen</td></tr><tr><td>Done</td><td>Done</td></tr><tr><td>empiricism</td><td>Empirie</td></tr><tr><td>event</td><td>Event</td></tr><tr><td>feedback</td><td>Feedback</td></tr><tr><td>Focus</td><td>Fokus</td></tr><tr><td>forecast</td><td>Vorhersage</td></tr><tr><td>framework</td><td>Rahmenwerk</td></tr><tr><td>Increment</td><td>das Increment</td></tr><tr><td>inspect &amp; adapt</td><td>Überprüfung und Anpassung</td></tr><tr><td>inspection</td><td>Überprüfung</td></tr><tr><td>Lean Thinking</td><td>Lean Thinking</td></tr><tr><td>Openness</td><td>Offenheit</td></tr><tr><td>process framework</td><td>Prozessrahmenwerk</td></tr><tr><td>product</td><td>Produkt</td></tr><tr><td>Product Backlog</td><td>das Product Backlog</td></tr><tr><td>Product Backlog item</td><td>Product-Backlog-Eintrag</td></tr><tr><td>Product Backlog refinement</td><td>das Refinement des Product Backlogs</td></tr><tr><td>Product Goal</td><td>Produkt-Ziel</td></tr><tr><td>the Product Owner</td><td>der:die Product Owner:in</td></tr><tr><td>Respect</td><td>Respekt</td></tr><tr><td>responsible</td><td>umsetzungsverantwortlich</td></tr><tr><td>Scrum Artifacts</td><td>Scrum-Artefakte</td></tr><tr><td>Scrum</td><td>Scrum</td></tr><tr><td>Scrum Events</td><td>Scrum Events</td></tr><tr><td>Scrum Guide</td><td>Scrum Guide</td></tr><tr><td>the Scrum Master</td><td>der:die Scrum Master:in</td></tr><tr><td>Scrum Team</td><td>Scrum Team</td></tr><tr><td>self-management</td><td>Selbstmanagement</td></tr><tr><td>Sprint Backlog</td><td>das Sprint Backlog</td></tr><tr><td>Sprint Backlog item</td><td>Sprint-Backlog-Eintrag</td></tr><tr><td>Sprint Goal</td><td>Sprint-Ziel</td></tr><tr><td>Sprint Planning</td><td>das Sprint Planning</td></tr><tr><td>Sprint progress</td><td>Sprint-Fortschritt</td></tr><tr><td>Sprint Retrospective</td><td>die Sprint Retrospective</td></tr><tr><td>Sprint Review</td><td>das Sprint Review</td></tr><tr><td>Stakeholder</td><td>Stakeholder:innen</td></tr><tr><td>timebox</td><td>die Timebox</td></tr><tr><td>timeboxed</td><td>zeitlich beschränkt</td></tr><tr><td>value</td><td>Wert</td></tr><tr><td>Transparency</td><td>Transparenz</td></tr></table>"};
const TIPS = ["Accountable for establishing Scrum and for the Scrum Team's effectiveness. 'True leaders who serve' the team and the organization.", "One person, not a committee. Accountable for maximizing the product's value and for Product Backlog management. Can delegate the work but stays accountable.", "Emergent, ordered list of what is needed to improve the product. The single source of work. Commitment: the Product Goal.", "One Scrum Master, one Product Owner and Developers. Typically 10 or fewer people. No sub-teams or hierarchies.", "A usable step toward the Product Goal that meets the Definition of Done. Several can be created in one Sprint, and an Increment may be delivered to stakeholders before the Sprint ends.", "Fixed-length event of one month or less. The container for all other events. A Sprint could be cancelled if the Sprint Goal becomes obsolete; only the Product Owner has the authority to cancel it.", "People outside the Scrum Team with an interest in the product. Key stakeholders are invited to the Sprint Review. Those wanting to change the Product Backlog do so by trying to convince the Product Owner.", "Scrum defines only the parts needed to implement its theory. Teams add their own practices around it; implementing only parts of Scrum is possible, but the result is not Scrum.", "Learning from experience: decide based on what you observe, not on predictions. One of Scrum's two foundations, with lean thinking.", "Reduce waste and focus on the essentials. The second foundation of Scrum.", "Pillar 2 of empiricism. Artifacts and progress are checked frequently to spot problems. Without transparency it is 'misleading and wasteful'.", "Pillar 3 of empiricism. Adjust as soon as possible when something is off. Inspection without adaptation is 'pointless'.", "Pillar 1 of empiricism. The process and work must be visible to those doing it and receiving it. Exam trap: transparency is a pillar, not a value.", "The team internally decides who does what, when and how. Replaced the older term 'self-organizing'.", "The five Scrum values. Learn them by heart: transparency, trust and collaboration are NOT on this list.", "Everyone in the Scrum Team who creates any part of the usable Increment. Not just programmers. Older guides said 'Development Team'.", "The long-term objective for the Scrum Team, kept in the Product Backlog. One at a time: fulfill or abandon it before taking on the next.", "The team as a whole has all the skills needed to create value each Sprint. Not every person needs every skill.", "Fixed-length events of one month or less. The container for all other events. The next Sprint starts immediately after the previous one ends.", "The 2020 Guide talks about three accountabilities (Developers, Product Owner, Scrum Master) instead of 'roles'.", "Sprint Goal (why) + selected items (what) + actionable plan (how). A plan by and for the Developers, updated throughout the Sprint.", "The quality standard for the Increment. Work that doesn't meet it isn't part of the Increment, can't be released or even presented at the Sprint Review.", "The single objective for the Sprint, defined by the whole Scrum Team in Sprint Planning. A commitment by the Developers. Fixed goal, flexible scope.", "Second-to-last event. A working session with key stakeholders to inspect the outcome and decide what's next. Not a sign-off. Max 4 h for a one-month Sprint.", "Anything blocking the team's progress. The Scrum Master 'causes the removal' of impediments, which doesn't mean fixing everything personally.", "A maximum duration. One-month Sprint: Sprint Planning 8 h, Sprint Review 4 h, Sprint Retrospective 3 h; for shorter Sprints these events are usually shorter. The Daily Scrum is always 15 minutes.", "Starts the Sprint. Three topics: Why (Sprint Goal), What (selected items), How (the plan). Max 8 h for a one-month Sprint. The whole Scrum Team attends.", "Concludes the Sprint. Plans ways to increase quality and effectiveness. Max 3 h for a one-month Sprint. Improvements may go into the next Sprint Backlog.", "Optional forecasting tools. Useful, but they don't replace empiricism. Not a Scrum artifact.", "Only the Product Owner can cancel a Sprint. A Sprint could be cancelled if its Sprint Goal becomes obsolete.", "15 minutes for the Developers, every working day, same time and place. Purpose: inspect progress toward the Sprint Goal and adapt the Sprint Backlog. No mandatory 'three questions'.", "Each artifact has one: Product Backlog = Product Goal, Sprint Backlog = Sprint Goal, Increment = Definition of Done.", "An ongoing activity, not an event: breaking items down and adding detail, order and size. The old '10% of capacity' rule is gone in 2020.", "Done by the Developers who will do the work. The Product Owner may influence them by helping them understand and select trade-offs.", "Scrum's rules can't be changed. You can use only parts of Scrum, but then it isn't Scrum."];
const TIP_EN = ["Scrum Master", "Product Owner", "Product Backlog", "Scrum Team", "Increment", "Sprint", "Stakeholders", "Purposefully incomplete", "Empiricism", "Lean thinking", "Inspection", "Adaptation", "Transparency", "Self-managing", "Commitment, Focus, Openness, Respect, Courage", "Developers", "Product Goal", "Cross-functional", "Sprints", "Accountabilities", "Sprint Backlog", "Definition of Done", "Sprint Goal", "Sprint Review", "Impediments", "Timebox", "Sprint Planning", "Sprint Retrospective", "Burn-downs", "Cancelling a Sprint", "Daily Scrum", "Commitment", "Product Backlog refinement", "Sizing", "Immutable"];
const TIP_DE = ["Scrum Master:in", "Product Owner:in", "das Product Backlog", "Scrum Team", "das Increment", "Sprint", "Stakeholder:innen", "absichtlich unvollständig", "Empirie", "Lean Thinking", "Überprüfung", "Anpassung", "Transparenz", "Selbstmanagement", "Commitment, Fokus, Offenheit, Respekt, Mut", "die Developer:innen", "Produkt-Ziel", "interdisziplinär", "Sprints", "Ergebnisverantwortlichkeiten", "das Sprint Backlog", "Definition of Done", "Sprint-Ziel", "das Sprint Review", "Hindernisse (impediments)", "die Timebox / zeitlich beschränkt", "das Sprint Planning", "die Sprint Retrospective", "Burn-Down-Charts", "Sprint abbrechen", "Daily Scrum", "Commitment", "das Refinement des Product Backlogs", "Größenbestimmung", "unveränderlich"];
// ===== Engine: pure game state, no DOM. Story beats live in story.js. =====
const DEVS = ["priya", "tom", "lea"];
const DAYNAMES = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
const PRODUCT_GOAL = "Customers book and pay for bike repairs online, without calling the shop.";
const NEXT_PRODUCT_GOAL = "Returning customers manage their bikes and bookings in one account.";
const PG_ITEMS = ["form", "price", "pay", "cal"];
const DOD_BASE = ["Code reviewed", "Automated tests pass", "Tested on phone and desktop"];

const CATALOG = {
  form: ["Online booking form", 6], price: ["Repair price estimate", 5], email: ["Booking confirmation email", 4],
  map: ["Shop map and opening hours", 4], sms: ["SMS reminder before pickup", 3], card: ["Card payment when booking", 10],
  pay: ["Pay by card when booking", 7], saved: ["Saved cards for returning customers", 3], cal: ["Booking calendar", 12],
  acct: ["Customer accounts", 8], banner: ["Winter check-up banner", 1], vouch: ["Gift vouchers", 4],
  loyal: ["Loyalty stamps", 5], invoice: ["Pay later by invoice", 4]
};
const PERKS = {
  pairing: { n: "Pair on the payment provider", line: "Pair on the payment provider, so more than one of us knows it." },
  requests: { n: "Agree how requests reach Jonas", line: "Agree with Maya and Hans that new requests go to Jonas." },
  autotest: { n: "Automate the phone tests", line: "Automate the phone tests, so checking Done gets faster." },
  timer: { n: "Timer for the Daily Scrum", line: "Use a timer at the Daily Scrum and hold technical talks right after it." },
  dodwall: { n: "Definition of Done on the wall", line: "Print the Definition of Done and hang it next to the board." },
  agenda: { n: "Sprint Review invitations", line: "Send Maya and Hans a short note before each Sprint Review on what to look at." }
};
const NAMES = { jonas: "Jonas", priya: "Priya", tom: "Tom", lea: "Lea", you: "You", maya: "Maya", hans: "Hans" };

const clone = o => JSON.parse(JSON.stringify(o));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const val = (x, S) => (typeof x === "function" ? x(S) : x);

function newGame() {
  const S = {
    v: 2, sp: 0, pos: -1, ev: null, pending: [], phase: "read", day: 1, t: "09:00", worked: 1,
    items: {}, pb: [], sb: [], inc: [], goal: null, goalItems: [], pgoal: PRODUCT_GOAL, pgoalDone: false,
    dod: DOD_BASE.slice(), dodStruck: false, on: { priya: null, tom: null, lea: null }, absent: {},
    perks: {}, flags: {}, lost: {}, score: 0, max: 0, trust: 60, results: [], sprintRes: [], diary: [],
    fresh: [], dayLog: [], mark: null, ghost: null, res: null, step: false, mood: null, done: false
  };
  return S;
}

// ----- Items and boards -----
function mk(S, id, size) {
  const c = CATALOG[id];
  S.items[id] = { id, n: c[0], s: size === undefined ? c[1] : size, prog: 0, where: "out", owner: null, blocked: 0, badge: null, st: null, kind: "pbi", tasks: 0, sp: null };
  return S.items[id];
}
function mkImp(S, key) {
  const id = "imp-" + key;
  S.items[id] = { id, n: PERKS[key].n, s: 1, prog: 0, where: "out", owner: null, blocked: 0, badge: null, st: null, kind: "imp", tasks: 1, sp: null };
  return S.items[id];
}
const BOARD_NAME = { pb: "Product Backlog", sb: "Sprint Backlog", inc: "Increment", out: "off the board" };
function note(S, text, why, icon) {
  const e = { sp: S.sp, d: S.day, t: S.t, text, why: why || "", icon: icon || "move" };
  S.diary.push(e); S.fresh.push(e);
}
function detach(S, id) { for (const b of ["pb", "sb", "inc"]) { const i = S[b].indexOf(id); if (i >= 0) S[b].splice(i, 1); } }
function move(S, id, to, why, pos) {
  const it = S.items[id]; const from = it.where;
  detach(S, id);
  if (to !== "out") { const L = S[to]; pos === undefined || pos >= L.length ? L.push(id) : L.splice(Math.max(0, pos), 0, id); }
  it.where = to;
  if (to === "inc") it.sp = S.sp;
  note(S, `“${it.n}”: ${from === "out" ? "new on the " + BOARD_NAME[to] : BOARD_NAME[from] + " → " + BOARD_NAME[to]}`, why, to);
}
function reorder(S, prio, why) {
  const rank = id => { const i = prio.indexOf(id); return i < 0 ? 99 : i; };
  const before = S.pb.join();
  S.pb.sort((a, b) => rank(a) - rank(b));
  for (const id of S.pb) if (S.items[id].badge === "Jonas re-orders") S.items[id].badge = null;
  if (S.pb.join() !== before) note(S, "Product Backlog re-ordered", why, "order");
}
const inSB = id => S => S.items[id] && S.items[id].where === "sb";
const isOpen = it => it.where === "sb" && it.prog < it.s && !it.st;
const workable = it => isOpen(it) && !(it.blocked > 0);
const sbItems = S => S.sb.map(id => S.items[id]);
const workersOf = (S, id) => DEVS.filter(d => S.on[d] === id);
const N = (S, id) => (S.items[id] ? S.items[id].n : CATALOG[id][0]);

function pickNext(S, dev) {
  const c = sbItems(S).filter(workable);
  if (!c.length) return null;
  const free = c.find(it => workersOf(S, it.id).filter(x => x !== dev).length === 0);
  if (free) return free;
  return c.slice().sort((a, b) => (b.s - b.prog) - (a.s - a.prog))[0];
}

function finish(S, it, log, sim) {
  if (it.kind === "imp") { it.st = "done"; if (!sim) note(S, `Improvement “${it.n}” done`, "The team planned it at the last Retrospective", "imp"); return; }
  if (!sim && S.flags.dodDropped && S.sp === 1) it.untested = true;
  if (sim) { detach(S, it.id); S.inc.push(it.id); it.where = "inc"; return; }
  move(S, it.id, "inc", S.flags.dodDropped && S.sp === 1 ? "Marked Done without the phone tests" : "Meets the Definition of Done");
  if (S.sp >= 1 && S.flags.release === "early" && !it.untested) it.live = true;
  if (S.sp === 1 && !S.flags.release && !S.flags.dodDropped && !S.pending.includes("release")) { S.flags.release = "asked"; S.flags.releaseItem = it.id; S.pending.push("release"); }
  log && log.push(`“${it.n}” meets the Definition of Done and joins the Increment.`);
}

function work(S, d, log, sim) {
  for (const dev of DEVS) {
    if ((S.absent[dev] || []).includes(d)) { log && log.push(`${NAMES[dev]} is off sick.`); continue; }
    if (S.lost && (S.lost[dev] || []).includes(d)) { log && log.push(S.flags.stopped ? `${NAMES[dev]} stops work, as the Scrum Master said.` : `${NAMES[dev]} spends the day switching to new work.`); continue; }
    let it = S.items[S.on[dev]];
    if (!it || !workable(it)) {
      const nx = pickNext(S, dev);
      if (log && nx && (!it || nx.id !== it.id)) log.push(`${NAMES[dev]} picks up “${nx.n}”.`);
      it = nx; S.on[dev] = it ? it.id : null;
    }
    if (!it) continue;
    it.prog = Math.min(it.s, it.prog + 1);
  }
  for (const it of sbItems(S)) {
    if (it.prog >= it.s && !it.st) {
      if (!sim && it.trap && !S.flags[it.trap]) { it.st = "testing"; it.badge = "Testing"; S.flags[it.trap] = "pending"; S.pending.push(it.trap); }
      else finish(S, it, log, sim);
    }
  }
  for (const it of sbItems(S)) {
    if (it.blocked > 0 && it.blocked < 90) {

// Which Sprint Backlog items would still be unfinished after day 9, if nothing else happens?
function forecast(S) {

  if (S.goalItems.every(id => S.items[id].where === "inc" && !S.items[id].bad && !S.items[id].untested)) return "done";
  if (S.goalItems.some(id => S.items[id].blocked >= 90)) return "risk";

// When the Developers run out of planned work, they pull in more with Jonas, as long as the Sprint Goal stays safe.
function pull(S, d, log) {

  if (S.goal && goalStatus(S) === "risk") return;

  const ok = it => !it.notReady && it.droppedSp !== S.sp && (it.holdSp || 0) <= S.sp && it.s && it.s <= room;

const PTS = [0, 5, 10];
function grade(S, g, label, kind) {

// x: option index for who/choice/retro; "allow" | "step" | option index for call
function answer(S, x) {

    { key: "dev", t: "Priya, Tom and Lea, the Developers", wrong: "Not the Developers alone." },

}

// helpers used by story beats
function block(S, id, days, badge) { const it = S.items[id]; it.blocked = days; it.badge = badge || "Blocked"; note(S, `“${it.n}” is ${(badge || "blocked").toLowerCase()}`, "", "block"); }

      fx: (S, o) => { S.nextImp = o.key; S.perks[o.key] = true; },
      g: [Q.retroImp, ["The Sprint Retrospective concludes the Sprint.", "Sprint Retrospective"]] },

    { k: "end", t: "15:30", at: "lounge", cast: TEAM }

// ================= SPRINT 2 =================
function planS2(S) {
  const c = carried(S, ["form", "price"]);
  S.goalItems = [...c, "pay"];
  S.goal = goalText(S.goalItems.map(id => GOAL_PART[id]));
  note(S, "Sprint Goal added to the Sprint Backlog", "Defined by the whole Scrum Team", "goal");
  const picked = select(S, 20, S.flags.overcommit, S.flags.overcommit ? "Selected under pressure from Hans" : "Selected by the Developers, in discussion with Jonas");
  if (S.nextImp) { const imp = mkImp(S, S.nextImp); move(S, imp.id, "sb", "Improvement from the last Retrospective", 0); assign(S, "lea", imp.id); }
  assign(S, "tom", "pay");
  const rest = picked.filter(id => id !== "pay");
  if (rest[0]) assign(S, "priya", rest[0]);
  if (!S.nextImp && rest[1]) assign(S, "lea", rest[1]);
  for (const id of picked) S.items[id].tasks = Math.max(2, Math.round(S.items[id].s * 0.7));
  note(S, "The Developers planned their tasks", "Their plan for the Sprint", "plan");
}

      fb: "The team agrees, and the improvement goes into the next Sprint Backlog, so it gets addressed as soon as possible.",
      fx: (S, o) => { S.nextImp = o.key; S.perks[o.key] = true; },

    { k: "end", t: "15:30", at: "lounge", cast: TEAM }
  ]

// ================= SPRINT 3 =================
function planS3(S) {
  const c = carried(S);
  S.goalItems = ["cal", ...c];
  S.goal = c.length ? goalText(["pick their own repair slot", ...c.map(id => GOAL_PART[id])]) : "Customers pick their own repair slot in a live calendar.";
  note(S, "Sprint Goal added to the Sprint Backlog", "Defined by the whole Scrum Team", "goal");
  const picked = select(S, 20, false, "Selected by the Developers, in discussion with Jonas");
  if (S.nextImp) { const imp = mkImp(S, S.nextImp); move(S, imp.id, "sb", "Improvement from the last Retrospective", 0); assign(S, "tom", imp.id); }
  assign(S, "priya", "cal"); assign(S, "lea", "cal");
  const rest = picked.filter(id => id !== "cal");
  if (!S.nextImp && rest[0]) assign(S, "tom", rest[0]);
  for (const id of picked) S.items[id].tasks = Math.max(2, Math.round(S.items[id].s * 0.7));
}

      lines: [["jonas", "Quick round, everyone. Tom, status? Priya, status? And Lea, leave the calendar today and help Tom."]],

function walk(id, to, toRoom, delay) {
  const t = $("tok-" + id);
  const from = office.pos[id];
  if (from[0] === to[0] && from[1] === to[1]) return 0;
  const r0 = office.room[id] === undefined ? roomAt(from[0], from[1]) : office.room[id];
  const pts = pathFor(from, r0, to, toRoom);
  office.pos[id] = to; office.room[id] = toRoom;
  if (reduced || !t.animate) { place(id); return 0; }
  const segs = []; let len = 0;
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(d); len += d; }
  const dur = Math.max(450, Math.min(1900, len * 1.5));
  let acc = 0;
  const frames = pts.map((p, i) => { if (i) acc += segs[i - 1]; return { left: p[0] / 10 + "%", top: p[1] / 6 + "%", offset: len ? acc / len : i / (pts.length - 1) }; });
  place(id);
  const a = t.animate(frames, { duration: dur, delay: delay || 0, easing: "ease-in-out", fill: "backwards" });
  t.classList.add("walk");
  a.onfinish = a.oncancel = () => t.classList.remove("walk");
  office.anims.push(a);
  return dur + (delay || 0);
}
function officeStop() {
  for (const a of office.anims) { try { a.commitStyles && a.commitStyles(); } catch (e) {} a.cancel(); }
  office.anims = [];
  for (const t of office.timers) clearTimeout(t);
  office.timers = [];
  document.querySelectorAll("#office .tok").forEach(t => t.classList.remove("speak", "work", "walk", "daily"));
  $("oclock").hidden = true;
  // A walk cut short leaves its token mid-step: the next walk starts from there.
  for (const id of Object.keys(HOME)) {
    const t = $("tok-" + id), x = parseFloat(t.style.left) * 10, y = parseFloat(t.style.top) * 6;
    if (isFinite(x) && isFinite(y)) { office.pos[id] = [x, y]; const r = roomAt(x, y); if (r !== office.room[id]) office.room[id] = r === "corr" ? null : r; }
  }
}
const later = (ms, f) => office.timers.push(setTimeout(f, ms));

// Where everyone stands for one moment of the story.
function spotsFor(b) {
  const at = ROOM[b.at] ? b.at : "team";
  const cast = (b.cast || []).filter(c => HOME[c]);
  const out = {};
  for (const id of Object.keys(HOME)) out[id] = [HOME[id][0], HOME[id][1], HOME[id][2]];
  if (at === "workshop" || at === "lounge") {
    const seats = SEATS[at];
    const order = ["jonas", "priya", "tom", "lea", "maya", "hans", "you"].filter(c => cast.includes(c));
    order.forEach((c, i) => { const s = seats[i % seats.length]; out[c] = [s[0], s[1], at]; });
  } else {
    let v = 0;
    for (const c of cast) {
      if (HOME[c][2] === at) continue;
      const s = SEATS[at][v++ % SEATS[at].length]; out[c] = [s[0], s[1], at];
    }
  }
  return out;
}
function setMoods() {
  for (const id of Object.keys(HOME)) { const fc = document.querySelector(`#tok-${id} .fc`); const m = moodOf(id); if (fc.dataset.m !== m) { fc.innerHTML = face(id, m); fc.dataset.m = m; } }
}
function renderSboard() {
  const el = $("sboard");
  if (!S || mode !== "game" || S.done) { el.innerHTML = "<div></div><div></div><div></div>"; return; }
  const sb = S.sb.map(id => S.items[id]).filter(it => it.kind === "pbi" && it.where === "sb");
  const sq = it => `<i class="${it.blocked ? "blk" : ""}"></i>`;
  const todo = sb.filter(it => !it.prog), doing = sb.filter(it => it.prog);
  const done = S.inc.filter(id => S.items[id].sp === S.sp);
  el.innerHTML = `<div>${todo.map(sq).join("")}</div><div class="doing">${doing.map(sq).join("")}</div><div class="done">${done.map(() => "<i></i>").join("")}</div>`;
}
function speakSeq(lines, start) {
  const ids = lines.map(l => l[0]).filter(w => HOME[w]);
  ids.forEach((w, i) => later(start + i * 380, () => {
    document.querySelectorAll("#office .tok.speak").forEach(t => t.classList.remove("speak"));
    $("tok-" + w).classList.add("speak");
  }));
}
function setRoom(at) { document.querySelectorAll("#office .room").forEach(r => r.classList.toggle("on", r.id === "room-" + at)); }

// Called after every renderScene.
function officeUpdate() {
  if (!office.el) return;
  const show = mode === "title" || (mode === "game" && S && !S.done);
  $("leftcol").classList.toggle("officeoff", !show);
  setMoods(); renderSboard();
  if (!show) return;
  if (mode === "title" || !S) { officeIdle(); return; }
  const b = beat(S);
  const key = `${S.sp}-${S.pos}-${S.ev}-${S.day}-${S.phase}`;
  if (key === office.key) return;
  const sameBeat = office.key.split("-").slice(0, 4).join("-") === key.split("-").slice(0, 4).join("-");
  office.key = key;
  officeStop();
  if (b.k === "day") { dayClip(); return; }
  if (b.k === "end") { setRoom("lounge"); const sp = spotsFor({ at: "lounge", cast: ["jonas", "priya", "tom", "lea", "you"] }); for (const id in sp) walk(id, sp[id].slice(0, 2), sp[id][2], 0); return; }
  for (const d of DEVS) { $("tok-" + d).classList.toggle("off", (S.absent[d] || []).includes(S.day)); $("tok-" + d).classList.toggle("stuck", S.sb.some(id => S.items[id].blocked && S.items[id].owner === d)); }
  setRoom(b.at);
  const sp = spotsFor(b);
  let arrive = 0, n = 0;
  for (const id in sp) { const d = walk(id, sp[id].slice(0, 2), sp[id][2], (n++ % 4) * 70); arrive = Math.max(arrive, d); }
  const lines = S.phase === "fb" ? (S.res && S.res.lines) || [] : sameBeat ? [] : S.view.lines;
  speakSeq(lines, sameBeat ? 0 : Math.min(arrive, 900));
}
function officeIdle() {
  officeStop(); office.key = "";
  setRoom(null);
  for (const id of Object.keys(HOME)) walk(id, HOME[id].slice(0, 2), HOME[id][2], 0);
  for (const d of DEVS) $("tok-" + d).classList.add("work");
}

// The days since the last moment, played back fast: work at the desks, then the Daily Scrum at the Scrum board.
function dayClip() {
  setRoom("team");
  const last = S.day - 1, first = Math.min(last, S.clipFrom || last);
  const absent = d => (S.absent[d] || []).includes(last);
  const clock = $("oclock"), ct = $("oclock-t"), cl = $("oclock-l");
  for (const id of Object.keys(HOME)) walk(id, HOME[id].slice(0, 2), HOME[id][2], 0);
  for (const d of DEVS) $("tok-" + d).classList.toggle("off", absent(d));
  const blockedOwners = DEVS.filter(d => S.sb.some(id => S.items[id].blocked && S.items[id].owner === d));
  for (const d of DEVS) $("tok-" + d).classList.toggle("stuck", blockedOwners.includes(d));
  if (last < 1) return;
  clock.hidden = false;
  cl.textContent = first < last ? `Days ${first}–${last}, fast-forward` : "Yesterday, fast-forward";
  const hm = m => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
  const tick = (from, to, ms, t0) => { const steps = 8; for (let i = 0; i <= steps; i++) later(t0 + (ms * i) / steps, () => { const m = from + ((to - from) * i) / steps; ct.textContent = `Day ${last} · ${hm(m - (m % 15))}`; }); };
  if (reduced) { ct.textContent = `Day ${S.day} · 09:00`; cl.textContent = "New day"; return; }
  const devsIn = DEVS.filter(d => !absent(d));
  devsIn.forEach(d => $("tok-" + d).classList.add("work"));
  tick(540, 810, 1300, 200);
  later(1550, () => {
    cl.textContent = "Daily Scrum, 15 minutes";
    devsIn.forEach(d => { $("tok-" + d).classList.remove("work"); walk(d, DAILY[d], "team", 0); $("tok-" + d).classList.add("daily"); });
    $("sboard").classList.add("hot");
  });
  later(3000, () => {
    $("sboard").classList.remove("hot");
    cl.textContent = first < last ? `Days ${first}–${last}, fast-forward` : "Yesterday, fast-forward";
    devsIn.forEach(d => { $("tok-" + d).classList.remove("daily"); walk(d, HOME[d].slice(0, 2), "team", 0); });
  });
  later(3700, () => devsIn.forEach(d => $("tok-" + d).classList.add("work")));
  tick(825, 1020, 1200, 3700);
  later(5100, () => { devsIn.forEach(d => $("tok-" + d).classList.remove("work")); ct.textContent = `Day ${S.day} · 09:00`; cl.textContent = "Next morning"; for (const d of DEVS) $("tok-" + d).classList.toggle("off", (S.absent[d] || []).includes(S.day)); });
}

}

const BLITZ_TIME = 15000;
const ROLES = [["po", "Product Owner", ["jonas"]], ["dev", "Developers", ["priya", "tom", "lea"]], ["sm", "Scrum Master", ["you"]], ["team", "Whole Scrum Team", ["jonas", "priya", "tom", "lea", "you"]]];
function startBlitz(from) {
  blitz = { list: shuffle(BLITZ).slice(0, 10), i: 0, right: 0, pts: 0, streak: 0, done: false, pick: null, t0: 0, from, timer: null, finished: false };
  mode = "blitz"; nextBlitz(true);
}
function nextBlitz(first) {
  if (!first) blitz.i++;

  if (blitz.i >= blitz.list.length) { blitz.finished = true; prefs.blitzBest = Math.max(prefs.blitzBest || 0, blitz.pts); savePrefs(); renderScene(); return; }

  if (bar) bar.animate([{ width: "100%" }, { width: "0%" }], { duration: BLITZ_TIME, easing: "linear", fill: "forwards" });

}
function blitzPick(k) {
  if (blitz.done) return;

// ---------- Flow ----------
function renderAll(animate) { renderHeader(); renderScene(); renderBoard(animate); renderDiary(); }
function newGameUI() { S = newGame(); start(S); mode = "game"; lastKey = ""; saveGame(); closeDrawer(); renderAll(true); window.scrollTo({ top: 0 }); }
function autoBest(S) {
  const b = beat(S);
  if (S.phase === "read" || S.phase === "end") { cont(S); return; }
  if (S.phase === "call") { const r = answer(S, b.ok ? "allow" : "step"); if (!r) answer(S, val(b.opts, S).findIndex(o => o.g === 2)); }
  else if (b.k === "who") answer(S, whoOptions(b).findIndex(o => o.key === b.ans));
  else if (b.k === "retro") answer(S, 0);
  else answer(S, val(b.opts, S).findIndex(o => o.g === 2));
  cont(S);
}
function jumpTo(sp) {
  S = newGame(); start(S);
  let guard = 0;
  while (S.sp < sp && guard++ < 1000) autoBest(S);
  S.score = 0; S.max = 0; S.results = []; S.trust = 70; S.fresh = [];
  mode = "game"; lastKey = ""; saveGame(); closeDrawer(); renderAll(false); window.scrollTo({ top: 0 });
}
function doCont() {
  cont(S); saveGame();
  const b = S.done ? null : beat(S);
  beep(b && b.k === "day" ? "day" : "tick");
  renderAll(true);

  else { const sb = document.querySelector(".scene-body"); if (sb) sb.scrollTop = 0; }
}
function doAnswer(x) {
  const r = answer(S, x);
  saveGame();
  if (r) beep(r.g === 2 && !r.falseAlarm ? "good" : r.g === 1 ? "tick" : "bad");
  renderAll(true);
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act],[data-opt],[data-q],[data-role]");
  if (!t || t.disabled) return;
  if (watch.on && (t.dataset.opt !== undefined) && t.closest("#scene")) return;
  if (t.dataset.opt !== undefined) return doAnswer(+t.dataset.opt);
  if (t.dataset.q !== undefined) return quizPick(+t.dataset.q);
  if (t.dataset.role !== undefined) return blitzPick(t.dataset.role);
  const a = t.dataset.act;
  if (a === "wpause") return watchPause(!watch.paused);
  if (a === "wspeed") { watch.speed = watch.speed === 1 ? 2 : watch.speed === 2 ? 3 : 1; renderWatchbar(); if (!watch.paused) watchNext(400); return; }
  if (a === "wstop") return watchStop(false);
  if (a === "wmore") { watch.paused = false; cont(S); afterWatchMove(); return; }
  if (a === "watch") return watchStart();
  if (watch.on && t.closest("#scene") && !t.closest("#watchbar")) return;
  // Never replace a saved game without asking.

    ${q.s ? chatHtml(q.s) : ""}
    <p class="qtext">${esc(q.q)}</p>
    <div class="popts">${it.order.map((oi, n) => {
      const on = it.picked.includes(oi); let cls = "popt " + (multi ? "check" : "radio"), mk = on ? "✓" : "";
      if (it.checked && !ex) { if (q.a.includes(oi)) { cls += on ? " right" : " right missed"; mk = "✓"; } else if (on) { cls += " wrong"; mk = "✕"; } }
      return `<button type="button" class="${cls}" data-oi="${oi}" data-pk="${n + 1}" aria-pressed="${on}" ${it.checked && !ex ? "disabled" : ""}><span class="mk">${mk}</span><span>${esc(q.o[oi])}${it.checked && !ex && q.a.includes(oi) && !on ? `<small class="misslbl">Correct answer you didn't pick</small>` : ""}</span></button>`;
    }).join("")}</div>`;
  if (it.checked && !ex) {
    const ok = sameSet(it.picked, q.a);
    h += `<div class="pfb ${ok ? "ok" : "no"}"><strong>${ok ? "Correct" : "Not quite"}</strong>${q.x ? `<p>${esc(q.x)}</p>` : ""}${pquoteHtml(q)}</div>`;
  }
  if (P.confirm === "leave") h += `<div class="confirm"><span>Your ${esc(P.label)} is still running. Leave it? It won't be scored.</span><div class="row"><button class="pbtn" type="button" data-pact="leaveyes">Leave the exam</button><button class="pbtn" type="button" data-pact="cancel">Keep going</button></div></div>`;
  if (P.confirm === "quit") h += `<div class="confirm"><span>${ex ? `Quit ${esc(P.label)}? It won't be scored.` : "Quit this round? Answers you already checked are saved."}</span><div class="row"><button class="pbtn" type="button" data-pact="quityes">Quit</button><button class="pbtn" type="button" data-pact="cancel">Keep going</button></div></div>`;
  if (P.confirm === "submit") { const open = P.items.length - answered; h += `<div class="confirm"><span>${open ? `${open} question${open > 1 ? "s are" : " is"} unanswered and ${P.flags.size} flagged. Submit anyway?` : `All questions answered${P.flags.size ? `, ${P.flags.size} still flagged` : ""}. Submit your exam?`}</span><div class="row"><button class="pbtn" type="button" data-pact="submityes">Submit</button><button class="pbtn" type="button" data-pact="cancel">Not yet</button></div></div>`; }
  const actLbl = ex ? (P.i === P.items.length - 1 ? "Review and submit" : "Next") : it.checked ? (P.i === P.items.length - 1 ? "See results" : "Next question") : "Check answer";
  const actDis = !ex && !it.checked && it.picked.length !== q.a.length;
  h += `<div class="qnav">${ex ? `<button class="pbtn" type="button" data-pact="prev" ${P.i === 0 ? "disabled" : ""}>Back</button><button class="pbtn" type="button" data-pact="flag">${P.flags.has(P.i) ? "Remove flag" : "Flag for review"}</button>` : ""}<span class="sp"></span>${ex ? `<button class="pbtn" type="button" data-pact="submit">Submit exam</button>` : ""}<button class="primary" type="button" data-pact="act" ${actDis ? "disabled" : ""}>${actLbl}</button></div>`;
  if (ex) h += `<div><span class="hint">${answered} of ${P.items.length} answered · ${P.flags.size} flagged</span><div class="qmap" style="margin-top:6px">${P.items.map((x, i) => `<button type="button" class="${[x.picked.length === x.q.a.length ? "done" : "", P.flags.has(i) ? "flag" : "", i === P.i ? "cur" : ""].join(" ")}" data-go="${i}" aria-label="Question ${i + 1}">${i + 1}</button>`).join("")}</div></div>`;
  h += `</div>`;
  $("pmain").innerHTML = h;
  pTick();
}
function pPick(oi) {
  const it = P.items[P.i], q = it.q;
  if (it.checked && P.mode === "practice") return;
  if (q.a.length === 1) it.picked = [oi];
  else if (it.picked.includes(oi)) it.picked = it.picked.filter(x => x !== oi);
  else if (it.picked.length < q.a.length) it.picked = it.picked.concat(oi);
  else it.picked = it.picked.slice(1).concat(oi);
  if (P.mode === "exam") saveExam();
  renderPQ();
}
function pAct() {
  const it = P.items[P.i];
  if (P.mode === "exam") { if (P.i < P.items.length - 1) { P.i++; saveExam(); renderPQ(); } else { P.confirm = "submit"; renderPQ(); } return; }
  if (!it.checked) { it.checked = true; record(it.q.id, sameSet(it.picked, it.q.a)); psave(); renderPQ(); return; }
  if (P.i < P.items.length - 1) { P.i++; renderPQ(); window.scrollTo({ top: 0 }); } else finishPractice();
}
function finishPractice() { showPResults(false); }
function finishExam() {
  if (!P || P.done) return;
  clearInterval(P.timer);
  P.items.forEach(it => { if (it.picked.length) record(it.q.id, sameSet(it.picked, it.q.a)); });
  const ok = P.items.filter(it => sameSet(it.picked, it.q.a)).length;
  const d = new Date(); pstore.exams.push({ date: d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }), score: Math.round(ok / P.items.length * 100), label: P.label });
  P.done = true; saveExam();
  P.used = Math.round((60 * 60 * 1000 - Math.max(0, P.end - Date.now())) / 60000);
  showPResults(true);
}
function showPResults(exam) {
  P.done = true;
  const ok = P.items.filter(it => sameSet(it.picked, it.q.a)).length, n = P.items.length, pct = Math.round(ok / n * 100), pass = pct >= 85;
  const by = {}; P.items.forEach(it => { const t = it.q.t; by[t] = by[t] || [0, 0]; by[t][1]++; if (sameSet(it.picked, it.q.a)) by[t][0]++; });
  const wrong = P.items.filter(it => !sameSet(it.picked, it.q.a)); P.wrongIds = wrong.map(it => it.q.id);
  $("pmain").innerHTML = `<div class="pcard">
    <span class="hint" style="text-transform:uppercase;letter-spacing:.1em;font-weight:700">${exam ? `${esc(P.label)} result · ${P.used} min used` : "Practice result · " + esc(P.label)}</span>
    <div class="row" style="gap:18px"><span class="bigpct">${pct}%</span><span class="pverdict ${pass ? "pass" : "fail"}">${exam ? (pass ? "Pass" : "Below pass mark") : (pass ? "Exam level" : "Keep practising")}</span></div>
    <span>${ok} of ${n} correct · PSM I pass mark is 85%</span>
    <div class="ptopics">${Object.entries(by).map(([t, [a, m]]) => { const p = Math.round(a / m * 100); return `<div class="ptopic"><div><div class="nm">${esc(QB.topics[t])}</div><div class="sb">${a} of ${m} correct</div></div><div class="meterbar"><i style="width:${p}%"></i></div><span class="pct">${p}%</span></div>`; }).join("")}</div>
    <div class="row">${wrong.length ? `<button class="primary" type="button" data-pact="redo">${wrong.length > 1 ? `Practise these ${wrong.length} again` : "Practise this one again"}</button>` : ""}${!exam ? `<button class="primary alt" type="button" data-pact="again">Another round</button>` : ""}<button class="primary alt" type="button" data-pact="home">Back to practice</button></div>
  </div>
  ${wrong.length ? `<section class="pcard review"><h2>Review your mistakes (${wrong.length})</h2>${wrong.map(it => { const q = it.q; return `<details><summary>${esc(q.q)}</summary>${q.s ? chatHtml(q.s) : ""}<p class="ans"><span class="w">Your answer:</span> ${it.picked.length ? it.picked.map(i => esc(q.o[i])).join("; ") : "No answer"}</p><p class="ans"><span class="r">Correct:</span> ${q.a.map(i => esc(q.o[i])).join("; ")}</p>${q.x ? `<p>${esc(q.x)}</p>` : ""}${pquoteHtml(q)}</details>`; }).join("")}</section>` : ""}`;
  window.scrollTo({ top: 0 });
}
document.addEventListener("keydown", e => {
  if (view !== "practice" || !P || P.done || e.altKey || e.ctrlKey || e.metaKey) return;
  if (/input|textarea|select/i.test(e.target.tagName)) return;
  if (/^[1-6]$/.test(e.key)) { const b = document.querySelector(`#pmain [data-pk="${e.key}"]:not([disabled])`); if (b) { e.preventDefault(); b.click(); } }
  if (e.key === "Enter" && e.target.tagName !== "BUTTON") { const b = document.querySelector('#pmain [data-pact="act"]:not([disabled])'); if (b) { e.preventDefault(); b.click(); } }
});

// ---------- Start ----------
restoreExam();
window.claude?.hot?.snapshot?.(() => ({ S: watch.on ? watch.saved : S, mode: mode === "game" && !watch.on ? "game" : "title" }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});

</script>
</body>
