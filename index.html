<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="PSM I study kit: the full Scrum Guide 2020 in English and German, exam practice and a Scrum Master game.">
<title>Scrum Master on Duty</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Patrick+Hand&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a workshop wall. Left, the scene where you make the call; right, three pegboards (Product Backlog, Sprint Backlog, Increment) with work items as repair tags. On phones the pegboards live in a pull-up drawer. */
:root {
  --bg: #e6eaed; --bg-2: #dbe1e5; --panel: #fbfcfc; --panel-2: #f1f4f6; --ink: #142029; --muted: #56636f; --line: #c8d1d8;
  --accent: #df540c; --accent-ink: #b0420a; --accent-soft: #fde5d4; --on-accent: #ffffff;
  --peg: #cdbf9f; --peg-2: #c2b391; --peg-hole: rgba(70, 52, 22, .28); --peg-ink: #3c311d;
  --tag: #f7e8c6; --tag-imp: #e2eed8; --tag-edge: #d8bf8b; --tag-ink: #2a2315; --tag-muted: #6e5f40; --paper: #fffdf5; --paper-line: #e3dcc6;
  --stamp-red: #c0281c; --stamp-green: #23743a; --stamp-blue: #2556a8; --stamp-amber: #9a5c00;
  --good: #1f7a3a; --good-soft: #dcf0e1; --bad: #b42318; --bad-soft: #fbe2de; --warn: #985600; --warn-soft: #fdefd5;
  --c-po: #2f5fb3; --c-dev1: #2e7d32; --c-dev2: #6a7a12; --c-dev3: #a1481a; --c-you: #0f7c78; --c-stake: #8a3f8f; --c-mgr: #5f656e;
  --shadow: 0 1px 0 rgba(20, 32, 41, .06), 0 6px 18px -8px rgba(20, 32, 41, .25); --bar: #142029; --bar-ink: #f4f6f8;
  --f-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-hand: "Patrick Hand", "Segoe Print", "Comic Sans MS", cursive;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e141a; --bg-2: #131b22; --panel: #18212a; --panel-2: #1e2933; --ink: #e7edf2; --muted: #9aa8b4; --line: #2b3843;
  --accent: #ff7b34; --accent-ink: #ff9b62; --accent-soft: #3a2416; --on-accent: #1a0d05;
  --peg: #3b3426; --peg-2: #342e21; --peg-hole: rgba(0, 0, 0, .45); --peg-ink: #e6dcc3;
  --tag: #eddcb2; --tag-edge: #c4a96f; --tag-ink: #231c0f; --tag-muted: #5f5136; --paper: #f4efdf; --paper-line: #d6cdb2;
  --good: #72d08e; --good-soft: #15301f; --bad: #ff8b7b; --bad-soft: #3b1c17; --warn: #f3b35b; --warn-soft: #33260f;
  --c-po: #86a9f0; --c-dev1: #76c77c; --c-dev2: #b9c95c; --c-dev3: #e89a6b; --c-you: #4cc7c0; --c-stake: #d491d8; --c-mgr: #a9aeb5;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 22px -10px rgba(0, 0, 0, .7); --bar: #070b0f; --bar-ink: #e7edf2;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e141a; --bg-2: #131b22; --panel: #18212a; --panel-2: #1e2933; --ink: #e7edf2; --muted: #9aa8b4; --line: #2b3843;
  --accent: #ff7b34; --accent-ink: #ff9b62; --accent-soft: #3a2416; --on-accent: #1a0d05;
  --peg: #3b3426; --peg-2: #342e21; --peg-hole: rgba(0, 0, 0, .45); --peg-ink: #e6dcc3;
  --tag: #eddcb2; --tag-edge: #c4a96f; --tag-ink: #231c0f; --tag-muted: #5f5136; --paper: #f4efdf; --paper-line: #d6cdb2;
  --good: #72d08e; --good-soft: #15301f; --bad: #ff8b7b; --bad-soft: #3b1c17; --warn: #f3b35b; --warn-soft: #33260f;
  --c-po: #86a9f0; --c-dev1: #76c77c; --c-dev2: #b9c95c; --c-dev3: #e89a6b; --c-you: #4cc7c0; --c-stake: #d491d8; --c-mgr: #a9aeb5;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 22px -10px rgba(0, 0, 0, .7); --bar: #070b0f; --bar-ink: #e7edf2;
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; }
.wrap { max-width: 1440px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- Header ---------- */
.gamebar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--toph)); z-index: 19; background: var(--panel); border-bottom: 1px solid var(--line); }
.gamebar .wrap { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 10px 22px; padding-block: 8px; }
.gamebar .strip { justify-content: flex-start; }
.gamebar .meters { order: 2; } .gamebar .tools { order: 3; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand b { display: block; font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: .02em; line-height: 1; text-transform: uppercase; }
.brand small { display: block; color: var(--muted); font-size: 12px; line-height: 1.2; margin-top: 3px; }
.strip { display: flex; align-items: center; gap: 12px; min-width: 0; justify-content: center; }
.sprintlbl { font-family: var(--f-display); font-weight: 800; font-size: 18px; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
.days { display: grid; grid-template-columns: repeat(10, minmax(22px, 34px)); gap: 3px; }
.dcell { position: relative; height: 34px; border-radius: 5px; background: var(--panel-2); border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--f-mono); font-size: 10px; color: var(--muted); line-height: 1.05; text-align: center; }
.dcell b { display: block; font-size: 11px; color: var(--ink); }
.dcell.past { background: var(--bg-2); }
.dcell.now { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.dcell.now b { color: var(--on-accent); }
.dcell i { position: absolute; top: -10px; right: -4px; font-style: normal; font-family: var(--f-mono); font-size: 8.5px; font-weight: 700; padding: 0 3px; border-radius: 3px; background: var(--ink); color: var(--panel); line-height: 12px; }
.meters { display: flex; align-items: center; gap: 14px; }
.meter { display: grid; gap: 2px; min-width: 0; }
.meter .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); white-space: nowrap; }
.meter .v { font-family: var(--f-mono); font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.trust { display: flex; align-items: center; gap: 6px; }
.trust .bar { width: 64px; height: 8px; border-radius: 99px; background: var(--bg-2); overflow: hidden; }
.trust .bar span { display: block; height: 100%; background: var(--good); border-radius: 99px; transition: width .5s; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.pill.none { background: var(--panel-2); color: var(--muted); }
.pill.track { background: var(--good-soft); color: var(--good); }
.pill.risk { background: var(--warn-soft); color: var(--warn); }
.pill.done { background: var(--good); color: var(--panel); }
.pill.missed { background: var(--bad-soft); color: var(--bad); }
.tools { display: flex; gap: 6px; }
.tbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.tbtn:hover { border-color: var(--accent); }
.tbtn svg { width: 16px; height: 16px; }

/* ---------- Main grid ---------- */
main.wrap { display: grid; grid-template-columns: minmax(360px, 470px) minmax(0, 1fr); gap: 20px; padding-block: 20px 40px; align-items: start; }
.scene { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.scene-body { overflow-y: auto; padding: 18px 20px 20px; display: grid; gap: 14px; align-content: start; }
.place { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 20px; background: var(--bar); color: var(--bar-ink); }
.place .when .s { display: none; }
.place .where { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 800; font-size: 17px; letter-spacing: .05em; text-transform: uppercase; }
.place .where svg { width: 18px; height: 18px; }
.place .when { font-family: var(--f-mono); font-size: 12.5px; opacity: .85; white-space: nowrap; }
.cast { display: flex; flex-wrap: wrap; gap: 6px 10px; }
.who { display: grid; justify-items: center; gap: 1px; width: 54px; font-size: 11px; color: var(--muted); transition: transform .3s; }
.who svg { width: 44px; height: 44px; }
.who.speaking { color: var(--ink); font-weight: 700; transform: translateY(-3px); }
.who.speaking svg { filter: drop-shadow(0 3px 0 var(--accent)); }
.narr { font-size: 14px; color: var(--muted); border-left: 3px solid var(--line); padding: 2px 0 2px 10px; }
.lines { display: grid; gap: 8px; }
.line { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; align-items: start; animation: rise .35s both; }
.line svg { width: 30px; height: 30px; }
.bubble { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px 12px 12px 12px; padding: 7px 11px; min-width: 0; }
.bubble .nm { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .03em; }
.line.you .bubble { background: var(--accent-soft); border-color: transparent; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.act { border: 2px dashed var(--accent); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; background: var(--accent-soft); }
.act .lbl { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ink); }
.act p { margin: 0; font-weight: 700; }
.callbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cbtn { border: 0; border-radius: 10px; padding: 12px 10px; cursor: pointer; font-weight: 700; font-size: 15px; display: grid; gap: 2px; justify-items: center; text-align: center; }
.cbtn small { font-weight: 400; font-size: 12px; opacity: .85; }
.cbtn.allow { background: var(--panel); border: 1.5px solid var(--line); }
.cbtn.allow:hover { border-color: var(--good); }
.cbtn.step { background: var(--accent); color: var(--on-accent); }
.cbtn.step:hover { filter: brightness(1.05); }
.q { font-family: var(--f-display); font-weight: 800; font-size: 22px; line-height: 1.12; margin: 0; letter-spacing: .01em; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--panel); border-radius: 10px; padding: 10px 12px 10px 10px; cursor: pointer; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; transition: border-color .15s, transform .15s; }
.opt:hover:not([disabled]) { border-color: var(--accent); transform: translateX(2px); }
.opt .key { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--panel-2); font-family: var(--f-mono); font-size: 12px; font-weight: 700; }
.opt.face { grid-template-columns: 52px minmax(0, 1fr); align-items: center; }
.opt.face .fs { width: 52px; }
.opt.face svg { width: 30px; height: 30px; }
.opt.face .fs { display: flex; width: 36px; justify-content: center; }
.opt.face .fs svg + svg { margin-left: -12px; }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.dim { opacity: .55; }
.verdict { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; font-weight: 700; }
.verdict .big { font-family: var(--f-display); font-weight: 900; font-size: 24px; text-transform: uppercase; letter-spacing: .03em; line-height: 1; }
.verdict .pts { margin-left: auto; font-family: var(--f-mono); font-size: 13px; }
.verdict.g2 { background: var(--good-soft); color: var(--good); }
.verdict.g1 { background: var(--warn-soft); color: var(--warn); }
.verdict.g0 { background: var(--bad-soft); color: var(--bad); }
.verdict.info { background: var(--panel-2); color: var(--ink); }
.fbtext { margin: 0; }
.moves { display: grid; gap: 6px; padding: 10px 12px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); }
.moves .lbl, .guide .lbl { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.mv { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; font-size: 13.5px; align-items: start; }
.mv svg { width: 18px; height: 18px; margin-top: 1px; color: var(--accent-ink); }
.mv em { display: block; font-style: normal; color: var(--muted); font-size: 12.5px; }
.guide { border-radius: 10px; padding: 10px 12px; background: var(--paper); color: var(--tag-ink); border: 1px solid var(--paper-line); display: grid; gap: 8px; }
.guide .lbl { color: var(--tag-muted); }
.guide blockquote { margin: 0; font-size: 13.5px; line-height: 1.45; padding-left: 10px; border-left: 3px solid var(--tag-edge); }
.guide cite { display: block; font-style: normal; font-size: 11.5px; color: var(--tag-muted); margin-top: 2px; }
.primary { border: 0; border-radius: 10px; padding: 12px 18px; background: var(--ink); color: var(--panel); font-weight: 700; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.primary:hover { background: var(--accent); color: var(--on-accent); }
.primary.alt { background: var(--panel); color: var(--ink); border: 1.5px solid var(--line); }
.primary.alt:hover { border-color: var(--accent); background: var(--panel); color: var(--ink); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.hint { font-size: 12.5px; color: var(--muted); }
.dayhead { display: flex; align-items: baseline; gap: 12px; }
.dayhead .n { font-family: var(--f-display); font-weight: 900; font-size: 56px; line-height: .9; color: var(--accent); }
.dayhead .t { font-family: var(--f-display); font-weight: 800; font-size: 24px; text-transform: uppercase; letter-spacing: .03em; line-height: 1; }
.dayhead .t small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 13px; text-transform: none; letter-spacing: 0; color: var(--muted); margin-top: 4px; }
.loglist { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.loglist li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; font-size: 14px; }
.loglist li::before { content: ""; width: 8px; height: 8px; margin: 7px 0 0 4px; border-radius: 50%; background: var(--accent); }
.loglist li.quiet::before { background: var(--line); }

/* title screen */
.hero { display: grid; gap: 14px; }
.hero h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(44px, 6vw, 64px); line-height: .88; margin: 0; text-transform: uppercase; letter-spacing: .01em; }
.hero h1 span { color: var(--accent); display: block; }
.hero p { margin: 0; }
.how { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.how li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; font-size: 14px; align-items: start; }
.how li b { display: block; }
.how .ic { width: 28px; height: 28px; border-radius: 8px; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; }
.how .ic svg { width: 16px; height: 16px; }
.castrow { display: flex; gap: 2px; flex-wrap: wrap; }
.castrow svg { width: 46px; height: 46px; }

/* summary */
.stamp { display: inline-block; font-family: var(--f-display); font-weight: 900; font-size: 26px; text-transform: uppercase; letter-spacing: .06em; padding: 4px 14px; border: 3px solid currentColor; border-radius: 6px; transform: rotate(-4deg); }
.stamp.ok { color: var(--good); }
.stamp.no { color: var(--bad); }
.reslist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.reslist li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; font-size: 14px; }
.reslist .m { font-weight: 700; font-family: var(--f-mono); }
.reslist .g2 .m { color: var(--good); } .reslist .g1 .m { color: var(--warn); } .reslist .g0 .m { color: var(--bad); }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.badge { border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; display: grid; gap: 2px; }
.badge b { font-size: 14px; }
.badge.on { border-color: var(--good); background: var(--good-soft); }
.badge.off { opacity: .55; }
.bigscore { font-family: var(--f-display); font-weight: 900; font-size: 54px; line-height: .9; }
.bigscore small { font-size: 22px; color: var(--muted); }

/* blitz */
.blitz-card { background: var(--paper); color: var(--tag-ink); border: 1px solid var(--paper-line); border-radius: 12px; padding: 18px 16px; font-family: var(--f-hand); font-size: 24px; line-height: 1.2; min-height: 110px; display: grid; align-content: center; box-shadow: var(--shadow); }
.timer { height: 8px; background: var(--bg-2); border-radius: 99px; overflow: hidden; }
.timer span { display: block; height: 100%; background: var(--accent); width: 100%; }
.roles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.role { border: 1.5px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px; cursor: pointer; display: grid; justify-items: center; gap: 4px; font-weight: 700; font-size: 13.5px; text-align: center; }
.role:hover:not([disabled]) { border-color: var(--accent); }
.role .faces { display: flex; }
.role .faces svg { width: 34px; height: 34px; margin-left: -6px; }
.role .faces svg:first-child { margin-left: 0; }
.role.right { border-color: var(--good); background: var(--good-soft); }
.role.wrong { border-color: var(--bad); background: var(--bad-soft); }
.streak { font-family: var(--f-mono); font-weight: 700; font-size: 13px; }

/* ---------- Boards ---------- */
.boards { min-width: 0; display: grid; gap: 10px; }
.btabs { display: flex; gap: 4px; align-items: center; }
.btab { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 700; color: var(--muted); }
.btab[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.btabs .sp { flex: 1; }
.legend { font-size: 12px; color: var(--muted); }
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.col { min-width: 0; border-radius: 12px; padding: 12px 10px 14px; background-color: var(--peg); background-image: radial-gradient(circle at 9px 9px, var(--peg-hole) 2.2px, transparent 2.8px); background-size: 18px 18px; border: 1px solid var(--peg-2); box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .06); display: grid; gap: 8px; align-content: start; min-height: 340px; }
.colhead { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; padding: 0 2px; color: var(--peg-ink); }
.colhead h2 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: 20px; text-transform: uppercase; letter-spacing: .03em; line-height: 1; }
.colhead .cnt { font-family: var(--f-mono); font-size: 12px; font-weight: 700; background: var(--peg-ink); color: var(--peg); border-radius: 6px; padding: 1px 6px; }
.colsub { font-size: 11.5px; color: var(--peg-ink); opacity: .8; margin: -4px 2px 0; }
.pin { position: relative; background: var(--paper); color: var(--tag-ink); border-radius: 3px; padding: 9px 10px 8px; font-size: 13px; line-height: 1.35; box-shadow: 0 2px 4px rgba(0, 0, 0, .15); transition: box-shadow .3s; }
.pin::before { content: ""; position: absolute; top: -5px; left: 50%; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--accent); box-shadow: 0 1px 2px rgba(0, 0, 0, .4); }
.pin .lbl { display: block; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--tag-muted); margin-bottom: 2px; }
.pin.empty { color: var(--tag-muted); font-style: italic; }
.pin ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 1px; }
.pin li::before { content: "☐ "; color: var(--tag-muted); }
.pin li.struck { text-decoration: line-through; text-decoration-color: var(--stamp-red); text-decoration-thickness: 2px; color: var(--tag-muted); }
.pin li.added { font-weight: 700; }
.pin.marked { box-shadow: 0 0 0 3px var(--accent), 0 2px 4px rgba(0, 0, 0, .15); }
.cards { display: grid; gap: 8px; }
.tag { position: relative; background: var(--tag); color: var(--tag-ink); padding: 8px 9px 8px 22px; min-width: 0;
  clip-path: polygon(12px 0, 100% 0, 100% 100%, 12px 100%, 0 calc(100% - 12px), 0 12px);
  filter: drop-shadow(0 1.5px 1.5px rgba(0, 0, 0, .18)); display: grid; gap: 4px; }
.tag::before { content: ""; position: absolute; left: 7px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%; background: var(--peg); box-shadow: inset 0 0 0 1.5px var(--tag-edge); }
.tag .ttl { font-family: var(--f-hand); font-size: 17px; line-height: 1.1; overflow-wrap: anywhere; }
.tag .meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-family: var(--f-mono); font-size: 10.5px; color: var(--tag-muted); }
.tag .rank { position: absolute; right: 7px; top: 6px; font-family: var(--f-display); font-weight: 900; font-size: 18px; line-height: 1; color: var(--tag-muted); opacity: .6; }
.tag.pb .ttl { padding-right: 22px; }
.tag .faces { display: flex; margin-left: auto; }
.tag .faces svg { width: 22px; height: 22px; margin-left: -5px; }
.prog { display: flex; gap: 2px; flex-wrap: wrap; }
.prog i { width: 9px; height: 6px; border-radius: 2px; background: rgba(0, 0, 0, .1); }
.prog i.f { background: var(--stamp-green); }
.stampsm { position: absolute; right: 6px; top: 4px; font-family: var(--f-display); font-weight: 900; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; padding: 0 5px; border: 2px solid currentColor; border-radius: 3px; transform: rotate(-6deg); background: rgba(255, 255, 255, .35); }
.stampsm.red { color: var(--stamp-red); } .stampsm.green { color: var(--stamp-green); } .stampsm.blue { color: var(--stamp-blue); } .stampsm.amber { color: var(--stamp-amber); }
.tag.has-stamp .ttl { padding-right: 58px; }
.tag.imp { background: var(--tag-imp); }
.tag.imp .ttl::before { content: "Improvement · "; font-family: var(--f-mono); font-size: 10px; color: var(--stamp-green); display: block; }
.tag.marked { animation: nudge 1.2s ease-in-out infinite; }
.tag.marked::after { content: ""; position: absolute; inset: 0; border: 2.5px dashed var(--accent); pointer-events: none; clip-path: inherit; }
@keyframes nudge { 50% { transform: translateX(4px); } }
.marklbl { justify-self: start; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--accent); color: var(--on-accent); margin-bottom: -4px; }
.tag.ghost { background: transparent; filter: none; outline: 2.5px dashed var(--accent); outline-offset: -3px; clip-path: none; border-radius: 4px; }
.tag.ghost .ttl { color: var(--peg-ink); }
.tag.ghost::before { display: none; }
.tag.fresh { animation: flash 1.6s ease-out; }
@keyframes flash { 0% { box-shadow: none; } 15% { filter: drop-shadow(0 0 10px var(--accent)); } 100% { filter: drop-shadow(0 1.5px 1.5px rgba(0, 0, 0, .18)); } }
.grp { font-family: var(--f-mono); font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--peg-ink); opacity: .85; margin: 4px 2px -2px; }
.empty-col { font-size: 12.5px; color: var(--peg-ink); opacity: .75; font-style: italic; padding: 4px 2px; }
.whyfloat { position: fixed; z-index: 40; pointer-events: none; background: var(--ink); color: var(--panel); font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 6px; box-shadow: var(--shadow); max-width: 240px; animation: whyfloat 2.4s ease-out forwards; }
@keyframes whyfloat { 0% { opacity: 0; transform: translateY(6px); } 12% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-6px); } }
.diary { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 4px; max-height: 70vh; overflow-y: auto; }
.diary h3 { font-family: var(--f-display); font-weight: 800; font-size: 18px; text-transform: uppercase; letter-spacing: .03em; margin: 10px 0 2px; }
.diary h3:first-child { margin-top: 0; }
.dentry { display: grid; grid-template-columns: 74px 18px minmax(0, 1fr); gap: 8px; font-size: 13.5px; padding: 5px 0; border-bottom: 1px solid var(--line); }
.dentry .tm { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); padding-top: 2px; }
.dentry svg { width: 16px; height: 16px; margin-top: 2px; color: var(--accent-ink); }
.dentry em { display: block; font-style: normal; color: var(--muted); font-size: 12.5px; }
.sheethandle { display: none; }

/* drawer (field guide) */
.drawer { position: fixed; inset: 0; z-index: 50; display: grid; justify-items: end; background: rgba(10, 16, 22, .45); }
.drawer .panel { width: min(560px, 100%); height: 100%; background: var(--panel); overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 18px) max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 30px) 20px; display: grid; gap: 14px; align-content: start; box-shadow: var(--shadow); }
.drawer h2 { font-family: var(--f-display); font-weight: 900; font-size: 30px; text-transform: uppercase; margin: 0; line-height: 1; }
.drawer h3 { font-family: var(--f-display); font-weight: 800; font-size: 19px; text-transform: uppercase; letter-spacing: .03em; margin: 8px 0 0; }
.flow { display: grid; gap: 8px; }
.flowstep { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; padding: 10px 12px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); }
.flowstep .path { font-weight: 700; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.flowstep .path span { font-family: var(--f-mono); font-size: 11.5px; padding: 1px 6px; border-radius: 5px; background: var(--tag); color: var(--tag-ink); }
.flowstep p { margin: 0; font-size: 13.5px; }
.flowstep q { display: block; font-size: 12.5px; color: var(--muted); quotes: "“" "”"; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th, .tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.tbl td:last-child { font-family: var(--f-mono); font-size: 12.5px; white-space: nowrap; }
.small { font-size: 12px; color: var(--muted); }
.confirm { display: grid; gap: 8px; padding: 12px; border-radius: 10px; background: var(--warn-soft); }
a { color: var(--accent-ink); }

/* ---------- Narrow screens: boards become a pull-up drawer ---------- */

  .gamebar { position: static; }
  .gamebar .wrap { grid-template-columns: minmax(0, 1fr) auto; }
  .gamebar .tools { order: 0; }
  .strip { grid-column: 1 / -1; grid-row: 2; justify-content: space-between; }
  .meters { grid-column: 1 / -1; grid-row: 3; justify-content: space-between; gap: 8px; }
  .brand b { font-size: 19px; }
  .brand small { display: none; }
  .days { grid-template-columns: repeat(10, minmax(0, 1fr)); flex: 1; max-width: 360px; }
  .dcell { height: 30px; }
  main.wrap { grid-template-columns: minmax(0, 1fr); padding-block: 14px calc(84px + env(safe-area-inset-bottom, 0px)); }
  .scene { position: static; max-height: none; }
  .scene-body { overflow: visible; padding: 16px; }
  .place { padding: 9px 16px; }
  .place .when .f { display: none; } .place .when .s { display: inline; }
  .legend { display: none; }

  .boards { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--panel); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; box-shadow: 0 -10px 30px -12px rgba(0, 0, 0, .35);
    padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
    max-height: 86vh; transform: translateY(calc(100% - 64px - env(safe-area-inset-bottom, 0px))); transition: transform .35s cubic-bezier(.2, .8, .2, 1); gap: 8px; grid-template-rows: auto auto minmax(0, 1fr); }
  .boards.open { transform: none; }
  .sheethandle { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; padding: 10px 2px 8px; cursor: pointer; text-align: left; }
  .sheethandle::before { content: ""; position: absolute; top: 6px; left: 50%; width: 40px; height: 4px; margin-left: -20px; border-radius: 99px; background: var(--line); }
  .sheethandle .counts { display: flex; gap: 6px; flex-wrap: wrap; min-width: 0; padding-top: 6px; }
  .sheethandle .c { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 99px; background: var(--panel-2); border: 1px solid var(--line); white-space: nowrap; }
  .sheethandle .c b { font-family: var(--f-mono); }
  .sheethandle .open-l { font-size: 12.5px; font-weight: 700; color: var(--accent-ink); white-space: nowrap; padding-top: 6px; }
  .boards.bump .sheethandle .c { animation: bump .7s; }
  @keyframes bump { 40% { background: var(--accent); color: var(--on-accent); border-color: var(--accent); } }
  .boards .scroll { overflow-y: auto; min-height: 0; overscroll-behavior: contain; }
  .board { gap: 6px; }
  .col { padding: 10px 6px 10px; min-height: 0; background-size: 14px 14px; background-image: radial-gradient(circle at 7px 7px, var(--peg-hole) 1.8px, transparent 2.3px); }
  .colhead h2 { font-size: 15px; }
  .colsub { display: none; }
  .pin { font-size: 11.5px; padding: 8px 7px 6px; }
  .tag { padding: 6px 6px 6px 16px; clip-path: polygon(9px 0, 100% 0, 100% 100%, 9px 100%, 0 calc(100% - 9px), 0 9px); }
  .tag::before { left: 4px; width: 6px; height: 6px; margin-top: -3px; }
  .tag .ttl { font-size: 14px; }
  .tag.pb .ttl { padding-right: 14px; }
  .tag .rank { font-size: 14px; right: 4px; top: 4px; }
  .tag.has-stamp .ttl { padding-right: 0; }
  .tag.has-stamp { padding-top: 22px; }
  .stampsm { font-size: 11px; }

}
@media (max-width: 520px) {

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }

/* ===== App chrome: top bar, start page, Scrum Guide reader, practice, office map ===== */
[hidden] { display: none !important; }
:root {
  --toph: 58px;
  --o-wall: #9aa5af; --o-floor: #e7e2d7; --o-room: #f7f4ec; --o-meet: #f2e9d6; --o-lounge: #e7efe0; --o-shop: #e5ebf3; --o-furn: #dccbaa; --o-furn-line: #a8946c; --o-board: #fffdf5;
  --mark: #ffe08a; --mark-ink: #2a1f00; --mark-cur: #ff9b3d;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --o-wall: #070b0f; --o-floor: #1d252d; --o-room: #26313b; --o-meet: #2e3239; --o-lounge: #233127; --o-shop: #232c3a; --o-furn: #4b4333; --o-furn-line: #75674a; --o-board: #3b4651;
  --mark: #6b5310; --mark-ink: #fff4d6; --mark-cur: #c25a12;
} }
:root[data-theme="dark"] {
  --o-wall: #070b0f; --o-floor: #1d252d; --o-room: #26313b; --o-meet: #2e3239; --o-lounge: #233127; --o-shop: #232c3a; --o-furn: #4b4333; --o-furn-line: #75674a; --o-board: #3b4651;
  --mark: #6b5310; --mark-ink: #fff4d6; --mark-cur: #c25a12;
}

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); }
.topin { display: flex; align-items: center; gap: 16px; min-height: var(--toph); }
.top .brand { color: inherit; text-decoration: none; margin-right: auto; }
.nav { display: flex; gap: 4px; }
.nav a { display: inline-flex; align-items: center; gap: 7px; padding: 8px 12px; border-radius: 9px; color: var(--muted); text-decoration: none; font-weight: 700; font-size: 14.5px; white-space: nowrap; position: relative; }
.nav a svg { width: 17px; height: 17px; }
.nav a:hover { color: var(--ink); background: var(--panel-2); }
.nav a[aria-current="page"] { color: var(--ink); }
.nav a[aria-current="page"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -9px; height: 3px; border-radius: 3px 3px 0 0; background: var(--accent); }
.view[hidden] { display: none !important; }
.gtitle { display: none; }
main.game { display: grid; grid-template-columns: minmax(360px, 470px) minmax(0, 1fr); gap: 20px; padding-block: 18px 40px; align-items: start; }
.leftcol { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--toph) + 70px); max-height: calc(100vh - var(--toph) - 86px); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.leftcol .scene { flex: 1 1 auto; }
.leftcol.officeoff .office { display: none; }

/* start page */
.home { padding-block: 28px 48px; display: grid; gap: 22px; }
.welcome { display: grid; gap: 10px; max-width: 820px; }
.welcome h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(38px, 5.6vw, 64px); line-height: .9; margin: 0; text-transform: uppercase; letter-spacing: .01em; }
.welcome h1 span { color: var(--accent); }
.welcome p { margin: 0; font-size: 16px; color: var(--muted); max-width: 640px; }
.entries { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; }
.entry { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; display: grid; gap: 14px; align-content: start; overflow: hidden; }
.entry h2 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: 30px; line-height: 1; text-transform: uppercase; letter-spacing: .02em; display: flex; align-items: center; gap: 10px; }
.entry h2 svg { width: 26px; height: 26px; color: var(--accent); }
.entry p { margin: 0; }
.entry .sub { color: var(--muted); font-size: 14px; }
.entry.guide-entry { background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 8%, var(--panel)) 0%, var(--panel) 62%); }
.bigsearch { display: flex; align-items: center; gap: 8px; border: 2px solid var(--ink); border-radius: 12px; background: var(--panel); padding: 4px 4px 4px 12px; }
.bigsearch:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.bigsearch svg { width: 20px; height: 20px; flex: none; color: var(--muted); }
.bigsearch input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 17px; padding: 10px 2px; color: var(--ink); outline: none; }
.bigsearch .primary { padding: 10px 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 5px 11px; font-size: 13px; cursor: pointer; color: var(--ink); text-decoration: none; white-space: nowrap; }
.chip:hover { border-color: var(--accent); }
.chip.lang-de::before { content: "DE · "; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.gamepreview { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--o-wall); }

.practice-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.ptile { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 14px 12px; display: grid; gap: 6px; align-content: start; cursor: pointer; color: var(--ink); font: inherit; transition: border-color .15s, transform .15s; }
.ptile:hover { border-color: var(--accent); transform: translateY(-2px); }
.ptile b { font-size: 16px; display: flex; align-items: center; gap: 8px; }
.ptile b svg { width: 18px; height: 18px; color: var(--accent-ink); flex: none; }
.ptile span { font-size: 13px; color: var(--muted); }
.ptile .meterbar { margin-top: 4px; }
.sechead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.sechead h2 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: 24px; text-transform: uppercase; letter-spacing: .02em; }
.foot { color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 4px; }
.foot a { color: var(--accent-ink); }

/* Scrum Guide reader */
.gtools { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--toph)); z-index: 18; background: var(--bg); border-bottom: 1px solid var(--line); }
.gtin { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.tocbtn { display: none; }
.search { flex: 1; max-width: 560px; display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1.5px solid var(--line); border-radius: 10px; padding: 3px 4px 3px 10px; }
.search:focus-within { border-color: var(--accent); }
.search > svg { width: 17px; height: 17px; color: var(--muted); flex: none; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 15px; padding: 7px 2px; color: var(--ink); outline: none; }
.search input::-webkit-search-cancel-button { cursor: pointer; }
.scount { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.sbtn { border: 0; background: var(--panel-2); border-radius: 7px; width: 30px; height: 30px; cursor: pointer; font-size: 11px; color: var(--ink); flex: 0 0 30px; }
.sbtn:hover { background: var(--accent-soft); }
.lang { display: inline-flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); margin-left: auto; flex: none; }
.lang button { border: 0; background: transparent; padding: 8px 12px; font-weight: 700; font-size: 13.5px; cursor: pointer; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.glayout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 28px; padding-block: 20px 60px; align-items: start; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--toph) + 74px); max-height: calc(100vh - var(--toph) - 96px); overflow-y: auto; display: grid; gap: 1px; padding-right: 4px; font-size: 13.5px; }
.toc a { color: var(--muted); text-decoration: none; padding: 4px 8px; border-radius: 6px; border-left: 2px solid transparent; line-height: 1.3; }
.toc a.l4 { padding-left: 20px; } .toc a.l5 { padding-left: 32px; font-size: 12.5px; } .toc a.l6 { padding-left: 32px; font-size: 12.5px; }
.toc a:hover { color: var(--ink); background: var(--panel-2); }
.toc a.on { color: var(--ink); font-weight: 700; border-left-color: var(--accent); background: var(--panel); }
.toc a .qn { font-family: var(--f-mono); font-size: 10.5px; color: var(--accent-ink); margin-left: 4px; }
.gmain { min-width: 0; display: grid; gap: 16px; }
.sg { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 28px clamp(18px, 4vw, 52px) 40px; max-width: 820px; font-size: 16.5px; line-height: 1.68; }
.sg p, .sg li { overflow-wrap: break-word; hyphens: auto; }
.sg h2, .sg h3, .sg h4, .sg h5, .sg h6 { scroll-margin-top: calc(var(--toph) + 84px); font-family: var(--f-display); text-transform: uppercase; letter-spacing: .02em; line-height: 1.05; margin: 1.6em 0 .45em; }
.sg h3 { font-size: 30px; font-weight: 900; padding-top: .5em; border-top: 2px solid var(--line); }
.sg h4 { font-size: 23px; font-weight: 800; }
.sg h5 { font-size: 19px; font-weight: 800; color: var(--accent-ink); }
.sg h6 { font-size: 17px; font-weight: 800; color: var(--muted); }
.sg h3:first-of-type { border-top: 0; }
.sg ul, .sg ol { padding-left: 1.3em; }
.sg li { margin: .25em 0; }
.sg .flash { animation: hflash 1.8s ease-out; }
@keyframes hflash { 0%, 30% { background: var(--accent-soft); box-shadow: 0 0 0 8px var(--accent-soft); } 100% { background: transparent; box-shadow: none; } }
.sg-cover { text-align: center; padding: 10px 0 18px; border-bottom: 2px solid var(--line); margin-bottom: 8px; }
.sg-cover h2 { font-size: clamp(34px, 5vw, 52px); font-weight: 900; margin: 6px 0 4px; border: 0; padding: 0; }
.sg-cover p { margin: 0; color: var(--muted); }
.sg-legal, .sg-attrib { font-size: 13px; color: var(--muted); line-height: 1.5; }
.sg-attrib { background: var(--panel-2); border-radius: 10px; padding: 10px 12px; margin: 0 0 6px; }
.sg-center { text-align: center; font-weight: 700; }
.sg-table { border-collapse: collapse; width: 100%; font-size: 14px; margin: .6em 0; }
.sg-table td, .sg-table th { border-bottom: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
.sg-table th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.sg mark { background: var(--mark); color: var(--mark-ink); border-radius: 3px; padding: 0 1px; }
.sg mark.cur { background: var(--mark-cur); color: #fff; box-shadow: 0 0 0 3px var(--mark-cur); }
.term { text-decoration: underline dotted var(--accent); text-decoration-thickness: 1.5px; text-underline-offset: 3px; cursor: help; border-radius: 3px; }
.term:hover, .term.on { background: var(--accent-soft); }
.tip { position: fixed; z-index: 45; max-width: min(340px, calc(100vw - 32px)); background: var(--ink); color: var(--panel); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; line-height: 1.45; box-shadow: var(--shadow); pointer-events: none; }
.tip b { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .75; margin-bottom: 3px; }
.secq { display: inline-flex; align-items: center; gap: 6px; margin: -.1em 0 .6em; border: 1.5px solid var(--line); background: var(--panel-2); color: var(--ink); border-radius: 99px; padding: 4px 11px 4px 9px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; text-transform: none; letter-spacing: 0; }
.secq:hover { border-color: var(--accent); background: var(--accent-soft); }
.secq svg { width: 14px; height: 14px; color: var(--accent-ink); }
.gresults { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; max-width: 820px; display: grid; gap: 6px; }
.gresults .lbl { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.gres { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1px; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 6px 8px; cursor: pointer; font: inherit; color: var(--ink); }
.gres:hover { background: var(--panel-2); }
.gres b { font-size: 12px; color: var(--accent-ink); text-transform: uppercase; letter-spacing: .06em; }
.gres span { font-size: 14px; color: var(--muted); }
.gres mark { background: var(--mark); color: var(--mark-ink); border-radius: 2px; }
.backtop { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 17; }

/* practice */
.pwrap { padding-block: 24px 60px; display: grid; gap: 18px; max-width: 980px; }
.ptitle { font-family: var(--f-display); font-weight: 900; font-size: clamp(32px, 4.6vw, 48px); line-height: .92; margin: 0; text-transform: uppercase; }
.pcard { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 18px 20px; display: grid; gap: 14px; }
.pcard h2 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: 22px; text-transform: uppercase; letter-spacing: .02em; }
.ptopics { display: grid; gap: 8px; }
.ptopic { display: grid; grid-template-columns: minmax(0, 1fr) 140px auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.ptopic:last-child { border-bottom: 0; }
.ptopic .nm { font-weight: 700; }
.ptopic .sb { font-size: 12.5px; color: var(--muted); }
.meterbar { height: 8px; border-radius: 99px; background: var(--bg-2); overflow: hidden; }
.meterbar i { display: block; height: 100%; border-radius: 99px; background: var(--good); transition: width .6s; }
.pct { font-family: var(--f-mono); font-weight: 700; font-size: 13px; min-width: 64px; text-align: right; }
.pbtn { border: 1.5px solid var(--line); background: var(--panel); border-radius: 9px; padding: 7px 12px; font: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; color: var(--ink); white-space: nowrap; }
.pbtn:hover { border-color: var(--accent); }
.pbtn[disabled] { opacity: .45; cursor: default; }
.histrow { display: flex; flex-wrap: wrap; gap: 6px; }
.hchip { font-family: var(--f-mono); font-size: 12px; padding: 3px 8px; border-radius: 99px; }
.hchip.pass { background: var(--good-soft); color: var(--good); } .hchip.fail { background: var(--bad-soft); color: var(--bad); }
.qhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.qhead .mode { font-weight: 700; }
.qhead .sp { flex: 1; }
.qtimer { font-family: var(--f-mono); font-weight: 700; font-size: 18px; padding: 3px 10px; border-radius: 8px; background: var(--panel-2); }
.qtimer.low { background: var(--bad-soft); color: var(--bad); }
.qbar { height: 6px; border-radius: 99px; background: var(--bg-2); overflow: hidden; }
.qbar i { display: block; height: 100%; background: var(--accent); transition: width .35s; }
.qtext { font-size: 20px; font-weight: 700; line-height: 1.35; margin: 0; }
.qmeta { font-size: 12.5px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.qmeta .choose { color: var(--accent-ink); font-weight: 700; }
.qchat { display: grid; gap: 8px; background: var(--panel-2); border-radius: 12px; padding: 12px; }
.qchat .lbl { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.popts { display: grid; gap: 8px; }
.popt { text-align: left; border: 1.5px solid var(--line); background: var(--panel); border-radius: 11px; padding: 11px 12px; cursor: pointer; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; align-items: start; font: inherit; color: var(--ink); font-size: 15.5px; transition: border-color .15s, background .15s; }
.popt:hover:not([disabled]) { border-color: var(--accent); }
.popt .mk { width: 22px; height: 22px; border: 2px solid var(--line); border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 900; margin-top: 1px; }
.popt.check .mk { border-radius: 6px; }
.popt[aria-pressed="true"] { border-color: var(--ink); background: var(--panel-2); }
.popt[aria-pressed="true"] .mk { background: var(--ink); border-color: var(--ink); color: var(--panel); }
.popt.right { border-color: var(--good); background: var(--good-soft); }
.popt.right .mk { background: var(--good); border-color: var(--good); color: var(--panel); }
.popt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.popt.wrong .mk { background: var(--bad); border-color: var(--bad); color: var(--panel); }
.popt[disabled] { cursor: default; }
.pfb { border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; animation: rise .3s both; }
.pfb.ok { background: var(--good-soft); } .pfb.no { background: var(--bad-soft); }
.pfb strong { font-family: var(--f-display); font-weight: 900; font-size: 22px; text-transform: uppercase; letter-spacing: .03em; }
.pfb.ok strong { color: var(--good); } .pfb.no strong { color: var(--bad); }
.pfb p { margin: 0; }
.pquote { background: var(--paper); color: var(--tag-ink); border: 1px solid var(--paper-line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; font-size: 14px; }
.pquote .ref { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--tag-muted); }
.pquote q { display: block; padding-left: 10px; border-left: 3px solid var(--tag-edge); quotes: "“" "”"; }
.linkbtn { justify-self: start; border: 0; background: transparent; padding: 0; font: inherit; font-size: 13px; font-weight: 700; color: var(--accent-ink); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.qnav { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.qnav .sp { flex: 1; }
.qmap { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 4px; }
.qmap button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; height: 30px; font-family: var(--f-mono); font-size: 11.5px; cursor: pointer; color: var(--ink); position: relative; }
.qmap button.done { background: var(--panel-2); border-color: var(--muted); }
.qmap button.flag::after { content: ""; position: absolute; top: 2px; right: 2px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.qmap button.cur { outline: 2.5px solid var(--accent); outline-offset: 1px; }
.bigpct { font-family: var(--f-display); font-weight: 900; font-size: 72px; line-height: .85; }
.pverdict { font-family: var(--f-display); font-weight: 900; font-size: 22px; text-transform: uppercase; padding: 3px 12px; border-radius: 8px; justify-self: start; }
.pverdict.pass { background: var(--good-soft); color: var(--good); } .pverdict.fail { background: var(--bad-soft); color: var(--bad); }
.review details { border-bottom: 1px solid var(--line); padding: 8px 0; }
.review summary { cursor: pointer; font-weight: 700; }
.review .ans { margin: 6px 0; font-size: 14px; }
.review .w { color: var(--bad); font-weight: 700; } .review .r { color: var(--good); font-weight: 700; }

/* office map */
.office { position: relative; width: 100%; aspect-ratio: 1000 / 600; background: var(--o-wall); border-radius: 14px; overflow: hidden; container-type: inline-size; flex: none; box-shadow: var(--shadow); }
.office > * { position: absolute; }
.room { border-radius: 3px; transition: box-shadow .4s; }
.room .rname { position: absolute; left: 5px; top: 3px; font-family: var(--f-mono); font-size: clamp(7px, 1.55cqw, 11px); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; white-space: nowrap; }
.room.meet { background: var(--o-meet); } .room.work, .room.office { background: var(--o-room); } .room.lounge { background: var(--o-lounge); } .room.shop { background: var(--o-shop); }
.room.on { box-shadow: inset 0 0 0 2.5px var(--accent); }
.room.on .rname { color: var(--accent-ink); }
.corr, .door { background: var(--o-floor); }
.furn { background: var(--o-furn); border: 1px solid var(--o-furn-line); border-radius: 3px; }
.furn.round { border-radius: 45%; }
.furn.screen { background: var(--ink); border: 0; }
.wheel { border: 2px solid var(--o-furn-line); border-radius: 50%; }
.ftag { font-family: var(--f-mono); font-size: clamp(6px, 1.25cqw, 9px); color: var(--muted); white-space: nowrap; transform: translateX(-50%); }
.sboard { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--paper); border: 1px solid var(--o-furn-line); border-radius: 2px; transition: box-shadow .4s; }
.sboard.hot { box-shadow: 0 0 0 3px var(--accent); }
.sboard > div { display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 1px; padding: 1px; border-right: 1px dashed var(--o-furn-line); }
.sboard > div:last-child { border-right: 0; }
.sboard i { width: 1.15cqw; height: 1.15cqw; min-width: 3px; min-height: 3px; border-radius: 1px; background: #f2c94c; }
.sboard .doing i { background: #f2994a; } .sboard .done i { background: #6fcf97; }
.sboard i.blk { background: var(--stamp-red); }
.tok { width: clamp(20px, 6.6cqw, 40px); height: clamp(20px, 6.6cqw, 40px); transform: translate(-50%, -50%); z-index: 3; will-change: left, top; }
.tok .fc { display: block; width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 0 0 2px var(--panel), 0 2px 4px rgba(0, 0, 0, .3); }
.tok .fc svg { display: block; width: 100%; height: 100%; }
.tok.you .fc { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--c-you); }
.tok .nm { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 2px; font-family: var(--f-mono); font-size: clamp(7px, 1.5cqw, 10px); font-weight: 700; background: var(--panel); color: var(--ink); padding: 0 3px; border-radius: 3px; white-space: nowrap; display: none; }
.tok.speak .nm, .tok.you .nm { display: block; }
.tok .bub { position: absolute; right: -36%; top: -38%; width: 52%; height: 40%; min-width: 11px; min-height: 9px; border-radius: 40% 40% 40% 4px; background: var(--panel); border: 1.5px solid var(--accent); display: none; }
.tok .bub::before { content: "···"; position: absolute; inset: 0; display: grid; place-items: center; font-size: clamp(7px, 1.6cqw, 11px); line-height: 0; font-weight: 900; color: var(--accent-ink); }
.tok.speak { z-index: 6; }
.tok.speak .fc { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4.5px var(--accent); }
.tok.speak .bub { display: block; animation: pop .3s both; }
@keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
.tok.walk .fc { animation: bob .32s ease-in-out infinite alternate; }
.tok.work .fc { animation: type 1.1s ease-in-out infinite; }
@keyframes bob { to { transform: translateY(-12%); } }
@keyframes type { 0%, 100% { transform: none; } 50% { transform: rotate(-6deg) translateY(-4%); } }
.tok.off { opacity: .28; filter: grayscale(1); }
.tok.stuck::after { content: "!"; position: absolute; left: -18%; top: -22%; width: 46%; height: 46%; min-width: 11px; min-height: 11px; border-radius: 50%; background: var(--stamp-red); color: #fff; display: grid; place-items: center; font-weight: 900; font-size: clamp(8px, 1.7cqw, 12px); box-shadow: 0 0 0 2px var(--panel); }
.tok.daily .fc { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px #f2994a; }
.oclock { left: 50%; top: 47.5%; transform: translate(-50%, -50%); z-index: 8; background: var(--ink); color: var(--panel); border-radius: 99px; padding: 3px 12px; display: flex; gap: 8px; align-items: baseline; white-space: nowrap; box-shadow: var(--shadow); font-size: clamp(9px, 2cqw, 13px); }
.oclock b { font-family: var(--f-mono); }
.oclock span { opacity: .8; }
.oclock[hidden] { display: none; }
.otoggle { right: 6px; bottom: 6px; z-index: 9; border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 7px; padding: 2px 8px; font: inherit; font-size: 11px; font-weight: 700; cursor: pointer; opacity: .9; }
.otoggle:hover { color: var(--ink); border-color: var(--accent); }
.nooffice .office { aspect-ratio: auto; height: 34px; background: var(--panel); border: 1px solid var(--line); box-shadow: none; }
.nooffice .office > :not(.otoggle) { display: none; }
.nooffice .office .otoggle { top: 5px; bottom: auto; }

/* watch mode */
.watchbar { display: grid; gap: 12px; margin-bottom: 10px; padding: 14px; border: 1px solid #344453; border-radius: 14px; background: linear-gradient(145deg, #1d2b38, #111a23); color: #f3efe6; box-shadow: 0 8px 22px rgba(17, 26, 35, .2); }
.wtop { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.widentity { display: flex; align-items: center; gap: 10px; min-width: 0; }
.widentity > div { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; }
.widentity b { font-family: var(--f-display); font-weight: 900; font-size: 19px; text-transform: uppercase; letter-spacing: .035em; }
.wlive { display: inline-flex; align-items: center; gap: 6px; flex: none; border-radius: 99px; padding: 5px 8px; background: #d8523e; color: #fff; font: 800 10px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .08em; }
.wlive::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.wlive.paused { background: #697582; }
.wday { color: #f3c66d; font: 700 13px var(--f-mono); white-space: nowrap; }
.wday i { color: rgba(243, 239, 230, .58); font-style: normal; }
.watchbar .wbtns { display: flex; align-items: center; justify-content: flex-end; flex: none; flex-wrap: nowrap; gap: 6px; }
.watchbar button { min-height: 34px; border: 1px solid rgba(243, 239, 230, .35); background: rgba(255, 255, 255, .045); color: inherit; border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 12px; font-weight: 750; cursor: pointer; white-space: nowrap; }
.watchbar button:hover { background: rgba(255, 255, 255, .13); }
.watchbar button:focus-visible { outline: 3px solid #f3c66d; outline-offset: 2px; }
.watchbar .wbtns .wprimary { border-color: #f3c66d; background: #f3c66d; color: #17212a; }
.watchbar .wbtns .wprimary:hover { background: #ffda87; }
.watchbar .wbtns .wstop { color: rgba(243, 239, 230, .75); }
.wprogress { display: grid; gap: 5px; }
.wtracks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
.wsprint { display: block; height: 6px; overflow: hidden; border-radius: 99px; background: rgba(243, 239, 230, .2); }
.wsprint i, .wdaytrack i { display: block; height: 100%; border-radius: inherit; background: #f3c66d; }
.wsprint:not(.current) i { background: #71c59a; }
.wprogress-meta { display: flex; justify-content: space-between; gap: 8px; color: rgba(243, 239, 230, .72); font: 600 10px var(--f-mono); }
.wdaytrack { height: 3px; overflow: hidden; border-radius: 99px; background: rgba(243, 239, 230, .12); }
.wdaytrack i { background: #f3c66d; transition: width .3s ease; }
.wnow { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: start; gap: 9px; padding: 10px 11px; border-left: 3px solid #f3c66d; border-radius: 0 9px 9px 0; background: rgba(255, 255, 255, .07); }
.wnow > span, .wtrail > span:first-child { color: #f3c66d; font: 800 10px var(--f-mono); letter-spacing: .09em; text-transform: uppercase; }
.wnow p { margin: 0; font-size: 13px; font-weight: 650; line-height: 1.4; }
.wtrail { display: flex; flex-wrap: wrap; gap: 5px 9px; align-items: baseline; color: rgba(243, 239, 230, .57); font-size: 10.5px; line-height: 1.3; }
.wtrail > span:not(:first-child)::before { content: "· "; color: #f3c66d; }
.opt.picking { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.cbtn.picking { outline: 3px solid var(--accent); outline-offset: 2px; }

@media (max-width: 960px) {
  :root { --toph: 54px; }
  .brand small { display: none; }
  .entries { grid-template-columns: minmax(0, 1fr); }
  .practice-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  main.game { grid-template-columns: minmax(0, 1fr); padding-block: 12px calc(84px + env(safe-area-inset-bottom, 0px)); }
  .leftcol { position: static; max-height: none; }
  .gtitle { display: block; grid-row: 1; grid-column: 1; font-family: var(--f-display); font-weight: 800; font-size: 15px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
  .gamebar .tools { grid-row: 1; grid-column: 2; }
  .glayout { grid-template-columns: minmax(0, 1fr); padding-block: 12px 70px; }
  .tocbtn { display: inline-flex; }
  .toc { position: fixed; z-index: 30; top: calc(env(safe-area-inset-top, 0px) + var(--toph) + 60px); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); max-height: 62vh; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 10px; display: none; }
  .toc.open { display: grid; }
  .sg { font-size: 16px; padding: 20px 16px 28px; border-radius: 14px; }
  .sg h3 { font-size: 25px; } .sg h4 { font-size: 20px; }
  .ptopic { grid-template-columns: minmax(0, 1fr) auto; }
  .ptopic .meterbar { grid-column: 1 / -1; grid-row: 2; }
}
@media (max-width: 620px) {
  .nav a { padding: 8px 9px; font-size: 13px; gap: 5px; }
  .nav a[aria-current="page"]::after { left: 9px; right: 9px; bottom: -7px; }
  .top .brand div { display: none; }
  .gtin { flex-wrap: wrap; gap: 8px; }
  .search { order: 3; flex-basis: 100%; max-width: none; }
  .lang { margin-left: auto; }
  .practice-row { grid-template-columns: minmax(0, 1fr); }
  .ptile { grid-template-columns: minmax(0, 1fr); }
  .bigsearch .primary span { display: none; }
  .entry { padding: 16px; }
  .entry h2 { font-size: 26px; }
  .qtext { font-size: 18px; }
}
@media (max-width: 380px) { .nav a span { display: none; } .nav a { padding: 8px 12px; } }
.watchbar { position: sticky; top: 0; z-index: 4; }
.scene.watching .scene-body button { pointer-events: none; }
.scene.watching .scene-body .opt:not(.picking):not(.right):not(.wrong) { opacity: .85; }
.opt.picking, .cbtn.picking { animation: pickpulse .9s ease-in-out infinite alternate; }
@keyframes pickpulse { from { box-shadow: 0 0 0 2px var(--accent-soft); } to { box-shadow: 0 0 0 6px var(--accent-soft); } }
@media (prefers-reduced-motion: reduce) { .opt.picking, .cbtn.picking { animation: none; } .wdaytrack i { transition: none; } }
.gamepreview .pv-cap { font-family: var(--f-mono); font-weight: 700; }
.gamepreview > svg { display: block; width: 100%; height: auto; }

a.primary { text-decoration: none; }
.primary svg { width: 17px; height: 17px; flex: none; }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.fact { display: grid; gap: 1px; align-content: start; padding: 10px 11px; border-radius: 11px; background: var(--panel); border: 1px solid var(--line); color: var(--ink); text-decoration: none; transition: border-color .2s, transform .2s; }
.fact:hover { border-color: var(--accent); transform: translateY(-2px); }
.fact b { font-family: var(--f-display); font-size: 30px; line-height: 1; color: var(--accent); }
.fact span { font-weight: 700; font-size: 13.5px; }
.fact small { color: var(--muted); font-size: 11.5px; line-height: 1.35; }
@media (max-width: 620px) { .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  .watchbar { position: static; gap: 10px; padding: 11px; }

  .qnav .sp { display: none; }

  .qnav .pbtn { flex: 1 1 auto; }
}
.entry.guide-entry { align-content: center; gap: 22px; }
.entry.guide-entry h2 { font-size: clamp(30px, 3.6vw, 44px); }
.guide-entry .bigsearch input { font-size: 18px; padding-block: 8px; }
@media (max-width: 960px) { .entry.guide-entry { align-content: start; gap: 14px; } }

<script>
const QB = {"questions":[{"id":"th1","t":"theory","q":"Scrum is founded on which two concepts?","o":["Empiricism","Lean thinking","The Agile Manifesto","Systems thinking"],"a":[0,1],"x":"The Agile Manifesto and systems thinking are related ideas, but the Scrum Guide names exactly two foundations.","r":"Scrum Theory","g":["Scrum is founded on empiricism and lean thinking."]},{"id":"th2","t":"theory","q":"Which statement describes empiricism as the Scrum Guide defines it?","o":["Knowledge comes from experience and making decisions based on what is observed","Knowledge comes from thorough analysis and planning before the work begins","Decisions are based on expert judgement and proven industry benchmarks","Knowledge comes from following a defined process consistently over time"],"a":[0],"x":"Empiricism means learning by doing and observing, not by predicting everything upfront.","r":"Scrum Theory","g":["Empiricism asserts that knowledge comes from experience and making decisions based on what is observed."]},{"id":"th3","t":"theory","q":"The Scrum events work because they implement which empirical pillars?","o":["Transparency, inspection and adaptation","Transparency, collaboration and adaptation","Inspection, adaptation and self-management","Commitment, transparency and inspection"],"a":[0],"x":"Collaboration, self-management and commitment all matter in Scrum, but the three pillars of empiricism are transparency, inspection and adaptation.","r":"Scrum Theory","g":["These events work because they implement the empirical Scrum pillars of transparency, inspection, and adaptation."]},{"id":"th4","t":"theory","q":"Which list contains only Scrum values?","o":["Focus, respect, courage","Focus, respect, transparency","Openness, courage, collaboration","Commitment, trust, focus"],"a":[0],"x":"Transparency is a pillar, not a value. Collaboration and trust are not in the list of five values.","r":"Scrum Values","g":["Commitment, Focus, Openness, Respect, and Courage"]},{"id":"th5","t":"theory","q":"The Scrum framework is described as purposefully incomplete. What does that mean?","o":["It only defines the parts required to implement Scrum theory","Teams may leave out events that don't fit their context","The complete rules are described in separate training material","Each organization must add its own roles to complete it"],"a":[0],"x":"Scrum leaves room for practices and techniques, but it does not let you drop its own elements.","r":"Scrum Definition","g":["The Scrum framework is purposefully incomplete, only defining the parts required to implement Scrum theory."]},{"id":"th6","t":"theory","q":"What does the Scrum Guide say about implementing only parts of Scrum?","o":["It is possible, but the result is not Scrum","It is not possible, because the framework would not work","It is acceptable once the team has matured","It is recommended as a first step in an adoption"],"a":[0],"x":"You can technically use pieces of Scrum, but the Guide is clear that the result is no longer Scrum.","r":"End Note","g":["The Scrum framework, as outlined herein, is immutable. While implementing only parts of Scrum is possible, the result is not Scrum."]},{"id":"th7","t":"theory","q":"When is a Scrum Team expected to adapt?","o":["The moment it learns anything new through inspection","At the Sprint Retrospective, so everyone agrees on the change","At the next Sprint Planning, so the current Sprint is not disrupted","Whenever the Scrum Master identifies a deviation"],"a":[0],"x":"Adaptation is not saved up for a particular event. The events are formal opportunities, but the team adapts as soon as it learns.","r":"Scrum Theory: Adaptation","g":["A Scrum Team is expected to adapt the moment it learns anything new through inspection."]},{"id":"th8","t":"theory","q":"According to the Scrum Guide, what makes adaptation more difficult?","o":["People involved are not empowered or self-managing","Sprints are shorter than two weeks","Stakeholders take part in the Sprint Review","The Product Backlog changes frequently"],"a":[0],"x":"Short Sprints, stakeholder involvement and a changing backlog all support adaptation. A lack of empowerment gets in its way.","r":"Scrum Theory: Adaptation","g":["Adaptation becomes more difficult when the people involved are not empowered or self-managing."]},{"id":"th9","t":"theory","q":"Why is low transparency of the Scrum artifacts a problem?","o":["It can lead to decisions that diminish value and increase risk","It makes the Daily Scrum run over its 15-minute timebox","It prevents the Product Owner from ordering the backlog","It stops the team from forecasting with velocity"],"a":[0],"x":"Important decisions are based on the perceived state of the artifacts. If that picture is wrong, so are the decisions.","r":"Scrum Theory: Transparency","g":["Artifacts that have low transparency can lead to decisions that diminish value and increase risk."]},{"id":"th10","t":"theory","q":"According to the Scrum Guide, inspection without adaptation is considered...","o":["Pointless","Misleading and wasteful","Acceptable in early Sprints","A sign of low transparency"],"a":[0],"x":"Watch the wording: inspection without transparency is 'misleading and wasteful', inspection without adaptation is 'pointless'.","r":"Scrum Theory: Inspection","g":["Inspection without adaptation is considered pointless.","Inspection without transparency is misleading and wasteful."]},{"id":"th11","t":"theory","q":"Why does Scrum use an iterative, incremental approach?","o":["To optimize predictability and to control risk","To deliver all features as early as possible","To make long-term release dates fixed","To keep every Developer fully utilized"],"a":[0],"x":"Short cycles of inspect and adapt make outcomes more predictable and limit how much can go wrong at once.","r":"Scrum Theory","g":["Scrum employs an iterative, incremental approach to optimize predictability and to control risk."]},{"id":"th12","t":"theory","q":"What does the Scrum Guide say about burn-downs, burn-ups and cumulative flows?","o":["They can be useful, but they do not replace the importance of empiricism","They are required to make the Sprint Backlog transparent","They should be inspected by the Developers at every Daily Scrum","They are the main input for the Product Owner at the Sprint Review"],"a":[0],"x":"Forecasting practices are optional tools. In complex work, only what has already happened can be used for forward-looking decisions.","r":"The Sprint","g":["Various practices exist to forecast progress, like burn-downs, burn-ups, or cumulative flows. While proven useful, these do not replace the importance of empiricism."]},{"id":"th13","t":"theory","q":"Which two Scrum values are most clearly at risk here?","s":[["tom","I'm way behind on the booking form, but I'll just say 'on track' at the Daily. Don't want to look bad."]],"o":["Openness","Courage","Focus","Respect"],"a":[0,1],"x":"Tom is not being open about a challenge, and he is avoiding the uncomfortable but right thing to do.","r":"Scrum Values","g":["The Scrum Team and its stakeholders are open about the work and the challenges.","The Scrum Team members have the courage to do the right thing, to work on tough problems."]},{"id":"th14","t":"theory","q":"What does the Scrum Guide say happens when events are not operated as prescribed?","o":["Opportunities to inspect and adapt are lost","The current Sprint must be cancelled by the Product Owner","The Increment is no longer valid","The Retrospective must be extended"],"a":[0],"x":"Every event exists to create an inspect-and-adapt moment. Skipping or changing one removes that moment.","r":"Scrum Events","g":["Failure to operate any events as prescribed results in lost opportunities to inspect and adapt."]},{"id":"th15","t":"theory","q":"What are Scrum events used for?","o":["To create regularity","To minimize the need for meetings not defined in Scrum","To give management regular status updates","To replace collaboration outside the events"],"a":[0,1],"x":"Events create a steady rhythm. They do not replace collaboration, and they are not status meetings.","r":"Scrum Events","g":["Events are used in Scrum to create regularity and to minimize the need for meetings not defined in Scrum."]},{"id":"th16","t":"theory","q":"What happens when the Scrum values are embodied by the Scrum Team and the people they work with?","o":["The empirical pillars come to life, building trust","The Scrum Team no longer needs a dedicated Scrum Master","The Definition of Done can be relaxed","Velocity becomes predictable"],"a":[0],"x":"Living the values makes transparency, inspection and adaptation actually work, and that builds trust.","r":"Scrum Values","g":["When these values are embodied by the Scrum Team and the people they work with, the empirical Scrum pillars of transparency, inspection, and adaptation come to life building trust."]},{"id":"th17","t":"theory","q":"According to the Scrum values, who is open about the work and the challenges?","o":["The Scrum Team and its stakeholders","The Developers","The Scrum Team only","The Scrum Master and the Product Owner"],"a":[0],"x":"Openness is not limited to the team. The Guide includes the stakeholders.","r":"Scrum Values","g":["The Scrum Team and its stakeholders are open about the work and the challenges."]},{"id":"th18","t":"theory","q":"Which statement is the Scrum Guide's definition of Scrum?","o":["A lightweight framework that helps people, teams and organizations generate value through adaptive solutions for complex problems","A lightweight process for managing projects with changing requirements through fixed-length iterations, roles and ceremonies","An agile methodology that defines the practices teams use to deliver working software in small increments","A framework for scaling agile delivery across teams and departments through shared events and artifacts"],"a":[0],"x":"Scrum is a framework, not a process or methodology, and it is not limited to software.","r":"Scrum Definition","g":["Scrum is a lightweight framework that helps people, teams and organizations generate value through adaptive solutions for complex problems."]},{"id":"tm1","t":"team","q":"Which three accountabilities does Scrum define within the Scrum Team?","o":["Developers, Product Owner, Scrum Master","Development Team, Product Owner, Scrum Master","Developers, Product Owner, stakeholders","Team lead, Product Owner, Scrum Master"],"a":[0],"x":"'Development Team' is the wording of older Scrum Guides. The 2020 Guide speaks of Developers, and stakeholders are not part of the Scrum Team.","r":"Scrum Team","g":["Scrum defines three specific accountabilities within the Scrum Team: the Developers, the Product Owner, and the Scrum Master."]},{"id":"tm2","t":"team","q":"What size does the Scrum Guide give for a Scrum Team?","o":["Typically 10 or fewer people","3 to 9 Developers, plus the Product Owner and Scrum Master","7 people, plus or minus 2","No size is mentioned"],"a":[0],"x":"'3 to 9 Developers' was the older guidance. The 2020 Guide says typically 10 or fewer people for the whole Scrum Team.","r":"Scrum Team","g":["The Scrum Team is small enough to remain nimble and large enough to complete significant work within a Sprint, typically 10 or fewer people."]},{"id":"tm3","t":"team","q":"What does it mean that Scrum Teams are self-managing?","o":["They internally decide who does what, when, and how","They decide which Product Backlog items are most valuable","They do not report to any manager in the organization","They may change the Scrum framework to fit their needs"],"a":[0],"x":"Self-management is about how the team organizes its own work. Ordering by value stays with the Product Owner, and the framework itself stays intact.","r":"Scrum Team","g":["They are also self-managing, meaning they internally decide who does what, when, and how."]},{"id":"tm4","t":"team","q":"What does it mean that Scrum Teams are cross-functional?","o":["The members have all the skills necessary to create value each Sprint","Every member of the team can perform every type of task that comes up","The team includes a member from each department involved","Members rotate between accountabilities from Sprint to Sprint"],"a":[0],"x":"Cross-functional describes the team as a whole, not each individual.","r":"Scrum Team","g":["Scrum Teams are cross-functional, meaning the members have all the skills necessary to create value each Sprint."]},{"id":"tm5","t":"team","q":"What are the Developers always accountable for?","o":["Creating a plan for the Sprint, the Sprint Backlog","Instilling quality by adhering to a Definition of Done","Adapting their plan each day toward the Sprint Goal","Ordering the Product Backlog items","Ensuring all events are kept within the timebox"],"a":[0,1,2],"x":"Ordering the Product Backlog belongs to the Product Owner. Making sure events stay within the timebox is a Scrum Master service.","r":"Developers","g":["Creating a plan for the Sprint, the Sprint Backlog;","Instilling quality by adhering to a Definition of Done;","Adapting their plan each day toward the Sprint Goal; and,"]},{"id":"tm6","t":"team","q":"What is the Product Owner accountable for?","o":["Maximizing the value of the product resulting from the work of the Scrum Team","Effective Product Backlog management","Sizing the Product Backlog items","Creating the plan for delivering the Increment"],"a":[0,1],"x":"Sizing is done by the Developers who will do the work, and the plan for the Sprint is the Developers' Sprint Backlog.","r":"Product Owner","g":["The Product Owner is accountable for maximizing the value of the product resulting from the work of the Scrum Team.","The Product Owner is also accountable for effective Product Backlog management"]},{"id":"tm7","t":"team","q":"Management proposes that a committee of three managers share the Product Owner accountability. What does the Scrum Guide say?","o":["The Product Owner is one person, not a committee","A committee may act as Product Owner if one member chairs it","A committee is fine if its members agree on the order","Each committee member can own a part of the Product Backlog"],"a":[0],"x":"The Product Owner may represent many stakeholders, but the accountability sits with one person.","r":"Product Owner","g":["The Product Owner is one person, not a committee."]},{"id":"tm8","t":"team","q":"Jonas has asked Priya to write the technical Product Backlog items. Who is accountable for those items?","s":[["jonas","Priya, could you write up the technical items for the payment work? You know it best."]],"o":["Jonas","Priya, for the items she wrote","Jonas and Priya together","The Scrum Team as a whole"],"a":[0],"x":"Delegating the work does not delegate the accountability.","r":"Product Owner","g":["The Product Owner may do the above work or may delegate the responsibility to others. Regardless, the Product Owner remains accountable."]},{"id":"tm9","t":"team","q":"Maya wants her feature moved to the top of the Product Backlog. How should she go about it?","s":[["maya","Our regional launch is next month. My feature has to be first in the backlog. Who do I talk to?"]],"o":["Try to convince the Product Owner","Raise it at the Sprint Review so the team can decide","Ask the Scrum Master to run a prioritization vote","Bring it to Sprint Planning and discuss it with the Developers"],"a":[0],"x":"The Sprint Review can influence the Product Backlog, but the Product Owner makes the ordering decisions.","r":"Product Owner","g":["Those wanting to change the Product Backlog can do so by trying to convince the Product Owner."]},{"id":"tm10","t":"team","q":"A product has grown and is now built by three Scrum Teams. What should they share?","o":["The Product Goal","The Product Backlog","The Product Owner","The Sprint Backlog","The Scrum Master"],"a":[0,1,2],"x":"Each Scrum Team keeps its own Sprint Backlog. The Guide does not require a shared Scrum Master.","r":"Scrum Team
